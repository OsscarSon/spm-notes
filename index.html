<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>SPM 备考本</title>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root{
  --paper:#f3f6fc;--dot:rgba(58,88,160,.16);--glass:rgba(255,255,255,.74);--glass-line:rgba(255,255,255,.9);--hover:rgba(255,255,255,.6);
  --shadow:0 0 0 1px rgba(23,38,63,.06),0 28px 60px -30px rgba(40,64,128,.38);
  --sheet:#ffffff;--sheet2:#f1f4fb;--ink:#17263f;--muted:#5d6b7c;--line:#d3dbe8;--margin:rgba(235,110,110,.42);
  --hl:#ffe45e;--accent:#17263f;--accent-ink:#ffffff;--ok:#1b7f55;--ok-soft:#d9f0e4;--bad:#c23b32;--bad-soft:#fadcd9;--warn:#8a5a00;--warn-soft:#fff1c9;
  --blue:#2f55d4;--blue-soft:#e4eafc;
  --a1:#9ec1ff;--a2:#c3b3ff;--a3:#a9ecd9;--glow:.62;
  --kai:"Kaiti SC","STKaiti","KaiTi","楷体","AR PL UKai CN","Noto Serif SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC","Segoe UI",Roboto,sans-serif;
  --mx:36px;--pl:54px;
}
body[data-theme="night"],body[data-theme="auto"].dark{--paper:#0b1420;--dot:rgba(170,200,255,.11);--glass:rgba(21,33,47,.68);--glass-line:rgba(255,255,255,.09);--hover:rgba(255,255,255,.07);
  --shadow:0 0 0 1px rgba(255,255,255,.04),0 30px 70px -30px rgba(0,0,0,.7);--sheet:#172331;--sheet2:#1e2c3d;--ink:#e6edf6;--muted:#9fb0c3;--line:#2b3b4f;--margin:rgba(255,130,130,.35);
  --accent:#e6edf6;--accent-ink:#0b1420;--ok:#6fd1a2;--ok-soft:#163a2c;--bad:#ff8f84;--bad-soft:#43211e;--warn:#f0c46a;--warn-soft:#3a2f14;--blue:#9db0ff;--blue-soft:#222d57;--glow:.34;
  --a1:#4b6fd6;--a2:#7c5cc4;--a3:#2c8f86}
body[data-theme="sakura"]{--paper:#fff5f8;--dot:rgba(200,90,130,.14);--a1:#ff9fc2;--a2:#ffcf9e;--a3:#b9c8ff}
body[data-theme="mint"]{--paper:#f1fbf6;--dot:rgba(40,130,100,.14);--a1:#74e3d1;--a2:#c9ef93;--a3:#8fcfff}
body[data-theme="paper"]{--paper:#f6efdf;--dot:rgba(150,110,50,.14);--glass:rgba(255,250,238,.78);--a1:#ffd96b;--a2:#ffb98a;--a3:#a7e3a0}
@media (prefers-color-scheme:dark){body[data-theme="auto"]{--paper:#0b1420;--dot:rgba(170,200,255,.11);--glass:rgba(21,33,47,.68);--glass-line:rgba(255,255,255,.09);--hover:rgba(255,255,255,.07);
  --shadow:0 0 0 1px rgba(255,255,255,.04),0 30px 70px -30px rgba(0,0,0,.7);--sheet:#172331;--sheet2:#1e2c3d;--ink:#e6edf6;--muted:#9fb0c3;--line:#2b3b4f;--margin:rgba(255,130,130,.35);
  --accent:#e6edf6;--accent-ink:#0b1420;--ok:#6fd1a2;--ok-soft:#163a2c;--bad:#ff8f84;--bad-soft:#43211e;--warn:#f0c46a;--warn-soft:#3a2f14;--blue:#9db0ff;--blue-soft:#222d57;--glow:.34;
  --a1:#4b6fd6;--a2:#7c5cc4;--a3:#2c8f86}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 var(--sans);min-height:100vh;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4{margin:0}
p{margin:.45em 0}
[hidden]{display:none!important}
.muted{color:var(--muted)}.fine{font-size:13px}.spacer{flex:1}

/* aurora */
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:var(--paper)}
.aurora::after{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--dot) 1.1px,transparent 1.3px);background-size:22px 22px;
  -webkit-mask-image:radial-gradient(ellipse 80% 55% at 50% 0%,#000 0%,transparent 80%);mask-image:radial-gradient(ellipse 80% 55% at 50% 0%,#000 0%,transparent 80%)}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:var(--glow);will-change:transform}
.aurora i:nth-child(1){width:60vmax;height:60vmax;left:-16vmax;top:-26vmax;background:var(--a1);animation:d1 40s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:52vmax;height:52vmax;right:-18vmax;top:4vmax;background:var(--a2);animation:d2 48s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:48vmax;height:48vmax;left:18vw;bottom:-30vmax;background:var(--a3);animation:d3 56s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(9vmax,7vmax) scale(1.1)}}@keyframes d2{to{transform:translate(-8vmax,10vmax) scale(.92)}}@keyframes d3{to{transform:translate(-10vmax,-6vmax) scale(1.12)}}

.shell{max-width:940px;margin:0 auto;padding:16px 14px 130px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:10px 4px 14px;flex-wrap:wrap}
.title h1{font:700 34px/1.1 var(--kai);letter-spacing:.04em}
.title p{margin:4px 0 0;color:var(--muted);font-size:14px}
.top .right{display:flex;gap:8px;align-items:center}
.chip-days{display:flex;align-items:baseline;gap:6px;padding:6px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-weight:700}
.chip-days b{font:700 22px/1 var(--kai);color:var(--bad)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:7px 16px;border-radius:999px;border:1px solid var(--glass-line);background:var(--glass);
  font-weight:700;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--ink);transition:background-color .2s}
.btn:hover:not(:disabled){background:var(--sheet)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover:not(:disabled){opacity:.9;background:var(--accent)}
.btn.line{border-color:var(--line)}
.btn.small{min-height:32px;padding:4px 12px;font-size:14px}
.btn.good{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn.badb{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* pills + tabs */
.subjects{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 12px}
.subjects::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
.subjects button{flex:0 0 auto;display:flex;align-items:center;gap:8px;min-height:42px;padding:7px 18px;font-weight:700;border:1px solid var(--glass-line);border-radius:999px;
  background:var(--glass);color:var(--ink);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 20px -14px rgba(40,64,128,.5)}
.subjects button:hover:not([aria-pressed=true]){background:var(--sheet)}
.subjects button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.subjects .sd{width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.subjects .cnt{font-size:12px;font-weight:700;min-width:20px;padding:0 6px;border-radius:999px;background:rgba(127,140,160,.22);line-height:20px;text-align:center}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 12px}
.tab{flex:0 0 auto;border:1px solid transparent;background:transparent;padding:8px 18px;border-radius:12px 12px 6px 6px;font-weight:700;color:var(--muted);font-size:16px;position:relative}
.tab:hover{background:var(--hover)}
.tab.active{background:var(--sheet);color:var(--ink);border-color:var(--line);box-shadow:0 3px 0 -1px var(--hl)}
.sheet{position:relative;background:var(--glass);border:1px solid var(--glass-line);border-radius:26px;box-shadow:var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  padding:26px 26px 30px var(--pl);min-height:360px;
  background-image:linear-gradient(90deg,transparent var(--mx),var(--margin) var(--mx),var(--margin) calc(var(--mx) + 2px),transparent calc(var(--mx) + 2px))}
@media (max-width:640px){.sheet{padding:20px 14px 24px var(--pl);border-radius:20px;--mx:30px;--pl:44px}.subjects button{padding:6px 14px}.title h1{font-size:28px}}
.sheet h2{font:700 21px/1.4 var(--kai);margin:22px 0 10px}.sheet h2:first-child{margin-top:0}
.sheet h3{font:700 17px/1.4 var(--kai);margin:18px 0 8px}

/* blocks */
.notice{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 16px;background:var(--sheet2)}
.notice p{margin:4px 0 10px}.notice p:last-child{margin-bottom:0}
.notice.warn{background:var(--warn-soft);border-color:var(--warn)}
.notice.error{background:var(--bad-soft);border-color:var(--bad);white-space:pre-wrap}
.notice.ok{background:var(--ok-soft);border-color:var(--ok)}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin:0 0 14px}
.controls label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.controls .grow{flex:1 1 200px}.controls label{min-width:0;max-width:100%}.controls .grow select{width:100%}.controls label.chk{flex-direction:row;align-items:center;white-space:normal}.subs .tag{white-space:normal;line-height:1.4;padding:3px 10px;border-radius:12px;max-width:100%}
select,input[type=text],input[type=password],input[type=number],input[type=date],textarea{border:1.5px solid var(--line);background:var(--sheet);border-radius:10px;padding:8px 10px;min-height:40px;max-width:100%}
input[type=text],input[type=password],textarea{width:100%}
textarea{min-height:90px;resize:vertical;line-height:1.6}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--sheet2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.blue{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.tag.red{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.tag.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.bar{height:8px;border-radius:99px;background:var(--sheet2);overflow:hidden;border:1px solid var(--line)}.bar>i{display:block;height:100%;border-radius:99px;background:var(--blue)}
.empty{padding:26px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:14px;background:var(--sheet2)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--sheet);padding:5px 14px;border-radius:99px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hl{background:linear-gradient(transparent 58%,var(--hl) 58%)}
.tip{border-left:4px solid var(--hl);background:var(--warn-soft);padding:8px 12px;border-radius:0 10px 10px 0;margin:10px 0;font-size:.94rem}
.warnbox{border-left:4px solid var(--bad);background:var(--bad-soft);padding:8px 12px;border-radius:0 10px 10px 0;margin:10px 0;font-size:.94rem}
.scroll-x{overflow-x:auto}

/* hero */
.hero{background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:20px 22px}
.hero .big{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.hero .num{font:700 clamp(3.4rem,10vw,5.6rem)/1 var(--kai)}
.hero .lbl{font-size:1.05rem;font-weight:700}
.omr{display:grid;grid-template-columns:repeat(auto-fill,minmax(20px,1fr));gap:7px;margin-top:16px}
.omr b{aspect-ratio:1;border-radius:50%;border:2px solid var(--line);display:block}
.omr b.past{background:var(--muted);border-color:var(--muted);opacity:.7}
.omr b.today{border-color:var(--bad);background:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.omr b.exam{border-color:var(--blue);border-width:3px}
.omr-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px;color:var(--muted)}
.omr-legend span::before{content:"";display:inline-block;width:11px;height:11px;border-radius:50%;border:2px solid var(--line);margin-right:6px;vertical-align:-1px}
.omr-legend .l-past::before{background:var(--muted);border-color:var(--muted)}
.omr-legend .l-today::before{background:var(--bad);border-color:var(--bad)}
.omr-legend .l-exam::before{border-color:var(--blue)}

/* chapters */
.chap{border:1px solid var(--line);border-radius:12px;background:var(--sheet);margin-bottom:8px}
.chap>summary{list-style:none;display:flex;gap:10px;align-items:center;padding:10px 14px;cursor:pointer;font-weight:700}
.chap>summary::-webkit-details-marker{display:none}
.chap>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
.chap[open]>summary::before{transform:rotate(90deg)}
.chap>summary .t{flex:1;min-width:0}
.chap[open]>summary{border-bottom:1px solid var(--line)}
.chap .body{padding:12px 16px 16px}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.chk input{width:17px;height:17px;accent-color:var(--ok)}
.subs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.note h4{margin:14px 0 4px;font:700 16px var(--kai)}
.note ul{margin:.3em 0;padding-left:1.2em}.note li{margin:.2em 0}
.note table,.md table{border-collapse:collapse;width:100%;margin:8px 0;font-size:.92rem}
.note th,.note td,.md th,.md td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
.note th,.md th{background:var(--sheet2)}
.note code,.md code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--sheet2);padding:1px 6px;border-radius:5px;font-size:.88em}
.md h1,.md h2,.md h3,.md h4{font-family:var(--kai);line-height:1.4;margin:1.2em 0 .4em}
.md h2{font-size:19px;background:linear-gradient(transparent 58%,var(--hl) 58%);display:inline-block}
.md h3{font-size:17px}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md ul,.md ol{padding-left:1.3em}
.md pre{background:var(--sheet2);padding:10px;border-radius:10px;overflow-x:auto}
.md blockquote{margin:.6em 0;padding:4px 12px;border-left:4px solid var(--hl);background:var(--warn-soft);border-radius:0 8px 8px 0}
.md{overflow-wrap:anywhere}

/* quiz/flash */
.qbox{max-width:760px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--sheet);padding:10px 12px;border-radius:12px;margin:7px 0}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .bub{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--muted)}
.opt.sel{border-color:var(--ink)}.opt.sel .bub{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.flash{max-width:620px}
.face{min-height:230px;border:1.5px solid var(--ink);border-radius:20px;background:var(--sheet);padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 5px 0 var(--ink);cursor:pointer}
.face .q{font:700 22px/1.5 var(--kai)}.face .a{font-size:17px;white-space:pre-wrap}

/* exam */
.qcard{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.qcard .qh{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.qno{font:700 18px var(--kai)}
.part{margin:12px 0 4px;padding-left:12px;border-left:3px solid var(--line)}
.part .pm{float:right;margin-left:8px}
.stem{white-space:pre-wrap}
.score{font:700 44px/1 var(--kai)}
.fb{margin-top:8px;padding:8px 12px;border-radius:10px;background:var(--sheet2);font-size:.94rem}
.fb.full{background:var(--ok-soft)}.fb.zero{background:var(--bad-soft)}
.timerbar{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin-bottom:8px}
.timerbar b{font:700 22px var(--kai);font-variant-numeric:tabular-nums}

/* chat */
.msg{max-width:min(720px,94%);padding:10px 14px;border-radius:16px;margin:8px 0;border:1px solid var(--line);background:var(--sheet)}
.msg.user{margin-left:auto;background:var(--blue-soft);border-color:transparent}
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;background:var(--sheet2);cursor:pointer}
.drop.over{border-color:var(--blue);background:var(--blue-soft)}
.res{display:flex;flex-direction:column;gap:3px;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--sheet);border-radius:12px;padding:11px 14px}
.res:hover{border-color:var(--ink)}
.res b{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
table.t{border-collapse:collapse;width:100%;font-size:.92rem}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left}
table.t th{color:var(--muted);font-weight:700;font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:99px;font-weight:700;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.on{opacity:1}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.aurora i,.spin{animation:none}}
@media print{.aurora,.top,.subjects,.tabs,#petBox,#petBack,.no-print{display:none!important}.sheet{box-shadow:none;border:0;background:#fff}}
.fig{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;margin:10px 0;overflow-x:auto;text-align:center}.fig svg{max-width:100%;height:auto}.fig.fine{padding:10px 12px;background:var(--sheet)}
/* PPT 播放器 */
.ppt{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;color:var(--ink);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
  background:radial-gradient(60vmax 50vmax at 8% -5%,color-mix(in srgb,var(--a1) 55%,transparent),transparent),radial-gradient(55vmax 45vmax at 100% 15%,color-mix(in srgb,var(--a2) 50%,transparent),transparent),radial-gradient(60vmax 45vmax at 35% 115%,color-mix(in srgb,var(--a3) 50%,transparent),transparent),radial-gradient(circle,var(--dot) 1.2px,transparent 1.6px) 0 0/22px 22px,var(--paper)}
.ppt-top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 14px}
.ppt-name{flex:1 1 220px;font:700 16px var(--kai);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ppt-stage{flex:1;min-height:0;display:flex;padding:6px 14px;overflow:auto}
.ppt-slide{position:relative;margin:auto;width:100%;max-width:1040px;overflow:hidden;background:var(--glass);border:1px solid var(--glass-line);border-radius:28px;box-shadow:var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  padding:clamp(26px,4.6vw,56px) clamp(22px,5vw,64px) clamp(26px,4vw,48px);min-height:min(66vh,560px);display:flex;flex-direction:column;justify-content:center;outline:none;animation:pptIn .38s ease both}
.ppt-slide::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:linear-gradient(90deg,var(--a1),var(--a2),var(--a3))}
.ppt-slide::after{content:attr(data-no);position:absolute;right:clamp(14px,3vw,34px);bottom:0;font:700 clamp(72px,15vw,170px)/1 var(--kai);color:color-mix(in srgb,var(--ink) 6%,transparent);pointer-events:none;letter-spacing:-.02em}

 {id:"mat",lang:"en",name:"数学 Matematik",ms:"Matematik",code:"1449",color:"#17795a",ep:"mathematics",core:true,

   ["T4 Bab 10 Matematik Pengguna: Pengurusan Kewangan",`<ul><li><b>SMART 目标</b>：Specific 具体、Measurable 可衡量、Achievable 可达成、Realistic 实际、Time-bound 有时限。</li><li>财务目标按时间分：短期 (约 1 年内)、中期、长期。</li><li><b>现金流 (aliran tunai)</b> = 收入 − 支出：收入大于支出为<b>盈余 (lebihan)</b>，小于为<b>赤字 (defisit)</b>。</li><li>支出分固定 (如房租、贷款) 和非固定 (如餐饮、娱乐)。</li><li>理财步骤：设定目标 → 了解现况 → 制订计划 → 执行 → 检讨调整。</li></ul><div class="tip">各阶段的具体年限和术语请以你手上的课本为准。</div>`],

   ["T5 Bab 3-4 Insurans & Cukai",`<ul><li>Insurans：premium、deductible、<b>co-insurance 条款</b> (保额不足 80% 要按比例赔)。</li><li>Cukai：<b>Pendapatan bercukai = Pendapatan agregat − Pelepasan cukai (relief)</b>，再按税率表分段计算；<b>rebat (rebate)</b> 是最后从应缴税额里扣，不是从收入里扣。</li></ul>`],
   ["T5 Bab 5 Kekongruenan, Pembesaran & Transformasi",`<ul><li>全等：SSS, SAS, ASA, AAS, RHS。</li><li>放大：比例因子 k；面积比 = k²。</li><li>三种等距变换：平移、反射、旋转 (面积不变)；放大<b>不是</b>等距变换。</li><li><b>变换的组合</b>：写作 VW，表示<b>先做 W，再做 V</b> (从右往左)。</li><li><b>Teselasi (tessellation)</b>：用全等图形无缝、不重叠地铺满平面。</li></ul>`],

function toOAI(contents,stripped){

function pptBullets(arr,max){const out=[];let cur=[];arr.forEach(b=>{if(cur.length>=max){out.push(cur);cur=[]}cur.push(b)});if(cur.length)out.push(cur);return out}
function mdToSlides(md){
  const slides=[];let cur=null;const flush=()=>{if(cur&&(cur.b.length||cur.tip))slides.push(cur);cur=null};
  const start=t=>{flush();cur={t:t,tz:"",b:[],z:"",tip:""}};
  const clean=s=>s.replace(/\*\*(.+?)\*\*/g,"$1").replace(/`([^`]+)`/g,"$1").replace(/^\s*[>#]+\s*/,"").trim();
  start("要点");
  md.split("\n").forEach(raw=>{const line=raw.trim();if(!line)return;
    let m;if(m=line.match(/^#{1,4}\s+(.*)$/)){start(clean(m[1]));return}
    if(/^\|?\s*:?-{2,}/.test(line))return;
    let txt=null;if(m=line.match(/^([-*•]|\d+[.)])\s+(.*)$/))txt=clean(m[2]);else if(line.startsWith("|"))txt=line.replace(/^\||\|$/g,"").split("|").map(x=>clean(x)).filter(Boolean).join(" — ");else txt=clean(line);
    if(!txt)return;
    if(/^华文[:：]/.test(txt)){const z=txt.replace(/^华文[:：]\s*/,"");const last=cur.b[cur.b.length-1];if(last&&typeof last==="string")cur.b[cur.b.length-1]=[last,z];else if(Array.isArray(last)&&!last[1])last[1]=z;else cur.z+=(cur.z?" ":"")+z;return}
    cur.b.push(txt)});
  flush();const res=[];slides.forEach(sl=>{const parts=pptBullets(sl.b,5);if(!parts.length){res.push(sl);return}parts.forEach((p,i)=>res.push({t:sl.t+(parts.length>1&&i?"（续）":""),tz:sl.tz,b:p,z:i===parts.length-1?sl.z:"",tip:i===parts.length-1?sl.tip:""}))});
  return res}
function htmlToSlides(html){
  const d=new DOMParser().parseFromString("<div>"+html+"</div>","text/html").body.firstChild;const slides=[];let cur={t:"内置要点",tz:"",b:[],z:"",tip:""};
  const flush=()=>{if(cur.b.length||cur.tip)slides.push(cur)};
  [...d.children].forEach(el=>{const tn=el.tagName;
    if(tn==="H4"||tn==="H3"){flush();cur={t:el.textContent.trim(),tz:"",b:[],z:"",tip:""}}
    else if(tn==="UL"||tn==="OL"){el.querySelectorAll(":scope>li").forEach(li=>cur.b.push(li.textContent.replace(/\s+/g," ").trim()))}
    else if(tn==="TABLE"){el.querySelectorAll("tr").forEach(tr=>{const t=[...tr.children].map(x=>x.textContent.replace(/\s+/g," ").trim()).filter(Boolean).join(" — ");if(t)cur.b.push(t)})}
    else if(el.classList&&(el.classList.contains("tip")||el.classList.contains("warnbox")))cur.tip=el.textContent.trim();
    else{const t=el.textContent.replace(/\s+/g," ").trim();if(t)cur.b.push(t)}});
  flush();const res=[];slides.forEach(sl=>{const parts=pptBullets(sl.b,5);if(!parts.length){res.push(sl);return}parts.forEach((p,i)=>res.push({t:sl.t+(parts.length>1&&i?"（续）":""),tz:"",b:p,z:"",tip:i===parts.length-1?sl.tip:""}))});return res}

function pptGo(d){const n=PP.decks[PP.di].slides.length;const v=Math.max(0,Math.min(n-1,PP.si+d));if(v!==PP.si){PP.si=v;drawPpt()}}

  let box=document.getElementById("ppt");if(!box){box=document.createElement("div");box.id="ppt";box.className="ppt";box.setAttribute("role","dialog");box.setAttribute("aria-modal","true");box.setAttribute("aria-label","PPT："+P.c.t);document.body.appendChild(box)}

const FIGRULE="【作图规则】是否需要图由你自己判断：凡是看图比看文字更容易懂、或 SPM 常考看图作答的内容 (如生物的细胞、器官、系统结构图，食物链和各种循环图，实验装置图，化学仪器和分子结构，电路图、光线图、受力图，几何图形，函数图像，地理或历史示意图，流程图)，即使学生没要求也主动画出来，不要只用文字描述；一句话能讲清楚的就不画。生物结构图画简化的示意即可，每个部分用引线加文字标出名称，图后再用文字列出各部分的功能。用三个反引号代码块，有三种写法：\n(1) 函数图像：```plot 代码块，每行一项。例如 y = x^2 - 4x + 3 (可以多条)；可选 x: -2..6 和 y: -4..10 设定范围；points: (1,0) A; (3,0) B 标出点；x = 2 画竖虚线 (如对称轴)；title: 标题。\n(2) 其他示意图 (装置图、几何、电路)：```svg 代码块，写完整的 <svg viewBox=\"0 0 600 400\" xmlns=\"http://www.w3.org/2000/svg\">，不要填背景色，线条和文字用深色 (#222)，文字 font-size 14-16，每个部件都标上名称 (如「烧瓶」「冷凝管」)；不要用 script、image、style 或外部链接。画不准的细节宁可简化，并说明这是示意图。\n(3) 写实插图：```image 代码块，里面用一句英文写画面描述 (画什么、什么风格)。只在需要「看起来像真的」而且不需要精确文字标注时才用 (如器官外观、显微镜下的样子、地貌)；有标注的结构图一律用 svg。学生点一下按钮才会生成，所以不要滥用。\n代码块前后照常用文字讲解。";

function kwScore(c,q){const hay=(c.t+" "+c.subs.join(" ")+" "+plain(c.n)+" "+(S.notes[c.k]?S.notes[c.k].md:"")+" "+(S.req[c.k]||"")).toLowerCase();let sc=0;
  (q.toLowerCase().match(/[a-z]{3,}/g)||[]).forEach(w=>{if(hay.includes(w))sc+=2});const zh=q.replace(/[^\u4e00-\u9fff]/g,"");for(let i=0;i<zh.length-1;i++){if(hay.includes(zh.slice(i,i+2)))sc+=1}return sc}
async function buildCtx(sid,query){
  const cs=chapsOf(sid).filter(c=>c.core),key=S.scope[sid],blocks=[];let used=[];
  if(key){const c=cs.find(x=>x.k===key);if(c){blocks.push("【当前章节】"+c.t+"\n"+chapText(c,7000));used.push(c.t)}}
  else{cs.map(c=>({c,sc:kwScore(c,query)})).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc).slice(0,3).forEach(x=>{blocks.push("【相关章节】"+x.c.t+"\n"+chapText(x.c,3000));used.push(x.c.t)})}
  const reqs=cs.filter(c=>S.req[c.k]&&!used.includes(c.t)).slice(0,6).map(c=>c.t+"：要求 "+S.req[c.k]);if(reqs.length)blocks.push("【其他章节的学生要求】\n"+reqs.join("\n"));
  const catalog="【本科章节目录】\n"+cs.map(c=>c.t+(c.subs.length?"（"+c.subs.join("；")+"）":"")).join("\n");
  const fp=await fileParts(sid);
  const rule=S.strict?"回答规则：只依据下面【资料】和学生上传的文件作答。资料没有覆盖的点，先明确说「资料里没有这一点」，再用 SPM 通用知识补充，并在该段前标注 [通用知识]。不要把通用知识说成是课本原文。":"回答规则：优先依据下面【资料】和学生上传的文件；资料没写到的，可用 SPM 通用知识补充，并标注 [通用知识]。";

/* ---- Gemini Files API：大文件 (如整本课本) ---- */
function keyTag(){const k=(S.ai.key||"").trim();return k?k.slice(0,6)+k.length:""}
async function uploadToGemini(blob,name,mime){
  const key=S.ai.key.trim();
  let start;try{start=await fetch("https://generativelanguage.googleapis.com/upload/v1beta/files?key="+encodeURIComponent(key),{method:"POST",headers:{"X-Goog-Upload-Protocol":"resumable","X-Goog-Upload-Command":"start","X-Goog-Upload-Header-Content-Length":String(blob.size),"X-Goog-Upload-Header-Content-Type":mime,"Content-Type":"application/json"},body:JSON.stringify({file:{display_name:name.slice(0,100)}})})}
  catch(e){throw new Error("无法连接 Google 上传服务。如果是在 claude.ai 里打开的预览版，那里不允许；请用 GitHub Pages 或本地的 index.html。")}
  if(!start.ok){let d=null;try{d=await start.json()}catch(e){}throw new Error(aiErr(start.status,d))}
  const upUrl=start.headers.get("x-goog-upload-url");
  if(!upUrl)throw new Error("拿不到上传地址 (浏览器可能没有放行响应头)。可以先把文件拆小到 14 MB 以内再上传。");
  const info=await new Promise((ok,no)=>{const x=new XMLHttpRequest();x.open("POST",upUrl);x.setRequestHeader("X-Goog-Upload-Offset","0");x.setRequestHeader("X-Goog-Upload-Command","upload, finalize");
    let last=0;x.upload.onprogress=e=>{if(e.lengthComputable&&Date.now()-last>700){last=Date.now();toast(`上传「${name}」${Math.round(e.loaded/e.total*100)}%`)}};
    x.onload=()=>{if(x.status>=200&&x.status<300){try{ok(JSON.parse(x.responseText))}catch(e){no(new Error("上传返回的格式不对"))}}else{let d=null;try{d=JSON.parse(x.responseText)}catch(e){}no(new Error(aiErr(x.status,d)))}};
    x.onerror=()=>no(new Error("上传失败：网络中断，请重试。"));x.send(blob)});
  let file=info.file||info;
  for(let i=0;i<60&&file.state==="PROCESSING";i++){await sleep(2000);const r=await fetch("https://generativelanguage.googleapis.com/v1beta/"+file.name+"?key="+encodeURIComponent(key));if(r.ok)file=await r.json();else break}
  if(file.state==="FAILED")throw new Error("Google 无法处理这个文件，请换一个或拆分后再试。");
  return{uri:file.uri,mime:file.mimeType||mime,expires:file.expirationTime?new Date(file.expirationTime).getTime():Date.now()+47*3600e3}}
async function ensureRemote(f,mime){
  if(!gemOK())throw new Error("大文件要先上传到 Google，请先到「设置」填写 API key。");
  const r=f.remote;if(r&&r.expires-Date.now()>30*60e3&&r.keyId===keyTag())return r;
  toast(`正在上传「${f.name}」到 Google…`);
  const up=await uploadToGemini(f.blob,f.name,mime);f.remote={uri:up.uri,mime:up.mime,expires:up.expires,keyId:keyTag()};await DB.put(f);return f.remote}

/* ---- Cloudflare 云端同步 (同你原来那份的 Worker 协议：PUT/GET {base}/s/{id}) ---- */
const SYNC_SALT="spm-notes-sync-v1";
let syncTimer=null,syncBusy=false,lastPull=0;
function syncBase(){return(S.sync.url||"").trim().replace(/\/+$/,"")}
function syncOn(){return !!(syncBase()&&gemOK())}
function syncSet(t,cls){const e=document.getElementById("syncStatus");if(e){e.textContent=t;e.style.color=cls==="bad"?"var(--bad)":cls==="ok"?"var(--ok)":""}}
function hash53(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
const SYNC_SKIP=["ai","use","draft","openChap","pickChap","sync"];
function syncSnapshot(){const o={};for(const k of Object.keys(S)){if(!SYNC_SKIP.includes(k))o[k]=S[k]}return o}
const syncHashNow=()=>hash53(JSON.stringify(syncSnapshot()));
function syncHasContent(){return !!(Object.keys(S.notes).length||S.wrong.length||S.cards.length||S.exams.length||Object.keys(S.done).length||Object.keys(S.req).length)}
function b64(buf){let s="";const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)}
function unb64(s){const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
async function syncKeys(){const enc=new TextEncoder(),secret=S.ai.key.trim();
  const idBuf=await crypto.subtle.digest("SHA-256",enc.encode("spm-id:"+secret));const id=[...new Uint8Array(idBuf)].map(b=>b.toString(16).padStart(2,"0")).join("");
  const base=await crypto.subtle.importKey("raw",enc.encode(secret),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:enc.encode(SYNC_SALT),iterations:100000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
  return{id,key}}
function scheduleSync(){if(!syncOn())return;clearTimeout(syncTimer);syncTimer=setTimeout(syncPush,20000)}
async function doPush(){
  const h=syncHashNow();let snap=syncSnapshot(),json=JSON.stringify(snap);
  if(json.length>4e6){snap.exams=(snap.exams||[]).map(e=>{const{snap:_s,...r}=e;return r});snap.chat={};json=JSON.stringify(snap);if(json.length>4e6)throw new Error("数据超过 4MB，同步不了。先删掉一些旧的 AI 笔记版本或旧试卷。")}
  const{id,key}=await syncKeys();const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(json));const ts=Date.now();
  let res;try{res=await fetch(syncBase()+"/s/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({ts,iv:b64(iv),data:b64(ct)})})}catch(e){throw new Error("连不上同步服务，请检查网址和网络。")}
  if(!res.ok)throw new Error("云端返回 "+res.status+"，请检查 Worker。");
  S.sync.ts=ts;S.sync.hash=h;save()}
async function syncPush(){
  if(!syncOn()||syncBusy)return;if(syncHashNow()===S.sync.hash)return;syncBusy=true;
  try{syncSet("上传中…");await doPush();syncSet("已同步 ✓ "+fmtAt(S.sync.ts),"ok")}catch(e){syncSet(e.message,"bad")}finally{syncBusy=false}}
async function syncPull(manual){
  if(!syncOn()){if(manual)syncSet(gemOK()?"请先填 Worker 网址":"请先在设置里填 Gemini API key (同步内容用它加密)","bad");return}
  if(syncBusy)return;syncBusy=true;if(manual)syncSet("同步中…");
  try{const{id,key}=await syncKeys();let res;
    try{res=await fetch(syncBase()+"/s/"+id,{cache:"no-store"})}catch(e){throw new Error("连不上同步服务，请检查网址和网络。")}
    lastPull=Date.now();
    if(res.status===404){await doPush();syncSet("云端还没有数据，已上传 ✓","ok");return}
    if(!res.ok)throw new Error("云端返回 "+res.status+"，请检查 Worker。");
    const rem=await res.json(),dirty=syncHashNow()!==S.sync.hash;
    if(rem.ts>S.sync.ts){
      let useCloud=true;if(dirty&&syncHasContent())useCloud=confirm("云端有较新的数据，而这台设备也有还没同步的修改。\n\n确定 = 用云端覆盖本机\n取消 = 用本机覆盖云端");
      if(useCloud){let v;try{const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(rem.iv)},key,unb64(rem.data));v=JSON.parse(new TextDecoder().decode(pt))}catch(e){throw new Error("无法解密云端数据：这台设备的 API key 和云端用的不一样。")}
        const keep={ai:S.ai,use:S.use,sync:S.sync};S=Object.assign({},DEF,v,keep,{draft:null});if(!S.my||!S.my.length)S.my=["bm"];if(!S.my.includes(S.sub))S.sub=S.my[0];
        S.sync.ts=rem.ts;S.sync.hash=syncHashNow();bust();save();render();syncSet("已从云端更新 ✓ "+fmtAt(rem.ts),"ok");toast("已从云端同步");return}
      await doPush();syncSet("已用本机覆盖云端 ✓","ok");return}
    if(dirty){await doPush();syncSet("已同步 ✓ "+fmtAt(S.sync.ts),"ok")}else syncSet("已是最新 ✓ "+(S.sync.ts?fmtAt(S.sync.ts):""),"ok")}
  catch(e){syncSet(e.message,"bad")}finally{syncBusy=false}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&syncOn()&&Date.now()-lastPull>60000)syncPull(false);else if(document.visibilityState==="hidden"&&syncOn()){clearTimeout(syncTimer);syncPush()}});

  <div class="row"><button class="btn" id="bkOut">导出 JSON</button><label class="btn">导入 JSON<input type="file" id="bkIn" accept=".json" hidden></label><button class="btn badb" id="bkRs">清空全部进度</button></div>`;
  $("#sKeyOk").onclick=()=>{S.ai.key=$("#sKey").value.trim();S.ai.model=$("#sMd").value;save();$("#sKeyMsg").innerHTML=S.ai.key?'<span style="color:var(--ok)">已保存 ✓</span>':"已清除 key";toast(S.ai.key?"已保存":"已清除 key")};
  $("#pvSave").onclick=()=>{S.ai.provider=$("#pvMain").value;S.ai.fallback=$("#pvFb").checked;S.ai.imgModel=$("#sImgM").value.trim()||"gemini-3.1-flash-image-preview";$$("[data-pk]").forEach(i=>{S.ai.alt[i.dataset.pk].key=i.value.trim()});$$("[data-pm]").forEach(i=>{S.ai.alt[i.dataset.pm].model=i.value.trim()||PROVS[i.dataset.pm].model});save();$("#pvMsg").innerHTML='<span style="color:var(--ok)">已保存 ✓</span>';toast("已保存")};
  $("#syncSave").onclick=()=>{S.sync.url=$("#syncUrl").value.trim().replace(/\/+$/,"");save();if(!S.sync.url){syncSet("未启用");rSet();return}syncPull(true)};
  if($("#syncNow"))$("#syncNow").onclick=()=>syncPull(true);
  if($("#syncOff"))$("#syncOff").onclick=()=>{S.sync={url:"",ts:0,hash:""};save();rSet()};
  $("#sEx").onchange=e=>{if(e.target.value){S.exam=e.target.value;save();renderNav();toast("已更新")}};
  $$("[data-lang]").forEach(b=>b.onclick=()=>{S.lang=b.dataset.lang;save();rSet()});
  $$("[data-th]").forEach(b=>b.onclick=()=>{S.theme=b.dataset.th;save();applyTheme();rSet()});
  $$("[data-my]").forEach(c=>c.onchange=()=>{S.my=SUBJECTS.filter(s=>$(`[data-my="${s.id}"]`).checked).map(s=>s.id);if(!S.my.length){c.checked=true;S.my=[c.dataset.my]}if(!S.my.includes(S.sub))S.sub=S.my[0];save();renderNav()});
  $$("[data-cf]").forEach(c=>c.onchange=()=>{S.conf[c.dataset.cf]=+c.value;save()});
  $("#bkOut").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(Object.assign({},S,{ai:Object.assign({},S.ai,{key:"",alt:{}}),draft:null}),null,1)],{type:"application/json"}));a.download="spm-notes-backup.json";a.click()};
  $("#bkIn").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const keepAI=S.ai;S=Object.assign({},DEF,JSON.parse(t));S.ai=keepAI;bust();save();toast("已导入");render()}catch(x){toast("文件格式不对")}})};
  $("#bkRs").onclick=()=>{if(confirm("确定清空所有进度、AI 笔记和错题？这个操作不能撤销。(API key 会保留)")){const k=S.ai;S=Object.assign({},DEF,{since:today(),ai:k});bust();save();go("today")}}}

/* ---- 事件 ---- */
document.addEventListener("click",e=>{
  const sb=e.target.closest("#subjects [data-sub]");if(sb){S.sub=sb.dataset.sub;save();render();return}
  const tb=e.target.closest("#tabs [data-tab]");if(tb){S.tab=tb.dataset.tab;save();render();try{history.replaceState(null,"","#"+S.tab)}catch(x){}return}
  const a=e.target.closest("[data-act]");if(!a)return;const act=a.dataset.act,k=a.dataset.k,sid=a.dataset.sub;
  if(act!=="copynote")e.preventDefault();
  if(act==="goset"){S.tab="set";save();render()}
  else if(act==="opennote"){S.openChap=k;go("notes",sid);setTimeout(()=>{const d=document.querySelector(`details[data-k="${CSS.escape(k)}"]`);if(d){d.open=true;d.scrollIntoView({block:"center"})}},50)}
  else if(act==="gosub"){go(a.dataset.tab||"notes",sid)}
  else if(act==="gennote"){genNote(sid,k,a)}
  else if(act==="ppt"){openPpt(sid,k)}
  else if(act==="gensubs"){genSubs(sid,k,a)}
  else if(act==="cardchap"){genCards(sid,k,10,a)}
  else if(act==="askchap"){S.scope[sid]=k;go("chat",sid)}
  else if(act==="quizchap"){S.pickChap=k;dMode="mcq";qz=null;go("drill",sid)}
  else if(act==="copynote"){const n=S.notes[k];if(n&&navigator.clipboard)navigator.clipboard.writeText(n.md).then(()=>toast("已复制"),()=>toast("复制失败"))}
  else if(act==="histrestore"){const n=S.notes[k],h=n&&n.hist&&n.hist[+a.dataset.i];if(h&&confirm("恢复到这个版本？当前版本会放进历史版本里。")){putNote(k,h.md,h.at,+a.dataset.i);save();S.openChap=k;rNotes()}}
  else if(act==="delnote"){if(confirm("删除这一章的 AI 笔记 (连同历史版本)？")){delete S.notes[k];save();S.openChap=k;rNotes()}}
  else if(act==="delown"){S.own[sid]=(S.own[sid]||[]).filter(x=>String(x.id)!==a.dataset.id);bust();save();rNotes()}
});
document.addEventListener("click",e=>{const w=e.target.closest("[data-wai]");if(w){const x=S.wrong.find(y=>y.id===w.dataset.wai);if(!x)return;chatPending=`我做错了这道 SPM ${subj(x.s)?subj(x.s).name:""} 的题，请讲清楚：为什么错、正确思路、这个知识点怎么避免再错。\n题目：${x.q}\n${x.a?"参考答案/笔记："+x.a:""}`;go("chat",x.s)}
  const d=e.target.closest("[data-wdel]");if(d){S.wrong=S.wrong.filter(y=>y.id!==d.dataset.wdel);save();rWrong()}});
$("#btnSet").onclick=()=>{S.tab="set";save();render()};

/* ---- 启动 ---- */
load();applyTheme();
const h0=(location.hash||"").slice(1);if(TABS.some(t=>t[0]===h0))S.tab=h0;else if(!TABS.some(t=>t[0]===S.tab)&&S.tab!=="set")S.tab="today";
render();
if(syncOn())setTimeout(()=>syncPull(false),1200);
window.__spm={S:()=>S,go};
})();

</script>
</body>
