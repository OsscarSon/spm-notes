 a decision (✗) → make a decision (✓).", "decision 用 make"], ["interested on (✗) → interested in (✓).", "interested in"], ["Because ..., so ... in one sentence (✗).", "because 与 so 不同时用"], ["Overusing 'very'. Use strong adjectives (exhausted, delighted).", "少用 very，换强词"]], "", ""], ["Exam Question Patterns", "考试常见问法", [["Choose the correct preposition.", "选介词"], ["Replace the underlined word with a synonym.", "换同义词"], ["Join the sentences with a suitable linking word.", "用连接词合并句子"]], "", ""], ["Word Formation", "构词", [["Prefixes: un- (unhappy), dis- (dislike), im-/in-/il-/ir- (impossible, incorrect, illegal, irregular), mis- (misunderstand), re- (rebuild).", "前缀"], ["Suffixes: -tion/-ment (decision, development), -ness (kindness), -able (comfortable), -ful (helpful), -less (careless).", "后缀"], ["Change word class: succeed → success → successful → successfully.", "词性转换"], ["For cloze/word-formation items decide the class needed before changing the word.", "先判断需要的词性"]], "", ""], ["Phrasal Verbs", "短语动词", [["look after (take care of), look for (search), look up (check in a dictionary).", "照顾、寻找、查阅"], ["give up (stop trying), put off (postpone), turn down (refuse), carry on (continue).", "放弃、推迟、拒绝、继续"], ["come up with (think of an idea), run out of (have no more), take part in (join).", "想出、用完、参加"], ["get along with (have a good relationship), look forward to + -ing (wait eagerly).", "相处、期待"]], "", ""], ["Commonly Confused Words", "易混词", [["affect (verb) / effect (noun); advice (noun) / advise (verb).", "影响（动/名）；建议（名/动）"], ["accept (receive) / except (not including); lose (verb) / loose (not tight).", "接受/除外；丢失/松的"], ["its (belongs to it) / it's (it is); their / there / they're; then / than.", "its/it's；their/there/they're；then/than"], ["principal (head, main) / principle (rule); borrow (take) / lend (give).", "校长/原则；借入/借出"]], "", ""], ["Idioms and Collocations", "习语与搭配", [["break the ice (start a conversation); a piece of cake (very easy); under the weather (unwell).", "打破僵局；小菜一碟；身体不适"], ["hit the books (study hard); once in a blue moon (very rarely).", "用功读书；千载难逢"], ["Collocations: make a mistake, do homework, take a break, heavy rain, strong tea.", "固定搭配"]], "", ""], ["Uji Diri", "自测：先想答案，再对照", [["S: 'make' or 'do' a decision? J: make.", "问：decision 搭配？答：make。"], ["S: good ___ ? J: at.", "问：good ___？答：at。"], ["S: Link word for result? J: Therefore / Consequently.", "问：表结果？答：Therefore / Consequently。"], ["S: Fix: interested on J: interested in.", "问：改正 interested on答：interested in。"], ["S: Choose affect or effect: 'Pollution has a bad ___ on health.' J: effect.", "问：Pollution has a bad ___ on health？答：effect"], ["S: Meaning of 'give up'? J: stop trying.", "问：give up 的意思？答：放弃"]], "", ""]], "bi|5": [["Key Points", "重点要点", [["Subject–verb agreement: the number of ... is; a number of ... are.", "主谓一致"], ["Tenses: past simple for events; past continuous for background; present perfect for results up to now.", "时态用法"], ["Conditionals: If I were you, I would ...; If it rains, we will ...", "条件句"], ["Articles: the = specific/unique; a/an = first mention; no article for general plurals.", "冠词"], ["Reported speech: shift the tense back.", "间接引语时态后移"]], "", ""], ["Model Language", "范例与模板", [["Everyone / each / nobody take singular verbs.", "everyone 等配单数"], ["Since + point in time; for + duration.", "since 与 for"], ["Neither ... nor / Either ... or: verb agrees with the nearer subject.", "就近一致"]], "", ""], ["Common Mistakes", "常见错误", [["The number of students are (✗) → is (✓).", "the number of 配 is"], ["He go to school (✗) → goes (✓).", "第三人称单数"], ["I have seen him yesterday (✗) → saw (✓).", "昨天用过去式"], ["If I was you (✗ formal) → If I were you (✓).", "虚拟用 were"]], "", ""], ["Exam Question Patterns", "考试常见问法", [["Fill in the blank with the correct tense.", "选正确时态"], ["Correct the error in the sentence.", "改错"], ["Choose the correct article.", "选冠词"]], "", ""], ["Tenses Overview", "时态总览", [["Present simple: habits and facts (She walks to school). Present continuous: now or temporary (She is walking).", "现在时：习惯/正在进行"], ["Present perfect: result or experience up to now (I have finished). Use since + point in time, for + duration.", "现在完成时"], ["Past simple: finished events (I met him yesterday). Past continuous: background action (I was reading when he called).", "过去时与过去进行时"], ["Past perfect: earlier past (She had left before I arrived).", "过去完成时"], ["Future: will (decision/prediction), going to (plan), present continuous (arrangement).", "将来时"]], "", ""], ["Passive Voice", "被动语态", [["Form: be + past participle. The window was broken by the boy.", "结构：be + 过去分词"], ["Tenses: is made, was made, has been made, will be made, is being made.", "各时态被动"], ["Use the passive when the doer is unknown or unimportant: The shop was robbed last night.", "施事者不明或不重要时用"], ["Change active to passive: object becomes subject; verb → be + past participle; subject → by + agent.", "主动变被动的步骤"]], "", ""], ["Conditionals", "条件句", [["Zero: If you heat ice, it melts. (general truth)", "零条件：普遍真理"], ["First: If it rains, we will stay home. (real, likely)", "第一条件：可能发生"], ["Second: If I were you, I would apologise. (unreal present)", "第二条件：与现在事实相反"], ["Third: If she had studied, she would have passed. (unreal past)", "第三条件：与过去事实相反"]], "", ""], ["Reported Speech", "间接引语", [["Shift tenses back: 'I am tired' → She said (that) she was tired.", "时态后退一步"], ["Change pronouns and time words: now → then; today → that day; tomorrow → the next day.", "代词与时间状语变化"], ["Questions: 'Where do you live?' → He asked where I lived. Yes/no: He asked if/whether ...", "疑问句改写，语序变陈述"], ["Commands: 'Sit down.' → She told me to sit down.", "祈使句：told ... to"]], "", ""], ["Relative Clauses and Connectors", "关系从句与连接词", [["who (people), which (things), that (both), whose (possession), where (places).", "关系代词"], ["Non-defining clauses use commas: My uncle, who lives in Ipoh, is a doctor.", "非限定性从句加逗号"], ["Contrast: although, however, but. Reason: because, since. Result: so, therefore. Addition: moreover, in addition.", "对比/原因/结果/递进"], ["Do not use although and but together in one sentence.", "although 和 but 不能同用"]], "", ""], ["Prepositions, Articles and Modal Verbs", "介词、冠词与情态动词", [["Time: at 7 o'clock, on Monday, in June. Place: at the bus stop, in the room, on the table.", "时间与地点介词"], ["a/an for first mention or a general singular; the for specific or unique things (the sun).", "冠词用法"], ["Modal verbs: must (necessity), should (advice), can/could (ability, possibility), might (possibility).", "情态动词"], ["Modals are followed by the base verb: She can swim (not can swims).", "情态动词后接动词原形"]], "", ""], ["Uji Diri", "自测：先想答案，再对照", [["S: 'A number of students ___' (is/are)? J: are.", "问：a number of students ___？答：are。"], ["S: Since or for: 'two years'? J: for.", "问：'two years' 用 since 还是 for？答：for。"], ["S: If I ___ you, I would ... (was/were)? J: were.", "问：If I ___ you？答：were。"], ["S: Report: 'I am tired,' she said. J: She said (that) she was tired.", "问：改间接引语？答：She said (that) she was tired."], ["S: Complete: If it rains, we ___ stay home. J: will.", "问：If it rains, we ___ stay home？答：will"], ["S: Passive: The boy broke the window. J: The window was broken by the boy.", "问：改被动？答：The window was broken by the boy."]], "", ""]], "bi|6": [["Key Points", "重点要点", [["Listening: 30 marks, about 40 minutes.", "听力 30 分，约 40 分钟"], ["Read the options before the audio; underline keywords.", "先读选项，划关键词"], ["Listen for numbers, names, times and changes of mind (but, actually).", "注意数字、名字、时间、转折"], ["Speaking: give an opinion, a reason and an example.", "口语：观点+理由+例子"]], "", ""], ["Model Language", "范例与模板", [["In my opinion ... because ...", "我认为……因为……"], ["For example, ...", "例如……"], ["On the other hand, ...", "另一方面……"], ["Could you say that again, please?", "请再说一遍"]], "", ""], ["Common Mistakes", "常见错误", [["Answering with only yes/no.", "只答 yes/no"], ["Writing the answer late and missing the next question.", "答案写太慢漏下一题"], ["Long silence; use fillers such as 'Let me think'.", "长时间沉默"]], "", ""], ["Exam Question Patterns", "考试常见问法", [["Choose the picture that matches the recording.", "选与录音相符的图"], ["Complete the notes with a word or number.", "填词或数字"], ["Talk about your hobbies / a memorable event.", "谈爱好/难忘经历"]], "", "Speaking marks: confirm with the official format book."], ["Listening: Strategies by Task", "听力：按题型策略", [["Picture/short dialogue: look at the pictures first and predict the vocabulary.", "图片题：先预测词汇"], ["Notes completion: write a word or number; check spelling and units.", "填空：注意拼写和单位"], ["Multiple choice: listen for the idea, not just matching words; beware of corrections (No, I mean ...).", "选择题：留意更正"], ["Use pauses to read the next question; never leave a blank.", "利用间隙读下一题；不留空白"]], "", ""], ["Speaking: Answer Structure", "口语：回答结构", [["A.R.E.: Answer → Reason → Example. Do you like reading? Yes, I do, because it relaxes me. For example, last week I finished a mystery novel.", "回答 → 理由 → 例子"], ["Speak in full sentences; extend answers beyond one word.", "用完整句子"], ["Useful phrases: In my opinion, ...; Another point is ...; On the other hand, ...; Could you repeat that, please?", "常用表达"], ["Keep a steady pace; if you make a mistake, correct yourself calmly and continue.", "语速平稳，出错自然纠正"]], "", ""], ["Uji Diri", "自测：先想答案，再对照", [["S: What to do before the audio starts? J: Read the options.", "问：听前做什么？答：先读选项。"], ["S: Name one linking phrase for examples. J: For example.", "问：举例用语？答：For example。"], ["S: Marks for Listening? J: 30.", "问：听力总分？答：30 分。"], ["S: What does A.R.E. stand for in speaking? J: Answer, Reason, Example.", "问：A.R.E. 指什么？答：回答、理由、例子"]], "", ""]], "bm|0": [["Istilah Penting", "重点术语", [["Jenis karangan: rencana, ucapan, cerita, laporan, surat.", "文体种类"], ["Bahagian A wajib; Bahagian B pilih satu (ikut format kertas anda).", "A 必答，B 选一"], ["Pendahuluan: peribahasa, soalan retorik, definisi atau situasi.", "开头方式"], ["Binaan perenggan: isi + huraian + contoh + kesimpulan kecil.", "段落结构"], ["Penutup: rumusan dan harapan atau nasihat.", "结尾：总结与希望"]], "", ""], ["Contoh & Templat", "范例与模板", [["Penanda wacana: Pertama sekali, Selain itu, Di samping itu, Tambahan pula, Walau bagaimanapun, Akhir sekali.", "连接语"], ["Peribahasa: Bersatu teguh, bercerai roboh; Hendak seribu daya, tak hendak seribu dalih.", "谚语例子"], ["Ucapan: Salam hormat → penghargaan kepada tetamu → isi → penutup + terima kasih.", "演讲格式"], ["Laporan: Tajuk → Tarikh/Tempat → Isi → Penutup + nama penulis.", "报告格式"]], "", ""], ["Kesalahan Lazim", "常见错误", [["Tersalah jenis karangan atau format.", "文体或格式错"], ["Isi disenaraikan tanpa huraian.", "只列点不阐述"], ["Ayat terlalu panjang dan tidak tepat.", "句子冗长"], ["Tiada penutup.", "没有结尾"]], "", ""], ["Soalan Lazim SPM", "考试常见问法", [["Tulis sebuah rencana tentang pentingnya ...", "写文章谈...的重要"], ["Tulis ucapan tentang ... untuk perhimpunan sekolah.", "校会演讲"], ["Tulis cerita yang bermula dengan ...", "指定开头的故事"]], "", "Bahagian/markah: ikut format rasmi dalam kertas anda."], ["Struktur Karangan", "作文结构", [["Pendahuluan (1 perenggan): ayat pembuka (peribahasa / soalan retorik / definisi / pernyataan), huraikan tajuk, nyatakan hala tuju isi.", "引言（1 段）：开头句（谚语/设问/定义/陈述）、解释题目、点出要写的要点"], ["Isi (3–4 perenggan): satu isi utama setiap perenggan + huraian + contoh/bukti + kesimpulan kecil.", "主体（3–4 段）：每段一个主要点 + 阐述 + 例子/证据 + 小结"], ["Penutup (1 perenggan): rumusan isi dan harapan/nasihat; jangan bawa isi baharu.", "结尾（1 段）：总结要点并写期望/劝勉；不要引入新内容"], ["Susun isi dari yang paling penting kepada yang kurang penting; gunakan penanda wacana antara perenggan.", "要点按重要性排列；段与段之间用语篇标记连接"], ["Patuhi jenis karangan dan format yang diminta: rencana, ucapan, laporan, cerita, surat rasmi.", "严格按题目要求的体裁与格式写"]], "", "Petua: baca soalan dua kali, bulatkan kata kunci (jenis karangan, bilangan isi, sasaran pembaca) sebelum menulis."], ["Surat Rasmi: Format", "正式书信格式", [["Alamat pengirim di penjuru kanan atas, kemudian tarikh di bawahnya.", "寄信人地址在右上角，下面写日期"], ["Alamat penerima di sebelah kiri: nama/jawatan, nama organisasi, alamat.", "收信人地址在左侧：姓名/职位、机构、地址"], ["Salam pembuka: Tuan/Puan, (dengan tanda koma).", "称呼：Tuan/Puan,"], ["Tajuk surat dalam huruf besar dan tebal/bergaris, ringkas dan jelas, contohnya: PERMOHONAN MENGGUNAKAN DEWAN SEKOLAH.", "标题用大写并加粗/下划线，简短明确"], ["Isi: perenggan pembuka (tujuan), perenggan isi (butiran), perenggan penutup. Akhiri dengan: Sekian, terima kasih. Kemudian: Yang benar, (nama dalam kurungan).", "正文：开头（目的）、内容（细节）、结尾；以“Sekian, terima kasih.”结束，再写“Yang benar,”和署名"]], "", "Petua: gunakan bahasa baku, tiada singkatan SMS dan tiada ayat emosi dalam surat rasmi."], ["Ucapan dan Laporan", "演讲稿与报告", [["Ucapan: salam pembuka → penghormatan kepada tetamu (Yang Berusaha..., Yang Dihormati...) → pendahuluan → isi (3–4) → penutup + Sekian, terima kasih.", "演讲稿：开场问候 → 向嘉宾致敬 → 引言 → 要点 → 结尾致谢"], ["Gunakan ayat retorik, ajakan dan gaya bahasa untuk menarik perhatian pendengar.", "多用设问、号召和修辞吸引听众"], ["Laporan: tajuk → pengenalan (latar program) → isi (tarikh, tempat, aktiviti, hasil) → penutup/cadangan → nama penyedia dan tarikh.", "报告：标题 → 简介 → 内容（时间、地点、活动、成果）→ 结尾/建议 → 撰写人与日期"], ["Gunakan ayat pasif dan kata ganti ketiga (beliau, mereka); laporan bersifat fakta, bukan pendapat peribadi.", "报告用被动句与第三人称，只写事实，不写个人感受"], ["Perhatikan kata arahan dalam soalan (laporan tentang..., ucapan sempena...).", "注意题目的指令词"]], "", ""], ["Peribahasa dan Simpulan Bahasa", "谚语与惯用语", [["Bagai aur dengan tebing: saling memerlukan dan bergantung.", "如同竹与河岸：相互依赖"], ["Berat sama dipikul, ringan sama dijinjing: bekerjasama dalam susah dan senang.", "有难同当有福同享"], ["Bulat air kerana pembetung, bulat manusia kerana muafakat: kata sepakat menjayakan sesuatu.", "团结一致才能成功"], ["Rajin pangkal pandai; usaha tangga kejayaan: kegigihan membawa kejayaan.", "勤能生巧；努力是成功的阶梯"], ["Simpulan bahasa: ringan tulang (rajin), besar kepala (sombong), kaki bangku (tidak pandai bersukan), panjang tangan (suka mencuri), buah tangan (cenderamata).", "惯用语：勤快、傲慢、不擅运动、手脚不干净、手信"]], "", "Petua: gunakan peribahasa pada pendahuluan dan penutup, dan pastikan maksudnya sesuai dengan isi."], ["Contoh Perenggan: Menjaga Alam Sekitar", "示范段落：爱护环境", [["Pendahuluan: Alam sekitar ibarat ibu yang memberikan kita kehidupan. Oleh itu, tanggungjawab menjaganya terletak di bahu semua lapisan masyarakat. Antara langkah yang boleh diambil termasuklah kempen kitar semula dan penguatkuasaan undang-undang.", "引言：环境如同母亲；因此人人有责任；方法包括回收运动与执法"], ["Isi: Pertama sekali, kempen kitar semula dapat mengurangkan pembuangan sisa. Hal ini demikian kerana bahan terbuang diproses semula menjadi barang berguna. Sebagai contoh, tin aluminium dilebur untuk dijadikan tin baharu.", "要点：回收减少垃圾；原因；例子"], ["Penutup: Kesimpulannya, menjaga alam sekitar merupakan tanggungjawab bersama. Marilah kita bertindak sekarang agar generasi akan datang dapat menikmati bumi yang bersih dan hijau.", "结尾：总结 + 号召"], ["Perhatikan pola: pernyataan isi → huraian (Hal ini demikian kerana...) → contoh (Sebagai contoh,...).", "注意模式：主旨 → 阐述 → 例子"]], "", ""], ["Uji Diri", "自测：先想答案，再对照", [["S: Apakah struktur perenggan? J: Isi, huraian, contoh, kesimpulan.", "问：段落结构？答：要点、阐述、例子、小结。"], ["S: Apakah yang dibuat dahulu? J: Bulatkan jenis karangan.", "问：第一步？答：圈出文体。"], ["S: Nyatakan satu penanda wacana. J: Selain itu.", "问：一个连接语？答：Selain itu。"], ["S: Apa dalam penutup? J: Rumusan dan harapan.", "问：结尾写？答：总结与希望。"], ["S: Apakah penutup surat rasmi? J: Sekian, terima kasih. diikuti Yang benar,.", "问：正式书信的结尾？答：Sekian, terima kasih. 然后 Yang benar,"], ["S: Berapakah bilangan perenggan dalam karangan yang lengkap? J: Sekurang-kurangnya pendahuluan, 3–4 isi dan penutup.", "问：完整作文的结构？答：引言 + 3–4 主体段 + 结尾"], ["S: Apakah maksud 'bagai aur dengan tebing'? J: Saling memerlukan.", "问：谚语含义？答：相互依赖"]], "", ""]], "bm|1": [["Istilah Penting", "重点术语", [["Ringkasan: pendekkan teks kepada isi penting dalam satu perenggan.", "把文章缩成一段要点"], ["Isi penting = fakta utama; buang contoh, huraian dan ayat hiasan.", "只留主要事实"], ["Patuhi had perkataan.", "遵守字数"], ["Guna ayat sendiri, jangan salin.", "用自己的话"]], "", ""], ["Contoh & Templat", "范例与模板", [["Langkah: baca → garis isi → senarai isi → gabung ayat → semak had perkataan.", "五步法"], ["Gunakan kata hubung: dan, serta, kerana, supaya, sehingga.", "用连接词连句"], ["Gunakan ayat pasif/aktif untuk memendekkan.", "改写缩短"]], "", ""], ["Kesalahan Lazim", "常见错误", [["Menyalin ayat asal.", "照抄"], ["Menambah pendapat atau contoh sendiri.", "加入自己的意见"], ["Melebihi had perkataan.", "超字数"], ["Tiada pengaitan antara isi.", "要点之间无衔接"]], "", ""], ["Soalan Lazim SPM", "考试常见问法", [["Tulis ringkasan tentang ... dalam lebih kurang __ patah perkataan.", "限字数摘要"], ["Ringkaskan langkah/punca/kesan yang dinyatakan.", "摘要步骤/原因/影响"]], "", ""], ["Langkah Meringkaskan Teks", "摘要步骤", [["1. Baca arahan: jumlah isi, topik ringkasan dan had perkataan.", "先读指令：要点数、主题与字数上限"], ["2. Baca teks dan garis isi penting (selalunya terdapat dalam ayat topik di awal perenggan).", "读文并划出要点（常在段首主旨句）"], ["3. Senaraikan isi penting dalam ayat ringkas; buang contoh, ulangan dan huraian.", "把要点列成简短句；删去例子、重复和细节"], ["4. Gabungkan isi dengan kata hubung dan tulis dalam satu perenggan menggunakan ayat sendiri.", "用连词连成一段，用自己的话写"], ["5. Kira perkataan dan semak ejaan serta tatabahasa.", "数字数并检查拼写与语法"]], "", "Petua: jangan menulis pendapat sendiri; ringkasan hanya mengandungi isi daripada teks."], ["Teknik Memendekkan Ayat", "缩短句子的技巧", [["Gantikan frasa panjang dengan satu perkataan: pada masa ini → kini; oleh sebab itu → maka; dalam jangka masa yang panjang → lama-kelamaan.", "用单词代替长短语"], ["Buang kata penguat dan hiasan: sangat, amat, benar-benar; buang peribahasa dan perumpamaan.", "删去强调词与修饰、谚语"], ["Gabungkan dua ayat: Ali rajin belajar. Ali berjaya. → Ali berjaya kerana rajin belajar.", "合并两句"], ["Gunakan senarai: Mereka membeli beras, gula dan minyak. → Mereka membeli barang keperluan dapur.", "用概括词代替罗列"], ["Pastikan isi yang dipendekkan tidak mengubah maksud asal.", "缩短后不能改变原意"]], "", ""], ["Contoh Ringkasan", "摘要示范", [["Teks asal: Kegiatan bergotong-royong perlu dihidupkan semula kerana banyak faedahnya. Selain dapat mengeratkan hubungan penduduk, kampung juga menjadi bersih. Kos penyelenggaraan turut dapat dijimatkan. Contohnya, penduduk Kampung Seri menjaga parit bersama-sama setiap hujung minggu.", "原文：互助合作的好处"], ["Isi penting: (1) mengeratkan hubungan penduduk; (2) kampung bersih; (3) menjimatkan kos. (Contoh Kampung Seri dibuang.)", "要点：三点；例子删去"], ["Ringkasan: Kegiatan bergotong-royong perlu dihidupkan semula kerana dapat mengeratkan hubungan penduduk, menjadikan kampung bersih dan menjimatkan kos penyelenggaraan.", "摘要成品：一句话连接三点"], ["Perhatikan: ayat baharu, tiada contoh, dan semua isi digabungkan dengan koma dan kata hubung.", "注意：重新造句、无例子、用连词连接"]], "", ""], ["Uji Diri", "自测：先想答案，再对照", [["S: Berapa perenggan ringkasan? J: Satu.", "问：摘要几段？答：一段。"], ["S: Boleh salin ayat asal? J: Tidak.", "问：可抄原句吗？答：不可。"], ["S: Apa dibuang? J: Contoh dan huraian.", "问：要删掉什么？答：例子和阐述。"], ["S: Bolehkah memasukkan contoh dalam ringkasan? J: Tidak; contoh dibuang.", "问：摘要可以放例子吗？答：不可以"], ["S: Gantikan 'pada masa ini' dengan satu perkataan. J: Kini.", "问：一个词替换 pada masa ini？答：kini"]], "", ""]], "bm|2": [["Istilah Penting", "重点术语", [["Soalan pemahaman: jawab berdasarkan teks.", "根据文章作答"], ["'Apakah maksud ...': tafsir mengikut konteks.", "词义按语境"], ["'Jelaskan': beri sebab dan kesan.", "解释题：因+果"], ["'Pada pendapat anda': beri pendirian dan alasan.", "观点题：立场+理由"], ["Jawapan lengkap dan ringkas.", "答案完整简洁"]], "", ""], ["Contoh & Templat", "范例与模板", [["Rumus: Isi → Bukti dari teks → Huraian.", "答题公式"], ["Ubah suai ayat teks, jangan salin keseluruhan.", "改写文本语句"]], "", ""], ["Kesalahan Lazim", "常见错误", [["Menyalin satu perenggan.", "整段照抄"], ["Jawapan tiada bukti.", "无依据"], ["Tidak menjawab ikut kata arahan (nyatakan/jelaskan/huraikan).", "不按指令词作答"]], "", ""], ["Soalan Lazim SPM", "考试常见问法", [["Nyatakan dua ...", "列出两点"], ["Jelaskan mengapa ...", "解释原因"], ["Apakah pengajaran daripada teks?", "文章的教训"]], "", ""], ["Jenis Soalan Pemahaman", "理解题类型", [["Isi tersurat: jawapan terdapat jelas dalam teks (nyatakan, senaraikan).", "显性信息：答案直接在文中"], ["Isi tersirat: jawapan diperoleh daripada maklumat yang tidak dinyatakan secara langsung; perlu membuat inferens.", "隐含信息：需推断"], ["Soalan bahasa: maksud perkataan/peribahasa dalam konteks, unsur gaya bahasa.", "语言题：词语/谚语在语境中的意思，修辞"], ["Soalan nilai dan pengajaran; soalan pendapat (KBAT): beri pendirian dan sebab.", "价值/教训题；高阶思维：给出立场与理由"], ["Jumlah markah menentukan bilangan isi yang diperlukan dalam jawapan.", "分数决定要写的要点数量"]], "", ""], ["Kata Arahan dan Cara Menjawab", "指令词与答法", [["Nyatakan / Senaraikan: tulis isi ringkas, tidak perlu huraian.", "列举：简要写要点"], ["Jelaskan / Terangkan / Huraikan: beri isi + penjelasan (sebab, kesan atau contoh).", "解释/阐述：要点 + 说明"], ["Bincangkan: tulis kebaikan dan keburukan atau pelbagai sudut dengan alasan.", "讨论：优缺点或多角度并说明理由"], ["Bandingkan: nyatakan persamaan dan perbezaan.", "比较：相同与不同"], ["Pada pendapat anda: beri pendirian yang jelas + alasan + contoh.", "你认为：立场 + 理由 + 例子"]], "", ""], ["Contoh Jawapan Pemahaman", "理解题示范答案", [["Soalan: Mengapakah Pak Ali memilih menanam sayur-sayuran? (2 markah)", "题：阿里叔为何种蔬菜？（2分）"], ["Jawapan: Pak Ali memilih menanam sayur-sayuran kerana harga sayur semakin meningkat dan dia ingin menjimatkan perbelanjaan keluarga.", "答：因为菜价上涨，想节省家庭开销（两个要点各1分）"], ["Soalan: Apakah nilai murni yang ada pada watak ini? Jawapan: Rajin, kerana beliau menjaga kebun setiap hari tanpa mengeluh.", "题：价值观？答：勤奋 + 证据"], ["Elakkan menyalin satu perenggan; ubah suai ayat dan ambil isi yang berkaitan sahaja.", "不要抄整段，改写并只取相关要点"]], "", ""], ["Uji Diri", "自测：先想答案，再对照", [["S: 'Jelaskan' perlu apa? J: Isi dan huraian lengkap (boleh sertakan sebab atau kesan).", "问：Jelaskan 要写？答：因和果。"], ["S: Maksud perkataan ikut apa? J: Konteks teks.", "问：词义依据？答：语境。"], ["S: Format jawapan? J: Isi, bukti, huraian.", "问：答案格式？答：要点、证据、阐述。"], ["S: Apakah perbezaan 'nyatakan' dengan 'jelaskan'? J: Nyatakan = isi ringkas; jelaskan = isi + penjelasan.", "问：nyatakan 与 jelaskan 的区别？答：前者只写要点，后者要解释"], ["S: Isi tersirat ialah apa? J: Isi yang tidak dinyatakan secara langsung dalam teks.", "问：隐含信息？答：文中没有直接说出的信息"]], "", ""]], "bm|3": [["Istilah Penting", "重点术语", [["Awalan: me-, ber-, pe-, per-, ter-, di-, se-, ke-.", "前缀"], ["Akhiran: -kan, -i, -an.", "后缀"], ["Apitan: me-kan, pe-an, ke-an.", "圈缀"], ["Kata ganda: penuh, separa, berentak.", "叠词三种"], ["Ayat majmuk: gabungan, pancangan, campuran.", "复句三种"]], "", ""], ["Contoh & Templat", "范例与模板", [["me- + baca → membaca; ber- + lari → berlari; ter- + jatuh → terjatuh.", "前缀例子"], ["-kan: lakukan; -i: hadiri; -an: makanan.", "后缀例子"], ["pe-an: pembelajaran; ke-an: keindahan; me-kan: menyatakan.", "圈缀例子"], ["Penuh: buku-buku; berentak: sayur-mayur, kuih-muih.", "叠词例子"], ["Rapat: matahari, jawatankuasa, setiausaha.", "词连写例子"]], "", ""], ["Kesalahan Lazim", "常见错误", [["Tersilap ejaan imbuhan: me + pukul → memukul (huruf p luluh), bukan mempukul.", "imbuhan 拼写变化"], ["Mengeja kata majmuk yang sepatutnya rapat secara terpisah.", "连写词写成分写"], ["Menggunakan 'di' sebagai awalan dan kata depan secara tertukar.", "di 前缀与介词混用"]], "", ""], ["Soalan Lazim SPM", "考试常见问法", [["Tentukan jenis imbuhan bagi perkataan bergaris.", "判断词缀类型"], ["Betulkan kesalahan ayat.", "改错句"], ["Bina ayat menggunakan kata ganda.", "用叠词造句"]], "", ""], ["Golongan Kata", "词类", [["Kata nama: am (buku), khas (Kuala Lumpur), abstrak (keadilan), ganti nama (saya, mereka).", "名词：普通、专有、抽象、代词"], ["Kata kerja: transitif (membaca buku) dan tak transitif (berlari).", "动词：及物/不及物"], ["Kata adjektif: menerangkan sifat (cantik, rajin, tinggi).", "形容词"], ["Kata tugas: kata hubung (dan, tetapi, kerana), kata sendi nama (di, ke, daripada, kepada), kata penguat (sangat, amat), kata nafi (tidak, bukan), kata tanya (apa, siapa), kata seru (wah, aduh), kata pemeri (ialah, adalah).", "功能词：连词、介词、程度副词、否定词、疑问词、感叹词、系词"], ["Bezakan ialah (diikuti kata nama/frasa nama) dan adalah (diikuti adjektif/frasa sendi nama/frasa kerja).", "ialah 后接名词；adalah 后接形容词/介词短语"]], "", ""], ["Imbuhan dan Peluluhan", "词缀与首字脱落", [["Awalan me- berubah mengikut huruf pertama: me+baca → membaca; me+dengar → mendengar; me+ambil → mengambil; me+lihat → melihat.", "me- 随首字母变化"], ["Huruf k, p, t, s luluh: me+kirim → mengirim; me+pukul → memukul; me+tulis → menulis; me+sapu → menyapu.", "k、p、t、s 脱落"], ["Kata dasar satu suku kata: menge-: me+cat → mengecat; me+lap → mengelap.", "单音节词用 menge-"], ["pe-: pe+tulis → penulis; pe+pukul → pemukul; pe+jual → penjual; pe+kerja → pekerja.", "pe- 的变化"], ["ber-: ber+ajar → belajar; ber+kerja → bekerja; ber+ternak → beternak; ber+lari → berlari.", "ber- 的特殊变化"]], "", "Petua: kata pinjaman seperti 'kritik' ditulis mengkritik (k tidak luluh)."], ["Kata Ganda dan Kata Majmuk", "叠词与复合词", [["Kata ganda penuh: buku-buku, rumah-rumah; separa: lelaki, tetamu, pepohon; berentak: sayur-mayur, kuih-muih, gunung-ganang.", "全叠、半叠、节奏叠"], ["Kata ganda tidak perlu ditambah penjamak: semua murid (bukan semua murid-murid); banyak buku (bukan banyak buku-buku).", "已有“全部/许多”不再叠词"], ["Kata majmuk: kata yang bergabung dan membawa makna tertentu. Rapat: matahari, jawatankuasa, setiausaha, warganegara. Lain dieja terpisah: kereta api, ibu pejabat, orang ramai.", "合成词：有的连写，有的分写"], ["Kata majmuk istilah khusus: tanah liat, kad pengenalan.", "术语复合词"], ["Kata ganda berimbuhan: berlari-lari, kehijau-hijauan, anak-anakan.", "叠词加缀"]], "", ""], ["Jenis Ayat", "句子类型", [["Ayat penyata, ayat tanya, ayat perintah dan ayat seruan.", "陈述、疑问、祈使、感叹"], ["Ayat tunggal: satu klausa. Ayat majmuk: lebih daripada satu klausa.", "单句与复句"], ["Majmuk gabungan: dua ayat setara dihubungkan dengan dan, tetapi, atau, lalu, serta, malah.", "并列复句"], ["Majmuk pancangan: relatif (yang), komplemen (bahawa), keterangan (apabila, kerana, supaya, jika, walaupun).", "主从复句：关系、补语、状语"], ["Majmuk campuran: gabungan ayat majmuk gabungan dan pancangan.", "混合复句"]], "", ""], ["Ayat Aktif dan Pasif", "主动句与被动句", [["Ayat aktif: pelaku di depan; kata kerja berawalan const PPTS_BC={"bc|0": [["重点要点", "", [["书信格式：称呼 → 问候 → 正文 → 祝颂语 → 署名 → 日期。", ""], ["称呼顶格，后加冒号；问候语另起一行，缩进两格。", ""], ["通告：标题 + 事由 + 时间 + 地点 + 联系 + 署名/日期。", ""], ["启事 (寻物、招领、征求等)：标题 + 事项 + 联系方式 + 署名/日期。", ""], ["便条、请假条：说明事由、时间，语气简洁礼貌。", ""]], "", ""], ["范例与模板", "", [["正式信开头：敬启者 / 尊敬的 ××：", ""], ["结尾祝颂：此致（另起）敬礼（再另起顶格）；对朋友可写“祝 学业进步”。", ""], ["通告标题居中，正文另起；落款在右下方。", ""]], "", ""], ["常见错误", "", [["对象与语气不符（给校长用口语）。", ""], ["漏写署名或日期。", ""], ["通告、启事混淆；启事要写联系方式。", ""], ["格式对但事由不具体。", ""]], "", ""], ["考试常见问法", "", [["给校长/老师/朋友写一封信，说明……", ""], ["写一则通告，通知同学……", ""], ["写一则寻物（招领）启事。", ""]], "", "Kertas 1 Bahagian A/B 的具体分配请以官方格式书为准。"], ["书信范文：给校长的建议信", "", [["敬爱的校长：（顶格，后加冒号）", ""], ["您好！（另起一行，空两格）", ""], ["我是高二甲班的学生李明。我想向您建议，在图书馆增设晚间开放时间，让同学们有更多的自习空间。目前不少同学放学后需要回家才能温习，往往效率不高。", ""], ["如果学校能够在每周二、四开放图书馆至晚上七点，相信对同学们的学习帮助很大。恳请您考虑这项建议。", ""], ["此致 / 敬礼（“此致”另起空两格，“敬礼”再另起顶格）", ""], ["学生 李明 敬上；日期写在署名下方，靠右。", ""]], "", "提示：先写事由与目的，再写理由，最后写请求；语气要尊敬、有礼。"], ["通告范文", "", [["标题：通告（居中）", ""], ["为培养同学们的阅读习惯，本校将于十一月三日（星期一）上午八时至十时，在学校礼堂举办“阅读分享会”。", ""], ["欢迎各班同学踊跃参加，有意上台分享者请于十月三十一日前向华文学会报名。", ""], ["特此通告。（结尾套语）", ""], ["落款：华文学会（右下方），日期：二〇二六年十月十二日。", ""]], "", "必备要素：标题、事由、时间、地点、联系/报名方式、落款与日期。"], ["启事范文：寻物启事与招领启事", "", [["寻物启事：本人于十月十日下午在学校篮球场遗失黑色水壶一个，内有名字贴纸。拾到者请与高二乙班王芳联系，不胜感激。", ""], ["招领启事：本人于十月十一日早上在三年级教室拾获蓝色雨伞一把，失主请到学校服务处认领。", ""], ["格式：标题（居中）→ 正文（物品特征、时间地点）→ 联系方式 → 署名与日期。", ""], ["常用套语：拾到者请与……联系，不胜感激；失主请前来认领；特此启事。", ""]], "", "启事一定要写联系方式或认领地点，否则找不到人。"], ["应用文常用套语和易错点", "", [["称呼：敬启者（对不特定的人）、敬爱的老师/校长、亲爱的朋友。", ""], ["结尾祝颂：此致敬礼、祝学业进步、顺祝安康；结尾套语：谨此、盼复、特此通告。", ""], ["便条/请假条：先写称呼，再写事由、时间，最后写署名与日期；字数少但信息要完整。", ""], ["常见错误：对象与语气不符；少写署名/日期；通告与启事混淆；事由写得太笼统。", ""], ["检查清单：格式 → 事由具体 → 语气礼貌 → 署名日期 → 错别字与标点。", ""]], "", ""], ["Uji Diri", "自测：先想答案，再对照", [["S: 书信中“此致”后接什么？ J: 敬礼，另起一行。", ""], ["S: 通告的必备要素有哪些？ J: 标题、事由、时间、地点、联系、署名与日期。", ""], ["S: 启事必须写什么才能联系到人？ J: 联系方式。", ""], ["S: 通告的结尾套语是什么？ J: 特此通告。", ""], ["S: 启事必须写什么？ J: 联系方式或认领地点。", ""]], "", ""]], "bc|1": [["重点要点", "", [["记叙文六要素：人物、时间、地点、起因、经过、结果。", ""], ["叙述顺序：顺叙、倒叙、插叙。", ""], ["细节描写：动作、神态、语言、心理、环境。", ""], ["议论文三要素：论点、论据、论证。", ""], ["说明文方法：举例子、列数字、作比较、下定义、分类别、打比方。", ""]], "", ""], ["范例与模板", "", [["开头：开门见山 / 设问引入 / 引用名言。", ""], ["结尾：点题、呼应开头、升华主题。", ""], ["议论文结构：提出论点 → 分析论证 → 结论。", ""]], "", ""], ["常见错误", "", [["写成流水账，没有重点和细节。", ""], ["论点不明确，论据与论点不符。", ""], ["偏题、离题。", ""], ["错别字与标点错误。", ""]], "", ""], ["考试常见问法", "", [["以“……”为题，写一篇记叙文。", ""], ["你是否同意……？写一篇议论文。", ""], ["介绍一样事物，写一篇说明文。", ""]], "", ""], ["记叙文：结构与写作技巧", "", [["结构：开头点题 → 起因 → 经过（发展、高潮） → 结果 → 结尾点题或抒发感受。", ""], ["六要素要交代清楚：人物、时间、地点、起因、经过、结果；经过部分要详写，其余略写。", ""], ["细节描写：动作（慢慢捡起）、神态（皱起眉头）、语言（带语气和标点）、心理（心想……）、环境（渲染气氛）。", ""], ["叙述顺序：顺叙最稳；倒叙可以制造悬念；插叙补充背景，用得要自然。", ""], ["结尾可以点题、呼应开头或升华主题，不要空喊口号。", ""]], "", "避免流水账：选一件事，把高潮写足，再用一句话收尾。"], ["记叙文片段示范", "", [["开头：每当我看到那把旧雨伞，就会想起那个下着大雨的傍晚。", ""], ["动作与神态：妈妈放下手中的饭碗，皱着眉头冲进雨里，把我护在伞下，自己的半边肩膀却湿透了。", ""], ["心理：我望着她被雨水打湿的头发，心里一阵发酸：原来爱就藏在这些不起眼的细节里。", ""], ["结尾：如今雨伞早已褪色，但那份温暖，一直撑在我的心里。（点题 + 升华）", ""]], "", ""], ["议论文：结构与论证方法", "", [["结构：引论（提出论点）→ 本论（分论点 + 论据）→ 结论（重申论点并升华）。", ""], ["三要素：论点（观点）、论据（事实、数据、名言）、论证（把论据和论点联系起来）。", ""], ["论证方法：举例论证、道理论证（引用名言）、对比论证、比喻论证。", ""], ["每个分论点一个段落：观点句 → 论据 → 分析 → 回扣论点。", ""], ["写作忌讳：论点含糊、论据与论点无关、只堆事例不分析。", ""]], "", "开头可以用设问或名言引入，结尾要回应题目。"], ["说明文与作文审题", "", [["说明文要点：说明对象明确，说明顺序（时间、空间、逻辑），说明方法（举例子、列数字、作比较、下定义、分类别、打比方）。", ""], ["语言要准确、客观、有条理，不夹杂过多感情。", ""], ["审题：圈出题眼，判断体裁（记叙、议论、说明、应用），确定人称与字数。", ""], ["立意：从题目中找最有话可写的角度；先列提纲再动笔，段落之间要有衔接。", ""], ["收尾 3 分钟检查：错别字、标点、病句、字数、标题格式。", ""]], "", ""], ["好词好句积累", "", [["形容勤奋：废寝忘食、持之以恒、锲而不舍。", ""], ["形容团结：同心协力、众志成城、齐心协力。", ""], ["形容感动：热泪盈眶、感慨万千、心潮澎湃。", ""], ["名言：千里之行，始于足下；业精于勤，荒于嬉。", ""], ["使用成语要符合语境和感情色彩，不要生硬堆砌。", ""]], "", ""], ["Uji Diri", "自测：先想答案，再对照", [["S: 议论文三要素？ J: 论点、论据、论证。", ""], ["S: 记叙文如何增加细节？ J: 加动作、神态、语言、心理、环境描写。", ""], ["S: 结尾常见写法？ J: 点题、呼应、升华。", ""], ["S: 记叙文哪一部分要详写？ J: 经过（高潮）。", ""], ["S: 议论文每个分论点怎么写？ J: 观点句 + 论据 + 分析 + 回扣。", ""]], "", ""]], "bc|2": [["重点要点", "", [["阅读理解：先通读，找关键句，概括中心思想。", ""], ["修辞：比喻（本体、喻体、喻词）、拟人、夸张、排比、设问、反问。", ""], ["词语在文中的意思要结合上下文。", ""], ["回答要用自己的话归纳，不整段照抄。", ""]], "", ""], ["范例与模板", "", [["比喻：把 A 比作 B；拟人：把物当人写。", ""], ["设问：自问自答；反问：无疑而问，答案在反面。", ""], ["作用答法：修辞 + 表达效果（生动、形象、强调、增强语气）。", ""]], "", ""], ["常见错误", "", [["比喻与拟人混淆；设问与反问混淆。", ""], ["答案照抄原文整段。", ""], ["只写手法，不写作用。", ""]], "", ""], ["考试常见问法", "", [["文中画线句用了什么修辞？有什么作用？", ""], ["概括第×段的段意。", ""], ["解释词语在文中的意思。", ""]], "", ""], ["修辞手法及作用的答题公式", "", [["比喻：把A比作B，生动形象地写出了……的特点。", ""], ["拟人：赋予事物人的动作/情感，生动形象，表达了作者……的感情。", ""], ["夸张：突出……的特点，强调……，给人深刻印象。", ""], ["排比：增强气势和节奏感，强调……，更有说服力。", ""], ["设问：引起读者注意与思考；反问：加强语气，强调……，语气强烈。", ""]], "", "答题公式：修辞名称 + 本体特征 + 表达效果 + 作者情感。"], ["概括段意与中心思想", "", [["概括段意：找段落主旨句（常在段首或段尾）；叙事段用“谁 + 做了什么 + 结果”。", ""], ["概括中心思想：全文写了什么 + 表达了什么（情感或道理）。", ""], ["公式：本文通过叙述……（事件），表达了……（情感/道理）。", ""], ["回答要用自己的话归纳，不整段照抄；字数要符合要求。", ""]], "", ""], ["句子作用与词语理解", "", [["开头句：点题、设置悬念、渲染气氛、引出下文。", ""], ["结尾句：点明中心、升华主题、呼应开头、余味无穷。", ""], ["过渡句：承上启下，使行文自然。", ""], ["词语理解：结合上下文推断；含义深刻的词语要回答“字面义 + 语境义”。", ""], ["重点词语（如“渐渐”“竟然”）：分析词性与表达效果，如表现变化过程、表示出乎意料。", ""]], "", ""], ["阅读题常见问法与答法", "", [["文中画线句用了什么修辞？有什么作用？→ 手法 + 效果。", ""], ["文章为什么用这个题目？→ 点明主旨/贯穿线索/吸引读者。", ""], ["从文中哪里可以看出……？→ 找原句，再用自己的话分析。", ""], ["你对……有什么看法？→ 观点明确 + 结合文章 + 联系生活。", ""], ["答题要分点、简洁，注意分数与要点数量对应。", ""]], "", ""], ["Uji Diri", "自测：先想答案，再对照", [["S: 设问与反问的区别？ J: 设问自问自答；反问无疑而问、答案在反面。", ""], ["S: 排比至少几个句子？ J: 三个或以上，结构相似。", ""], ["S: 修辞题答案包含什么？ J: 手法加作用。", ""], ["S: 比喻句的作用怎么答？ J: 生动形象地写出了……特点。", ""], ["S: 概括段意的公式？ J: 谁 + 做了什么 + 结果。", ""]], "", ""]], "bc|3": [["重点要点", "", [["常见虚词：之、其、而、以、于、者、也、乎、焉、矣。", ""], ["一词多义、古今异义（如“走”古义为“跑”，“去”古义为“离开”）。", ""], ["通假字：音同或音近而借用的字。", ""], ["翻译五字诀：留、换、补、删、调。", ""]], "", ""], ["范例与模板", "", [["留：人名、地名、官名保留不译。", ""], ["换：把古词换成现代词。", ""], ["补：补出省略的主语或成分。", ""], ["删：删去无义的虚词。", ""], ["调：调整倒装语序。", ""]], "", ""], ["常见错误", "", [["把古义当成今义。", ""], ["直译后句子不通顺。", ""], ["漏译虚词的作用或省略成分。", ""]], "", ""], ["考试常见问法", "", [["解释文中加点字的意思。", ""], ["把句子翻译成现代汉语。", ""], ["根据文章内容回答问题。", ""]], "", "文言文约占 Kertas 2 的 30 分（据练习网站转述的格式表，请核对官方格式书）。"], ["文言实词：古今异义与通假字", "", [["古今异义：走（古义：跑）、去（古义：离开）、妻子（古义：妻子和儿女）、非常（古义：不同寻常）、汤（古义：热水）、书（古义：书信）、池（古义：护城河）。", ""], ["通假字：说（通“悦”）、知（通“智”）、蚤（通“早”）、反（通“返”）。", ""], ["一词多义：以（用、因为、来）、为（作为、是、成为）、于（在、向、比）要结合语境判断。", ""], ["词类活用：名词作动词、形容词作动词、使动用法，翻译时要补出意思。", ""]], "", "做题提示：把词义放回句子里读，看是否通顺。"], ["文言虚词用法", "", [["之：代词（它）、助词（的）、取消句子独立性；例：学而时习之（之=代词）。", ""], ["而：表并列、承接、转折；例：学而不思则罔（而=转折）。", ""], ["以：用、凭、因为、来；于：在、向、比；其：他的/它的/那。", ""], ["者：……的人/事；也：判断或语气；矣：了；乎：吗/于；焉：兼词或语气词。", ""], ["虚词要放在句子中判断，一个字往往有几种用法。", ""]], "", ""], ["文言句式", "", [["判断句：……者，……也；……，……也；翻译成“……是……”。", ""], ["被动句：见、为……所、被；翻译成“被……”。", ""], ["倒装句：宾语前置（何陋之有→有何陋）、定语后置、状语后置。", ""], ["省略句：省略主语、宾语或介词，翻译时要补出。", ""], ["翻译时先找出句式，再逐字落实。", ""]], "", ""], ["翻译技巧与例句", "", [["例1：学而不思则罔，思而不学则殆。→ 只学习而不思考就会迷惑，只思考而不学习就会疑惑。", ""], ["例2：三人行，必有我师焉。→ 几个人同行，其中必定有可以做我老师的人。", ""], ["留：人名、地名、官名不译；换：古词换今词；补：补出省略成分；删：删去无义虚词；调：调整倒装语序。", ""], ["翻译完要通读一遍，保证句子通顺、符合原意。", ""]], "", ""], ["文言文阅读答题步骤", "", [["先通读全文，弄清故事、人物和大意。", ""], ["解释字词时联系上下文和已学知识。", ""], ["概括人物形象：看人物的语言、行动，再用一两个词概括。", ""], ["归纳启示：从文章的道理、教训出发，结合生活写。", ""], ["答案分点作答，字迹工整，不要漏写要点。", ""]], "", ""], ["Uji Diri", "自测：先想答案，再对照", [["S: 翻译五字诀是什么？ J: 留、换、补、删、调。", ""], ["S: “走”的古义是什么？ J: 跑。", ""], ["S: 通假字是什么？ J: 音同或音近而借用的字。", ""], ["S: “蚤”通哪个字？ J: 早。", ""], ["S: 判断句的标志？ J: ……者，……也。", ""]], "", ""]], "bc|4": [["重点要点", "", [["病句类型：搭配不当、语序不当、成分残缺、前后矛盾、重复啰嗦、不合逻辑。", ""], ["成语：要理解含义与感情色彩，不能望文生义。", ""], ["标点：逗号、顿号、分号、冒号、引号、省略号各有用法。", ""], ["顿号用于并列词语之间，分号用于分句并列。", ""]], "", ""], ["范例与模板", "", [["修改病句：先找主干（谁 + 做了什么），再看修饰成分。", ""], ["重复：“大约……左右”只能留一个。", ""]], "", ""], ["常见错误", "", [["望文生义使用成语。", ""], ["顿号与逗号用混。", ""], ["修改后又产生新病句。", ""]], "", ""], ["考试常见问法", "", [["指出并修改下列病句。", ""], ["选择适当的成语填空。", ""], ["为句子加上标点符号。", ""]], "", ""], ["成语理解与常见误用", "", [["差强人意：大体上还能使人满意（不是“不满意”）。", ""], ["首当其冲：最先受到攻击或遭遇灾难（不是“首先”）。", ""], ["不以为然：不认为是对的（不是“不在乎”）。", ""], ["炙手可热：形容权势大、气焰盛（贬义）。", ""], ["七月流火：指天气渐渐变凉（不是“酷热”）。", ""], ["使用成语先弄清含义、感情色彩和适用对象，不要望文生义。", ""]], "", ""], ["病句类型与修改", "", [["成分残缺：通过这次活动，使我们增长了知识。→ 删去“通过”或“使”。", ""], ["重复啰嗦：他大约十二岁左右。→ 删去“大约”或“左右”。", ""], ["否定不当：我们要避免不再发生类似的错误。→ 去掉“不”。", ""], ["搭配不当：他的写作水平显著增加。→ “水平”应与“提高”搭配。", ""], ["语序不当、前后矛盾、不合逻辑也要逐一检查；改完要重读一遍。", ""]], "", "修改方法：抓主干（谁 + 做什么），再检查修饰成分。"], ["标点符号用法", "", [["逗号：句内停顿；顿号：并列词语之间；分号：并列分句之间，层次更清楚。", ""], ["冒号：提示下文或总括上文；引号：直接引用、特殊含义。", ""], ["书名号《》：书名、篇名、报刊名；省略号：省略、语意中断；破折号：解释说明、转折。", ""], ["句号表示陈述句结束，问号用于疑问句，感叹号用于强烈感情。", ""], ["常见错误：顿号与逗号混用；引号内的句末标点位置错误。", ""]], "", ""], ["的、地、得，近义词辨析", "", [["“的”后面接名词：美丽的花；“地”后面接动词：认真地学习；“得”后面接补语：跑得很快。", ""], ["近义词要看语境、范围、轻重、感情色彩，例如“爱护/爱惜”“发现/发觉”。", ""], ["辨析时代入句子，读起来是否自然、意思是否准确。", ""]], "", ""], ["Uji Diri", "自测：先想答案，再对照", [["S: “大约三十人左右”错在哪里？ J: 重复啰嗦。", ""], ["S: 顿号用在哪里？ J: 并列词语之间。", ""], ["S: 病句修改先找什么？ J: 句子主干。", ""], ["S: “差强人意”的意思？ J: 大体上还能使人满意。", ""], ["S: 改病句：他大约十二岁左右。 J: 删去“大约”或“左右”。", ""]], "", ""]], "bc|5": [["重点要点", "", [["Kertas 3：小组讨论，约 30 分（据练习网站转述）。", ""], ["表达结构：观点 + 理由 + 例子。", ""], ["要回应他人的观点，而不是只说自己的。", ""], ["语言要流利、清楚、有礼貌。", ""]], "", ""], ["范例与模板", "", [["开场：我认为……，因为……", ""], ["回应：我同意……的看法，不过……", ""], ["补充：此外，我想补充一点……", ""], ["总结：综合大家的意见，……", ""]], "", ""], ["常见错误", "", [["抢话或长时间沉默。", ""], ["只说观点，没有理由和例子。", ""], ["偏离讨论主题。", ""]], "", ""], ["考试常见问法", "", [["就某个话题与组员讨论并表达看法。", ""], ["对他人的观点作出回应。", ""]], "", "口试分数与形式请以官方格式书和学校通知为准。"], ["小组讨论：流程与评分关注点", "", [["流程：听清题目 → 简短思考 → 轮流发言 → 回应他人 → 总结。", ""], ["评分关注：语言表达（流利、清楚、用词得当）、内容（观点明确有理由）、互动（倾听与回应）、礼貌。", ""], ["发言结构：观点 + 理由 + 例子，每次发言保持简洁。", ""], ["不要抢话，也不要长时间沉默；可用“我想补充一点……”加入讨论。", ""]], "", ""], ["常用句式与示范话题", "", [["开场：我认为……，因为……；我的看法是……", ""], ["同意与补充：我同意你的看法，此外……；你说得很对，我想补充的是……", ""], ["不同意：我理解你的意思，不过我认为……", ""], ["总结：综合大家的意见，我们认为……", ""], ["话题示范：手机对学生的利与弊。观点：利大于弊，但需自律；理由：查资料、联系；例子：线上学习；弊端：沉迷游戏。", ""]], "", ""], ["Uji Diri", "自测：先想答案，再对照", [["S: 发言的基本结构？ J: 观点、理由、例子。", ""], ["S: 讨论中要做什么？ J: 回应他人，不只说自己的。", ""], ["S: 讨论中如何加入别人的话题？ J: 先回应，再说“我想补充一点”。", ""]], "", ""]]};

const PPTS_AM={"am|T4-1": [["Key Formulas (1/2)", "核心公式 (1/2)", [["Vertical line test: a vertical line meets the graph at most once for a relation to be a function.", "垂直线测试：垂直线最多交图像于一点，才是函数。"], ["Domain, codomain, range; \\(f(x)\\) is the image of \\(x\\).", "定义域、陪域、值域；\\(x\\) 的像为 \\(f(x)\\)。"], ["Absolute value function: \\(|x|=x\\;(x\\ge0)\\), \\(|x|=-x\\;(x\\lt0)\\); the graph is V-shaped.", "绝对值函数：\\(|x|=x\\;(x\\ge0)\\)，\\(|x|=-x\\;(x\\lt0)\\)，图像呈 V 形。"], ["Composite function: \\(fg(x)=f\\big(g(x)\\big)\\), do \\(g\\) first then \\(f\\); in general \\(fg\\ne gf\\).", "复合函数：\\(fg(x)=f\\big(g(x)\\big)\\)，先 \\(g\\) 后 \\(f\\)；一般 \\(fg\\ne gf\\)。"]], "", ""], ["Key Formulas (2/2)", "核心公式 (2/2)", [["Inverse \\(f^{-1}\\): let \\(y=f(x)\\), make \\(x\\) the subject, then replace \\(y\\) with \\(x\\).", "反函数 \\(f^{-1}\\)：设 \\(y=f(x)\\)，用 \\(y\\) 表示 \\(x\\)，再把 \\(y\\) 换成 \\(x\\)。"], ["\\(ff^{-1}(x)=f^{-1}f(x)=x\\); the graphs of \\(f\\) and \\(f^{-1}\\) are symmetric about \\(y=x\\); only one-to-one functions have inverses.", "\\(ff^{-1}(x)=f^{-1}f(x)=x\\)；\\(f\\) 与 \\(f^{-1}\\) 的图像关于 \\(y=x\\) 对称；只有一对一函数有反函数。"], ["\\((fg)^{-1}=g^{-1}f^{-1}\\).", "\\((fg)^{-1}=g^{-1}f^{-1}\\)。"]], "", ""], ["Worked Example", "例题详解", [["Question: given \\(f(x)=2x+3\\), \\(g(x)=x^2\\), find \\(fg(x)\\), \\(gf(x)\\) and \\(f^{-1}(x)\\).", "题：已知 \\(f(x)=2x+3\\)，\\(g(x)=x^2\\)，求 \\(fg(x)\\)、\\(gf(x)\\) 与 \\(f^{-1}(x)\\)。"], ["Step 1: \\(fg(x)=f(x^2)=2x^2+3\\)", "第 1 步：\\(fg(x)=f(x^2)=2x^2+3\\)"], ["Step 2: \\(gf(x)=g(2x+3)=(2x+3)^2\\)", "第 2 步：\\(gf(x)=g(2x+3)=(2x+3)^2\\)"], ["Step 3: let \\(y=2x+3\\), then \\(x=\\dfrac{y-3}{2}\\)", "第 3 步：令 \\(y=2x+3\\)，则 \\(x=\\dfrac{y-3}{2}\\)"], ["Step 4: so \\(f^{-1}(x)=\\dfrac{x-3}{2}\\)", "第 4 步：所以 \\(f^{-1}(x)=\\dfrac{x-3}{2}\\)"]], "", ""], ["Solving Steps", "解题步骤", [["To find \\(fg(x)\\): substitute the whole of \\(g(x)\\) in place of x in f.", "求 \\(fg(x)\\)：把 \\(g(x)\\) 整个代入 f 的 x。"], ["Given \\(fg(x)\\), find \\(f(x)\\): let \\(u=g(x)\\), solve for x in terms of u, then substitute back.", "已知 \\(fg(x)\\) 求 \\(f(x)\\)：令 \\(u=g(x)\\)，解出 x（用 u 表示），代回。"], ["Inverse: \\(y=f(x) \\to\\) make x the subject \\(\\to\\) replace y with x \\(\\to\\) write \\(f^{-1}(x)\\).", "求反函数：\\(y=f(x) \\to\\) 换成以 y 表示 x → 把 y 换成 x → 写出 \\(f^{-1}(x)\\)。"], ["Absolute value: split into cases (\\(x\\ge 0\\) and x<0) to remove the modulus.", "含绝对值：分情况（\\(x\\ge 0\\) 与 x<0）去绝对值。"]], "", ""], ["Common Mistakes", "常见错误", [["Writing fg and gf in the wrong order.", "fg 与 gf 次序写反。"], ["Forgetting to swap x and y when finding an inverse.", "求反函数时忘了交换 x 与 y。"], ["Not checking the answers of an absolute value equation by substitution.", "绝对值方程解出后不代回检验。"]], "", ""], ["Exam Focus & Marks", "考试题型与得分点", [["Common: given f and g, find fg, gf and inverses; given fg, find f or g.", "常考：给出 f、g 求 fg、gf 与反函数；已知 fg 求 f 或 g。"], ["Mark points: show the substitution (method mark), then simplify (answer mark).", "得分点：代入过程要写出（方法分），最后化简（答案分）。"]], "", "M = method mark, A = answer mark（M = 方法分，A = 答案分）"], ["Quick Recall", "速记", [["Composite: substitute from the inside out (g first, then f); inverse: swap, then solve.", "复合从里往外代：先 g 后 f；反函数：换位置再解。"]], "", ""], ["Uji Diri", "自测：先想答案，再对照", [["S: \\(f(x)=2x+3\\), \\(g(x)=x^{2}\\), find \\(fg(x)\\). J: \\(2x^{2}+3\\)", "问：\\(f(x)=2x+3\\)，\\(g(x)=x^{2}\\)，求 \\(fg(x)\\)。答：\\(2x^{2}+3\\)"], ["S: \\(f(x)=2x+3\\), find \\(f^{-1}(x)\\). J: (x−3)/2", "问：\\(f(x)=2x+3\\)，求 \\(f^{-1}(x)\\)。答：(x−3)/2"], ["S: In \\(fg(x)\\), which function is applied first? J: g first, then f.", "问：\\(fg(x)\\) 的运算顺序？答：先 g 后 f。"]], "", ""]], "am|T4-2": [["Key Formulas (1/2)", "核心公式 (1/2)", [["Quadratic formula: \\(x=\\dfrac{-b\\pm\\sqrt{b^2-4ac}}{2a}\\).", "求根公式：\\(x=\\dfrac{-b\\pm\\sqrt{b^2-4ac}}{2a}\\)。"], ["Completing the square: \\(x^2+bx=\\left(x+\\dfrac b2\\right)^2-\\dfrac{b^2}{4}\\).", "配方法：\\(x^2+bx=\\left(x+\\dfrac b2\\right)^2-\\dfrac{b^2}{4}\\)。"], ["Sum and product of roots: \\(\\alpha+\\beta=-\\dfrac ba\\), \\(\\alpha\\beta=\\dfrac ca ：把线性式变成 \\(y=\\)… 代入非线性式"], ["S: How to simplify three equations in three unknowns? J: Eliminate the same variable", "问：三元方程组如何化简？答：消去同一个变量"]], "", ""]], "am|T4-4": [["Key Formulas (1/2)", "核心公式 (1/2)", [["Indices: \\(a^m\\times a^n=a^{m+n}\\), \\(a^m\\div a^n=a^{m-n}\\), \\((a^m)^n=a^{mn}\\).", "指数：\\(a^m\\times a^n=a^{m+n}\\)，\\(a^m\\div a^n=a^{m-n}\\)，\\((a^m)^n=a^{mn}\\)。"], ["\\(a^{-n}=\\dfrac1{a^n}\\), \\(a^{m/n}=\\sqrt[n]{a^m}\\), \\(a^0=1\\).", "\\(a^{-n}=\\dfrac1{a^n}\\)，\\(a^{m/n}=\\sqrt[n]{a^m}\\)，\\(a^0=1\\)。"], ["Surds: \\(\\sqrt a\\times\\sqrt b=\\sqrt{ab}\\), \\(\\dfrac{\\sqrt a}{\\sqrt b}=\\sqrt{\\dfrac ab}\\); rationalising \\(\\dfrac1{a+\\sqrt b}=\\dfrac{a-\\sqrt b}{a^2-b}\\).", "Surd：\\(\\sqrt a\\times\\sqrt b=\\sqrt{ab}\\)，\\(\\dfrac{\\sqrt a}{\\sqrt b}=\\sqrt{\\dfrac ab}\\)；有理化 \\(\\dfrac1{a+\\sqrt b}=\\dfrac{a-\\sqrt b}{a^2-b}\\)。"], ["Logarithms: \\(\\log_a a=1\\), \\(\\log_a1=0\\); \\(\\log_a(xy)=\\log_ax+\\log_ay\\); \\(\\log_a\\dfrac xy=\\log_ax-\\log_ay\\); \\(\\log_ax^n=n\\log_ax\\).", "对数：\\(\\log_a a=1\\)，\\(\\log_a1=0\\)；\\(\\log_a(xy)=\\log_ax+\\log_ay\\)；\\(\\log_a\\dfrac xy=\\log_ax-\\log_ay\\)；\\(\\log_ax^n=n\\log_ax\\)。"]], "", ""], ["Key Formulas (2/2)", "核心公式 (2/2)", [["Change of base: \\(\\log_ab=\\dfrac{\\log_cb}{\\log_ca}\\), \\(\\log_ab=\\dfrac1{\\log_ba}\\); \\(a^{\\log_ax}=x\\).", "换底：\\(\\log_ab=\\dfrac{\\log_cb}{\\log_ca}\\)，\\(\\log_ab=\\dfrac1{\\log_ba}\\)；\\(a^{\\log_ax}=x\\)。"]], "", ""], ["Worked Example", "例题详解", [["Question: solve \\(\\log_2(x+3)+\\log_2x=2\\).", "题：解 \\(\\log_2(x+3)+\\log_2x=2\\)。"], ["Step 1: \\(\\log_2[x(x+3)]=2\\Rightarrow x(x+3)=4\\)", "第 1 步：\\(\\log_2[x(x+3)]=2\\Rightarrow x(x+3)=4\\)"], ["Step 2: \\(x^2+3x-4=0\\Rightarrow(x+4)(x-1)=0\\)", "第 2 步：\\(x^2+3x-4=0\\Rightarrow(x+4)(x-1)=0\\)"], ["Step 3: \\(x=-4\\) (rejected, the argument must be \\(\\gt0\\)) or \\(x=1\\)", "第 3 步：\\(x=-4\\)（舍去，真数须 \\(\\gt0\\)）或 \\(x=1\\)"], ["Step 4: answer: \\(x=1\\)", "第 4 步：答：\\(x=1\\)"]], "", ""], ["Solving Steps", "解题步骤", [["Exponential equations: make the bases the same, or take logs of both sides.", "解指数方程：化成同底，或两边取对数。"], ["Logarithmic equations: combine into one log and either equate arguments or convert to index form; always check that arguments are \\(\\gt 0\\).", "解对数方程：化为 logₐ(…\\()=\\log _{a}(\\)…) 或写成指数式；必须检验真数＞0。"], ["Rationalising: multiply numerator and denominator by the conjugate.", "有理化：分子分母同乘共轭式。"]], "", ""], ["Common Mistakes", "常见错误", [["Splitting \\(\\log (x+y)\\) into log x + log y.", "把 \\(\\log (x+y)\\) 拆成 log x + log y。"], ["Treating \\((a+b)^{n}\\) as \\(a^{n}+b^{n}\\).", "\\((a+b)^{n}\\) 误当成 \\(a^{n}+b^{n}\\)。"], ["Not checking log equation answers and keeping a root that makes an argument negative.", "解对数方程后不检验，保留了使真数为负的根。"]], "", ""], ["Exam Focus & Marks", "考试题型与得分点", [["Common: exponential and log equations; change of base; rationalising surds.", "常考：解指数、对数方程；换底；surd 有理化。"], ["Mark points: combine the logs (M), reject the root that makes the argument invalid (A).", "得分点：合并对数（M），舍去不合真数的根（A）。"]], "", "M = method mark, A = answer mark（M = 方法分，A = 答案分）"], ["Quick Recall", "速记", [["Always check log equations: the argument must be greater than zero.", "对数方程必检验：真数要大于零。"]], "", ""], ["Uji Diri", "自测：先想答案，再对照", [["S: Value of \\(\\log _{2}8\\)? J: 3", "问：\\(\\log _{2}8\\) 的值？答：3"], ["S: \\(\\log a + \\log b =\\) ? J: \\(\\log (ab)\\)", "问：\\(\\log a + \\log b =\\) ？答：\\(\\log (ab)\\)"], ["S: Rationalise \\(1/\\sqrt{3}\\). J: \\(\\sqrt{3}/3\\)", "问：\\(1/\\sqrt{3}\\) 有理化？答：\\(\\sqrt{3}/3\\)"]], "", ""]], "am|T4-5": [["Key Formulas (1/2)", "核心公式 (1/2)", [["AP: \\(T_n=a+(n-1)d\\); \\(S_n=\\dfrac n2\\left[2a+(n-1)d\\right]=\\dfrac n2(a+l)\\).", "AP：\\(T_n=a+(n-1)d\\)；\\(S_n=\\dfrac n2\\left[2a+(n-1)d\\right]=\\dfrac n2(a+l)\\)。"], ["GP: \\(T_n=ar^{n-1}\\); \\(S_n=\\dfrac{a(1-r^n)}{1-r}=\\dfrac{a(r^n-1)}{r-1}\\) (\\(r\\ne1\\)).", "GP：\\(T_n=ar^{n-1}\\)；\\(S_n=\\dfrac{a(1-r^n)}{1-r}=\\dfrac{a(r^n-1)}{r-1}\\)（\\(r\\ne1\\)）。"], ["Infinite GP: \\(S_\\infty= function pptBullets(arr,max){const out=[];let cur=[];arr.forEach(b=>{if(cur.length>=max){out.push(cur);cur=[]}cur.push(b)});if(cur.length)out.push(cur);return out}
function mdToSlides(md){
  const slides=[];let cur=null;const flush=()=>{if(cur&&(cur.b.length||cur.tip))slides.push(cur);cur=null};
  const start=t=>{flush();cur={t:t,tz:"",b:[],z:"",tip:""}};
  const clean=s=>s.replace(/\*\*(.+?)\*\*/g,"$1").replace(/`([^`]+)`/g,"$1").replace(/^\s*[>#]+\s*/,"").trim();
  start("要点");
  md.split("\n").forEach(raw=>{const line=raw.trim();if(!line)return;
    let m;if(m=line.match(/^#{1,4}\s+(.*)$/)){start(clean(m[1]));return}
    if(/^\|?\s*:?-{2,}/.test(line))return;
    let txt=null;if(m=line.match(/^([-*•]|\d+[.)])\s+(.*)$/))txt=clean(m[2]);else if(line.startsWith("|"))txt=line.replace(/^\||\|$/g,"").split("|").map(x=>clean(x)).filter(Boolean).join(" — ");else txt=clean(line);
    if(!txt)return;
    if(/^华文[:：]/.test(txt)){const z=txt.replace(/^华文[:：]\s*/,"");const last=cur.b[cur.b.length-1];if(last&&typeof last==="string")cur.b[cur.b.length-1]=[last,z];else if(Array.isArray(last)&&!last[1])last[1]=z;else cur.z+=(cur.z?" ":"")+z;return}
    cur.b.push(txt)});
  flush();const res=[];slides.forEach(sl=>{const parts=pptBullets(sl.b,5);if(!parts.length){res.push(sl);return}parts.forEach((p,i)=>res.push({t:sl.t+(parts.length>1&&i?"（续）":""),tz:sl.tz,b:p,z:i===parts.length-1?sl.z:"",tip:i===parts.length-1?sl.tip:""}))});
  return res}
function htmlToSlides(html){
  const d=new DOMParser().parseFromString("<div>"+html+"</div>","text/html").body.firstChild;const slides=[];let cur={t:"内置要点",tz:"",b:[],z:"",tip:""};
  const flush=()=>{if(cur.b.length||cur.tip)slides.push(cur)};
  [...d.children].forEach(el=>{const tn=el.tagName;
    if(tn==="H4"||tn==="H3"){flush();cur={t:el.textContent.trim(),tz:"",b:[],z:"",tip:""}}
    else if(tn==="UL"||tn==="OL"){el.querySelectorAll(":scope>li").forEach(li=>cur.b.push(li.textContent.replace(/\s+/g," ").trim()))}
    else if(tn==="TABLE"){el.querySelectorAll("tr").forEach(tr=>{const t=[...tr.children].map(x=>x.textContent.replace(/\s+/g," ").trim()).filter(Boolean).join(" — ");if(t)cur.b.push(t)})}
    else if(el.classList&&(el.classList.contains("tip")||el.classList.contains("warnbox")))cur.tip=el.textContent.trim();
    else{const t=el.textContent.replace(/\s+/g," ").trim();if(t)cur.b.push(t)}});
  flush();const res=[];slides.forEach(sl=>{const parts=pptBullets(sl.b,5);if(!parts.length){res.push(sl);return}parts.forEach((p,i)=>res.push({t:sl.t+(parts.length>1&&i?"（续）":""),tz:"",b:p,z:"",tip:i===parts.length-1?sl.tip:""}))});return res}

function openPpt(sid,k){

  if(PPTS[k])decks.push({id:"built",label:"内置 PPT",slides:PPTS[k].map(a=>({t:a[0],tz:a[1],b:a[2],z:a[3]||"",tip:a[4]||""}))});
  if(S.notes[k])decks.push({id:"ai",label:"AI 笔记版",slides:mdToSlides(S.notes[k].md)});
  if(c.n)decks.push({id:"n",label:"内置要点版",slides:htmlToSlides(c.n)});
  if(!decks.length||!decks.some(d=>d.slides.length)){toast("这一章还没有内容可以做成 PPT。先点「AI 生成这一章的笔记」，再来看。");return}
  const head={title:true,t:c.t,b:(c.subs||[]).slice(),z:S.req[k]?"章节要求："+S.req[k]:""};
  decks.forEach(d=>{d.slides=[head,...d.slides,{end:true}]});
  PP={sid,k,c,decks,di:0,si:0,zh:S.pptZh!==false,opener:document.activeElement};
  document.body.style.overflow="hidden";drawPpt();document.addEventListener("keydown",pptKey)}
function closePpt(){const o=document.getElementById("ppt");if(o)o.remove();document.body.style.overflow="";document.removeEventListener("keydown",pptKey);const op=PP&&PP.opener;PP=null;if(op&&op.focus)try{op.focus()}catch(e){}}
function pptKey(e){if(!PP)return;const k=e.key;if(k==="Escape"){closePpt();return}

function salvageJSON(s,depth){const st=[];let inS=false,esc=false,cut=-1,stk=null;
  for(let i=0;i<s.length;i++){const ch=s[i];
    if(inS){if(esc)esc=false;else if(ch==="\\")esc=true;else if(ch==='"')inS=false;continue}
    if(ch==='"'){inS=true;continue}
    if(ch==="{"||ch==="[")st.push(ch);
    else if(ch==="}"||ch==="]"){st.pop();if(st.length===depth){cut=i+1;stk=st.slice()}}}
  if(cut<0)return undefined;
  const closers=stk.slice().reverse().map(c=>c==="{"?"}":"]").join("");
  try{return JSON.parse(s.slice(0,cut)+closers)}catch(e){return undefined}}

const CALC_SUBJ=["mat","am","fiz","kim","sains"];
function calcRule(sid){return CALC_SUBJ.includes(sid)?"\n【计算核对】如果你的解答里有数值计算，在回答的最后单独加一个 ```calc 代码块，每行写一项：算式 = 你算出的结果。算式只能用数字、+ - * / ^ ( )、sqrt() sin() cos() tan() ln() log() pi；角度要先换成弧度，例如 sin(30*pi/180)；科学记数法写成 6*10^-7；单位和说明写在 # 后面。只列最终答案和关键步骤的结果，最多 6 行；没有数值计算就不要加这个代码块。例如：\n```calc\n(3*10^8)/(5*10^14) = 6*10^-7  # 波长，单位 m\n```":""}
function calcVal(s){
  s=String(s||"").trim().replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻]+/g,m=>"^"+m.split("").map(c=>c==="⁻"?"-":"⁰¹²³⁴⁵⁶⁷⁸⁹".indexOf(c)).join(""))
    .replace(/(\d),(\d{3})(?!\d)/g,"$1$2").replace(/(\d)\s*[eE]\s*([+-]?\d+)/g,"$1*10^$2").replace(/(\d)\s*x\s*(?=[\d(])/g,"$1*");
  if(!s)return null;
  let f=compileFn(s);if(f){try{const v=f(0);if(isFinite(v))return v}catch(e){}}
  const m=s.match(/^[0-9.+\-−–×÷*\/^() \t]+/);   /* 去掉结尾的单位 */
  if(m&&m[0].trim()&&m[0].trim()!==s){f=compileFn(m[0]);if(f){try{const v=f(0);if(isFinite(v))return v}catch(e){}}}
  return null}
function calcFmt(v){const a=Math.abs(v);return(a>=1e6||(v!==0&&a<1e-3))?v.toExponential(4).replace(/\.?0+e/,"e"):String(+v.toPrecision(7))}

  const rows=[];
  String(body||"").split(/\r?\n/).slice(0,12).forEach(raw=>{

    const hi=line.indexOf("#"),cmt=hi>=0?line.slice(hi+1).trim():"",core=(hi>=0?line.slice(0,hi):line).replace(/[≈≃]/g,"=").trim(),ei=core.lastIndexOf("=");

    const tol=plain?0.5*Math.pow(10,-((Rs.split(".")[1]||"").length))*1.001:Math.abs(a)*0.01;

    :`<tr><td><code>${esc(r.L)}</code></td><td>AI：<b>${esc(r.R)}</b></td><td>程序：<b>${esc(calcFmt(r.a))}</b></td><td class="${r.st}">${r.st==="ok"?"✓ 一致":"⚠ 不一致"}</td></tr>${r.cmt?`<tr><td colspan="4" class="fine muted">${esc(r.cmt)}</td></tr>`:""}`).join("")}</table>${bad?`<div class="bad" style="margin-top:4px">有 ${bad} 行和程序算的不一样：请对照上面的步骤检查，不要直接抄答案。</div>`:(na?"":`<div class="fine muted" style="margin-top:4px">这几行的结果程序也算出来一样 (只核对数字，不核对解题思路对不对)。</div>`)}</div>`}

function essayNorm(o,max,text){
  const dims=(Array.isArray(o.dims)?o.dims:[]).map(d=>({n:String(d&&d.n||""),m:Math.max(0,Number(d&&d.m)||0),s:Number(d&&d.s)||0,c:String(d&&d.c||"")})).filter(d=>d.n&&d.m>0).map(d=>({n:d.n,m:d.m,c:d.c,s:Math.max(0,Math.min(d.m,Math.round(d.s*2)/2))}));

  if(dims.length&&Math.abs(sumM-max)<=1.01)score=sumS;
  score=Math.max(0,Math.min(max,Math.round(score*2)/2));
  const flat=s=>String(s).replace(/\s+/g," ").trim().toLowerCase(),T=flat(text||""),arr=a=>Array.isArray(a)?a:[];
  const errors=arr(o.errors).slice(0,8).map(x=>({orig:String(x&&x.orig||""),fix:String(x&&x.fix||""),why:String(x&&x.why||"")})).filter(x=>x.orig&&x.fix).map(x=>({orig:x.orig,fix:x.fix,why:x.why,found:!T||T.includes(flat(x.orig))}));
  const upgrades=arr(o.upgrades).slice(0,4).map(x=>({orig:String(x&&x.orig||""),better:String(x&&x.better||""),why:String(x&&x.why||"")})).filter(x=>x.orig&&x.better);
  return{score,dims,errors,upgrades,strengths:arr(o.strengths).slice(0,5).map(String),advice:arr(o.advice).slice(0,4).map(String),model:String(o.model||"")}}

只输出 JSON：{"score":总分,"dims":[{"n":"维度名","s":得分,"m":满分,"c":"评语"}],"strengths":["..."],"errors":[{"orig":"","fix":"","why":""}],"upgrades":[{"orig":"","better":"","why":""}],"advice":["..."],"model":""}`}];
      if(e.img){content.push({text:"手写作文照片："});content.push({inline_data:{mime_type:"image/jpeg",data:e.img}})}
      const out=await gem([{role:"user",parts:content}],sysPrompt(sid,"你现在是严格公正的 SPM 写作评卷员。"),6000,{json:"{",cache:true});
      const r=essayNorm(parseJSON(out,"{"),max,e.text);e.res=r;
      S.essays=S.essays||[];S.essays.unshift({id:"e"+Date.now(),s:sid,type:e.type,topic:e.topic.trim(),text:e.text.slice(0,8000),max,score:r.score,at:Date.now(),res:r});
      if(S.essays.length>20)S.essays.length=20;save();essayView(box)}
    catch(err){setBusy($("#eSub"),false);$("#eMsg").innerHTML=`<span style="color:var(--bad)">${esc(err.message)}</span>`}};
  if($("#eNew"))$("#eNew").onclick=()=>{ES={sid,type:e.type,topic:"",hint:"",text:"",img:null,res:null,max:e.max};essayView(box);window.scrollTo(0,0)};
  if($("#eWr"))$("#eWr").onclick=()=>{S.wrong.push({id:"s"+Date.now(),type:"manual",s:sid,q:"作文错句："+e.topic.slice(0,40),a:e.res.errors.map(x=>"原："+x.orig+"\n改："+x.fix+(x.why?"\n"+x.why:"")).join("\n\n")});save();toast("已记进错题本")};
  $$("[data-eview]").forEach(b=>b.onclick=()=>{const x=(S.essays||[]).find(y=>y.id===b.dataset.eview);if(!x)return;ES={sid,type:x.type,topic:x.topic,hint:"",text:x.text,img:null,res:x.res,max:x.max};essayView(box);window.scrollTo(0,0)});
  $$("[data-edel]").forEach(b=>b.onclick=()=>{if(!confirm("删除这篇作文和它的批改？"))return;S.essays=(S.essays||[]).filter(y=>y.id!==b.dataset.edel);save();essayView(box)})}

function keyTag(){const k=(S.ai.key||"").trim();return k?k.slice(0,6)+k.length:""}
async function uploadToGemini(blob,name,mime){
  const key=S.ai.key.trim();
  let start;try{start=await fetch("https://generativelanguage.googleapis.com/upload/v1beta/files?key="+encodeURIComponent(key),{method:"POST",headers:{"X-Goog-Upload-Protocol":"resumable","X-Goog-Upload-Command":"start","X-Goog-Upload-Header-Content-Length":String(blob.size),"X-Goog-Upload-Header-Content-Type":mime,"Content-Type":"application/json"},body:JSON.stringify({file:{display_name:name.slice(0,100)}})})}
  catch(e){throw new Error("无法连接 Google 上传服务。如果是在 claude.ai 里打开的预览版，那里不允许；请用 GitHub Pages 或本地的 index.html。")}
  if(!start.ok){let d=null;try{d=await start.json()}catch(e){}throw new Error(aiErr(start.status,d))}
  const upUrl=start.headers.get("x-goog-upload-url");
  if(!upUrl)throw new Error("拿不到上传地址 (浏览器可能没有放行响应头)。可以先把文件拆小到 14 MB 以内再上传。");
  const info=await new Promise((ok,no)=>{const x=new XMLHttpRequest();x.open("POST",upUrl);x.setRequestHeader("X-Goog-Upload-Offset","0");x.setRequestHeader("X-Goog-Upload-Command","upload, finalize");
    let last=0;x.upload.onprogress=e=>{if(e.lengthComputable&&Date.now()-last>700){last=Date.now();toast(`上传「${name}」${Math.round(e.loaded/e.total*100)}%`)}};
    x.onload=()=>{if(x.status>=200&&x.status<300){try{ok(JSON.parse(x.responseText))}catch(e){no(new Error("上传返回的格式不对"))}}else{let d=null;try{d=JSON.parse(x.responseText)}catch(e){}no(new Error(aiErr(x.status,d)))}};
    x.onerror=()=>no(new Error("上传失败：网络中断，请重试。"));x.send(blob)});
  let file=info.file||info;
  for(let i=0;i<60&&file.state==="PROCESSING";i++){await sleep(2000);const r=await fetch("https://generativelanguage.googleapis.com/v1beta/"+file.name+"?key="+encodeURIComponent(key));if(r.ok)file=await r.json();else break}
  if(file.state==="FAILED")throw new Error("Google 无法处理这个文件，请换一个或拆分后再试。");
  return{uri:file.uri,mime:file.mimeType||mime,expires:file.expirationTime?new Date(file.expirationTime).getTime():Date.now()+47*3600e3}}
async function ensureRemote(f,mime){
  if(!gemOK())throw new Error("大文件要先上传到 Google，请先到「设置」填写 API key。");
  const r=f.remote;if(r&&r.expires-Date.now()>30*60e3&&r.keyId===keyTag())return r;
  toast(`正在上传「${f.name}」到 Google…`);
  const up=await uploadToGemini(f.blob,f.name,mime);f.remote={uri:up.uri,mime:up.mime,expires:up.expires,keyId:keyTag()};await DB.put(f);return f.remote}

const SYNC_SALT="spm-notes-sync-v1";
const SYNC_WORKER_CODE="// SPM 同步 Worker —— 配合 KV 使用\n// 协议：PUT/GET  {你的网址}/s/{64位十六进制id}\n// 数据在手机/电脑上已用 API key 加密，这里只存密文，Worker 看不到内容。\n// 需要绑定一个 KV，变量名必须叫 SYNC\n\nconst CORS = {\n  'Access-Control-Allow-Origin': '*',\n  'Access-Control-Allow-Methods': 'GET, PUT, OPTIONS',\n  'Access-Control-Allow-Headers': 'Content-Type',\n  'Access-Control-Max-Age': '86400',\n};\n\nconst MAX_BYTES = 20 * 1024 * 1024; // KV 单个值上限 25MB，这里留点余量\n\nconst reply = (body, status = 200, extra = {}) =>\n  new Response(body, { status, headers: { ...CORS, ...extra } });\n\nexport default {\n  async fetch(req, env) {\n    if (req.method === 'OPTIONS') return reply(null, 204);\n\n    const m = new URL(req.url).pathname.match(/^\\/s\\/([0-9a-f]{64})$/);\n    if (!m) return reply('SPM sync worker is running', 404);\n    const id = m[1];\n\n    if (!env.SYNC) return reply('KV binding \"SYNC\" is missing', 500);\n\n    if (req.method === 'GET') {\n      const v = await env.SYNC.get(id);\n      if (v === null) return reply('not found', 404);\n      return reply(v, 200, {\n        'Content-Type': 'application/json',\n        'Cache-Control': 'no-store',\n      });\n    }\n\n    if (req.method === 'PUT') {\n      const body = await req.text();\n      if (body.length > MAX_BYTES) return reply('too large', 413);\n      try { JSON.parse(body); } catch { return reply('bad json', 400); }\n      await env.SYNC.put(id, body);\n      return reply('ok');\n    }\n\n    return reply('method not allowed', 405);\n  },\n};\n";

<p class="muted" style="margin-top:0">同步靠「API key」认人：电脑和手机填同一个 API key，就能对上同一份数据。每个人用自己的 Cloudflare 账号和自己的 API key，数据互不相干，不需要别人的 workers.dev。免费套餐就够用，不用绑信用卡。</p>
<p><b>第 1 步：注册 Cloudflare 账号</b></p>
<ol style="margin:4px 0 10px;padding-left:1.3em">
<li>打开 <a href="https://dash.cloudflare.com/sign-up" target="_blank" rel="noopener noreferrer">dash.cloudflare.com/sign-up</a>，用邮箱和密码注册。</li>
<li>去邮箱点验证链接。</li>
</ol>
<p><b>第 2 步：建 KV 存储空间</b></p>
<ol style="margin:4px 0 10px;padding-left:1.3em">
<li>登录后，左侧菜单找到 <b>Storage &amp; Databases → Workers KV</b>。</li>
<li>点 <b>Create a KV namespace</b>，名字随便填，例如 <code>spm-sync</code>，然后创建。</li>
</ol>
<p><b>第 3 步：建 Worker</b></p>
<ol style="margin:4px 0 10px;padding-left:1.3em">
<li>左侧菜单先点 <b>Compute</b>，再点 <b>Workers &amp; Pages → Create → Create Worker</b>。</li>
<li>名字填 <code>spm-sync</code>（会成为网址的一部分），点 <b>Deploy</b>。第一次可能要你选一个 xxx.workers.dev 子域名，随便取一个。</li>
<li>部署完点 <b>Edit code</b><button type="button" class="btn small" id="wkCopy" title="复制 Worker 代码" aria-label="复制 Worker 代码" style="padding:2px 7px;vertical-align:middle;margin-left:4px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button> （点右边的复制图标，就是复制要贴的代码）。把编辑器里原有的代码全部删掉，贴上刚复制的代码，再点右上角 <b>Deploy</b>。</li>
</ol>
<p><b>第 4 步：把 KV 绑定到 Worker（最容易漏）</b></p>
<ol style="margin:4px 0 10px;padding-left:1.3em">
<li>进入这个 Worker 的 <b>Settings → Bindings → Add</b>。</li>
<li>选 <b>KV namespace</b>。</li>
<li><b>Variable name 必须填 <code>SYNC</code></b>（大写），KV namespace 选第 2 步建的那个，保存并部署。</li>
</ol>
<p><b>第 5 步：拿到网址并测试</b></p>
<ol style="margin:4px 0 10px;padding-left:1.3em">
<li>在 Worker 页面找到网址，形如 <code>https://spm-sync.你的子域名.workers.dev</code>。</li>
<li>浏览器打开它，看到 <code>SPM sync worker is running</code> 就成功了。如果出现 <code>KV binding "SYNC" is missing</code>，说明第 4 步没绑好。</li>
</ol>
<p><b>第 6 步：在这里填写</b></p>
<ol style="margin:4px 0 10px;padding-left:1.3em">
<li>电脑和手机都在上面的「Gemini API key」填<b>同一个 key</b>。</li>
<li>把第 5 步的网址贴到下面的输入框，结尾不要带 /，点「保存并同步」。</li>
<li>到另一台设备同样填好网址，点「立即同步」，数据就过去了。</li>
</ol>
<p class="muted" style="margin-bottom:0"><b>提醒：</b>两台设备的 API key 必须一模一样，多一个空格都不行；换了 key 就等于换了新的同步空间。Cloudflare KV 更新到各地最多有约 1 分钟延迟，刚在一台同步完，另一台等一会再点，不要连点。免费额度是每天 1000 次写入、10 万次读取，上传很多图片或资料文件时同步次数会变多。</p>
</div></details>

function noteHTML(c){

function printDoc(title,sections){

  const box=document.createElement("div");box.id="printArea";
  const d=new Date().toLocaleDateString("zh-CN",{year:"numeric",month:"long",day:"numeric"});

    sections.map((x,i)=>`<section class="pa-sec${i?" pa-break":""}">${x.t?`<h2 class="pa-title">${esc(x.t)}</h2>`:""}<div class="md">${x.html}</div></section>`).join("");
  document.body.appendChild(box);document.body.classList.add("printing");
  const oldTitle=document.title;document.title=title; /* 浏览器会拿它当 PDF 文件名 */
  let finished=false;
  const done=()=>{if(finished)return;finished=true;document.body.classList.remove("printing");box.remove();document.title=oldTitle;window.removeEventListener("afterprint",done)};
  window.addEventListener("afterprint",done);
  const needMath=/\\\(|\\\[|\$\$/.test(box.textContent);
  setTimeout(()=>{try{window.print()}catch(e){done();toast("这个浏览器不能直接打印，请用浏览器菜单里的「打印」")}},needMath?700:120)}
function printNote(sid,k){
  const c=findChap(sid,k);if(!c)return;
  const html=noteHTML(c);if(!html){toast("这一章还没有笔记可以打印");return}
  printDoc(`${subj(sid).name} · ${c.t}`,[{t:"",html}])}
function printSubj(sid){
  const cs=chapsOf(sid).filter(c=>S.notes[c.k]);
  if(!cs.length){toast("这一科还没有生成笔记");return}

<script>
(function(){
  var bell=document.getElementById("btnBell"),set=document.getElementById("btnSet");
  if(!bell)return;
  var standalone=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||window.navigator.standalone===true;
  var dp=null;
  window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();dp=e;});
  window.addEventListener("appinstalled",function(){var b=document.getElementById("btnInstall");if(b)b.remove();dp=null;});

  /* ---- 铃铛右边的安装按钮 (已经装成 App 时不显示) ---- */
  if(!standalone){
    var b=document.createElement("button");
    b.className="btn line";b.id="btnInstall";b.type="button";
    b.setAttribute("aria-label","安装成 App");b.title="安装成 App";
    b.innerHTML='<span aria-hidden="true">📲</span>';
    bell.insertAdjacentElement("afterend",b);
    b.onclick=function(){
      if(inApp()){showIab();return}
      if(dp){dp.prompt();dp.userChoice.then(function(){dp=null;});return;}
      showHelp();
    };
  }
  /* ---- 在 Instagram / Facebook / TikTok 等内置浏览器里装不了 App：教人改用浏览器打开 ---- */
  function inApp(){return /Instagram|FBAN|FBAV|FB_IAB|FBIOS|MicroMessenger|TikTok|musical_ly|Bytedance|Snapchat|\bLine\//i.test(navigator.userAgent)}
  function appName(){var u=navigator.userAgent;return /Instagram/i.test(u)?"Instagram":/FBAN|FBAV|FB_IAB|FBIOS/i.test(u)?"Facebook":/TikTok|musical_ly|Bytedance/i.test(u)?"TikTok":/MicroMessenger/i.test(u)?"微信":/Snapchat/i.test(u)?"Snapchat":/Line\//i.test(u)?"LINE":"这个 App"}
  function copyUrl(done){var u=location.href.split("#")[0];function fb(){var t=document.createElement("textarea");t.value=u;t.style.cssText="position:fixed;opacity:0";document.body.appendChild(t);t.select();try{document.execCommand("copy")}catch(e){}t.remove();done(true)}
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(u).then(function(){done(true)},fb);else fb()}
  function showIab(){
    var ua=navigator.userAgent,ios=/iphone|ipad|ipod/i.test(ua),and=/android/i.test(ua),nm=appName();
    var old=document.getElementById("pwaHelp");if(old)old.remove();
    var s1=ios?'点右上角 (或右下角) 的 <b>⋯</b>，选 <b>在 Safari 中打开</b> (有的写「在外部浏览器打开」)':and?'点右上角的 <b>⋯</b>，选 <b>在 Chrome 中打开</b> (或「在浏览器中打开」)':'点右上角的 <b>⋯</b>，选 <b>在浏览器中打开</b>';
    var s2=ios?'打开后，点底部中间的 <b>分享</b> 按钮 → <b>添加到主屏幕</b> → <b>添加</b>':and?'打开后，点浏览器右上角的 <b>⋮</b> → <b>安装应用</b> (或「添加到主屏幕」)':'打开后，在浏览器菜单里选 <b>安装</b> 或 <b>添加到主屏幕</b>';
    var chrome=and?'<a class="btn pri small" href="intent://'+location.host+location.pathname+'#Intent;scheme=https;package=com.android.chrome;end">用 Chrome 打开</a>':"";
    var back=document.createElement("div");back.className="upd-back no-print";back.id="pwaHelp";
    back.innerHTML='<div class="upd iab" role="dialog" aria-label="装 App 要先用浏览器打开"><div class="row"><h2 style="margin:0">🌐 装 App 要先用浏览器打开</h2></div><p>你现在是在 <b>'+nm+'</b> 里打开的。它自带的小浏览器<b>不能安装 App</b>，填好的 API key 也可能下次就不见了。</p><div class="stp"><i>1</i><div>'+s1+'</div></div><div class="stp"><i>2</i><div>'+s2+'</div></div><p class="fine muted" style="margin:6px 0 0">找不到「在浏览器中打开」？点下面的「复制网址」，再到 '+(ios?"Safari":and?"Chrome":"浏览器")+' 的网址栏粘贴。</p><div class="btns"><button class="btn pri small" id="iabCopy">复制网址</button>'+chrome+'<button class="btn small" id="pwaHelpX">知道了</button></div></div>';
    document.body.appendChild(back);
    var close=function(){back.remove()};back.onclick=function(e){if(e.target===back)close()};
    document.getElementById("pwaHelpX").onclick=close;
    var cb=document.getElementById("iabCopy");cb.onclick=function(){copyUrl(function(){cb.textContent="已复制 ✓"})};
  }
  if(!standalone&&inApp()){try{if(!sessionStorage.getItem("spmIab")){sessionStorage.setItem("spmIab","1");setTimeout(showIab,1500)}}catch(e){}}
  function showHelp(){
    if(inApp()){showIab();return}
    var ua=navigator.userAgent,ios=/iphone|ipad|ipod/i.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
    var safari=/safari/i.test(ua)&&!/crios|fxios|edgios|chrome|android/i.test(ua);
    var steps;
    if(ios&&safari)steps="1. 点屏幕最下面中间的 <b>分享按钮</b> (方框加向上的箭头)<br>2. 往下滑，点 <b>添加到主屏幕</b><br>3. 点右上角 <b>添加</b>";
    else if(ios)steps="iPhone 上，<b>Safari</b> 最稳。如果你用的是 Chrome 等其他浏览器：点右上角 (或底部) 的 <b>分享</b> 或 <b>⋯</b> → <b>添加到主屏幕</b> → <b>添加</b> (需要 iOS 16.4 以上)。找不到这个选项的话，就用 Safari 打开这个网址，再点底部的分享按钮 → <b>添加到主屏幕</b>。";
    else if(/android/i.test(ua))steps="点浏览器右上角的 <b>⋮</b> → <b>安装应用</b> (或 <b>添加到主屏幕</b>)。";
    else steps="Chrome / Edge：看地址栏最右边的 <b>安装图标</b>，或菜单里的 <b>安装 SPM备考本</b>。";
    var old=document.getElementById("pwaHelp");if(old)old.remove();
    var back=document.createElement("div");back.className="upd-back no-print";back.id="pwaHelp";
    back.innerHTML='<div class="upd" role="dialog" aria-label="安装成 App"><div class="row"><h2 style="margin:0">📲 安装成 App</h2><span class="spacer"></span><button class="btn small" id="pwaHelpX">关闭</button></div><p style="line-height:1.8;margin:12px 0 4px">'+steps+'</p><p class="fine muted" style="margin:8px 0 0">装好后桌面会有「SPM备考」图标，一点就进来，不用再开浏览器。</p></div>';
    document.body.appendChild(back);
    var close=function(){back.remove()};
    back.onclick=function(e){if(e.target===back)close()};
    document.getElementById("pwaHelpX").onclick=close;
  }

  /* ---- 新版本提醒：铃铛亮红点 + 底部提示条 ---- */
  var bar=document.createElement("div");bar.id="pwaBar";
  bar.innerHTML='<span>🔔 有新版本了</span><button type="button" id="pwaReload">刷新</button><button type="button" class="x" id="pwaLater" aria-label="稍后">✕</button>';
  document.body.appendChild(bar);
  document.getElementById("pwaReload").onclick=function(){location.reload()};
  document.getElementById("pwaLater").onclick=function(){bar.classList.remove("show")};
  function announce(){
    bell.classList.add("unread");
    bar.classList.add("show");
  }
  if("serviceWorker" in navigator){
    var hadCtrl=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.register("sw.js").then(function(reg){
      var check=function(){try{reg.update()}catch(e){}};
      document.addEventListener("visibilitychange",function(){if(!document.hidden)check()});
      setInterval(check,30*60*1000);
      reg.addEventListener("updatefound",function(){
        var nw=reg.installing;if(!nw)return;
        nw.addEventListener("statechange",function(){
          if(nw.state==="installed"&&navigator.serviceWorker.controller)announce();
        });
      });
    }).catch(function(){});
    navigator.serviceWorker.addEventListener("controllerchange",function(){if(hadCtrl)announce();});
  }
})();
</script>

<script>
(function(){
  var DOGS=["wallpapers/dog1.jpg","wallpapers/dog2.jpg","wallpapers/dog3.jpg","wallpapers/dog4.jpg","wallpapers/dog5.jpg"];
  var MC=[1,2,3,4,5,6,7,8].map(function(n){return "wallpapers/mc"+n+".jpg"});
  var KEY="spm-wp-mode",EVERY=10000,MAX=12;
  var mode="",timer=null,idx=0,front=0,list=null,urls=[];
  var rot=true;try{rot=localStorage.getItem("spm-wp-rot")!=="0"}catch(e){}
  try{mode=localStorage.getItem(KEY)||""}catch(e){}
  if(mode!=="custom"&&mode!=="dogs"&&mode!=="minecraft")mode="";

  function say(m){try{if(typeof toast==="function")toast(m)}catch(e){}}
  function saveMode(){try{localStorage.setItem(KEY,mode)}catch(e){}}

  /* ---- 自定义图片存在 IndexedDB (比 localStorage 大得多) ---- */
  function db(){return new Promise(function(ok,no){try{var r=indexedDB.open("spm-wp",1);r.onupgradeneeded=function(){r.result.createObjectStore("kv")};r.onsuccess=function(){ok(r.result)};r.onerror=function(){no(r.error)}}catch(e){no(e)}})}
  function dbGet(k){return db().then(function(d){return new Promise(function(ok,no){var q=d.transaction("kv").objectStore("kv").get(k);q.onsuccess=function(){ok(q.result||null)};q.onerror=function(){no(q.error)}})})}
  function dbSet(k,v){return db().then(function(d){return new Promise(function(ok,no){var t=d.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=ok;t.onerror=function(){no(t.error)}})})}
  function dbDel(k){return db().then(function(d){return new Promise(function(ok,no){var t=d.transaction("kv","readwrite");t.objectStore("kv").delete(k);t.oncomplete=ok;t.onerror=function(){no(t.error)}})})}
  function shrink(file){return new Promise(function(ok,no){
    var u=URL.createObjectURL(file),im=new Image();
    im.onload=function(){var m=1600,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(u);c.toBlob(function(b){b?ok(b):no(new Error("toBlob"))},"image/jpeg",.85)};
    im.onerror=function(){URL.revokeObjectURL(u);no(new Error("bad image"))};im.src=u})}
  function shrinkAll(fs){var out=[];return fs.reduce(function(p,f){return p.then(function(){return shrink(f).then(function(b){out.push(b)},function(){})})},Promise.resolve()).then(function(){return out})}

  /* 自定义图片列表 (兼容旧版只存了一张的情况) */
  function loadList(){
    if(list)return Promise.resolve(list);
    return dbGet("customList").then(function(l){
      if(Array.isArray(l)){list=l;return l}
      return dbGet("custom").then(function(b){
        list=b?[b]:[];
        if(!b)return list;
        return dbSet("customList",list).then(function(){return dbDel("custom")}).catch(function(){}).then(function(){return list});
      });
    }).catch(function(){list=[];return list});
  }
  function persist(){return dbSet("customList",list)}
  function makeUrls(){urls.forEach(function(u){URL.revokeObjectURL(u)});urls=(list||[]).map(function(b){return URL.createObjectURL(b)})}

  /* ---- 壁纸图层 (两层交叉淡入淡出) ---- */
  var layer=document.createElement("div");layer.id="wpLayer";layer.setAttribute("aria-hidden","true");
  layer.innerHTML='<div class="wi"></div><div class="wi"></div>';
  var au=document.querySelector(".aurora");if(au)au.insertAdjacentElement("afterend",layer);else document.body.insertBefore(layer,document.body.firstChild);
  function setOn(v){layer.classList.toggle("on",v);document.body.classList.toggle("wp-on",v)}
  var wis=layer.querySelectorAll(".wi");
  var br=60;try{var sb=parseInt(localStorage.getItem("spm-wp-br"),10);if(sb>=25&&sb<=100)br=sb}catch(e){}
  layer.style.setProperty("--wpb",br/100);
  function sliderHTML(){return '<label class="fine" style="display:flex;align-items:center;gap:10px;margin-top:12px">壁纸亮度<input type="range" id="wpBr" min="25" max="100" value="'+br+'" style="flex:1;max-width:260px"><span id="wpBrV" style="min-width:3em">'+br+'%</span></label>'}
  function rotHTML(){return '<label class="chk" style="margin-top:12px"><input type="checkbox" id="wpRot" '+(rot?"checked":"")+'> 每 10 秒自动换一张</label>'}

  function sources(){return mode==="dogs"?DOGS:(mode==="minecraft"?MC:(mode==="custom"?urls:[]))}
  function show(url){
    var nxt=front?0:1;
    wis[nxt].style.setProperty("--u",'url("'+new URL(url,location.href).href+'")');
    wis[nxt].classList.add("show");wis[front].classList.remove("show");front=nxt;
  }
  function clearShow(){wis[0].classList.remove("show");wis[1].classList.remove("show")}
  function paint(){
    var src=sources();if(!src.length)return;if(idx>=src.length)idx=0;
    var u=src[idx],im=new Image(),wide=(mode==="dogs"||mode==="minecraft")&&innerWidth>innerHeight*1.15;
    var v=wide?u.replace(/\.jpg$/,"-pc.jpg"):u;
    im.onload=function(){if(sources()[idx]===u)show(v)};
    im.onerror=function(){if(v!==u&&sources()[idx]===u)show(u)};
    im.src=v;
  }
  (function(){var t,w0=innerWidth>innerHeight*1.15;addEventListener("resize",function(){clearTimeout(t);t=setTimeout(function(){var w=innerWidth>innerHeight*1.15;if(w!==w0){w0=w;if(layer.classList.contains("on"))paint()}},250)})})();
  function stop(){if(timer){clearInterval(timer);timer=null}}
  function restart(){
    stop();
    if(rot&&sources().length>1)timer=setInterval(function(){
      if(document.hidden)return;var s=sources();if(s.length<2)return;idx=(idx+1)%s.length;paint();
    },EVERY);
  }
  function apply(){
    stop();
    if(mode==="dogs"||mode==="minecraft"){idx=0;setOn(true);paint();restart();fillCard();return}
    if(mode==="custom"){
      loadList().then(function(l){
        if(mode!=="custom")return;
        if(!l.length){mode="";saveMode();setOn(false);clearShow();refreshBtns();return}
        makeUrls();idx=0;setOn(true);paint();restart();refreshBtns();
      });return;
    }
    setOn(false);clearShow();
  }

  /* ---- 设置页里的「壁纸」栏 ---- */
  var file=document.createElement("input");file.type="file";file.accept="image/*";file.multiple=true;file.style.display="none";document.body.appendChild(file);
  file.onchange=function(){
    var fs=Array.prototype.slice.call(file.files||[]);file.value="";if(!fs.length)return;
    loadList().then(function(l){
      var room=MAX-l.length;
      if(room<=0){say("最多 "+MAX+" 张，先删掉几张再添加");return}
      return shrinkAll(fs.slice(0,room)).then(function(bs){
        if(!bs.length){say("这些图片打不开，换几张试试");return}
        var was=mode==="custom";
        list=l.concat(bs);
        return persist().then(function(){
          if(fs.length>room)say("最多 "+MAX+" 张，多出来的没有加进去");
          mode="custom";saveMode();makeUrls();if(!was)idx=0;
          setOn(true);paint();restart();refreshBtns();
        });
      });
    }).catch(function(){say("保存图片失败了，换几张试试")});
  };
  function card(){return document.getElementById("wpCard")}
  function refreshBtns(){
    var c=card();if(!c)return;
    c.querySelectorAll("[data-wp=custom],[data-wp=dogs],[data-wp=minecraft]").forEach(function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-wp")===mode))});
    fillCard();
  }
  function fillCard(){
    var c=card();if(!c)return;var box=c.querySelector("#wpBody");if(!box)return;
    if(mode==="dogs"){
      box.innerHTML='<div class="wthumbs">'+DOGS.map(function(u){return '<img src="'+u+'" alt="" loading="lazy">'}).join("")+'</div>'+rotHTML()+'<p class="fine muted" style="margin:6px 0 0">一共 5 张。插画 © MALTESE。</p>'+sliderHTML();
    }else if(mode==="minecraft"){
      box.innerHTML='<div class="wthumbs">'+MC.map(function(u){return '<img src="'+u+'" alt="" loading="lazy">'}).join("")+'</div>'+rotHTML()+'<p class="fine muted" style="margin:6px 0 0">一共 8 张。Minecraft 宣传图 © Mojang / Microsoft。</p>'+sliderHTML();
    }else if(mode==="custom"){
      var th=urls.map(function(u,i){return '<span class="wt"><img src="'+u+'" alt=""><button type="button" data-wp="rm" data-i="'+i+'" aria-label="删除这张">×</button></span>'}).join("");
      box.innerHTML='<div class="wthumbs">'+th+'</div><div class="controls"><button class="btn small" type="button" data-wp="pick">＋ 添加图片</button><button class="btn small" type="button" data-wp="del">全部删除</button></div>'+(urls.length>1?rotHTML():"")+'<p class="fine muted" style="margin:6px 0 0">可以一次选多张 (最多 '+MAX+' 张)。图片只保存在这台设备的浏览器里，不会上传到任何地方。</p>'+sliderHTML();
    }else box.innerHTML="";
  }
  function build(){
    var c=document.createElement("div");c.className="card";c.id="wpCard";c.style.marginTop="14px";
    c.innerHTML='<h3 style="margin-top:0">🖼️ 壁纸</h3><p class="fine muted">默认不用壁纸。点一下选用，再点一下取消。</p><div class="seg"><button type="button" data-wp="custom" aria-pressed="'+(mode==="custom")+'">自定义</button><button type="button" data-wp="dogs" aria-pressed="'+(mode==="dogs")+'">线条小狗</button><button type="button" data-wp="minecraft" aria-pressed="'+(mode==="minecraft")+'">Minecraft</button></div><div id="wpBody"></div>';
    c.addEventListener("input",function(e){
      if(e.target.id!=="wpBr")return;
      br=+e.target.value;layer.style.setProperty("--wpb",br/100);
      var v=document.getElementById("wpBrV");if(v)v.textContent=br+"%";
      try{localStorage.setItem("spm-wp-br",String(br))}catch(_){}
    });
    c.addEventListener("change",function(e){
      if(e.target.id!=="wpRot")return;
      rot=e.target.checked;try{localStorage.setItem("spm-wp-rot",rot?"1":"0")}catch(_){}
      restart();
    });
    c.addEventListener("click",function(e){
      var b=e.target.closest("[data-wp]");if(!b)return;
      var w=b.getAttribute("data-wp");
      if(w==="pick"){file.click();return}
      if(w==="rm"){
        var i=+b.getAttribute("data-i");if(!list||isNaN(i))return;
        list.splice(i,1);
        (list.length?persist():dbDel("customList")).catch(function(){}).then(function(){
          if(!list.length){urls.forEach(function(u){URL.revokeObjectURL(u)});urls=[];mode="";saveMode();apply();refreshBtns();return}
          makeUrls();if(idx>=urls.length)idx=0;paint();restart();refreshBtns();
        });return;
      }
      if(w==="del"){
        list=[];dbDel("customList").catch(function(){}).then(function(){
          urls.forEach(function(u){URL.revokeObjectURL(u)});urls=[];mode="";saveMode();apply();refreshBtns();say("已删除全部自定义图片");
        });return;
      }
      if(mode===w){mode="";saveMode();apply();refreshBtns();return}

      loadList().then(function(l){

      });
    });
    return c;
  }
  var sheet=document.getElementById("sheet");
  function inject(){
    if(!sheet||card())return;
    var h=sheet.querySelector("h2");
    if(!h||h.textContent.trim()!=="设置")return;
    var anchor=sheet.querySelector(".grid.g2")||h;
    anchor.insertAdjacentElement("afterend",build());
    fillCard();
  }
  if(sheet){new MutationObserver(inject).observe(sheet,{childList:true});inject()}
