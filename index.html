<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>SPM 备考本</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#17263f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SPM备考">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/mhchem.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root{
  --paper:#f3f6fc;--dot:rgba(58,88,160,.16);--glass:rgba(255,255,255,.74);--glass-line:rgba(255,255,255,.9);--hover:rgba(255,255,255,.6);
  --shadow:0 0 0 1px rgba(23,38,63,.06),0 28px 60px -30px rgba(40,64,128,.38);
  --sheet:#ffffff;--sheet2:#f1f4fb;--ink:#17263f;--muted:#5d6b7c;--line:#d3dbe8;--margin:rgba(235,110,110,.42);
  --hl:#ffe45e;--accent:#17263f;--accent-ink:#ffffff;--ok:#1b7f55;--ok-soft:#d9f0e4;--bad:#c23b32;--bad-soft:#fadcd9;--warn:#8a5a00;--warn-soft:#fff1c9;
  --blue:#2f55d4;--blue-soft:#e4eafc;
  --a1:#9ec1ff;--a2:#c3b3ff;--a3:#a9ecd9;--glow:.62;
  --kai:"Kaiti SC","STKaiti","KaiTi","楷体","AR PL UKai CN","Noto Serif SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC","Segoe UI",Roboto,sans-serif;
  --mx:36px;--pl:54px;
}
body[data-theme="night"],body[data-theme="auto"].dark{--paper:#0b1420;--dot:rgba(170,200,255,.11);--glass:rgba(21,33,47,.68);--glass-line:rgba(255,255,255,.09);--hover:rgba(255,255,255,.07);
  --shadow:0 0 0 1px rgba(255,255,255,.04),0 30px 70px -30px rgba(0,0,0,.7);--sheet:#172331;--sheet2:#1e2c3d;--ink:#e6edf6;--muted:#9fb0c3;--line:#2b3b4f;--margin:rgba(255,130,130,.35);
  --accent:#e6edf6;--accent-ink:#0b1420;--ok:#6fd1a2;--ok-soft:#163a2c;--bad:#ff8f84;--bad-soft:#43211e;--warn:#f0c46a;--warn-soft:#3a2f14;--blue:#9db0ff;--blue-soft:#222d57;--glow:.34;
  --a1:#4b6fd6;--a2:#7c5cc4;--a3:#2c8f86}
body[data-theme="sakura"]{--paper:#fff5f8;--dot:rgba(200,90,130,.14);--a1:#ff9fc2;--a2:#ffcf9e;--a3:#b9c8ff}
body[data-theme="mint"]{--paper:#f1fbf6;--dot:rgba(40,130,100,.14);--a1:#74e3d1;--a2:#c9ef93;--a3:#8fcfff}
body[data-theme="paper"]{--paper:#f6efdf;--dot:rgba(150,110,50,.14);--glass:rgba(255,250,238,.78);--a1:#ffd96b;--a2:#ffb98a;--a3:#a7e3a0}
@media (prefers-color-scheme:dark){body[data-theme="auto"]{--paper:#0b1420;--dot:rgba(170,200,255,.11);--glass:rgba(21,33,47,.68);--glass-line:rgba(255,255,255,.09);--hover:rgba(255,255,255,.07);
  --shadow:0 0 0 1px rgba(255,255,255,.04),0 30px 70px -30px rgba(0,0,0,.7);--sheet:#172331;--sheet2:#1e2c3d;--ink:#e6edf6;--muted:#9fb0c3;--line:#2b3b4f;--margin:rgba(255,130,130,.35);
  --accent:#e6edf6;--accent-ink:#0b1420;--ok:#6fd1a2;--ok-soft:#163a2c;--bad:#ff8f84;--bad-soft:#43211e;--warn:#f0c46a;--warn-soft:#3a2f14;--blue:#9db0ff;--blue-soft:#222d57;--glow:.34;
  --a1:#4b6fd6;--a2:#7c5cc4;--a3:#2c8f86}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 var(--sans);min-height:100vh;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4{margin:0}
p{margin:.45em 0}
[hidden]{display:none!important}
.muted{color:var(--muted)}.fine{font-size:13px}.spacer{flex:1}

/* aurora */
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:var(--paper)}
.aurora::after{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--dot) 1.1px,transparent 1.3px);background-size:22px 22px;
  -webkit-mask-image:radial-gradient(ellipse 80% 55% at 50% 0%,#000 0%,transparent 80%);mask-image:radial-gradient(ellipse 80% 55% at 50% 0%,#000 0%,transparent 80%)}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:var(--glow);will-change:transform}
.aurora i:nth-child(1){width:60vmax;height:60vmax;left:-16vmax;top:-26vmax;background:var(--a1);animation:d1 40s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:52vmax;height:52vmax;right:-18vmax;top:4vmax;background:var(--a2);animation:d2 48s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:48vmax;height:48vmax;left:18vw;bottom:-30vmax;background:var(--a3);animation:d3 56s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(9vmax,7vmax) scale(1.1)}}@keyframes d2{to{transform:translate(-8vmax,10vmax) scale(.92)}}@keyframes d3{to{transform:translate(-10vmax,-6vmax) scale(1.12)}}

.shell{max-width:940px;margin:0 auto;padding:16px 14px 130px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:10px 4px 14px;flex-wrap:wrap}
.title h1{font:700 34px/1.1 var(--kai);letter-spacing:.04em}
.title p{margin:4px 0 0;color:var(--muted);font-size:14px}
.top .right{display:flex;gap:8px;align-items:center}
.chip-days{display:flex;align-items:baseline;gap:6px;padding:6px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-weight:700}
.chip-days b{font:700 22px/1 var(--kai);color:var(--bad)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:7px 16px;border-radius:999px;border:1px solid var(--glass-line);background:var(--glass);
  font-weight:700;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--ink);transition:background-color .2s}
.btn:hover:not(:disabled){background:var(--sheet)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover:not(:disabled){opacity:.9;background:var(--accent)}
.btn.line{border-color:var(--line)}
.btn.small{min-height:32px;padding:4px 12px;font-size:14px}
.btn.good{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn.badb{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* pills + tabs */
.subjects{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 12px}
.subjects::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
.subjects button{flex:0 0 auto;display:flex;align-items:center;gap:8px;min-height:42px;padding:7px 18px;font-weight:700;border:1px solid var(--glass-line);border-radius:999px;
  background:var(--glass);color:var(--ink);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 20px -14px rgba(40,64,128,.5)}
.subjects button:hover:not([aria-pressed=true]){background:var(--sheet)}
.subjects button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.subjects .sd{width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.subjects .cnt{font-size:12px;font-weight:700;min-width:20px;padding:0 6px;border-radius:999px;background:rgba(127,140,160,.22);line-height:20px;text-align:center}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 12px}
.tab{flex:0 0 auto;border:1px solid transparent;background:transparent;padding:8px 18px;border-radius:12px 12px 6px 6px;font-weight:700;color:var(--muted);font-size:16px;position:relative}
.tab:hover{background:var(--hover)}
.tab.active{background:var(--sheet);color:var(--ink);border-color:var(--line);box-shadow:0 3px 0 -1px var(--hl)}
.sheet{position:relative;background:var(--glass);border:1px solid var(--glass-line);border-radius:26px;box-shadow:var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  padding:26px 26px 30px var(--pl);min-height:360px;
  background-image:linear-gradient(90deg,transparent var(--mx),var(--margin) var(--mx),var(--margin) calc(var(--mx) + 2px),transparent calc(var(--mx) + 2px))}
@media (max-width:640px){.sheet{padding:20px 14px 24px var(--pl);border-radius:20px;--mx:30px;--pl:44px}.subjects button{padding:6px 14px}.title h1{font-size:28px}}
.sheet h2{font:700 21px/1.4 var(--kai);margin:22px 0 10px}.sheet h2:first-child{margin-top:0}
.sheet h3{font:700 17px/1.4 var(--kai);margin:18px 0 8px}

/* blocks */
.notice{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 16px;background:var(--sheet2)}
.notice p{margin:4px 0 10px}.notice p:last-child{margin-bottom:0}
.notice.warn{background:var(--warn-soft);border-color:var(--warn)}
.notice.error{background:var(--bad-soft);border-color:var(--bad);white-space:pre-wrap}
.notice.ok{background:var(--ok-soft);border-color:var(--ok)}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin:0 0 14px}
.controls label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.controls .grow{flex:1 1 200px}.controls label{min-width:0;max-width:100%}.controls .grow select{width:100%}.controls label.chk{flex-direction:row;align-items:center;white-space:normal}.subs .tag{white-space:normal;line-height:1.4;padding:3px 10px;border-radius:12px;max-width:100%}
select,input[type=text],input[type=password],input[type=number],input[type=date],textarea{border:1.5px solid var(--line);background:var(--sheet);border-radius:10px;padding:8px 10px;min-height:40px;max-width:100%}
input[type=text],input[type=password],textarea{width:100%}
textarea{min-height:90px;resize:vertical;line-height:1.6}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--sheet2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.blue{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.tag.red{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.tag.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.bar{height:8px;border-radius:99px;background:var(--sheet2);overflow:hidden;border:1px solid var(--line)}.bar>i{display:block;height:100%;border-radius:99px;background:var(--blue)}
.empty{padding:26px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:14px;background:var(--sheet2)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--sheet);padding:5px 14px;border-radius:99px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hl{background:linear-gradient(transparent 58%,var(--hl) 58%)}
.tip{border-left:4px solid var(--hl);background:var(--warn-soft);padding:8px 12px;border-radius:0 10px 10px 0;margin:10px 0;font-size:.94rem}
.warnbox{border-left:4px solid var(--bad);background:var(--bad-soft);padding:8px 12px;border-radius:0 10px 10px 0;margin:10px 0;font-size:.94rem}
.scroll-x{overflow-x:auto}

/* hero */
.hero{background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:20px 22px}
.hero .big{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.hero .num{font:700 clamp(3.4rem,10vw,5.6rem)/1 var(--kai)}
.hero .lbl{font-size:1.05rem;font-weight:700}
.omr{display:grid;grid-template-columns:repeat(auto-fill,minmax(20px,1fr));gap:7px;margin-top:16px}
.omr b{aspect-ratio:1;border-radius:50%;border:2px solid var(--line);display:block}
.omr b.past{background:var(--muted);border-color:var(--muted);opacity:.7}
.omr b.today{border-color:var(--bad);background:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.omr b.exam{border-color:var(--blue);border-width:3px}
.omr-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px;color:var(--muted)}
.omr-legend span::before{content:"";display:inline-block;width:11px;height:11px;border-radius:50%;border:2px solid var(--line);margin-right:6px;vertical-align:-1px}
.omr-legend .l-past::before{background:var(--muted);border-color:var(--muted)}
.omr-legend .l-today::before{background:var(--bad);border-color:var(--bad)}
.omr-legend .l-exam::before{border-color:var(--blue)}

/* chapters */
.chap{border:1px solid var(--line);border-radius:12px;background:var(--sheet);margin-bottom:8px}
.chap>summary{list-style:none;display:flex;gap:10px;align-items:center;padding:10px 14px;cursor:pointer;font-weight:700}
.chap>summary::-webkit-details-marker{display:none}
.chap>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
.chap[open]>summary::before{transform:rotate(90deg)}
.chap>summary .t{flex:1;min-width:0}
.chap[open]>summary{border-bottom:1px solid var(--line)}
.chap .body{padding:12px 16px 16px}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.chk input{width:17px;height:17px;accent-color:var(--ok)}
.subs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.note h4{margin:14px 0 4px;font:700 16px var(--kai)}
.note ul{margin:.3em 0;padding-left:1.2em}.note li{margin:.2em 0}
.note table,.md table{border-collapse:collapse;width:100%;margin:8px 0;font-size:.92rem}
.note th,.note td,.md th,.md td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
.note th,.md th{background:var(--sheet2)}
.note code,.md code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--sheet2);padding:1px 6px;border-radius:5px;font-size:.88em}
.md h1,.md h2,.md h3,.md h4{font-family:var(--kai);line-height:1.4;margin:1.2em 0 .4em}
.md{line-height:1.8}
.md h2{font-size:19px;display:block;width:fit-content;max-width:100%;padding:.18em .7em;margin:1.5em 0 .7em;border-radius:10px;background:rgba(255,228,94,.62);color:#17263f;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.md h2 .katex{color:inherit}
body[data-theme="night"] .md h2,body[data-theme="auto"].dark .md h2{background:rgba(255,228,94,.2);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(255,228,94,.35)}
.md h3{font-size:17px;padding:.1em 0 .1em 11px;margin:1.3em 0 .5em;border-left:5px solid var(--a1);border-radius:2px}
.md h4{font-size:15.5px;margin:1.1em 0 .4em;color:var(--blue)}
.md li::marker{color:var(--a1)}
.md li{margin:.3em 0}
.md li>p{margin:.2em 0}
.md p.zhp{margin:.7em 0;padding:8px 12px;border-radius:10px;background:var(--sheet2);border-left:4px solid var(--a2);font-size:.95em}
.md hr{border:0;border-top:1px dashed var(--line);margin:1.4em 0}
.md tbody tr:nth-child(even) td{background:var(--sheet2)}
.md .katex-display{margin:.8em 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}
.md strong{font-weight:700}
mark.uh{background:var(--hl);color:#17263f;border-radius:3px;padding:0 1px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
mark.uh .katex{color:#17263f}
#uhBar{position:fixed;z-index:2000;display:none;gap:4px;padding:5px;border-radius:12px;background:var(--sheet);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.25)}
#uhBar button{border:0;border-radius:9px;padding:7px 11px;font:inherit;font-size:14px;background:var(--sheet2);color:var(--ink);cursor:pointer}
#uhBar button:first-child{background:var(--hl);color:#17263f;font-weight:600}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md ul,.md ol{padding-left:1.3em}
.md pre{background:var(--sheet2);padding:10px;border-radius:10px;overflow-x:auto}
.md blockquote{margin:.6em 0;padding:4px 12px;border-left:4px solid var(--hl);background:var(--warn-soft);border-radius:0 8px 8px 0}
.md{overflow-wrap:anywhere}

/* quiz/flash */
.qbox{max-width:760px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--sheet);padding:10px 12px;border-radius:12px;margin:7px 0}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .bub{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--muted)}
.opt.sel{border-color:var(--ink)}.opt.sel .bub{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.flash{max-width:620px}
.face{min-height:230px;border:1.5px solid var(--ink);border-radius:20px;background:var(--sheet);padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 5px 0 var(--ink);cursor:pointer}
.face .q{font:700 22px/1.5 var(--kai)}.face .a{font-size:17px;white-space:pre-wrap}

/* exam */
.qcard{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.qcard .qh{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.qno{font:700 18px var(--kai)}
.part{margin:12px 0 4px;padding-left:12px;border-left:3px solid var(--line)}
.part .pm{float:right;margin-left:8px}
.stem{white-space:pre-wrap}
.score{font:700 44px/1 var(--kai)}
.fb{margin-top:8px;padding:8px 12px;border-radius:10px;background:var(--sheet2);font-size:.94rem}
.fb.full{background:var(--ok-soft)}.fb.zero{background:var(--bad-soft)}
.timerbar{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin-bottom:8px}
.timerbar b{font:700 22px var(--kai);font-variant-numeric:tabular-nums}

/* chat */
.msg{max-width:min(720px,94%);padding:10px 14px;border-radius:16px;margin:8px 0;border:1px solid var(--line);background:var(--sheet)}
.msg.user{margin-left:auto;background:var(--blue-soft);border-color:transparent}
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;background:var(--sheet2);cursor:pointer}
.drop.over{border-color:var(--blue);background:var(--blue-soft)}
.res{display:flex;flex-direction:column;gap:3px;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--sheet);border-radius:12px;padding:11px 14px}
.res:hover{border-color:var(--ink)}
.res b{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
table.t{border-collapse:collapse;width:100%;font-size:.92rem}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left}
table.t th{color:var(--muted);font-weight:700;font-size:13px}

   ["Kertas 1：Karangan (Bahagian A 事件/Bahagian B 议论)",`<ul><li>先<b>圈出题目的文体</b>：Rencana(文章)、Ucapan(演讲)、Cerita(叙事)、Laporan、Surat。</li><li>开头：以谚语/问句/定义引入 → 主题句。结尾：总结 + 劝告/希望。</li><li>每段结构：<b>isi + huraian + contoh + kesimpulan 句</b>。</li><li>语法是失分大头：<code>di-</code> 前缀与介词 <code>di</code> 的分写、<code>kepada</code> 不写 <code>kepada nya</code>、<code>oleh itu / maka / lantaran</code> 的正确使用。</li></ul><div class="tip">每篇至少放 2 个谚语 (peribahasa) 和 2 个成语，必须用对语境，用错比不用更扣分。</div>`],
   ["Kertas 1：Ringkasan (摘要)",`<ul><li>先划出<b>要点(isi penting)</b>，再用自己的话连成 1 段，不要抄原句。</li><li>字数遵守题目限制；一般先写草稿数字数。</li><li>不加个人意见，不加例子，只保留原文观点。</li></ul>`],
   ["Kertas 2：Pemahaman (阅读理解)",`<ul><li>答案尽量回到原文找依据，但<b>不要整句照抄</b>，需要改写时用同义词。</li><li>「Apakah maksud ...」要解释在原文语境里的意思，不是词典义。</li><li>「Jelaskan」类题要有<b>因 + 果</b>两部分。</li></ul>`],
   ["Tatabahasa (语法)",`<table><tr><th>类别</th><th>要点</th></tr><tr><td>Imbuhan</td><td>awalan (me-, ber-, pe-, ter-), akhiran (-kan, -i, -an), apitan (me-kan, pe-an, ke-an)</td></tr><tr><td>Kata ganda</td><td>penuh / separa / berentak 三种</td></tr><tr><td>Kata majmuk</td><td>kata majmuk 分写：<code>kerja sama</code>, <code>tanggungjawab</code> 例外要背</td></tr><tr><td>Ayat</td><td>ayat tunggal, majmuk (gabungan/pancangan/campuran)</td></tr></table>`],
   ["Kesusasteraan (文学)",`<ul><li>Komsas：puisi、cerpen、novel、drama。每个文本背好<b>tema, persoalan, watak, plot, latar, nilai, pengajaran, gaya bahasa</b>。</li><li>答题格式：<b>Isi + Bukti (引用/事件) + Huraian</b>。</li><li>Sajak/pantun/syair/gurindam 的形式特征要会区分。</li></ul>`],
   ["Ujian Bertutur & Mendengar (口试/听力)",`<ul><li>口试：用完整句子，开头<b>表明观点</b>，给 2 个理由，结尾总结；不要停顿太久，卡住时用「Pada pendapat saya ...」补位。</li><li>听力：先读题再听，抓<b>名词、数字、转折词</b>。</li></ul>`]
  ]},
 {id:"bi",lang:"en",name:"英文 BI",ms:"English",code:"1119",color:"#2c47d6",ep:"english",core:true,
  fmt:"Paper 1 Reading & Use of English 40 分 (1 小时 30 分钟)，Paper 2 Writing 60 分 (1 小时 30 分钟)，Speaking 24 分，Listening 30 分 (40 分钟)；难度对应 CEFR B1–B2。Paper 2 Writing 共 3 部分、每部分 20 分。(据 LP 2021 起的格式表)",
  ch:[
   ["Writing: Part 1 短讯/Email & Part 2 Directed Writing",`<ul><li><b>Part 1</b>：短讯或 Email，约 <b>80 字内</b>，要点写齐、语气符合对象。</li><li><b>Part 2 Directed Writing</b>：约 125–150 字，<b>题目给的每个 content point 都要写到</b>，可用自己的话扩写。</li><li>先看对象定 register：朋友 = 非正式；校长/公司 = 正式，不用缩写。</li></ul><table><tr><th>格式</th><th>要点</th></tr><tr><td>Email</td><td>Subject → Dear ... → 正文 → Regards / Yours sincerely</td></tr><tr><td>正式信</td><td>Dear Sir/Madam → <b>Yours faithfully</b>；Dear Mr Tan → <b>Yours sincerely</b></td></tr><tr><td>Report</td><td>Title、To/From/Date → Introduction → Findings → Recommendations → Conclusion</td></tr><tr><td>Speech</td><td>问候听众 → 正文 → 结尾 <code>Thank you.</code></td></tr><tr><td>Article</td><td>吸睛标题 + 署名 (By ...) → 正文 → 结尾呼吁</td></tr></table><ul><li>常用句：<code>I am writing to ...</code>、<code>I look forward to hearing from you.</code></li></ul>`],
   ["Writing: Part 3 Continuous Writing (三选一)",`<ul><li>文体：Essay、Article、Short story、Review、Speech 等，先看 genre 再写。</li><li>结构：Introduction (hook) → 2-3 body paragraphs (P.E.E: Point, Evidence, Explain) → Conclusion。</li><li>高分要点：多样句型、linking words (however, moreover, consequently)、正确时态。</li></ul><div class="tip">写完检查三件事：主谓一致、时态一致、a/an/the。</div>`],
   ["Reading: 题型与技巧",`<ul><li>Skimming 找主旨，Scanning 找细节；先看题再读文章。</li><li>Vocabulary in context：看前后句猜词义。</li><li>Inference 题：答案在文中有线索，不是凭空想象。</li></ul>`],
   ["Reading & Use of English 各部分",`<ul><li><b>Part 1 短文本</b>：8 题三选一，文本是 memo、poster、notice、announcement、advertisement、letter、dialogue 等，抓<b>目的、对象、关键信息</b>。</li><li><b>Part 2 Cloze</b>：10 题，考<b>语法</b> (时态、介词、连接词、代词) 和<b>词汇</b> (搭配、词义)。先通读，再逐空判断词性。</li><li><b>Part 3 长文本</b>：8 题，常见叙事文，读完先概括每段大意；推断题要找文中线索。</li></ul><div class="tip">Part 4 及以后的题型和题数，请以你课本/官方样卷为准。</div>`],
   ["词汇与搭配",`<ul><li>Collocation：<code>make a decision</code>、<code>take a risk</code>、<code>do homework</code>、<code>pay attention</code>。</li><li>介词固定搭配：<code>depend on</code>、<code>good at</code>、<code>interested in</code>、<code>responsible for</code>。</li><li>Linking words：对比 however / although；原因 because / since；结果 therefore / consequently。</li></ul>`],
   ["Grammar 常错点",`<table><tr><th>点</th><th>例</th></tr><tr><td>主谓一致</td><td>The number of students <b>is</b> / A number of students <b>are</b></td></tr><tr><td>时态</td><td>过去叙事用 past simple，背景用 past continuous</td></tr><tr><td>条件句</td><td>If I <b>were</b> you, I <b>would</b> ...</td></tr><tr><td>冠词</td><td>the + 唯一/已提及；泛指复数不加 the</td></tr></table>`],
   ["Listening & Speaking",`<ul><li>Listening：先预读选项，圈关键词，听到答案立刻做记号。</li><li>Speaking：每个 task 说 3-4 句以上，给理由 + 例子，不要只答 yes/no。</li></ul>`]
  ]},
 {id:"sej",lang:"ms",name:"历史 Sejarah",ms:"Sejarah",code:"1249",color:"#8a5a00",ep:"sejarah",core:true,must:true,

  ch:[

   ["T4 Bab 2 Kebangkitan Nasionalisme",`<ul><li>民族主义的意义；欧洲、亚洲、东南亚的发展；本国觉醒因素：教育、媒体、宗教改革(Kaum Muda)、外来思想。</li></ul>`],
   ["T4 Bab 3 Konflik Dunia dan Pendudukan Jepun",`<ul><li>日本占领马来亚：1941-1945。政策：<b>Sook Ching</b> (肃清华人)、饥饿与物价上涨、泰缅铁路强迫劳动 (romusha)、一方面拉拢马来人。</li><li>抵抗：MPAJA (马来亚人民抗日军)、Force 136、Wataniah (彭亨) 等。</li></ul>`],
   ["T4 Bab 4 Era Peralihan Kuasa British",`<ul><li>BMA (1945-46) → <b>Malayan Union 1946</b> (中央集权、公民权放宽、削弱苏丹权力) → 马来人反对，UMNO (1946) 成立 → 被 1948 年联合邦取代。</li><li>砂拉越 1946 割让给英国 (Rajah Vyner Brooke)，反割让运动 (Duncan Stewart 被刺)；沙巴 1946 成为皇家殖民地。</li></ul>`],
   ["T4 Bab 5 Persekutuan Tanah Melayu 1948",`<ul><li>废除 Malayan Union 的原因：马来人强烈反对。特点：保留苏丹主权、中央政府 + 州政府、公民权条件较严。</li></ul>`],
   ["T4 Bab 6 Ancaman Komunis dan Darurat",`<ul><li>1948 年 6 月 16 日宣布紧急状态 (<b>Darurat</b>)，起因之一是三名欧洲园丘经理在霹雳被杀。</li><li>应对：<b>Briggs Plan</b> (新村)、Templer 的「心理战」(hati dan minda)、Home Guard。1960 年 7 月 31 日紧急状态结束。</li></ul>`],
   ["T4 Bab 7 Usaha Ke Arah Kemerdekaan",`<ul><li>Jawatankuasa Hubungan Antara Kaum (CLC)、Sistem Ahli (1951)、Sistem Pendidikan Kebangsaan (Penyata Razak 1956)、政党成立 (UMNO, MCA, MIC, Parti Perikatan)。</li></ul>`],
   ["T4 Bab 8 Pilihan Raya",`<ul><li>1951 地方选举 (George Town)；<b>1955 年首次联邦大选</b>，Parti Perikatan 在 52 席中赢 51 席；Tunku Abdul Rahman 成为首席部长。</li></ul>`],
   ["T4 Bab 9 Perlembagaan 1957",`<ul><li><b>Suruhanjaya Reid</b> (主席 Lord Reid) 起草宪法；1956 年 Tunku 率代表团到伦敦谈判；1957 年 2 月公布报告书，8 月 5 日签署《联合邦协定》。</li></ul>`],
   ["T4 Bab 10 Pemasyhuran Kemerdekaan",`<ul><li><b>1957 年 8 月 31 日</b>，在默迪卡体育场 (Stadium Merdeka) 宣布独立，Tunku 高呼「Merdeka」七次。</li><li>独立后：成为主权国家，宪法生效，第一任最高元首 Tuanku Abdul Rahman。</li></ul>`],
   ["T5 主题：Perlembagaan & Institusi",`<ul><li>宪法的地位：最高法律 (Perkara 4)；联邦宪法特点：君主立宪、议会民主、联邦制。</li><li>Majlis Raja-Raja 的角色：选举最高元首/副元首，对 Islam 事务、马来特权提供意见。</li></ul><div class="tip">课本目录请以你手上的版本为准，上面是核心主题，不按章号。</div>`],
   ["T5 主题：Pembentukan Malaysia (1963)",`<ul><li>1961 年 5 月 Tunku 在新加坡提出「马来西亚」构想 → Suruhanjaya Cobbold (1962) → 政府间委员会 (IGC) → <b>1963 年 9 月 16 日</b> 马来西亚成立 (马来亚 + 新加坡 + 沙巴 + 砂拉越)。</li><li>1965 年 8 月 9 日新加坡退出。</li></ul>`],
   ["T5 主题：Dasar & Pembangunan Negara",`<ul><li>DEB (Dasar Ekonomi Baru) 1971-1990：消除贫穷 + 重组社会。</li><li>Wawasan 2020 (Mahathir, 1991)；Rancangan Malaysia。</li></ul>`],
   ["T5 Bab 1 Kedaulatan Negara",`<ul><li>主权 = 国家拥有的最高、独立的统治权。主权国家要素：<b>领土、人民、政府、主权</b>。</li><li>维护主权：宪法与法律、武装力量与国防、外交、国民团结与社会稳定。</li></ul>`],
   ["T5 Bab 3 Raja Berperlembagaan & Demokrasi Berparlimen",`<ul><li>最高元首 (Yang di-Pertuan Agong) 由统治者会议选出，任期 <b>5 年</b>；一般须依内阁意见行事。</li><li>国会 = 最高元首 + Dewan Negara + Dewan Rakyat。</li><li><b>三权分立</b>：立法 (国会)、行政 (内阁)、司法 (法院)。</li></ul>`],
   ["T5 Bab 4 Sistem Persekutuan",`<ul><li>联邦宪法<b>第九附表</b>分三份清单：<b>联邦清单</b> (国防、外交、财政等)、<b>州清单</b> (土地、伊斯兰事务、马来习俗等)、<b>共同清单</b>。</li><li>强化联邦制的因素：宪法规定权力分配、国家理事会等合作机制。</li></ul>`],
   ["T5 Bab 6 Cabaran Selepas Pembentukan Malaysia",`<ul><li>新加坡 1965 年退出；<b>1969 年 5 月 13 日</b>种族冲突 → MAGERAN 治理 → <b>Rukun Negara (1970 年 8 月 31 日)</b> → DEB (1971)。</li><li>Rukun Negara 五原则：信奉上苍、忠于君主与国家、宪法至上、法治、品德端正。</li></ul>`],
   ["T5 Bab 9 Dasar Luar Malaysia",`<ul><li>原则：中立、不结盟、和平共处、与各国友好。</li><li>东盟 (ASEAN) <b>1967 年 8 月 8 日</b>成立，创始五国：马来西亚、印尼、泰国、菲律宾、新加坡。</li><li>其他：联合国 (1957 年加入)、英联邦、伊斯兰合作组织 (OIC)。</li></ul>`],
   ["答题技巧 (KBAT)",`<ul><li>Kertas 2 的「Huraikan」要有：<b>Isi (point) + Huraian (explain) + Contoh/Bukti</b>。</li><li>「Pada pendapat anda ...」类题一定要给立场 + 理由。</li><li>时间线：背<b>年份主线</b>：1511 → 1786 → 1824 → 1941-45 → 1946 → 1948 → 1955 → 1957 → 1963 → 1969 → 1971 → 1991。</li></ul>`],
   ["T5 Bab 7 Membina Kesejahteraan Negara",`<h4>7.1 Perpaduan dan Integrasi Nasional</h4><ul><li><b>Perpaduan</b>：各族团结和睦；<b>Integrasi nasional</b>：把不同民族与地区融合成一个国家。</li><li>重要因素：<b>Rukun Negara、教育、语言、文化、体育</b>。</li></ul><h4>7.2 Dasar Pendidikan Kebangsaan</h4><ul><li><b>Penyata Razak 1956</b> → <b>Ordinan Pelajaran 1957</b> → <b>Penyata Rahman Talib 1960</b> → <b>Akta Pelajaran 1961</b> → <b>Akta Pendidikan 1996</b>。</li><li><b>Falsafah Pendidikan Kebangsaan (FPK)</b>：目标是培养智力、精神、情感、身体均衡发展的个人。</li></ul><h4>7.3 Bahasa Melayu</h4><ul><li><b>宪法第 152 条</b>规定马来语为国语；<b>Dewan Bahasa dan Pustaka (DBP) 1956</b> 负责推广；用作教学语言和团结的语言。</li></ul><h4>7.4 Dasar Kebudayaan Kebangsaan (1971)</h4><ul><li>三项原则：以<b>本地区原住民文化</b>为基础；吸收<b>其他适合的文化</b>；<b>伊斯兰教</b>是重要成分。</li></ul><h4>7.5 Sukan dan 7.6 Rukun Negara</h4><ul><li>体育：国家队、<b>SUKMA</b>、国际赛事，使各族共同为国争光。</li><li><b>Rukun Negara 1970 年 8 月 31 日</b>宣布：<b>五大原则</b> (信奉上苍、忠于君主与国家、宪法至上、法治、品德端正) 与<b>五大目标</b>。</li></ul><h4>💯 给分对照</h4><ul><li>Jelaskan ... → 每个得分点 = 要点 (isi) + 阐述 (huraian)，3 个要点 → 6 分</li><li>Nyatakan ... → 只写要点，每点 1 分</li><li>具体年份和条文以课本为准</li></ul>`],
   ["T5 Bab 8 Membina Kemakmuran Negara",`<h4>8.1–8.2 DEB 的形成与实施</h4><ul><li>背景：<b>1969 年 5 月 13 日</b>种族冲突，暴露<b>贫富与经济职能不均</b>。</li><li><b>DEB 1971–1990</b>，两大目标：<b>消除贫穷</b> (不分种族)；<b>重组社会</b> (消除以种族区分经济职能)。</li><li>目标：1990 年<b>土著 (Bumiputera) 股权达 30%</b>。</li><li>执行机构：<b>FELDA、MARA、PERNAS、UDA</b> 等。</li></ul><h4>8.3–8.4 DPN 的形成与实施</h4><ul><li><b>DPN 1991–2000</b> 取代 DEB，强调<b>均衡发展</b>、人力资源开发、私人领域角色。</li><li>配合 <b>Wawasan 2020</b> (1991 年提出)。</li></ul><h4>8.5 成就</h4><ul><li>贫穷率大幅下降；中产阶级与土著企业家增加；经济结构从农业转向制造业；</li><li>不足：股权未完全达标，收入差距仍存在。</li></ul><h4>💯 给分对照</h4><ul><li>Jelaskan sebab DEB dilaksanakan → 3 个要点 × (要点 + 阐述)</li><li>Nyatakan dua objektif DEB → 2 分</li></ul>`]
  ]},
 {id:"mat",lang:"en",name:"数学 Matematik",ms:"Matematik",code:"1449",color:"#17795a",ep:"mathematics",core:true,

   ["T4 Bab 1 Fungsi dan Persamaan Kuadratik",`<ul><li>标准形式 \\(ax^{2} + bx + c = 0\\)；求根公式 \\(x = [-b \\pm \\sqrt{b^{2}-4ac}] / 2a\\)。</li><li>判别式：\\(b^{2}-4ac \\gt 0\\) 两个不同实根；\\(= 0\\) 两个相等实根；\\(\\lt 0\\) 无实根。</li><li>两根之和 \\(-\\frac{b}{a}\\)，积 \\(\\frac{c}{a}\\)。</li></ul>`],

   ["T4 Bab 1 Langkah Keselamatan dalam Makmal",`<h4>实验室守则</h4><ul><li>穿<b>实验袍</b>和<b>护目镜</b>，长发束起，不穿凉鞋。</li><li><b>不在实验室吃喝</b>，不尝任何化学品。</li><li>闻气体时用手把气体<b>轻轻扇向鼻子</b>，不直接闻。</li><li>用完化学品<b>盖紧瓶盖</b>放回原处，实验后<b>洗手</b>。</li></ul><h4>危险标志 (Hazard symbols)</h4><ul><li><b>Corrosive 腐蚀性</b>：强酸、强碱，避免接触皮肤和眼睛。</li><li><b>Flammable 易燃</b>：远离火源。</li><li><b>Toxic 有毒</b> / <b>Harmful 有害</b>：不吸入、不入口。</li><li><b>Explosive 爆炸性</b>、<b>Radioactive 放射性</b>、<b>Oxidising 氧化性</b>、<b>Environmental hazard 危害环境</b>。</li></ul><h4>意外处理</h4><ul><li>化学品溅到皮肤：用<b>大量清水冲洗</b>并告诉老师；溅入眼睛：立即用清水冲洗并就医。</li><li>小火：用<b>湿布、沙或灭火毯</b>盖住；电器起火：<b>不可用水</b>，用 CO₂ 灭火器。</li><li>玻璃碎片：<b>不用手捡</b>，用扫帚和畚箕；有毒废物放入指定容器，<b>不倒入水槽</b>。</li></ul><h4>💯 给分对照</h4><ul><li>State three safety rules in the laboratory → 3 分 → 写 3 点</li><li>Name the hazard symbol / Explain what it means → 各 1 分</li><li>Describe what to do when acid spills on skin → 2 分 → 清水冲洗 + 报告老师</li></ul>`],
   ["T4 Bab 2 Bantuan Kecemasan",`<h4>CPR (心肺复苏)</h4><ul><li>先确认<b>环境安全</b>，检查伤者<b>有没有反应</b>，大声<b>呼救并拨 999</b>。</li><li>打开气道 (<b>压额抬颏</b>)，检查呼吸不超过 10 秒。</li><li>胸外按压位置：<b>胸骨下半部</b>，成人深度约 5–6 cm，速率 100–120 次/分钟。</li><li>按压与人工呼吸比例 <b>30 : 2</b>，直到救护人员到达或伤者恢复呼吸。</li></ul><h4>Heimlich 急救法 (气道被异物卡住)</h4><ul><li>站在患者<b>身后</b>，双臂环抱其腰部。</li><li>一手握拳，放在<b>肚脐上方、胸骨下方</b>，另一手握住拳头。</li><li><b>向内、向上</b>快速用力推压，重复到异物排出。</li><li>患者失去反应时改做 CPR。</li></ul><h4>💯 给分对照</h4><ul><li>State the steps of CPR → 4–5 分 → 逐步写（呼救、气道、按压、30:2）</li><li>Describe how to perform the Heimlich manoeuvre → 3 分 → 站后环抱、拳头位置、向内向上</li></ul>`],
   ["T4 Bab 3 Teknik Mengukur Parameter Kesihatan Badan",`<h4>BMI 与腰围</h4><ul><li>\\(\\text{BMI}=\\dfrac{\\text{体重 (kg)}}{\\text{身高 (m)}^2}\\)。</li><li>常用分类：\\(\\lt18.5\\) 偏瘦；\\(18.5\\sim24.9\\) 正常；\\(25\\sim29.9\\) 过重；\\(\\ge30\\) 肥胖。</li><li>腰围过大代表<b>内脏脂肪多</b>，患心血管病、糖尿病的风险高。</li></ul><h4>血压、脉搏、体温</h4><ul><li>血压用<b>血压计</b>量度，成人正常约 \\(120/80\\text{ mmHg}\\)，长期偏高称高血压。</li><li>脉搏数的是<b>每分钟心跳</b>，成人静息时约 60–100 次；运动后升高。</li><li>体温用<b>体温计</b>量度，正常约 \\(37^\\circ\\text{C}\\)。</li></ul><h4>测量的好处</h4><ul><li>及早发现健康问题；</li><li>帮助调整饮食和运动；</li><li>作为就医时的参考数据。</li></ul><h4>💯 给分对照</h4><ul><li>Calculate the BMI → 2–3 分 → 公式 + 代入 + 判断</li><li>State two parameters of body health → 2 分</li><li>数值的具体分界以课本为准</li></ul>`],
   ["T4 Bab 4 Teknologi Hijau untuk Kelestarian Alam Sekitar",`<h4>定义与目的</h4><ul><li><b>绿色科技</b>：开发和应用<b>减少环境破坏、节约资源</b>的科技。</li><li>目的：<b>保护自然资源</b>、<b>减少污染</b>、<b>减缓气候变化</b>、让发展可持续。</li></ul><h4>应用例子</h4><ul><li><b>可再生能源</b>：太阳能、风能、水力、生物燃料，减少化石燃料使用。</li><li><b>废物管理</b>：<b>Reduce、Reuse、Recycle (3R)</b>，生物降解塑料。</li><li><b>节能</b>：LED 灯、节能电器、绿色建筑。</li><li><b>污水处理</b>、净化工业废气。</li></ul><h4>个人与社会的做法</h4><ul><li>少用一次性塑料，自带购物袋；</li><li>节约用水用电，搭乘公共交通；</li><li>支持政府的环保政策和法规。</li></ul><h4>💯 给分对照</h4><ul><li>Give three examples of green technology → 3 分</li><li>Explain how green technology helps the environment → 点 + 解释各 1 分</li></ul>`],
   ["T4 Bab 6 Sokongan, Pergerakan dan Pertumbuhan",`<h4>骨骼与关节</h4><ul><li>骨骼的功能：<b>支撑身体、保护内脏、使身体移动、制造血细胞</b>。</li><li><b>球窝关节</b> (肩、髋)：可向多个方向转动；<b>铰链关节</b> (肘、膝)：只向一个方向弯曲。</li></ul><h4>肌肉与运动</h4><ul><li>骨骼肌成对工作，称为<b>拮抗肌</b>：一块收缩时另一块松弛。</li><li>手臂抬起：<b>二头肌收缩</b>，<b>三头肌松弛</b>；手臂放下则相反。</li><li><b>肌腱</b>连接肌肉与骨，<b>韧带</b>连接骨与骨。</li></ul><h4>植物的支撑与生长</h4><ul><li>草本植物靠细胞的<b>膨压</b>与<b>木质部</b>支撑；木本植物靠<b>木质化的茎</b>支撑。</li><li>生长可用<b>身高或质量</b>的变化来测量；生长曲线呈<b>S 形</b>。</li></ul><h4>💯 给分对照</h4><ul><li>Explain how the arm is raised → 3–4 分 → 二头肌收缩、三头肌松弛、骨杠杆</li><li>State three functions of the skeleton → 3 分</li></ul>`],
   ["T4 Bab 7 Koordinasi Badan",`<h4>神经系统</h4><ul><li><b>中枢神经系统</b> = 脑 + 脊髓；<b>外周神经系统</b> = 其余神经。</li><li><b>反射弧</b>：刺激 → 感受器 → 感觉神经元 → 脊髓 → 运动神经元 → 效应器 → 反应。</li><li>反射动作<b>快速且不经大脑思考</b>，用于保护身体。</li></ul><h4>激素</h4><ul><li>激素由<b>内分泌腺</b>分泌，经<b>血液</b>运到目标器官。</li><li><b>胰岛素</b>使血糖<b>下降</b>，<b>胰高血糖素</b>使血糖<b>上升</b>。</li></ul><h4>植物激素与向性</h4><ul><li><b>生长素 (auxin)</b> 聚集在背光一侧，使该侧细胞伸长更快，茎因此<b>向光弯曲</b>。</li></ul><h4>神经与激素的比较</h4><ul><li>神经：传递<b>电信号</b>、速度<b>快</b>、作用<b>短暂</b>；激素：靠<b>血液</b>传递、速度<b>慢</b>、作用<b>持久</b>。</li></ul><h4>💯 给分对照</h4><ul><li>Compare nervous and hormonal coordination → 6 分 → 3 个对比点</li><li>State the pathway of a reflex action → 4 分</li></ul>`],
   ["T4 Bab 8 Unsur dan Bahan",`<h4>物质分类</h4><ul><li><b>元素</b>只含一种原子；<b>化合物</b>由两种以上元素<b>化学结合</b>；<b>混合物</b>只是物理混合，可用物理方法分离。</li></ul><h4>周期表</h4><ul><li>元素按<b>质子数</b>递增排列；<b>族</b> (纵列) 的化学性质相似，<b>周期</b> (横行)。</li><li><b>第 1 族碱金属</b>：质软、密度小；与水反应生成<b>碱 + 氢气</b>；往下反应越剧烈。</li><li><b>第 17 族卤素</b>：往下颜色变深，反应性<b>减弱</b>。</li><li><b>第 18 族惰性气体</b>：原子外层电子已满，<b>很稳定</b>，以单原子存在。</li><li><b>过渡元素</b>：坚硬、熔点高、可作<b>催化剂</b>、化合物常有颜色。</li></ul><h4>💯 给分对照</h4><ul><li>State two properties of Group 1 elements → 2 分</li><li>Explain why Group 18 elements are unreactive → 2 分 → 点 + 解释</li><li>Compare element, compound and mixture → 3 分</li></ul>`],
   ["T4 Bab 9 Bahan Kimia dalam Industri",`<h4>合金 (alloy)</h4><ul><li>合金是金属与其他元素的混合物，<b>比纯金属更硬、更耐腐蚀</b>。</li><li>原因：<b>不同大小的原子</b>打乱了排列，阻止原子层滑动。</li><li>例子：<b>黄铜 = 铜 + 锌</b>；<b>青铜 = 铜 + 锡</b>；<b>钢 = 铁 + 碳</b>。</li></ul><h4>其他工业材料</h4><ul><li><b>聚合物</b> (塑料、橡胶)：轻、不导电、易成型。</li><li><b>玻璃</b>：透明、耐化学品、易碎；<b>陶瓷</b>：耐高温、坚硬但易碎。</li><li><b>复合材料</b>：两种以上材料结合，如钢筋混凝土、玻璃纤维，兼具各自优点。</li></ul><h4>💯 给分对照</h4><ul><li>Explain why alloy is harder than pure metal → 2–3 分</li><li>Give one example and one use of an alloy → 2 分</li><li>课本里具体材料清单以课本为准</li></ul>`],
   ["T4 Bab 10 Bahan Kimia dalam Perubatan dan Kesihatan",`<h4>药物种类</h4><ul><li><b>止痛药 (analgesic)</b>：缓解疼痛，如对乙酰氨基酚 (paracetamol)。</li><li><b>抗生素 (antibiotic)</b>：杀死或抑制<b>细菌</b>，如青霉素；<b>对病毒无效</b>。</li><li><b>抗真菌药</b>、<b>心理治疗药 (psychotic)</b>、<b>激素类药</b>等各有用途。</li></ul><h4>正确用药</h4><ul><li><b>遵照医生或药剂师的指示</b>，不自己增减剂量。</li><li>抗生素要<b>吃完整个疗程</b>，否则细菌会产生<b>抗药性</b>。</li><li>注意<b>副作用</b>与过敏；药物放在儿童拿不到的地方。</li></ul><h4>健康与化妆品</h4><ul><li>化妆品含有化学成分，使用前看<b>成分与有效日期</b>，过敏者要小心。</li></ul><h4>💯 给分对照</h4><ul><li>State three types of medicine and their functions → 3–6 分</li><li>Explain why antibiotics must be completed → 2 分 → 点 + 解释</li></ul>`],
   ["T4 Bab 11 Daya dan Gerakan",`<h4>运动量</h4><ul><li>速度 \\(v=\\dfrac{s}{t}\\)；加速度 \\(a=\\dfrac{v-u}{t}\\)。</li><li><b>距离–时间图</b>：斜率 = 速度；水平线 = 静止。</li><li><b>速度–时间图</b>：斜率 = 加速度；曲线下的面积 = 位移。</li></ul><h4>牛顿运动定律</h4><ul><li><b>第一定律 (惯性)</b>：物体保持静止或匀速运动，除非受外力。</li><li><b>第二定律</b>：\\(F=ma\\)。</li><li><b>第三定律</b>：作用力与反作用力<b>大小相等、方向相反</b>。</li></ul><h4>应用</h4><ul><li>安全带、头枕、气囊是为了<b>减小惯性造成的伤害</b>；</li><li>摩擦力：增大 (轮胎纹路) 或减小 (润滑油) 视用途而定。</li></ul><h4>💯 给分对照</h4><ul><li>Explain why seat belts are needed → 2–3 分 → 惯性 + 减少前冲</li><li>Calculate the acceleration → 2 分 → 公式 + 答案 (含单位)</li></ul>`],
   ["T4 Bab 12 Tenaga Nuklear",`<h4>核反应</h4><ul><li><b>核裂变</b>：重核 (如 U-235) 被中子击中后分裂，释放大量能量并引起<b>链式反应</b>。</li><li><b>核聚变</b>：轻核结合成较重的核并释放能量，如太阳的能量来源。</li></ul><h4>辐射</h4><ul><li>三种射线：<b>α</b> (氦核)、<b>β</b> (电子)、<b>γ</b> (电磁波)。</li><li>穿透力：<b>γ &gt; β &gt; α</b>；电离能力：<b>α &gt; β &gt; γ</b>。</li><li><b>半衰期</b>：放射性原子数目减少一半所需的时间。</li></ul><h4>用途与危害</h4><ul><li>用途：<b>医疗</b> (癌症治疗、示踪)、<b>碳-14 测年</b>、<b>食物与器械杀菌</b>、<b>发电</b>。</li><li>危害：辐射病、癌症、基因突变；防护：<b>铅屏蔽、缩短接触时间、保持距离</b>。</li><li>马来西亚有研究用反应堆 <b>RTP (Reaktor TRIGA PUSPATI)</b>。</li></ul><h4>💯 给分对照</h4><ul><li>Compare fission and fusion → 4 分</li><li>State three uses and two dangers of radioisotopes → 5 分</li><li>Explain the half-life → 2 分</li></ul>`],
   ["T5 Bab 1 Mikroorganisma",`<h4>种类</h4><ul><li><b>细菌、真菌、病毒、原生生物、藻类</b>；病毒没有细胞结构，只能在宿主细胞内繁殖。</li></ul><h4>有益与有害</h4><ul><li>有益：<b>酵母</b>发酵面包与酒、<b>乳酸菌</b>制酸奶、制造抗生素、分解有机物。</li><li>有害：引起疾病——细菌 (霍乱、伤寒)、病毒 (流感、HIV)、原生生物 (疟疾)、真菌 (脚癣)；使食物变质。</li></ul><h4>生长条件与控制</h4><ul><li>生长需要<b>水分、适当温度、养分、适当 pH</b>。</li><li>控制方法：<b>杀菌 (sterilisation)</b>、<b>巴氏消毒</b>、<b>消毒剂</b>、<b>讲卫生</b>、<b>接种疫苗</b>。</li><li>疾病传播途径：<b>空气、水与食物、接触、媒介 (蚊)</b>。</li></ul><h4>💯 给分对照</h4><ul><li>State three harmful effects of microorganisms → 3 分</li><li>Explain how the spread of disease can be prevented → 3–4 分</li></ul>`],
   ["T5 Bab 2 Nutrisi dan Teknologi Makanan",`<h4>营养素</h4><ul><li><b>碳水化合物</b>供能量；<b>蛋白质</b>生长与修补；<b>脂肪</b>储能与保暖；<b>维生素、矿物质</b>调节身体功能；<b>纤维</b>帮助排便；<b>水</b>是溶剂与运输介质。</li><li>能量：碳水化合物和蛋白质约 <b>17 kJ/g</b>，脂肪约 <b>37 kJ/g</b>。</li></ul><h4>食物保存与添加剂</h4><ul><li>保存法：<b>冷藏、罐装、干燥、盐渍、糖渍、酸渍</b>——原理都是<b>抑制微生物生长</b>。</li><li>添加剂：<b>防腐剂</b>、<b>抗氧化剂</b>、<b>香料</b>、<b>色素</b>、<b>乳化剂</b>。</li></ul><h4>均衡饮食</h4><ul><li>按<b>食物金字塔</b>：适量吃谷物，多吃蔬果，少盐少糖少油；注意年龄、性别与活动量的需求。</li></ul><h4>💯 给分对照</h4><ul><li>State the functions of three nutrients → 3 分</li><li>Explain how salting preserves food → 2 分 → 渗透、抑制微生物</li></ul>`],
   ["T5 Bab 3 Kelestarian Alam Sekitar",`<h4>生态系统与能量</h4><ul><li>食物链从<b>生产者</b>开始；能量沿营养级<b>逐级减少</b> (约 10% 传到下一级)。</li><li><b>食物网</b>由多条食物链交织而成，物种越多越稳定。</li></ul><h4>生物多样性与威胁</h4><ul><li>生物多样性：<b>基因、物种、生态系统</b>的多样性。</li><li>威胁：<b>砍伐森林、污染、过度捕猎、气候变化、外来物种</b>。</li></ul><h4>保护措施</h4><ul><li>订立<b>法律</b>与设立<b>国家公园、保护区</b>；</li><li>推广 <b>3R</b> 与绿色科技；</li><li>加强<b>教育与宣传</b>，鼓励社区参与。</li></ul><h4>💯 给分对照</h4><ul><li>Explain why energy decreases along a food chain → 2–3 分</li><li>State three ways to conserve biodiversity → 3 分</li></ul>`],
   ["T5 Bab 8 Daya dan Tekanan",`<h4>压强</h4><ul><li>\\(P=\\dfrac{F}{A}\\)：受力面积越小，压强越大 (刀刃要薄)。</li><li>液体压强 \\(P=h\\rho g\\)：深度越深，压强越大 (水坝底部较厚)。</li><li>大气压约 \\(101\\text{ kPa}\\)，可用<b>气压计</b>量度。</li></ul><h4>原理</h4><ul><li><b>帕斯卡原理</b>：密闭液体中压强向各方向<b>等值传递</b>，\\(\\dfrac{F_1}{A_1}=\\dfrac{F_2}{A_2}\\)，用于<b>液压千斤顶、刹车</b>。</li><li><b>阿基米德原理</b>：浮力 = 物体排开液体的重量。</li><li><b>伯努利原理</b>：流速越大，压强越小 (机翼升力)。</li></ul><h4>💯 给分对照</h4><ul><li>Explain how a hydraulic jack works → 3 分</li><li>Calculate the pressure → 2 分 → 公式 + 答案 (含单位)</li></ul>`],
   ["T5 Bab 9 Teknologi Angkasa",`<h4>太阳系与探索</h4><ul><li>太阳系八大行星：水、金、地、火、木、土、天王、海王。</li><li>火箭靠<b>牛顿第三定律</b>：向后喷出气体，获得向前的推力。</li></ul><h4>人造卫星</h4><ul><li><b>通信卫星</b> (电视、电话)、<b>气象卫星</b>、<b>导航卫星 (GPS)</b>、<b>遥感卫星</b> (监测环境)。</li><li>太空探测器、空间站 (ISS) 用于科学研究。</li></ul><h4>好处与挑战</h4><ul><li>好处：通信、预报天气、导航、科学与医学研究；</li><li>挑战：<b>成本高</b>、<b>太空垃圾</b>、风险大。</li><li>马来西亚：2007 年<b>首位太空人 Sheikh Muszaphar</b> 登上国际空间站。</li></ul><h4>💯 给分对照</h4><ul><li>State three uses of artificial satellites → 3 分</li><li>Explain how a rocket moves upward → 2 分</li></ul>`]
  ]},

 {id:"am",lang:"en",name:"附加数学 Add Maths",ms:"Matematik Tambahan",code:"3472",color:"#c25e00",ep:"additional-mathematics",
  fmt:"Kertas 1 (2 小时，80 分)：A 12 题 64 分 (全答)、B 3 题选答 2 题 16 分。Kertas 2 (2 小时 30 分钟，100 分)：A 7 题 50 分 (全答)、B 4 题选答 3 题 30 分、C 4 题选答 2 题 20 分。",

   ["T4 Bab 1 Fungsi",`<h4>重点公式与要点</h4><ul><li>垂直线测试：垂直线最多交图像于一点，才是函数。</li><li>定义域、陪域、值域；\\(x\\) 的像为 \\(f(x)\\)。</li><li>绝对值函数：\\(|x|=x\\;(x\\ge0)\\)，\\(|x|=-x\\;(x\\lt0)\\)，图像呈 V 形。</li><li>复合函数：\\(fg(x)=f\\big(g(x)\\big)\\)，先 \\(g\\) 后 \\(f\\)；一般 \\(fg\\ne gf\\)。</li><li>反函数 \\(f^{-1}\\)：设 \\(y=f(x)\\)，用 \\(y\\) 表示 \\(x\\)，再把 \\(y\\) 换成 \\(x\\)。</li><li>\\(ff^{-1}(x)=f^{-1}f(x)=x\\)；\\(f\\) 与 \\(f^{-1}\\) 的图像关于 \\(y=x\\) 对称；只有一对一函数有反函数。</li><li>\\((fg)^{-1}=g^{-1}f^{-1}\\)。</li></ul><h4>例题详解</h4><p>已知 \\(f(x)=2x+3\\)，\\(g(x)=x^2\\)，求 \\(fg(x)\\)、\\(gf(x)\\) 与 \\(f^{-1}(x)\\)。</p><ol><li>\\(fg(x)=f(x^2)=2x^2+3\\)</li><li>\\(gf(x)=g(2x+3)=(2x+3)^2\\)</li><li>令 \\(y=2x+3\\)，则 \\(x=\\dfrac{y-3}{2}\\)</li><li>所以 \\(f^{-1}(x)=\\dfrac{x-3}{2}\\)</li></ol><h4>解题步骤</h4><ul><li>求 \\(fg(x)\\)：把 \\(g(x)\\) 整个代入 f 的 x。</li><li>已知 \\(fg(x)\\) 求 \\(f(x)\\)：令 \\(u=g(x)\\)，解出 x（用 u 表示），代回。</li><li>求反函数：\\(y=f(x) \\to\\) 换成以 y 表示 x → 把 y 换成 x → 写出 \\(f^{-1}(x)\\)。</li><li>含绝对值：分情况（\\(x\\ge 0\\) 与 x<0）去绝对值。</li></ul><h4>常见错误</h4><ul><li>fg 与 gf 次序写反。</li><li>求反函数时忘了交换 x 与 y。</li><li>绝对值方程解出后不代回检验。</li></ul><h4>考试题型与得分点</h4><ul><li>常考：给出 f、g 求 fg、gf 与反函数；已知 fg 求 f 或 g。</li><li>得分点：代入过程要写出（方法分），最后化简（答案分）。</li></ul><h4>速记</h4><p>复合从里往外代：先 g 后 f；反函数：换位置再解。</p>`],
   ["T4 Bab 2 Fungsi Kuadratik",`<h4>重点公式与要点</h4><ul><li>求根公式：\\(x=\\dfrac{-b\\pm\\sqrt{b^2-4ac}}{2a}\\)。</li><li>配方法：\\(x^2+bx=\\left(x+\\dfrac b2\\right)^2-\\dfrac{b^2}{4}\\)。</li><li>根与系数：\\(\\alpha+\\beta=-\\dfrac ba\\)，\\(\\alpha\\beta=\\dfrac ca\\)；由根构造方程 \\(x^2-(\\alpha+\\beta)x+\\alpha\\beta=0\\)。</li><li>判别式 \\(b^2-4ac\\)：\\(\\gt0\\) 两不等实根；\\(=0\\) 两相等根（相切）；\\(\\lt0\\) 无实根。</li><li>二次不等式（\\(\\alpha\\lt\\beta\\)）：\\((x-\\alpha)(x-\\beta)\\lt0\\Rightarrow\\alpha\\lt x\\lt\\beta\\)；\\((x-\\alpha)(x-\\beta)\\gt0\\Rightarrow x\\lt\\alpha\\) 或 \\(x\\gt\\beta\\)。</li><li>顶点式：\\(f(x)=a(x-h)^2+k\\)，顶点 \\((h,k)\\)，对称轴 \\(x=h\\)；\\(a\\gt0\\) 有最小值 \\(k\\)，\\(a\\lt0\\) 有最大值 \\(k\\)。</li><li>直线与曲线联立后看判别式：\\(\\gt0\\) 相交，\\(=0\\) 相切，\\(\\lt0\\) 不相交。</li></ul><h4>例题详解</h4><p>方程 \\(x^2+kx+9=0\\) 有两个相等的根，求 \\(k\\)。</p><ol><li>相等根：\\(b^2-4ac=0\\)</li><li>\\(k^2-4(1)(9)=0\\Rightarrow k^2=36\\)</li><li>所以 \\(k=\\pm6\\)</li></ol><h4>解题步骤</h4><ul><li>不等式：先因式分解求临界值 → 画草图 → 按图取区间。</li><li>求参数范围：写出判别式条件，再解关于 k 的不等式。</li><li>求顶点：配方，或 \\(h=-b/2a\\)，\\(k=f(h)\\)。</li></ul><h4>常见错误</h4><ul><li>\\(a\\lt 0\\) 时开口向下，区间取错。</li><li>混淆 \\(\\gt 0\\) 与 \\(\\ge 0\\) 的端点。</li><li>求 k 范围时判别式条件写反。</li></ul><h4>考试题型与得分点</h4><ul><li>常考：判别式求 k 的范围；二次不等式；顶点式与图像；直线与曲线相切。</li><li>得分点：写出判别式条件（M），解出 k 的范围（A）。</li></ul><h4>速记</h4><p>判别式三态：大两根、等一根、小无根。</p>`],
   ["T4 Bab 3 Sistem Persamaan",`<h4>重点公式与要点</h4><ul><li>三元一次方程组：用消元法先消去同一个变量，化成二元方程组再解。</li><li>线性＋非线性联立：由线性式得 \\(y=\\cdots\\)（或 \\(x=\\cdots\\)），代入非线性式，化成 \\(ax^2+bx+c=0\\)。</li><li>应用题：设变量列方程，解后检验是否合题意。</li></ul><h4>例题详解</h4><p>解联立方程 \\(x+y=5\\)，\\(x^2+y^2=13\\)。</p><ol><li>由 \\(y=5-x\\) 代入：\\(x^2+(5-x)^2=13\\)</li><li>\\(2x^2-10x+12=0\\Rightarrow x^2-5x+6=0\\)</li><li>\\((x-2)(x-3)=0\\)，\\(x=2\\) 或 \\(3\\)</li><li>对应 \\(y=3\\) 或 \\(2\\)；解为 \\((2,3)\\)、\\((3,2)\\)</li></ol><h4>解题步骤</h4><ul><li>三元：对 ①②、②③ 各消去同一变量（如 z）→ 得二元方程组 → 解 x,y → 回代求 z。</li><li>线性＋非线性：代入后整理成 \\(ax^{2}+bx+c=0\\)，解出 x，再回代求 y。</li><li>解要成对写：(x,y)。</li></ul><h4>常见错误</h4><ul><li>代入时括号展开出错，如 \\((2x+1)^{2}\\) 误写成 \\(4x^{2}+1\\)。</li><li>只解出 x 就停止，忘了求 y。</li><li>解出的值不合题意（如长度为负）却未舍去。</li></ul><h4>考试题型与得分点</h4><ul><li>常考：线性＋非线性联立（几乎每年）；三元一次方程组较少单独出大题。</li><li>得分点：代入并整理成二次方程（M），解出 x、y 且成对写（A）。</li></ul><h4>速记</h4><p>代入后整理成二次，x、y 要成对写。</p>`],
   ["T4 Bab 4 Indeks, Surd dan Logaritma",`<h4>重点公式与要点</h4><ul><li>指数：\\(a^m\\times a^n=a^{m+n}\\)，\\(a^m\\div a^n=a^{m-n}\\)，\\((a^m)^n=a^{mn}\\)。</li><li>\\(a^{-n}=\\dfrac1{a^n}\\)，\\(a^{m/n}=\\sqrt[n]{a^m}\\)，\\(a^0=1\\)。</li><li>Surd：\\(\\sqrt a\\times\\sqrt b=\\sqrt{ab}\\)，\\(\\dfrac{\\sqrt a}{\\sqrt b}=\\sqrt{\\dfrac ab}\\)；有理化 \\(\\dfrac1{a+\\sqrt b}=\\dfrac{a-\\sqrt b}{a^2-b}\\)。</li><li>对数：\\(\\log_a a=1\\)，\\(\\log_a1=0\\)；\\(\\log_a(xy)=\\log_ax+\\log_ay\\)；\\(\\log_a\\dfrac xy=\\log_ax-\\log_ay\\)；\\(\\log_ax^n=n\\log_ax\\)。</li><li>换底：\\(\\log_ab=\\dfrac{\\log_cb}{\\log_ca}\\)，\\(\\log_ab=\\dfrac1{\\log_ba}\\)；\\(a^{\\log_ax}=x\\)。</li></ul><h4>例题详解</h4><p>解 \\(\\log_2(x+3)+\\log_2x=2\\)。</p><ol><li>\\(\\log_2[x(x+3)]=2\\Rightarrow x(x+3)=4\\)</li><li>\\(x^2+3x-4=0\\Rightarrow(x+4)(x-1)=0\\)</li><li>\\(x=-4\\)（舍去，真数须 \\(\\gt0\\)）或 \\(x=1\\)</li><li>答：\\(x=1\\)</li></ol><h4>解题步骤</h4><ul><li>解指数方程：化成同底，或两边取对数。</li><li>解对数方程：化为 logₐ(…\\()=\\log _{a}(\\)…) 或写成指数式；<b>必须检验真数＞0</b>。</li><li>有理化：分子分母同乘共轭式。</li></ul><h4>常见错误</h4><ul><li>把 \\(\\log (x+y)\\) 拆成 log x + log y。</li><li>\\((a+b)^{n}\\) 误当成 \\(a^{n}+b^{n}\\)。</li><li>解对数方程后不检验，保留了使真数为负的根。</li></ul><h4>考试题型与得分点</h4><ul><li>常考：解指数、对数方程；换底；surd 有理化。</li><li>得分点：合并对数（M），舍去不合真数的根（A）。</li></ul><h4>速记</h4><p>对数方程必检验：真数要大于零。</p>`],
   ["T4 Bab 5 Janjang",`<h4>重点公式与要点</h4><ul><li>AP：\\(T_n=a+(n-1)d\\)；\\(S_n=\\dfrac n2\\left[2a+(n-1)d\\right]=\\dfrac n2(a+l)\\)。</li><li>GP：\\(T_n=ar^{n-1}\\)；\\(S_n=\\dfrac{a(1-r^n)}{1-r}=\\dfrac{a(r^n-1)}{r-1}\\)（\\(r\\ne1\\)）。</li><li>无穷等比：\\(S_\\infty=\\dfrac a{1-r}\\)，条件 \\(-1\\lt r\\lt1\\)。</li><li>\\(T_n=S_n-S_{n-1}\\)（\\(n\\ge2\\)）。</li><li>循环小数可用 \\(S_\\infty\\) 化为分数。</li></ul><h4>例题详解</h4><p>GP 首项 \\(a=8\\)，公比 \\(r=\\dfrac12\\)，求 \\(S_\\infty\\) 与 \\(T_5\\)。</p><ol><li>\\(|r|=\\tfrac12\\lt1\\)，故 \\(S_\\infty\\) 存在</li><li>\\(S_\\infty=\\dfrac{8}{1-\\frac12}=16\\)</li><li>\\(T_5=8\\left(\\tfrac12\\right)^4=\\tfrac12\\)</li></ol><h4>解题步骤</h4><ul><li>先判断是 AP（差相同）还是 GP（比相同）。</li><li>求使 Tₙ 或 Sₙ 超过某值的最小 n：列不等式，GP 用对数。</li><li>对数不等式两边除以负数（如 \\(\\log r\\lt 0\\)）时，不等号要反向。</li></ul><h4>常见错误</h4><ul><li>把 n 与 n−1 搞混。</li><li>用 \\(S\\infty\\) 公式却不检查 \\(|r|\\lt 1\\)。</li><li>对数不等式忘了变号。</li></ul><h4>考试题型与得分点</h4><ul><li>常考：AP、GP 求项数与和；无穷等比；循环小数；应用题（复利、递减）。</li><li>得分点：写出公式并代入（M），求 n 时用对数（A）。</li></ul><h4>速记</h4><p>先判断差还是比再选公式；无穷和先看 \\(|r|\\lt1\\)。</p>`],
   ["T4 Bab 6 Hukum Linear",`<h4>重点公式与要点</h4><ul><li>目标：化成 \\(Y=mX+c\\)，用直线求常数。</li><li>\\(y=ax^2+b\\)：\\(Y=y\\)，\\(X=x^2\\)；\\(y=\\dfrac ax+b\\)：\\(Y=y\\)，\\(X=\\dfrac1x\\)。</li><li>\\(y=ab^x\\)：\\(\\lg y=(\\lg b)x+\\lg a\\)，\\(m=\\lg b\\)，\\(c=\\lg a\\)，故 \\(b=10^m\\)，\\(a=10^c\\)。</li><li>斜率 \\(m=\\dfrac{y_2-y_1}{x_2-x_1}\\)；\\(c\\) 为 \\(Y\\) 轴截距。</li></ul><h4>例题详解</h4><p>\\(y=ab^x\\) 的 \\(\\lg y\\)–\\(x\\) 图为直线，过 \\((0,1)\\) 与 \\((2,3)\\)，求 \\(a,b\\)。</p><ol><li>\\(c=1\\Rightarrow\\lg a=1\\Rightarrow a=10\\)</li><li>\\(m=\\dfrac{3-1}{2-0}=1\\Rightarrow\\lg b=1\\Rightarrow b=10\\)</li></ol><h4>解题步骤</h4><ul><li>先变形，写出 Y、X、m、c 各是什么。</li><li>在直线上取相距较远的两点（不要取数据点，除非恰在线上）。</li><li>求出 m、c 后，还原出原来的常数。</li></ul><h4>常见错误</h4><ul><li>lg 求出的 m、c 忘了取反对数。</li><li>轴不从 0 开始时截距读错。</li><li>取点太近，斜率误差大。</li></ul><h4>考试题型与得分点</h4><ul><li>常考：由数据画图（图纸题）；读斜率、截距求常数。</li><li>得分点：变形正确（M）、取点算 m 与 c（M）、还原常数（A）。</li></ul><h4>速记</h4><p>先变形，再对号：Y、X、m、c 各是谁。</p>`],
   ["T4 Bab 7 Geometri Koordinat",`<h4>重点公式与要点</h4><ul><li>距离 \\(d=\\sqrt{(x_2-x_1)^2+(y_2-y_1)^2}\\)；中点 \\(\\left(\\dfrac{x_1+x_2}2,\\dfrac{y_1+y_2}2\\right)\\)。</li><li>内分点（\\(m:n\\)）：\\(\\left(\\dfrac{nx_1+mx_2}{m+n},\\dfrac{ny_1+my_2}{m+n}\\right)\\)。</li><li>斜率 \\(m=\\dfrac{y_2-y_1}{x_2-x_1}\\)；点斜式 \\(y-y_1=m(x-x_1)\\)；截距式 \\(\\dfrac xa+\\dfrac yb=1\\)。</li><li>平行 \\(m_1=m_2\\)；垂直 \\(m_1m_2=-1\\)。</li><li>三角形面积：\\(\\dfrac12\\left|x_1y_2+x_2y_3+x_3y_1-x_2y_1-x_3y_2-x_1y_3\\right|\\)。</li><li>轨迹：设 \\(P(x,y)\\)，按条件列方程；\\(PA:PB=m:n\\) 时平方化简。</li></ul><h4>例题详解</h4><p>\\(A(1,2)\\)，\\(B(5,6)\\)，求线段 \\(AB\\) 的垂直平分线方程。</p><ol><li>中点 \\((3,4)\\)，\\(m_{AB}=\\dfrac{6-2}{5-1}=1\\)</li><li>垂直平分线斜率 \\(-1\\)</li><li>\\(y-4=-(x-3)\\Rightarrow y=-x+7\\)</li></ol><h4>解题步骤</h4><ul><li>求直线方程：先求斜率，再用点斜式。</li><li>面积：按顺序写出各点坐标，交叉相乘，取绝对值的一半。</li><li>轨迹：用距离公式列式 → 两边平方 → 整理。</li></ul><h4>常见错误</h4><ul><li>内分比 m:n 与 n:m 搞反。</li><li>面积法顶点次序混乱。</li><li>垂直斜率忘了变号取倒数。</li></ul><h4>考试题型与得分点</h4><ul><li>常考：直线方程、面积、分点、轨迹方程（距离比）。</li><li>得分点：公式代入（M），化简成标准式（A）。</li></ul><h4>速记</h4><p>平行斜率等，垂直斜率乘积负一。</p>`],
   ["T4 Bab 8 Vektor",`<h4>重点公式与要点</h4><ul><li>模 \\(|\\mathbf a|=\\sqrt{x^2+y^2}\\)；单位向量 \\(\\hat{\\mathbf a}=\\dfrac{\\mathbf a}{|\\mathbf a|}\\)。</li><li>用基向量：\\(\\mathbf a=x\\mathbf i+y\\mathbf j\\)。</li><li>\\(\\overrightarrow{AB}=\\overrightarrow{OB}-\\overrightarrow{OA}\\)（终点减起点）。</li><li>平行：\\(\\mathbf a=k\\mathbf b\\)；\\(A,B,C\\) 共线 \\(\\Leftrightarrow\\overrightarrow{AB}=k\\overrightarrow{BC}\\)。</li><li>求交点：用两条路径表示同一向量，比较 \\(\\mathbf i\\)、\\(\\mathbf j\\) 的系数。</li></ul><h4>例题详解</h4><p>\\(\\overrightarrow{OA}=2\\mathbf i+\\mathbf j\\)，\\(\\overrightarrow{OB}=5\\mathbf i+4\\mathbf j\\)，求 \\(|\\overrightarrow{AB}|\\)。</p><ol><li>\\(\\overrightarrow{AB}=3\\mathbf i+3\\mathbf j\\)</li><li>\\(|\\overrightarrow{AB}|=\\sqrt{9+9}=3\\sqrt2\\)</li></ol><h4>解题步骤</h4><ul><li>先写出位置向量，再用 \\(⃗AB=⃗OB-⃗OA\\) 求所需向量。</li><li>共线问题：证明 ⃗AB 与 ⃗BC 成倍数。</li><li>比较系数时，i 与 j 要分开写两个方程。</li></ul><h4>常见错误</h4><ul><li>向量方向写反（⃗AB 与 ⃗BA 差一个负号）。</li><li>比较系数时 i、j 混在一起。</li><li>单位向量忘了除以模。</li></ul><h4>考试题型与得分点</h4><ul><li>常考：三角形/平行四边形中的向量表示；共线证明；求交点比例。</li><li>得分点：向量表示正确（M）、比较系数列方程（M）、求出系数（A）。</li></ul><h4>速记</h4><p>AB 等于 OB 减 OA；共线就是成倍数。</p>`],
   ["T4 Bab 9 Penyelesaian Segi Tiga",`<h4>重点公式与要点</h4><ul><li>正弦定理：\\(\\dfrac a{\\sin A}=\\dfrac b{\\sin B}=\\dfrac c{\\sin C}\\)。</li><li>余弦定理：\\(a^2=b^2+c^2-2bc\\cos A\\)；\\(\\cos A=\\dfrac{b^2+c^2-a^2}{2bc}\\)。</li><li>面积：\\(\\dfrac12ab\\sin C\\)。</li><li>模糊情形（SSA）：可能有两个三角形，\\(B\\) 与 \\(180^\\circ-B\\)。</li></ul><h4>例题详解</h4><p>\\(\\triangle ABC\\) 中 \\(a=7\\)，\\(b=5\\)，\\(C=60^\\circ\\)，求 \\(c\\)。</p><ol><li>\\(c^2=7^2+5^2-2(7)(5)\\cos60^\\circ\\)</li><li>\\(=49+25-35=39\\)</li><li>\\(c=\\sqrt{39}\\approx6.24\\)</li></ol><h4>解题步骤</h4><ul><li>已知两角一边 / 两边及一对角 → 正弦；已知三边 / 两边夹角 → 余弦。</li><li>SSA 时检查 B 和 \\(180^{\\circ}-B\\) 是否都使内角和小于 \\(180^{\\circ}\\)。</li><li>计算器要设在 DEG 模式。</li></ul><h4>常见错误</h4><ul><li>SSA 只写了一个解。</li><li>用错对边（边与其对角要对应）。</li><li>计算器误设成弧度。</li></ul><h4>考试题型与得分点</h4><ul><li>常考：两定理综合、面积、模糊情形、实际应用。</li><li>得分点：选对定理（M）、代入（M）、答案取到要求位数（A）。</li></ul><h4>速记</h4><p>两角一边用正弦，三边或夹角用余弦。</p>`],
   ["T4 Bab 10 Nombor Indeks",`<h4>重点公式与要点</h4><ul><li>指数：\\(I=\\dfrac{Q_1}{Q_0}\\times100\\)。</li><li>综合指数：\\(\\bar I=\\dfrac{\\sum I_iw_i}{\\sum w_i}\\)。</li><li>换基：\\(I_{2/0}=\\dfrac{I_{2/1}\\times I_{1/0}}{100}\\)。</li><li>由指数求价格：\\(Q_1=\\dfrac{I\\times Q_0}{100}\\)。</li></ul><h4>例题详解</h4><p>某物 2023 年价格 RM 50，2024 年 RM 60，求价格指数。</p><ol><li>\\(I=\\dfrac{60}{50}\\times100=120\\)</li><li>指数 120 表示比基年上涨 20%</li></ol><h4>解题步骤</h4><ul><li>先分清基年与现年。</li><li>综合指数：每个项目的指数乘其权重，再求和除以权重总和。</li><li>可由综合指数反求缺失的权重或指数。</li></ul><h4>常见错误</h4><ul><li>把基年与现年颠倒。</li><li>权重与对应项目错配。</li><li>忘了乘以 100。</li></ul><h4>考试题型与得分点</h4><ul><li>常考：综合指数求权重或指数；换基；价格上涨百分比。</li><li>得分点：公式代入（M），结果（A）。</li></ul><h4>速记</h4><p>现年比基年乘一百；综合指数是加权平均。</p>`],
   ["T5 Bab 1 Sukatan Membulat",`<h4>重点公式与要点</h4><ul><li>\\(1\\text{ rad}=\\dfrac{180^\\circ}{\\pi}\\approx57.3^\\circ\\)；\\(\\theta(\\text{rad})=\\theta^\\circ\\times\\dfrac{\\pi}{180}\\)。</li><li>弧长 \\(s=r\\theta\\)；扇形面积 \\(A=\\dfrac12r^2\\theta\\)（\\(\\theta\\) 为弧度）。</li><li>弦长 \\(=2r\\sin\\dfrac\\theta2\\)；扇形周长 \\(=r\\theta+2r\\)。</li><li>弓形面积 \\(=\\dfrac12r^2(\\theta-\\sin\\theta)\\)。</li></ul><h4>例题详解</h4><p>半径 6 cm、圆心角 \\(\\dfrac\\pi3\\) 的扇形，求弧长与面积。</p><ol><li>\\(s=6\\times\\dfrac\\pi3=2\\pi\\approx6.28\\text{ cm}\\)</li><li>\\(A=\\dfrac12(6)^2\\dfrac\\pi3=6\\pi\\approx18.85\\text{ cm}^2\\)</li></ol><h4>解题步骤</h4><ul><li>第一步：把角度统一转成弧度。</li><li>复杂图形：拆成扇形、三角形、弓形，分别计算再加减。</li><li>求半径或圆心角：用 \\(s=r\\theta\\) 或 \\(A=\\tfrac12 r^{2}\\theta\\) 反解。</li></ul><h4>常见错误</h4><ul><li>计算器没切到 RAD 模式。</li><li>弓形面积用成扇形面积。</li><li>θ 用度数代入 \\(s=r\\theta\\)。</li></ul><h4>考试题型与得分点</h4><ul><li>常考：弧长＋扇形＋弓形面积综合；已知周长或面积求 θ。</li><li>得分点：θ 换成弧度（M）、公式（M）、答案（A）。</li></ul><h4>速记</h4><p>θ 先转弧度；弓形等于扇形减三角形。</p>`],
   ["T5 Bab 2 Pembezaan",`<h4>重点公式与要点</h4><ul><li>定义：\\(\\dfrac{dy}{dx}=\\lim_{h\\to0}\\dfrac{f(x+h)-f(x)}h\\)。</li><li>\\(\\dfrac d{dx}(ax^n)=anx^{n-1}\\)；常数的导数为 \\(0\\)。</li><li>乘积：\\(\\dfrac{d(uv)}{dx}=u\\dfrac{dv}{dx}+v\\dfrac{du}{dx}\\)；商：\\(\\dfrac{d}{dx}\\dfrac uv=\\dfrac{v\\frac{du}{dx}-u\\frac{dv}{dx}}{v^2}\\)。</li><li>链式：\\(\\dfrac{dy}{dx}=\\dfrac{dy}{du}\\times\\dfrac{du}{dx}\\)。</li><li>切线斜率 \\(m=\\dfrac{dy}{dx}\\)；法线斜率 \\(-\\dfrac1m\\)。</li><li>驻点 \\(\\dfrac{dy}{dx}=0\\)；\\(\\dfrac{d^2y}{dx^2}\\gt0\\) 为最小，\\(\\lt0\\) 为最大。</li><li>变化率：\\(\\dfrac{dy}{dt}=\\dfrac{dy}{dx}\\times\\dfrac{dx}{dt}\\)；小变化 \\(\\delta y\\approx\\dfrac{dy}{dx}\\delta x\\)。</li></ul><h4>例题详解</h4><p>求曲线 \\(y=x^3-3x\\) 的驻点并判断类型。</p><ol><li>\\(\\dfrac{dy}{dx}=3x^2-3=0\\Rightarrow x=\\pm1\\)</li><li>\\(\\dfrac{d^2y}{dx^2}=6x\\)</li><li>\\(x=1\\)：\\(6\\gt0\\)，最小值 \\(y=-2\\)</li><li>\\(x=-1\\)：\\(-6\\lt0\\)，最大值 \\(y=2\\)</li></ol><h4>解题步骤</h4><ul><li>求切线：先求 dy/dx，代入点得斜率，再用 \\(y-y_{1}=m(x-x_{1})\\)。</li><li>最大最小值应用：写出目标量 → 用约束消去一个变量 → 求导 → 令导数为 0 → 用二阶导数检验。</li><li>相关变化率：用链式法则连接各变量。</li></ul><h4>常见错误</h4><ul><li>漏掉链式法则中的内层导数。</li><li>商法则分子顺序写反。</li><li>忘了检验驻点是最大还是最小。</li></ul><h4>考试题型与得分点</h4><ul><li>常考：切线/法线方程、最大最小应用题、相关变化率、小变化。</li><li>得分点：求导（M）、令导数为 0（M）、二阶导数检验（M）、答案（A）。</li></ul><h4>速记</h4><p>求极值：一阶为零，二阶定型。</p>`],
   ["T5 Bab 3 Pengamiran",`<h4>重点公式与要点</h4><ul><li>\\(\\int ax^n\\,dx=\\dfrac{ax^{n+1}}{n+1}+c\\)（\\(n\\ne-1\\)）。</li><li>\\(\\int(ax+b)^n\\,dx=\\dfrac{(ax+b)^{n+1}}{a(n+1)}+c\\)。</li><li>定积分：\\(\\int_a^bf(x)\\,dx=F(b)-F(a)\\)。</li><li>面积：\\(A=\\int_a^by\\,dx\\)；两曲线之间 \\(\\int(\\text{上}-\\text{下})\\,dx\\)。</li><li>旋转体积：绕 \\(x\\) 轴 \\(V=\\pi\\int y^2\\,dx\\)；绕 \\(y\\) 轴 \\(V=\\pi\\int x^2\\,dy\\)。</li></ul><h4>例题详解</h4><p>求 \\(y=x^2\\) 与 \\(x\\) 轴、\\(x=1\\)、\\(x=3\\) 围成的面积，及绕 \\(x\\) 轴旋转的体积。</p><ol><li>\\(A=\\int_1^3x^2dx=\\left[\\dfrac{x^3}3\\right]_1^3=9-\\dfrac13=\\dfrac{26}3\\)</li><li>\\(V=\\pi\\int_1^3x^4dx=\\pi\\left[\\dfrac{x^5}5\\right]_1^3=\\dfrac{242\\pi}5\\)</li></ol><h4>解题步骤</h4><ul><li>不定积分后别忘了 +c；用已知点求 c。</li><li>面积：先画草图，确定上下限与上下曲线。</li><li>x 轴下方的面积为负，要取绝对值或分段计算。</li><li>体积：先把 \\(y^{2}\\) 展开再积分。</li></ul><h4>常见错误</h4><ul><li>忘了写 +c。</li><li>忘了 π。</li><li>面积在 x 轴下方时直接相加，正负抵消。</li></ul><h4>考试题型与得分点</h4><ul><li>常考：由 dy/dx 求曲线；面积；体积（绕 x 轴、y 轴）。</li><li>得分点：积分（M）、代入上下限（M）、答案（A）。</li></ul><h4>速记</h4><p>积分别忘 +c；体积别忘 π。</p>`],
   ["T5 Bab 4 Pilih Atur dan Gabungan",`<h4>重点公式与要点</h4><ul><li>\\(n!=n(n-1)\\cdots1\\)；\\({}^nP_r=\\dfrac{n!}{(n-r)!}\\)；\\({}^nC_r=\\dfrac{n!}{r!(n-r)!}\\)；\\({}^nC_r={}^nC_{n-r}\\)。</li><li>排列看顺序，组合不看顺序。</li><li>有相同物品：\\(\\dfrac{n!}{a!\\,b!\\cdots}\\)；环形排列 \\((n-1)!\\)。</li><li>相邻：捆绑成一个整体，再乘内部排列；不相邻：先排其他，再插空。</li><li>乘法原理分步相乘；加法原理分类相加。</li></ul><h4>例题详解</h4><p>用 MATHS 的 5 个字母排成一行，M、A 必须相邻，有几种排法？</p><ol><li>把 M、A 捆绑视作 1 个，共 4 个对象：\\(4!=24\\)</li><li>M、A 内部可互换：\\(2!=2\\)</li><li>总数 \\(24\\times2=48\\)</li></ol><h4>解题步骤</h4><ul><li>先判断：顺序是否重要？</li><li>有限制条件：先安排有限制的位置。</li><li>“至少”问题：可用总数减去反面情况。</li></ul><h4>常见错误</h4><ul><li>排列与组合混用。</li><li>相同字母排列忘了除以重复阶乘。</li><li>相邻捆绑后漏乘内部排列。</li></ul><h4>考试题型与得分点</h4><ul><li>常考：有限制条件的排列（相邻、不相邻、奇偶）；组合选人。</li><li>得分点：分类或分步正确（M），计算（A）。</li></ul><h4>速记</h4><p>相邻先捆绑，不邻先插空。</p>`],
   ["T5 Bab 5 Taburan Kebarangkalian",`<h4>重点公式与要点</h4><ul><li>二项分布 \\(X\\sim B(n,p)\\)：\\(P(X=r)={}^nC_rp^rq^{n-r}\\)，\\(q=1-p\\)。</li><li>均值 \\(\\mu=np\\)；标准差 \\(\\sigma=\\sqrt{npq}\\)。</li><li>正态分布 \\(X\\sim N(\\mu,\\sigma^2)\\)：\\(Z=\\dfrac{X-\\mu}\\sigma\\)。</li><li>\\(P(Z\\gt k)=1-P(Z\\lt k)\\)；\\(P(Z\\lt-k)=P(Z\\gt k)\\)；连续分布 \\(P(X=a)=0\\)。</li><li>“至少一次” \\(=1-P(X=0)\\)。</li></ul><h4>例题详解</h4><p>\\(X\\sim B(5,0.3)\\)，求 \\(P(X=2)\\) 与 \\(\\mu\\)。</p><ol><li>\\(P(X=2)={}^5C_2(0.3)^2(0.7)^3=10\\times0.09\\times0.343\\approx0.3087\\)</li><li>\\(\\mu=5\\times0.3=1.5\\)</li></ol><h4>解题步骤</h4><ul><li>正态：先标准化成 Z，再查表或用性质。</li><li>已知概率求 k：用逆查表。</li><li>二项：先写出 n、p，再代入公式。</li></ul><h4>常见错误</h4><ul><li>把方差 σ² 当成标准差 σ。</li><li>忘了 \\(q=1-p\\)。</li><li>\\(P(Z\\gt k)\\) 与 \\(P(Z\\lt k)\\) 混淆。</li></ul><h4>考试题型与得分点</h4><ul><li>常考：二项概率；正态标准化与查表；求 k 值。</li><li>得分点：写出分布（M）、Z 值（M）、概率（A）。</li></ul><h4>速记</h4><p>二项记 n、p、q；正态先化 Z。</p>`],
   ["T5 Bab 6 Fungsi Trigonometri",`<h4>重点公式与要点</h4><ul><li>\\(\\sec\\theta=\\dfrac1{\\cos\\theta}\\)，\\(\\operatorname{cosec}\\theta=\\dfrac1{\\sin\\theta}\\)，\\(\\cot\\theta=\\dfrac1{\\tan\\theta}\\)。</li><li>\\(\\sin^2\\theta+\\cos^2\\theta=1\\)；\\(1+\\tan^2\\theta=\\sec^2\\theta\\)；\\(1+\\cot^2\\theta=\\operatorname{cosec}^2\\theta\\)。</li><li>\\(\\sin(A\\pm B)=\\sin A\\cos B\\pm\\cos A\\sin B\\)；\\(\\cos(A\\pm B)=\\cos A\\cos B\\mp\\sin A\\sin B\\)。</li><li>\\(\\tan(A\\pm B)=\\dfrac{\\tan A\\pm\\tan B}{1\\mp\\tan A\\tan B}\\)。</li><li>\\(\\sin2A=2\\sin A\\cos A\\)；\\(\\cos2A=\\cos^2A-\\sin^2A=2\\cos^2A-1=1-2\\sin^2A\\)；\\(\\tan2A=\\dfrac{2\\tan A}{1-\\tan^2A}\\)。</li><li>\\(y=a\\sin bx+c\\)：振幅 \\(|a|\\)，周期 \\(\\dfrac{360^\\circ}b\\)；象限符号 ASTC。</li></ul><h4>例题详解</h4><p>解 \\(2\\sin^2x+\\cos x=1\\)，\\(0^\\circ\\le x\\le360^\\circ\\)。</p><ol><li>\\(2(1-\\cos^2x)+\\cos x=1\\Rightarrow2\\cos^2x-\\cos x-1=0\\)</li><li>\\((2\\cos x+1)(\\cos x-1)=0\\)</li><li>\\(\\cos x=-\\tfrac12\\Rightarrow x=120^\\circ,240^\\circ\\)；\\(\\cos x=1\\Rightarrow x=0^\\circ,360^\\circ\\)</li></ol><h4>解题步骤</h4><ul><li>解三角方程：化成同一个三角函数 → 求参考角 → 按象限写出所有解。</li><li>注意 bx 的范围要同步扩大，如 \\(0^{\\circ}\\le x\\le 360^{\\circ}\\) 时 2x 的范围是 \\(0^{\\circ}~720^{\\circ}\\)。</li><li>证明恒等式：从较复杂一边化简。</li></ul><h4>常见错误</h4><ul><li>只写一个解，漏了其他象限的解。</li><li>没有同步扩大 bx 的范围。</li><li>忘了开方时的 ±。</li></ul><h4>考试题型与得分点</h4><ul><li>常考：恒等式证明、解三角方程（含倍角）、图像与振幅周期。</li><li>得分点：化成同一函数（M）、因式分解（M）、列出全部解（A）。</li></ul><h4>速记</h4><p>解方程：化同函、求参考角、按象限列全解。</p>`],
   ["T5 Bab 7 Pengaturcaraan Linear",`<h4>重点公式与要点</h4><ul><li>步骤：设变量 → 列约束（含 \\(x\\ge0,\\;y\\ge0\\)）→ 画可行区域 → 目标函数 → 取顶点 → 求最优。</li><li>画线：\\(\\le,\\ge\\) 用实线；\\(\\lt,\\gt\\) 用虚线。</li><li>目标函数 \\(k=ax+by\\)，最优解出现在可行区域的顶点。</li><li>若 \\(x,y\\) 须为整数，取区域内的整数点。</li></ul><h4>例题详解</h4><p>约束 \\(x+y\\le6\\)，\\(x\\ge1\\)，\\(y\\ge0\\)，求 \\(k=3x+2y\\) 的最大值。</p><ol><li>顶点：\\((1,0),\\;(6,0),\\;(1,5)\\)</li><li>\\(k=3,\\;18,\\;13\\)</li><li>最大值 \\(18\\)，在 \\((6,0)\\)</li></ol><h4>解题步骤</h4><ul><li>把文字约束一条条翻译成不等式，并检查每个单位。</li><li>按题目要求阴影“不需要的区域”或“所需的区域”（看清题目）。</li><li>顶点坐标用联立方程算准。</li></ul><h4>常见错误</h4><ul><li>不等式方向写反。</li><li>阴影区域取反。</li><li>虚线与实线混用。</li></ul><h4>考试题型与得分点</h4><ul><li>常考：列不等式、画图阴影、求最大最小值。</li><li>得分点：不等式正确（M）、区域图（M）、顶点代入（A）。</li></ul><h4>速记</h4><p>最优在顶点；实线含等号，虚线不含。</p>`],
   ["T5 Bab 8 Kinematik Gerakan Linear",`<h4>重点公式与要点</h4><ul><li>\\(v=\\dfrac{ds}{dt}\\)；\\(a=\\dfrac{dv}{dt}=\\dfrac{d^2s}{dt^2}\\)。</li><li>\\(s=\\int v\\,dt\\)；\\(v=\\int a\\,dt\\)（用初始条件求常数）。</li><li>静止 \\(v=0\\)；回到原点 \\(s=0\\)；速度最大或最小 \\(a=0\\)。</li><li>改变方向：\\(v=0\\) 且符号改变。</li><li>总路程：在 \\(v=0\\) 处分段，各段取绝对值再相加。</li></ul><h4>例题详解</h4><p>\\(s=t^3-6t^2+9t\\)（m），求静止时刻与 \\(t=0\\) 至 \\(4\\) 的总路程。</p><ol><li>\\(v=3t^2-12t+9=3(t-1)(t-3)\\)，静止于 \\(t=1,3\\)</li><li>\\(s(0)=0,\\;s(1)=4,\\;s(3)=0,\\;s(4)=4\\)</li><li>路程 \\(=4+4+4=12\\text{ m}\\)</li></ol><h4>解题步骤</h4><ul><li>先写出 s、v、a 之间的微积分关系。</li><li>\\(t=0\\) 时的条件用来求积分常数。</li><li>求路程：找出 \\(v=0\\) 的时刻，分段计算后相加。</li></ul><h4>常见错误</h4><ul><li>位移与路程混淆。</li><li>积分后忘了用初始条件求 c。</li><li>\\(a=0\\) 时的 t 当成速度为 0 的时刻。</li></ul><h4>考试题型与得分点</h4><ul><li>常考：由 s 求 v、a；由 a 积分；总路程。</li><li>得分点：求导或积分（M）、初始条件（M）、答案（A）。</li></ul><h4>速记</h4><p>位移看首尾，路程要分段。</p>`],
   ["答题技巧 (SPM 3472)",`<ul><li>计算器：弧度/度数模式要看清题目 (Sukatan Membulat 用 RAD)。</li><li>写出<b>每一步工作</b>，方法分 (M) 与答案分 (A) 分开计。</li><li>答案保留题目要求的小数位，或保留精确值 (surd、\\(\\pi\\))。</li><li>检查：舍去不合理的解 (长度为负、对数真数为负)。</li></ul>`]
  ]},

  if(status===400&&/too large|size|token/i.test(raw))return "资料太大了，超过一次能处理的范围。取消勾选几份上传的资料，或拆小一点。";

  if(status===404)return "找不到这个模型。到「设置」换成 gemini-3.5-flash-lite，或填新的模型名。";
  if(status===429){const m=raw.match(/retry in ([\d.]+)s/i);return "请求太频繁，或今天的免费额度用完了。"+(m?"约 "+Math.ceil(+m[1])+" 秒后可重试。":"等 1 分钟再试。")+"也可以换成 gemini-3.5-flash-lite。"}

async function sseEach(res,fn){

function planFor(offset){

/* ---- 笔记搜索：先用原来的“包含”匹配，再用 MiniSearch（前缀 / 容错 / 多词）补充；库加载失败就只用原来的 ---- */
const MS_URL="https://cdn.jsdelivr.net/npm/minisearch@7.1.0/dist/umd/index.min.js";
let msState=0,msIdx=null,msSig="";
function msLoad(){if(msState)return;msState=1;const e=document.createElement("script");e.src=MS_URL;e.onload=()=>{msState=window.MiniSearch?2:3;if(msState===2&&nQ&&$("#nq"))refreshSearch()};e.onerror=()=>{msState=3};document.head.appendChild(e)}
function refreshSearch(){const i=$("#nq");if(!i)return;const pos=i.selectionStart;rNotes();const j=$("#nq");if(j){j.focus();try{j.setSelectionRange(pos,pos)}catch(e){}}}
function msTok(t){return String(t).toLowerCase().match(/[\u3400-\u9fff]|[a-z0-9\u00c0-\u024f]+/g)||[]}
function noteSearch(q){
  const all=SUBJECTS.flatMap(x=>chapsOf(x.id).map(c=>({...c,sid:x.id})));
  const text=c=>(c.t+" "+c.subs.join(" ")+" "+plain(c.n)+" "+(S.notes[c.k]?S.notes[c.k].md:"")).toLowerCase();
  const hit=all.filter(c=>text(c).includes(q));
  msLoad();if(msState!==2)return hit;
  try{
    const sig=all.length+"|"+Object.keys(S.notes).length+"|"+Object.values(S.notes).reduce((a,n)=>a+((n&&n.md)||"").length,0);
    if(!msIdx||sig!==msSig){msIdx=new window.MiniSearch({fields:["t","subs","body"],storeFields:[],tokenize:msTok,searchOptions:{boost:{t:3,subs:2},prefix:true,fuzzy:t=>t.length>4?0.2:false,combineWith:"AND"}});
      msIdx.addAll(all.map(c=>({id:c.sid+"|"+c.k,t:c.t,subs:c.subs.join(" "),body:plain(c.n)+" "+(S.notes[c.k]?S.notes[c.k].md:"")})));msSig=sig}
    const seen=new Set(hit.map(c=>c.sid+"|"+c.k)),by=new Map(all.map(c=>[c.sid+"|"+c.k,c]));
    msIdx.search(q).forEach(r=>{if(!seen.has(r.id)&&by.has(r.id)){seen.add(r.id);hit.push(by.get(r.id))}});
  }catch(e){console.warn("minisearch",e)}
  return hit;
}
