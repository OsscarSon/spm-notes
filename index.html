ctric effect: emission of electrons (photoelectrons) from a metal surface when light of sufficient frequency shines on it.","光电效应：光照射金属表面释放光电子"],["Observations: ① there is a threshold frequency \\(f_0\\) — no emission below it, however bright; ② emission is instantaneous; ③ maximum kinetic energy of the photoelectrons depends on the frequency, not on the intensity; ④ the number of photoelectrons per second ∝ light intensity (above \\(f_0\\)).","观察：存在截止频率；瞬时发射；最大动能随频率；光电子数随光强"],["The wave theory fails: it predicts that bright light of any frequency should eject electrons after some time. The photon model explains it: one photon gives all its energy to one electron.","波动论无法解释；光子模型可以"],["Work function W: the minimum energy required to remove an electron from the metal surface, \\(W=hf_0\\).","逸出功 W = hf₀"],["Applications: photocells in automatic doors, burglar alarms, light meters, solar cells, digital cameras.","应用：光电管、太阳能电池"]],"","Tip: below the threshold frequency no electrons are emitted regardless of intensity."],["Einstein's Photoelectric Equation","爱因斯坦光电方程",[["\\(hf=W+\\tfrac12mv_{max}^{2}\\), i.e. photon energy = work function + maximum kinetic energy.","hf = W + ½mv²_max"],["Threshold: \\(hf_0=W\\) → \\(f_0=\\dfrac{W}{h}\\). Stopping potential \\(V_s\\): \\(eV_s=\\tfrac12mv_{max}^{2}\\).","f₀ = W/h；遏止电势 eV_s = Ek_max"],["Graph of \\(E_{k,max}\\) against f: straight line; gradient = h; intercept on the f-axis = \\(f_0\\); intercept on the vertical axis = \\(-W\\).","Ek-f 图：斜率 = h；横截距 f₀；纵截距 −W"],["Q: W = 3.0 × 10⁻¹⁹ J, f = 1.0 × 10¹⁵ Hz: hf = 6.63 × 10⁻¹⁹ J; \\(E_{k,max}=6.63\\times10^{-19}-3.0\\times10^{-19}=3.63\\times10^{-19}\\) J.","题：Ek_max = 3.63×10⁻¹⁹ J"],["Speed: \\(v=\\sqrt{\\dfrac{2E_k}{m}}=\\sqrt{\\dfrac{2(3.63\\times10^{-19})}{9.11\\times10^{-31}}}=8.9\\times10^{5}\\) m s⁻¹; \\(f_0=\\dfrac{3.0\\times10^{-19}}{6.63\\times10^{-34}}=4.5\\times10^{14}\\) Hz.","速度 8.9×10⁵ m/s；f₀ = 4.5×10¹⁴ Hz"]],"","Tip: always check the units — if W is in eV convert to joules (× 1.6 × 10⁻¹⁹)."],["Wave–Particle Duality","波粒二象性",[["Light shows wave properties (diffraction, interference) and particle properties (photoelectric effect): wave–particle duality.","光既有波动性（干涉、衍射）也有粒子性（光电效应）"],["De Broglie: moving particles also have a wavelength \\(\\lambda=\\dfrac{h}{p}=\\dfrac{h}{mv}\\).","德布罗意波长 λ = h/p = h/mv"],["Evidence: electrons passing through a thin crystal/graphite produce diffraction rings — electrons behave as waves.","证据：电子衍射环"],["Q: An electron at 1.0 × 10⁶ m s⁻¹: \\(\\lambda=\\dfrac{6.63\\times10^{-34}}{(9.11\\times10^{-31})(1.0\\times10^{6})}=7.3\\times10^{-10}\\) m.","题：λ = 7.3×10⁻¹⁰ m"],["A 0.1 kg ball at 10 m s⁻¹ has λ ≈ 6.6 × 10⁻³⁴ m — far too small to observe, so the wave nature of everyday objects is not noticed. Application: electron microscope (very short λ → high resolution).","日常物体 λ 太小；电子显微镜"]],"","Tip: faster or heavier particle → larger momentum → shorter wavelength."],["Worked Problems: Photoelectric Effect","例题：光电效应",[["Q1: Threshold frequency of a metal is 5.0 × 10¹⁴ Hz. Work function \\(W=hf_0=(6.63\\times10^{-34})(5.0\\times10^{14})=3.3\\times10^{-19}\\) J = 2.1 eV.","题1：W = hf₀ = 3.3×10⁻¹⁹ J = 2.1 eV"],["Q2: Light of wavelength 300 nm strikes a metal with W = 2.5 eV. Photon energy \\(E=\\dfrac{hc}{\\lambda}=\\dfrac{(6.63\\times10^{-34})(3.0\\times10^{8})}{3.0\\times10^{-7}}=6.63\\times10^{-19}\\) J = 4.1 eV; \\(E_{k,max}=4.1-2.5=1.6\\) eV.","题2：光子 4.1 eV，Ek_max = 1.6 eV"],["Stopping potential: \\(eV_s=E_{k,max}\\) → \\(V_s=1.6\\) V.","遏止电势 V_s = 1.6 V"],["If the light intensity doubles (same f): twice as many photons → twice as many photoelectrons per second (larger photocurrent), but \\(E_{k,max}\\) is unchanged.","光强加倍：光电流加倍，Ek_max 不变"],["If the frequency increases (same intensity): \\(E_{k,max}\\) increases; the number of photons per second decreases slightly because each photon carries more energy.","频率增大：Ek_max 增大"]],"","Tip: intensity affects the NUMBER of electrons; frequency affects their MAXIMUM ENERGY."],["Common Mistakes","常见错误",[["Mistake: saying that brighter light always gives photoelectrons — frequency must exceed \\(f_0\\).","错误：光强够大就一定有光电子"],["Mistake: confusing intensity (number of photons) with photon energy (frequency).","错误：混淆光强与光子能量"]],"",""],["Uji Diri","自测",[["S: Define work function. J: The minimum energy needed to remove an electron from the metal surface.","问：逸出功？答：把电子移出金属表面所需最小能量"],["S: Light of f = 8.0 × 10¹⁴ Hz hits a metal with W = 3.2 × 10⁻¹⁹ J. Is there emission? J: hf = 5.3 × 10⁻¹⁹ J > W, so yes; Ek = 2.1 × 10⁻¹⁹ J.","问：f=8.0×10¹⁴ Hz，W=3.2×10⁻¹⁹ J，有发射吗？答：hf=5.3×10⁻¹⁹>W，有；Ek=2.1×10⁻¹⁹ J"],["S: What does the gradient of an Ek–f graph represent? J: Planck's constant h.","问：Ek-f 图斜率？答：普朗克常数 h"]],"",""]]};

  start("要点");

    let m;if(m=line.match(/^#{1,4}\s+(.*)$/)){start(clean(m[1]));return}
    if(/^\|?\s*:?-{2,}/.test(line))return;
    let txt=null;if(m=line.match(/^([-*•]|\d+[.)])\s+(.*)$/))txt=clean(m[2]);else if(line.startsWith("|"))txt=line.replace(/^\||\|$/g,"").split("|").map(x=>clean(x)).filter(Boolean).join(" — ");else txt=clean(line);
    if(!txt)return;

    cur.b.push(txt)});

function salvageJSON(s,depth){const st=[];let inS=false,esc=false,cut=-1,stk=null;
  for(let i=0;i<s.length;i++){const ch=s[i];
    if(inS){if(esc)esc=false;else if(ch==="\\")esc=true;else if(ch==='"')inS=false;continue}
    if(ch==='"'){inS=true;continue}
    if(ch==="{"||ch==="[")st.push(ch);
    else if(ch==="}"||ch==="]"){st.pop();if(st.length===depth){cut=i+1;stk=st.slice()}}}
  if(cut<0)return undefined;
  const closers=stk.slice().reverse().map(c=>c==="{"?"}":"]").join("");
  try{return JSON.parse(s.slice(0,cut)+closers)}catch(e){return undefined}}

function calcHTML(body){
  const rows=[];
  String(body||"").split(/\r?\n/).slice(0,12).forEach(raw=>{
    const line=raw.trim();if(!line)return;
    const hi=line.indexOf("#"),cmt=hi>=0?line.slice(hi+1).trim():"",core=(hi>=0?line.slice(0,hi):line).replace(/[≈≃]/g,"=").trim(),ei=core.lastIndexOf("=");
    if(ei<1){rows.push({L:core,R:"",cmt,st:"na"});return}
    const Ls=core.slice(0,ei).trim(),Rs=core.slice(ei+1).trim(),a=calcVal(Ls),b=calcVal(Rs);
    if(a===null||b===null){rows.push({L:Ls,R:Rs,cmt,st:"na"});return}
    const plain=/^[+\-−–]?\d*\.?\d+$/.test(Rs.replace(/,/g,""));
    const tol=plain?0.5*Math.pow(10,-((Rs.split(".")[1]||"").length))*1.001:Math.abs(a)*0.01;
    const ok=Math.abs(a-b)<=Math.max(tol,Math.abs(a)*1e-9);
    rows.push({L:Ls,R:Rs,cmt,a,st:ok?"ok":"bad"})});
  if(!rows.length)return"";
  const bad=rows.filter(r=>r.st==="bad").length,na=rows.filter(r=>r.st==="na").length;
  return `<div class="calcbox"><b>🧮 计算核对</b> <span class="fine muted">程序把算式重新算了一遍</span><table>${rows.map(r=>r.st==="na"
    ?`<tr class="na"><td><code>${esc(r.L)}${r.R?" = "+esc(r.R):""}</code></td><td colspan="3" class="fine">程序看不懂这一行，没法核对</td></tr>`
    :`<tr><td><code>${esc(r.L)}</code></td><td>AI：<b>${esc(r.R)}</b></td><td>程序：<b>${esc(calcFmt(r.a))}</b></td><td class="${r.st}">${r.st==="ok"?"✓ 一致":"⚠ 不一致"}</td></tr>${r.cmt?`<tr><td colspan="4" class="fine muted">${esc(r.cmt)}</td></tr>`:""}`).join("")}</table>${bad?`<div class="bad" style="margin-top:4px">有 ${bad} 行和程序算的不一样：请对照上面的步骤检查，不要直接抄答案。</div>`:(na?"":`<div class="fine muted" style="margin-top:4px">这几行的结果程序也算出来一样 (只核对数字，不核对解题思路对不对)。</div>`)}</div>`}

const LIS_OK=["bm","bi"],ESS_OK=["bm","bi","bc"];
let LS=null;
const TTSX={tok:0,
  ok(){return typeof window!=="undefined"&&"speechSynthesis" in window&&typeof SpeechSynthesisUtterance!=="undefined"},
  list(lang){let vs=[];try{vs=speechSynthesis.getVoices()||[]}catch(e){}
    const nm=v=>String(v.lang||"").replace("_","-").toLowerCase(),pick=p=>vs.filter(v=>nm(v).startsWith(p));
    if(lang==="ms"){const a=pick("ms");return a.length?{vs:a,exact:true}:{vs:pick("id"),exact:false}}
    const all=[...pick("en-my"),...pick("en-gb"),...pick("en-au"),...pick("en-us"),...pick("en")].filter((v,i,x)=>x.indexOf(v)===i);return{vs:all,exact:true}},
  stop(){try{speechSynthesis.cancel()}catch(e){}this.tok++},
  play(script,lang,rate,onEnd){
    this.stop();try{speechSynthesis.resume()}catch(e){}
    const my=this.tok,vs=this.list(lang).vs,idx={};let n=0;const items=[];
    script.forEach(l=>{const k=String(l.spk||"A");if(!(k in idx))idx[k]=n++;
      const ch=String(l.text||"").split(/(?<=[.!?。！？])\s+/).map(s=>s.trim()).filter(Boolean);
      ch.forEach((c,ci)=>items.push({c,si:idx[k],last:ci===ch.length-1}))});
    const nSpk=n,step=i=>{
      if(my!==this.tok)return;
      if(i>=items.length){if(onEnd)onEnd();return}
      const it=items[i],u=new SpeechSynthesisUtterance(it.c),v=vs.length?vs[it.si%vs.length]:null;
      if(v){u.voice=v;u.lang=v.lang}else u.lang=lang==="ms"?"ms-MY":"en-GB";
      u.rate=rate;u.pitch=(vs.length>1&&nSpk>1)?1:(it.si===0?1:(it.si===1?1.25:0.8));
      const next=()=>{if(my!==this.tok)return;setTimeout(()=>step(i+1),it.last?600:150)};
      u.onend=next;u.onerror=next;
      try{speechSynthesis.speak(u)}catch(e){next()}};
    step(0)}};
function voiceNote(lang){
  if(!TTSX.ok())return"这个浏览器不支持朗读，听力没法播放声音。请换成 Chrome 或 Safari 再试。";
  const r=TTSX.list(lang),nm=lang==="ms"?"国语":"英语";
  if(!r.vs.length)return`你的设备里没有找到${nm}语音 (有的设备要几秒钟才加载完)。可以到系统设置里安装${nm}语音；没有语音时只能看原文。`;
  if(!r.exact)return"你的设备没有国语语音，改用印尼语语音朗读：发音接近，但不完全一样。";
  return`朗读语音：${r.vs[0].name}${r.vs.length>1?` 等 ${r.vs.length} 个`:""}`}

const ESS_TYPES={
 bm:[["prac","实用文 (surat、ucapan、laporan 等)"],["nar","叙事作文"],["arg","议论作文"],["des","描写作文"]],

function essayCount(t,lang){t=String(t||"");if(lang==="zh")return[...t.replace(/\s/g,"")].length+" 字";return t.trim().split(/\s+/).filter(Boolean).length+" 词"}

function essayLang(sid){return sid==="bm"?"ms":sid==="bi"?"en":"zh"}
function essayNorm(o,max,text){
  const dims=(Array.isArray(o.dims)?o.dims:[]).map(d=>({n:String(d&&d.n||""),m:Math.max(0,Number(d&&d.m)||0),s:Number(d&&d.s)||0,c:String(d&&d.c||"")})).filter(d=>d.n&&d.m>0).map(d=>({n:d.n,m:d.m,c:d.c,s:Math.max(0,Math.min(d.m,Math.round(d.s*2)/2))}));
  let score=Number(o.score)||0;const sumS=dims.reduce((a,d)=>a+d.s,0),sumM=dims.reduce((a,d)=>a+d.m,0);
  if(dims.length&&Math.abs(sumM-max)<=1.01)score=sumS;
  score=Math.max(0,Math.min(max,Math.round(score*2)/2));
  const flat=s=>String(s).replace(/\s+/g," ").trim().toLowerCase(),T=flat(text||""),arr=a=>Array.isArray(a)?a:[];
  const errors=arr(o.errors).slice(0,8).map(x=>({orig:String(x&&x.orig||""),fix:String(x&&x.fix||""),why:String(x&&x.why||"")})).filter(x=>x.orig&&x.fix).map(x=>({orig:x.orig,fix:x.fix,why:x.why,found:!T||T.includes(flat(x.orig))}));
  const upgrades=arr(o.upgrades).slice(0,4).map(x=>({orig:String(x&&x.orig||""),better:String(x&&x.better||""),why:String(x&&x.why||"")})).filter(x=>x.orig&&x.better);
  return{score,dims,errors,upgrades,strengths:arr(o.strengths).slice(0,5).map(String),advice:arr(o.advice).slice(0,4).map(String),model:String(o.model||"")}}

      e.topic=String(o.topic||"");e.hint=String(o.hint||"");e.res=null;essayView(box)}

    try{const max=e.max,dims=essayDims(sid).map(([n,w])=>`${n} (约 ${Math.round(max*w*2)/2} 分)`).join("、"),isZh=lang==="zh";
      const content=[{text:`请批改这篇 SPM「${subj(sid).name}」写作 (类型：${tName()})。
题目：${e.topic.trim()}
满分：${max}。练习用的评分维度和参考分值：${dims}；各维度分数之和 = 总分。
学生作文：
${e.text.trim()||"(见照片)"}

规则：
1. 只依据学生写的内容评分，不替学生补写；诚实打分，不要故意抬高；偏题、字数明显不足、格式不符 (例如实用文缺称呼或结尾) 要扣分，并写进评语。
2. 分数可以给 0.5 分，不超过各维度满分。
3. errors 里的 orig 必须是学生作文里真实出现的原句或片段，逐字照抄，不要改写；最多 8 条，挑最影响得分的；fix 是改正后的写法，用 ${langName}；why 用华文简短说明错在哪。
4. upgrades 最多 4 条：挑学生写得正确但平淡的句子，给出更好的写法 (用 ${langName})，why 用华文。
5. model 是针对这个题目的一段示范开头 (60-100 ${isZh?"字":"词"}，用 ${langName})。
6. dims 的 c、strengths、advice 用华文，学生要能看懂。
学生如附了手写照片，先读出内容再批改，字迹看不清要在 advice 里说明。
只输出 JSON：{"score":总分,"dims":[{"n":"维度名","s":得分,"m":满分,"c":"评语"}],"strengths":["..."],"errors":[{"orig":"","fix":"","why":""}],"upgrades":[{"orig":"","better":"","why":""}],"advice":["..."],"model":""}`}];

      const r=essayNorm(parseJSON(out,"{"),max,e.text);e.res=r;

  $$("[data-eview]").forEach(b=>b.onclick=()=>{const x=(S.essays||[]).find(y=>y.id===b.dataset.eview);if(!x)return;ES={sid,type:x.type,topic:x.topic,hint:"",text:x.text,img:null,res:x.res,max:x.max};essayView(box);window.scrollTo(0,0)});

/* ---- 阅卷官：学生自己提供题目和答案 (课本、真题都行)，AI 按评分点逐项打分 ---- */
let MK=null;
const MK_MAX=[1,2,3,4,5,6,8,10,12,15,20];
function markerNorm(o,max){
  const arr=a=>Array.isArray(a)?a:[];
  const points=arr(o.points).map(p=>({p:String(p&&p.p||""),m:Math.max(0,Number(p&&p.m)||0),s:Number(p&&p.s)||0,why:String(p&&p.why||"")})).filter(p=>p.p&&p.m>0).map(p=>({p:p.p,m:p.m,why:p.why,s:Math.max(0,Math.min(p.m,Math.round(p.s*2)/2))}));
  const sumS=points.reduce((a,p)=>a+p.s,0),sumM=points.reduce((a,p)=>a+p.m,0),pointsOk=points.length>0&&Math.abs(sumM-max)<=0.01;
  let score=Number(o.score)||0;if(pointsOk)score=sumS;
  score=Math.max(0,Math.min(max,Math.round(score*2)/2));
  return{score,points,pointsOk,src:o.scheme_src==="given"?"given":"inferred",deductions:arr(o.deductions).slice(0,6).map(String),ideal:String(o.ideal||""),tips:arr(o.tips).slice(0,3).map(String),note:String(o.note||"")}}
function markerResHTML(e){const r=e.res,li=a=>`<ul style="margin:4px 0 4px 18px;padding:0">${a.map(x=>`<li class="fine" style="white-space:pre-wrap">${esc(x)}</li>`).join("")}</ul>`;
  return `<div class="fb ${r.score>=e.max?"full":r.score===0?"zero":""}" style="margin-top:14px"><b style="font-size:22px">${r.score}/${e.max}</b> <span class="tag ${r.src==="given"?"ok":"warn"}">${r.src==="given"?"按你贴的评分标准":"评分点是 AI 推断的，不是官方"}</span></div>
  ${r.note?`<div class="notice warn" style="margin:8px 0"><div class="fine" style="white-space:pre-wrap">${esc(r.note)}</div></div>`:""}
  ${r.points.length?`<div style="margin:10px 0 2px"><b>得分点</b>${r.pointsOk?"":' <span class="fine muted">(各点分值加起来和满分不一致，总分以 AI 给的为准)</span>'}</div>${r.points.map(p=>`<div class="tip" style="margin:6px 0"><div class="row"><span>${p.s>=p.m?"✅":p.s>0?"🟡":"❌"} ${esc(p.p)}</span><span class="spacer"></span><b>${p.s}/${p.m}</b></div><div class="fine muted" style="white-space:pre-wrap">${esc(p.why)}</div></div>`).join("")}`:""}
  ${r.deductions.length?`<div style="margin:10px 0 2px"><b>失分原因</b></div>${li(r.deductions)}`:""}
  ${r.ideal?`<details open style="margin-top:8px"><summary class="fine muted" style="cursor:pointer">满分答案 (参考)</summary><div class="fine" style="white-space:pre-wrap;margin-top:4px">${esc(r.ideal)}</div></details>`:""}
  ${r.tips.length?`<div style="margin:10px 0 2px"><b>怎样答才能拿满分</b></div>${li(r.tips)}`:""}
  <div class="row" style="margin-top:12px"><button class="btn small" id="mWr">记进错题本</button><span class="spacer"></span><button class="btn pri" id="mNew">再批一题</button></div>`}
function rMarker(){const sid=S.sub,box=$("#dBody");ensureAgentCss();
  if(!MK||MK.sid!==sid)MK={sid,q:"",ans:"",scheme:"",max:4,qimg:null,aimg:null,res:null};
  markerView(box)}
function markerView(box){
  const e=MK,sid=e.sid;
  box.innerHTML=`<div class="card" style="max-width:760px">
  <p class="fine muted" style="margin-top:0">把任何一道题和你的答案贴进来 (课本、真题、老师给的都行)，AI 像评卷员一样逐个得分点打分，告诉你哪里丢分。和「作答题」不同，这里的题目由你自己提供。AI 的评分只是练习参考。</p>
  <label style="display:block">题目 <textarea id="mQ" style="min-height:80px" placeholder="贴题目，或拍照">${esc(e.q)}</textarea></label>
  <div class="row" style="margin:4px 0"><label class="btn small">📷 题目照片<input type="file" id="mQi" accept="image/*" hidden></label>${e.qimg?'<span class="tag ok">已附图</span>':""}<span class="spacer"></span><label class="fine">满分 <select id="mMax">${MK_MAX.map(n=>`<option ${e.max===n?"selected":""}>${n}</option>`).join("")}</select></label></div>
  <label style="display:block">我的答案 <textarea id="mA" style="min-height:130px" placeholder="写你的答案，或拍手写照片">${esc(e.ans)}</textarea></label>
  <div class="row" style="margin:4px 0"><label class="btn small">📷 手写答案照片<input type="file" id="mAi" accept="image/*" hidden></label>${e.aimg?'<span class="tag ok">已附图</span>':""}</div>
  <details style="margin:8px 0" ${e.scheme?"open":""}><summary class="fine muted" style="cursor:pointer">有官方评分标准吗？贴在这里，AI 会严格按它批改 (没有就不用填)</summary><textarea id="mS" style="min-height:90px;margin-top:6px">${esc(e.scheme)}</textarea></details>
  <div class="row"><span class="spacer"></span><button class="btn pri" id="mSub" ${aiOK()?"":"disabled"}>提交批改</button></div>
  <div id="mMsg" class="fine" style="margin-top:6px"></div>
  ${e.res?markerResHTML(e):""}</div>`;
  $("#mQ").oninput=ev=>{e.q=ev.target.value};$("#mA").oninput=ev=>{e.ans=ev.target.value};$("#mS").oninput=ev=>{e.scheme=ev.target.value};$("#mMax").onchange=ev=>{e.max=+ev.target.value};
  $("#mQi").onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{e.qimg=await prepImg(f);markerView(box)}catch(x){toast("图片读取失败")}};
  $("#mAi").onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{e.aimg=await prepImg(f);markerView(box)}catch(x){toast("图片读取失败")}};
  $("#mSub").onclick=async()=>{
    if(!e.q.trim()&&!e.qimg){toast("先贴题目，或附题目照片");return}
    if(!e.ans.trim()&&!e.aimg){toast("先写你的答案，或附手写照片");return}
    setBusy($("#mSub"),true,"批改中…");
    try{const max=e.max;
      const parts=[{text:`请按 SPM 评卷员的标准，批改这道「${subj(sid).name}」题。
满分：${max}
题目：${e.q.trim()||"(见题目照片)"}
${e.scheme.trim()?`官方评分标准 (严格按它批改)：\n${e.scheme.trim()}\n`:"没有提供评分标准：先按 SPM 的评分习惯自己拟定得分点 (各点分值之和 = 满分)，scheme_src 写 \"inferred\"。\n"}学生答案：
${e.ans.trim()||"(见答案照片)"}

规则：
1. 给了评分标准就严格按它，scheme_src 写 "given"；没给就自己拟定，写 "inferred"。
2. 逐点判定，只依据学生写的内容给分，不替学生补全，也不因为「意思差不多」就给分；数学类要区分方法分 (M) 和答案分 (A)，答案对但缺步骤要按评分标准扣；物理、化学注意公式、代入、单位和有效数字；文科和语言类看关键词和完整句子。
3. 分数可以给 0.5，每个点的得分不超过它的分值；总分 = 各点得分之和，不超过满分。
4. 如果题目有歧义、缺条件，或你没有把握确定标准答案，在 note 里老实说明，不要硬判；学生字迹看不清也写在 note 里。
5. why、deductions、tips、note 用华文，学生要看懂；引用学生原话要原样引用。ideal 是满分答案，用考试语言 (见语言规则，华文科目用华文)，写成学生能直接背的要点或步骤。
只输出 JSON：{"scheme_src":"given 或 inferred","points":[{"p":"得分点","m":分值,"s":得分,"why":"为什么得分或不得分"}],"score":总分,"deductions":["失分原因"],"ideal":"满分答案","tips":["怎样答才能拿满分"],"note":"需要提醒的不确定之处，没有就留空字符串"}`}];
      if(e.qimg){parts.push({text:"题目照片："});parts.push({inline_data:{mime_type:"image/jpeg",data:e.qimg}})}
      if(e.aimg){parts.push({text:"学生手写答案照片："});parts.push({inline_data:{mime_type:"image/jpeg",data:e.aimg}})}
      const out=await gem([{role:"user",parts}],sysPrompt(sid,"你现在是严格公正的 SPM 评卷员。"),6000,{json:"{",cache:true});
      e.res=markerNorm(parseJSON(out,"{"),max);markerView(box)}
    catch(err){setBusy($("#mSub"),false);$("#mMsg").innerHTML=`<span style="color:var(--bad)">${esc(err.message)}</span>`}};
  if($("#mNew"))$("#mNew").onclick=()=>{MK={sid,q:"",ans:"",scheme:"",max:e.max,qimg:null,aimg:null,res:null};markerView(box);window.scrollTo(0,0)};
  if($("#mWr"))$("#mWr").onclick=()=>{const r=e.res;S.wrong.push({id:"k"+Date.now(),type:"drill",s:sid,q:e.q.trim()||"(题目见照片)",a:`得分 ${r.score}/${e.max}\n评分要点：${r.points.map(p=>p.p+" ("+p.s+"/"+p.m+")").join("；")}\n我的作答：${e.ans.trim()||"(照片)"}\n满分答案：${r.ideal}`});save();toast("已记进错题本")}}

function rDrill(){
  if((dMode==="listen"&&!LIS_OK.includes(S.sub))||(dMode==="essay"&&!ESS_OK.includes(S.sub)))dMode="mcq";
  if(dMode!=="listen"){TTSX.stop();if(LS)LS.playing=false}
  $("#sheet").innerHTML=`${needKey()}<div class="row" style="margin-bottom:10px"><h2 style="margin:0">${esc(subj(S.sub).name)} 刷题</h2>
   </div><div class="seg" style="margin-bottom:12px"><button data-dm="mcq" aria-pressed="${dMode==="mcq"}">选择题</button><button data-dm="open" aria-pressed="${dMode==="open"}">作答题</button><button data-dm="mix" aria-pressed="${dMode==="mix"}">混合</button><button data-dm="mark" aria-pressed="${dMode==="mark"}">阅卷官</button>${LIS_OK.includes(S.sub)?`<button data-dm="listen" aria-pressed="${dMode==="listen"}">听力</button>`:""}${ESS_OK.includes(S.sub)?`<button data-dm="essay" aria-pressed="${dMode==="essay"}">作文</button>`:""}<button data-dm="wrong" aria-pressed="${dMode==="wrong"}">错题本 (${S.wrong.filter(w=>w.s===S.sub).length})</button></div><div id="dBody"></div>`;
  $$("[data-dm]").forEach(b=>b.onclick=()=>{dMode=b.dataset.dm;qz=null;rDrill()});(dMode==="wrong"?rWrong:dMode==="listen"?rListen:dMode==="essay"?rEssay:dMode==="mark"?rMarker:rQuiz)()}
function openHint(sid){return({
 bm:"短答 / 语法 / 完成句子 / 短文理解，或一小段 (50-80 字) 写作，不要整篇作文",
 bi:"short-answer / grammar / sentence completion / one-paragraph writing (not a full essay)",
 bc:"短答、成语或修辞、病句修改，或一小段写作 (不要整篇作文)",
 sej:"结构题 (a)(b) 式短答，或需要「观点 + 解释 + 例子」的短论述",
 mat:"计算题和应用题，答案要写出步骤",
 am:"计算题，答案要写出步骤"})[sid]||"结构题、简答、计算或解释题 (可含实验设计、图表分析)"}
const DRILL_N={mcq:8,open:5,mix:8};
function rQuiz(){
  const sid=S.sub,box=$("#dBody");
  if(qz&&qz.sid!==sid)qz=null;
  if(!qz){const nb=QUIZ.filter(q=>q[0]===sid).length;
    box.innerHTML=`<div class="card" style="max-width:660px"><div class="controls"><label class="grow">题源<select id="qSrc"><option value="ai">AI 按章节出题</option><option value="bank" ${nb?"":"disabled"}>内置题库 (${nb} 题，仅选择题，附华文翻译)</option></select></label></div>
     <div class="controls"><label class="grow" id="qCw">章节<select id="qC"><option value="">整科综合</option>${chapsOf(sid).filter(c=>c.core).map(c=>`<option value="${esc(c.k)}" ${S.pickChap===c.k?"selected":""}>${esc(c.t)}</option>`).join("")}</select></label></div>
     <div class="controls"><label>题数<select id="qN">${[3,5,8,10,15].map(n=>`<option ${n===DRILL_N[dMode]?"selected":""}>${n}</option>`).join("")}</select></label><label>难度<select id="qD"><option>基础</option><option selected>SPM 中等</option><option>KBAT 偏难</option></select></label><button class="btn pri" id="qGo">开始</button></div>
     <div id="qMsg" class="fine muted"></div><p class="fine muted">作答题是一题一题做：写完点「提交批改」，AI 马上给分和评语，不用等整份卷做完。想做整份试卷请到「模拟卷」。AI 题目可能有错，可疑的请对照课本。答错或失分的会进入错题本。</p></div>`;
    const sync=()=>{const t=dMode,ai=t!=="mcq"||$("#qSrc").value==="ai";if(t!=="mcq")$("#qSrc").value="ai";$("#qSrc").querySelector('[value="bank"]').disabled=t!=="mcq"||!nb;$("#qCw").style.display=ai?"":"none";$("#qD").disabled=!ai;$("#qGo").disabled=ai&&!aiOK()};

      const k=$("#qC").value,c=k?findChap(sid,k):null;S.pickChap=k;setBusy($("#qGo"),true,"生成中…");
      try{const fp=await fileParts(sid);const ctx=c?`章节：${c.t}\n${chapText(c,3500)}`:"范围：这一科整个 KSSM 纲要 (Form 4 + Form 5)";const z=wantZh(sid);
        const nOpen=t==="open"?n:t==="mix"?Math.round(n/2):0,nMcq=n-nOpen;
        const spec=`${nMcq?`${nMcq} 道单选题 (4 个选项)`:""}${nMcq&&nOpen?" 和 ":""}${nOpen?`${nOpen} 道作答题 (${openHint(sid)})`:""}`;
        const fmt=`只输出 JSON 对象：{"items":[${nMcq?`{"t":"mcq","q":"题目","o":["A内容","B内容","C内容","D内容"],"a":0,"e":"解析","qz":"${z?"题目和选项的华文翻译":""}","ez":"${z?"解析的华文翻译与一句解释":""}"}`:""}${nMcq&&nOpen?",":""}${nOpen?`{"t":"open","q":"题目","m":3,"scheme":"评分要点 (逐点列出得分点，可接受的答案)","qz":"${z?"题目的华文翻译":""}","cz":"${z?"评分要点的华文翻译":""}"}`:""}]}。a 是正确选项序号 (0-3)；m 是该作答题的分值 (1-6，和难度匹配)。${t==="mix"?"两种题型交错排列。":""}`;
        const out=await gem([{role:"user",parts:[...fp.parts,{text:`为 SPM「${subj(sid).name}」出 ${spec}，共 ${n} 题。难度：${$("#qD").value}。\n${ctx}\n要求：贴近 KSSM 与 SPM 风格；每题有明确答案；解析写出关键步骤；不要编造资料里没有的内容；题目、选项、解析、评分要点用考试语言 (见【语言规则】)，${z?"qz、ez、cz 用华文":"不需要华文翻译，qz、ez、cz 留空字符串"}。\n${fmt}`}]}],sysPrompt(sid),12000,{json:"{"});

          if(Array.isArray(x.o)&&x.o.length===4&&Number.isInteger(x.a)&&x.a>=0&&x.a<4)return{t:"mcq",q:String(x.q),o:x.o,a:x.a,e:x.e||"",qz:x.qz||"",ez:x.ez||""};return null}).filter(Boolean);

      catch(e){setBusy($("#qGo"),false);$("#qMsg").innerHTML=`<span style="color:var(--bad)">${esc(e.message)}</span>`}};return}
  if(qz.fin){const mc=qz.qs.filter(x=>x.t!=="open").length;const oc=qz.qs.length-mc;
    box.innerHTML=`<div class="card qbox"><h3 style="margin-top:0">完成</h3>${mc?`<div class="row"><span class="muted">选择题</span><span class="score" style="font-size:34px">${qz.score}/${mc}</span></div>`:""}${oc?`<div class="row"><span class="muted">作答题</span><span class="score" style="font-size:34px">${Math.round(qz.osc*10)/10}/${qz.omax}</span></div>`:""}<p class="muted">答错或失分的题已放进错题本。</p><div class="row"><button class="btn pri" id="qAgain">再来一组</button><button class="btn" id="qWr">看错题本</button></div></div>`;
    $("#qAgain").onclick=()=>{qz=null;rQuiz()};$("#qWr").onclick=()=>{dMode="wrong";qz=null;rDrill()};return}
  const q=qz.qs[qz.i];if(q.t==="open")return renderOpen(q);renderMcq(q)}
function newRun(sid,qs,ai){return{sid,qs,i:0,score:0,osc:0,omax:0,picked:null,fin:false,ai,res:null,ans:"",img:null}}
function nextQ(){qz.i++;qz.picked=null;qz.res=null;qz.ans="";qz.img=null;if(qz.i>=qz.qs.length)qz.fin=true;rQuiz()}

function renderOpen(q){
  const box=$("#dBody"),r=qz.res;
  box.innerHTML=`<div class="qbox"><div class="fine muted">第 ${qz.i+1} / ${qz.qs.length} 题 · 作答题 <span class="tag">${q.m} 分</span> <span class="tag warn">AI 生成</span></div>
   <h3 style="margin:10px 0 6px;font-family:var(--sans);font-size:18px;white-space:pre-wrap">${esc(q.q)}</h3>${zhBox(q.qz)}
   <textarea id="oAns" placeholder="在这里作答" style="min-height:120px;margin-top:6px" ${r?"disabled":""}>${esc(qz.ans)}</textarea>

    const pct=max?Math.round(total/max*100):0;e.result={res,total,max,pct,added,skip:[...skip]};

let chatBusy=false,chatImg=null,chatPending=null,chatErr="";
function kwScore(c,q){const hay=(c.t+" "+c.subs.join(" ")+" "+plain(c.n)+" "+(S.notes[c.k]?S.notes[c.k].md:"")+" "+(S.req[c.k]||"")).toLowerCase();let sc=0;
  (q.toLowerCase().match(/[a-z]{3,}/g)||[]).forEach(w=>{if(hay.includes(w))sc+=2});const zh=q.replace(/[^\u4e00-\u9fff]/g,"");for(let i=0;i<zh.length-1;i++){if(hay.includes(zh.slice(i,i+2)))sc+=1}return sc}
async function buildCtx(sid,query){
  const cs=chapsOf(sid).filter(c=>c.core),key=S.scope[sid],blocks=[];let used=[];
  if(key){const c=cs.find(x=>x.k===key);if(c){blocks.push("【当前章节】"+c.t+"\n"+chapText(c,7000));used.push(c.t)}}
  else{cs.map(c=>({c,sc:kwScore(c,query)})).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc).slice(0,3).forEach(x=>{blocks.push("【相关章节】"+x.c.t+"\n"+chapText(x.c,3000));used.push(x.c.t)})}
  const reqs=cs.filter(c=>S.req[c.k]&&!used.includes(c.t)).slice(0,6).map(c=>c.t+"：要求 "+S.req[c.k]);if(reqs.length)blocks.push("【其他章节的学生要求】\n"+reqs.join("\n"));
  const catalog="【本科章节目录】\n"+cs.map(c=>c.t+(c.subs.length?"（"+c.subs.join("；")+"）":"")).join("\n");
  const fp=await fileParts(sid);
  const rule=S.strict?"回答规则：只依据下面【资料】和学生上传的文件作答。资料没有覆盖的点，先明确说「资料里没有这一点」，再用 SPM 通用知识补充，并在该段前标注 [通用知识]。不要把通用知识说成是课本原文。":"回答规则：优先依据下面【资料】和学生上传的文件；资料没写到的，可用 SPM 通用知识补充，并标注 [通用知识]。";
  return{system:sysPrompt(sid,rule+"\n"+FIGRULE+"\n\n"+catalog+"\n\n"+blocks.join("\n\n")),parts:fp.parts,used,files:fp.names}}

  <div id="msgs">${h.length?h.map(m=>`<div class="msg ${m.r}">${m.r==="user"?esc(m.t).replace(/\n/g,"<br>")+(m.img?'<div class="fine muted">(附了一张图片)</div>':""):`<div class="md">${md(m.t)}</div>${m.src&&m.src.length?`<div class="fine muted" style="margin-top:6px">参考：${esc(m.src.join("、"))}</div>`:""}${m.by?`<div class="fine muted" style="margin-top:4px">由 ${esc(m.by)} 回答</div>`:""}`}</div>`).join(""):`<div class="empty">例如：「讲一下判别式，再出 3 道练习」<br>「Kadar tindak balas 为什么升温变快？」<br>拍下不会的题，点下面的 📷 上传。</div>`}${chatBusy?`<div class="msg model muted"><span class="spin"></span>思考中…</div>`:""}${chatErr?`<div class="notice error">${esc(chatErr)}</div>`:""}</div>
  <div class="card" style="margin-top:10px">${chatImg?`<div class="fine" style="margin-bottom:6px">已附图片 <button class="btn small" id="chImgX">移除</button></div>`:""}

async function ask(text){
  if(chatBusy)return;const sid=S.sub,h=S.chat[sid]=S.chat[sid]||[];const img=chatImg;chatImg=null;chatErr="";
  h.push({r:"user",t:text,img:!!img});chatBusy=true;if(S.tab==="chat")rChat();
  try{const ctx=await buildCtx(sid,text);
    const hist=h.slice(-14).map((m,i,a)=>({role:m.r==="user"?"user":"model",parts:[{text:m.t}]}));
    const lastParts=hist[hist.length-1].parts;if(img)lastParts.unshift({inline_data:{mime_type:"image/jpeg",data:img}});ctx.parts.forEach((p,i)=>lastParts.splice(i,0,p));
    const out=await gem(hist,ctx.system+calcRule(sid)+(img?"\n学生附了题目图片：先准确读出题目，字迹看不清的地方要说明，再解答。":""),8192);
    h.push({r:"model",t:out,src:ctx.used.concat(ctx.files),by:aiLabel()})}
  catch(e){h.pop();chatErr=e.message}
  chatBusy=false;if(h.length>40)S.chat[sid]=h.slice(-40);save();if(S.tab==="chat"&&S.sub===sid)rChat()}

async function uploadToGemini(blob,name,mime){

  let start;try{start=await fetch("https://generativelanguage.googleapis.com/upload/v1beta/files?key="+encodeURIComponent(key),{method:"POST",headers:{"X-Goog-Upload-Protocol":"resumable","X-Goog-Upload-Command":"start","X-Goog-Upload-Header-Content-Length":String(blob.size),"X-Goog-Upload-Header-Content-Type":mime,"Content-Type":"application/json"},body:JSON.stringify({file:{display_name:name.slice(0,100)}})})}

  if(!start.ok){let d=null;try{d=await start.json()}catch(e){}throw new Error(aiErr(start.status,d))}
  const upUrl=start.headers.get("x-goog-upload-url");
  if(!upUrl)throw new Error("拿不到上传地址 (浏览器可能没有放行响应头)。可以先把文件拆小到 14 MB 以内再上传。");
  const info=await new Promise((ok,no)=>{const x=new XMLHttpRequest();x.open("POST",upUrl);x.setRequestHeader("X-Goog-Upload-Offset","0");x.setRequestHeader("X-Goog-Upload-Command","upload, finalize");
    let last=0;x.upload.onprogress=e=>{if(e.lengthComputable&&Date.now()-last>700){last=Date.now();toast(`上传「${name}」${Math.round(e.loaded/e.total*100)}%`)}};
    x.onload=()=>{if(x.status>=200&&x.status<300){try{ok(JSON.parse(x.responseText))}catch(e){no(new Error("上传返回的格式不对"))}}else{let d=null;try{d=JSON.parse(x.responseText)}catch(e){}no(new Error(aiErr(x.status,d)))}};
    x.onerror=()=>no(new Error("上传失败：网络中断，请重试。"));x.send(blob)});
  let file=info.file||info;
  for(let i=0;i<60&&file.state==="PROCESSING";i++){await sleep(2000);const r=await fetch("https://generativelanguage.googleapis.com/v1beta/"+file.name+"?key="+encodeURIComponent(key));if(r.ok)file=await r.json();else break}
  if(file.state==="FAILED")throw new Error("Google 无法处理这个文件，请换一个或拆分后再试。");
  return{uri:file.uri,mime:file.mimeType||mime,expires:file.expirationTime?new Date(file.expirationTime).getTime():Date.now()+47*3600e3}}
async function ensureRemote(f,mime){
  if(!gemOK())throw new Error("大文件要先上传到 Google，请先到「设置」填写 API key。");
  const r=f.remote;if(r&&r.expires-Date.now()>30*60e3&&r.keyId===keyTag())return r;
  toast(`正在上传「${f.name}」到 Google…`);
  const up=await uploadToGemini(f.blob,f.name,mime);f.remote={uri:up.uri,mime:up.mime,expires:up.expires,keyId:keyTag()};await DB.put(f);return f.remote}

function noteHTML(c){
  if(S.notes[c.k]){
    const live=document.getElementById("ai-"+c.k);
    if(live&&live.innerHTML.trim()){ /* 直接用页面上已经渲染好的内容：公式、自己划的重点都会保留 */
      const cl=live.cloneNode(true);cl.removeAttribute("id");
      cl.querySelectorAll("button,script,.no-print").forEach(x=>x.remove());
      return cl.innerHTML}
    return md(S.notes[c.k].md)}
  return c.n||""}
function printDoc(title,sections){
  const old=document.getElementById("printArea");if(old)old.remove();
  const box=document.createElement("div");box.id="printArea";
  const d=new Date().toLocaleDateString("zh-CN",{year:"numeric",month:"long",day:"numeric"});
  box.innerHTML=`<div class="pa-head"><h1>${esc(title)}</h1><div class="pa-meta">SPM 备考本 · 打印于 ${d}</div></div>`+
    sections.map((x,i)=>`<section class="pa-sec${i?" pa-break":""}">${x.t?`<h2 class="pa-title">${esc(x.t)}</h2>`:""}<div class="md">${x.html}</div></section>`).join("");
  document.body.appendChild(box);document.body.classList.add("printing");
  const oldTitle=document.title;document.title=title; /* 浏览器会拿它当 PDF 文件名 */
  let finished=false;
  const done=()=>{if(finished)return;finished=true;document.body.classList.remove("printing");box.remove();document.title=oldTitle;window.removeEventListener("afterprint",done)};
  window.addEventListener("afterprint",done);
  const needMath=/\\\(|\\\[|\$\$/.test(box.textContent);
  setTimeout(()=>{try{window.print()}catch(e){done();toast("这个浏览器不能直接打印，请用浏览器菜单里的「打印」")}},needMath?700:120)}
function printNote(sid,k){
  const c=findChap(sid,k);if(!c)return;
  const html=noteHTML(c);if(!html){toast("这一章还没有笔记可以打印");return}
  printDoc(`${subj(sid).name} · ${c.t}`,[{t:"",html}])}
function printSubj(sid){
  const cs=chapsOf(sid).filter(c=>S.notes[c.k]);
  if(!cs.length){toast("这一科还没有生成笔记");return}
  printDoc(`${subj(sid).name} 笔记`,cs.map(c=>({t:c.t,html:noteHTML(c)})))}

/* ---- 启动 ---- */
load();applyTheme();
const h0=(location.hash||"").slice(1);if(TABS.some(t=>t[0]===h0))S.tab=h0;else if(!TABS.some(t=>t[0]===S.tab)&&S.tab!=="set")S.tab="today";
render();
if(syncOn())setTimeout(()=>syncPull(false),1200);
window.__spm={S:()=>S,go};
})();

 bar.addEventListener("mousedown",e=>e.preventDefault());
 bar.addEventListener("click",e=>{const b=e.target.closest("button");if(!b||!cur)return;const {r,a,b:e2}=cur;let L=(H[r.id]||[]).slice();
  if(b.dataset.u==="add")L.push([a,e2]);else{const o=[];L.forEach(q=>{if(q[1]<=a||q[0]>=e2){o.push(q);return}if(q[0]<a)o.push([q[0],a]);if(q[1]>e2)o.push([e2,q[1]])});L=o}
  L=merge(L);if(L.length)H[r.id]=L;else delete H[r.id];sv();getSelection().removeAllRanges();hide();apply(r)});
 const q=new Set();let t=0;
 function run(){t=0;[...q].forEach(r=>{if(r.isConnected)apply(r)});q.clear()}
 function scan(n){if(n.nodeType!==1)return;(n.matches&&n.matches('.md[id^="ai-"]')?[n]:[...n.querySelectorAll?n.querySelectorAll('.md[id^="ai-"]'):[]]).forEach(r=>{if(H[r.id])q.add(r)})}
 new MutationObserver(ms=>{ms.forEach(m=>m.addedNodes.forEach(scan));if(q.size&&!t)t=setTimeout(run,400)}).observe(document.documentElement,{childList:true,subtree:true});
 window.addEventListener("load",()=>{scan(document.body);if(q.size)t=setTimeout(run,800)});
}catch(e){}})();
</script>

<script>
(function(){
  var bell=document.getElementById("btnBell"),set=document.getElementById("btnSet");
  if(!bell)return;
  var standalone=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||window.navigator.standalone===true;
  var dp=null;
  window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();dp=e;});
  window.addEventListener("appinstalled",function(){var b=document.getElementById("btnInstall");if(b)b.remove();dp=null;});

  /* ---- 铃铛右边的安装按钮 (已经装成 App 时不显示) ---- */
  if(!standalone){
    var b=document.createElement("button");
    b.className="btn line";b.id="btnInstall";b.type="button";
    b.setAttribute("aria-label","安装成 App");b.title="安装成 App";
    b.innerHTML='<span aria-hidden="true">📲</span>';
    bell.insertAdjacentElement("afterend",b);
    b.onclick=function(){
      if(dp){dp.prompt();dp.userChoice.then(function(){dp=null;});return;}
      showHelp();
    };
  }
  function showHelp(){
    var ua=navigator.userAgent,ios=/iphone|ipad|ipod/i.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
    var safari=/safari/i.test(ua)&&!/crios|fxios|edgios|chrome|android/i.test(ua);
    var steps;
    if(ios&&safari)steps="1. 点屏幕最下面中间的 <b>分享按钮</b> (方框加向上的箭头)<br>2. 往下滑，点 <b>添加到主屏幕</b><br>3. 点右上角 <b>添加</b>";
    else if(ios)steps="iPhone 只有 <b>Safari</b> 才能安装。请用 Safari 打开这个网址，再点底部的分享按钮 → <b>添加到主屏幕</b>。";
    else if(/android/i.test(ua))steps="点浏览器右上角的 <b>⋮</b> → <b>安装应用</b> (或 <b>添加到主屏幕</b>)。";
    else steps="Chrome / Edge：看地址栏最右边的 <b>安装图标</b>，或菜单里的 <b>安装 SPM备考本</b>。";
    var old=document.getElementById("pwaHelp");if(old)old.remove();
    var back=document.createElement("div");back.className="upd-back no-print";back.id="pwaHelp";
    back.innerHTML='<div class="upd" role="dialog" aria-label="安装成 App"><div class="row"><h2 style="margin:0">📲 安装成 App</h2><span class="spacer"></span><button class="btn small" id="pwaHelpX">关闭</button></div><p style="line-height:1.8;margin:12px 0 4px">'+steps+'</p><p class="fine muted" style="margin:8px 0 0">装好后桌面会有「SPM备考」图标，一点就进来，不用再开浏览器。</p></div>';
    document.body.appendChild(back);
    var close=function(){back.remove()};
    back.onclick=function(e){if(e.target===back)close()};
    document.getElementById("pwaHelpX").onclick=close;
  }

  /* ---- 新版本提醒：铃铛亮红点 + 底部提示条 ---- */
  var bar=document.createElement("div");bar.id="pwaBar";
  bar.innerHTML='<span>🔔 有新版本了</span><button type="button" id="pwaReload">刷新</button><button type="button" class="x" id="pwaLater" aria-label="稍后">✕</button>';
  document.body.appendChild(bar);
  document.getElementById("pwaReload").onclick=function(){location.reload()};
  document.getElementById("pwaLater").onclick=function(){bar.classList.remove("show")};
  function announce(){
    bell.classList.add("unread");
    bar.classList.add("show");
  }
  if("serviceWorker" in navigator){
    var hadCtrl=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.register("sw.js").then(function(reg){
      var check=function(){try{reg.update()}catch(e){}};
      document.addEventListener("visibilitychange",function(){if(!document.hidden)check()});
      setInterval(check,30*60*1000);
      reg.addEventListener("updatefound",function(){
        var nw=reg.installing;if(!nw)return;
        nw.addEventListener("statechange",function(){
          if(nw.state==="installed"&&navigator.serviceWorker.controller)announce();
        });
      });
    }).catch(function(){});
    navigator.serviceWorker.addEventListener("controllerchange",function(){if(hadCtrl)announce();});
  }
})();
</script>

<script>
(function(){
  var DOGS=["wallpapers/dog1.jpg","wallpapers/dog2.jpg","wallpapers/dog3.jpg","wallpapers/dog4.jpg","wallpapers/dog5.jpg"];
  var KEY="spm-wp-mode",EVERY=10000,MAX=12;
  var mode="",timer=null,idx=0,front=0,list=null,urls=[];
  var rot=true;try{rot=localStorage.getItem("spm-wp-rot")!=="0"}catch(e){}
  try{mode=localStorage.getItem(KEY)||""}catch(e){}
  if(mode!=="custom"&&mode!=="dogs")mode="";

  function say(m){try{if(typeof toast==="function")toast(m)}catch(e){}}
  function saveMode(){try{localStorage.setItem(KEY,mode)}catch(e){}}

  /* ---- 自定义图片存在 IndexedDB (比 localStorage 大得多) ---- */
  function db(){return new Promise(function(ok,no){try{var r=indexedDB.open("spm-wp",1);r.onupgradeneeded=function(){r.result.createObjectStore("kv")};r.onsuccess=function(){ok(r.result)};r.onerror=function(){no(r.error)}}catch(e){no(e)}})}
  function dbGet(k){return db().then(function(d){return new Promise(function(ok,no){var q=d.transaction("kv").objectStore("kv").get(k);q.onsuccess=function(){ok(q.result||null)};q.onerror=function(){no(q.error)}})})}
  function dbSet(k,v){return db().then(function(d){return new Promise(function(ok,no){var t=d.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=ok;t.onerror=function(){no(t.error)}})})}
  function dbDel(k){return db().then(function(d){return new Promise(function(ok,no){var t=d.transaction("kv","readwrite");t.objectStore("kv").delete(k);t.oncomplete=ok;t.onerror=function(){no(t.error)}})})}
  function shrink(file){return new Promise(function(ok,no){
    var u=URL.createObjectURL(file),im=new Image();
    im.onload=function(){var m=1600,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(u);c.toBlob(function(b){b?ok(b):no(new Error("toBlob"))},"image/jpeg",.85)};
    im.onerror=function(){URL.revokeObjectURL(u);no(new Error("bad image"))};im.src=u})}
  function shrinkAll(fs){var out=[];return fs.reduce(function(p,f){return p.then(function(){return shrink(f).then(function(b){out.push(b)},function(){})})},Promise.resolve()).then(function(){return out})}

  /* 自定义图片列表 (兼容旧版只存了一张的情况) */
  function loadList(){
    if(list)return Promise.resolve(list);
    return dbGet("customList").then(function(l){
      if(Array.isArray(l)){list=l;return l}
      return dbGet("custom").then(function(b){
        list=b?[b]:[];
        if(!b)return list;
        return dbSet("customList",list).then(function(){return dbDel("custom")}).catch(function(){}).then(function(){return list});
      });
    }).catch(function(){list=[];return list});
  }
  function persist(){return dbSet("customList",list)}
  function makeUrls(){urls.forEach(function(u){URL.revokeObjectURL(u)});urls=(list||[]).map(function(b){return URL.createObjectURL(b)})}

  /* ---- 壁纸图层 (两层交叉淡入淡出) ---- */
  var layer=document.createElement("div");layer.id="wpLayer";layer.setAttribute("aria-hidden","true");
  layer.innerHTML='<div class="wi"></div><div class="wi"></div>';
  var au=document.querySelector(".aurora");if(au)au.insertAdjacentElement("afterend",layer);else document.body.insertBefore(layer,document.body.firstChild);
  function setOn(v){layer.classList.toggle("on",v);document.body.classList.toggle("wp-on",v)}
  var wis=layer.querySelectorAll(".wi");
  var br=60;try{var sb=parseInt(localStorage.getItem("spm-wp-br"),10);if(sb>=25&&sb<=100)br=sb}catch(e){}
  layer.style.setProperty("--wpb",br/100);
  function sliderHTML(){return '<label class="fine" style="display:flex;align-items:center;gap:10px;margin-top:12px">壁纸亮度<input type="range" id="wpBr" min="25" max="100" value="'+br+'" style="flex:1;max-width:260px"><span id="wpBrV" style="min-width:3em">'+br+'%</span></label>'}
  function rotHTML(){return '<label class="chk" style="margin-top:12px"><input type="checkbox" id="wpRot" '+(rot?"checked":"")+'> 每 10 秒自动换一张</label>'}

  function sources(){return mode==="dogs"?DOGS:(mode==="custom"?urls:[])}
  function show(url){
    var nxt=front?0:1;
    wis[nxt].style.setProperty("--u",'url("'+new URL(url,location.href).href+'")');
    wis[nxt].classList.add("show");wis[front].classList.remove("show");front=nxt;
  }
  function clearShow(){wis[0].classList.remove("show");wis[1].classList.remove("show")}
  function paint(){
    var src=sources();if(!src.length)return;if(idx>=src.length)idx=0;
    var u=src[idx],im=new Image();im.onload=function(){if(sources()[idx]===u)show(u)};im.src=u;
  }
  function stop(){if(timer){clearInterval(timer);timer=null}}
  function restart(){
    stop();
    if(rot&&sources().length>1)timer=setInterval(function(){
      if(document.hidden)return;var s=sources();if(s.length<2)return;idx=(idx+1)%s.length;paint();
    },EVERY);
  }
  function apply(){
    stop();
    if(mode==="dogs"){idx=0;setOn(true);paint();restart();fillCard();return}
    if(mode==="custom"){
      loadList().then(function(l){
        if(mode!=="custom")return;
        if(!l.length){mode="";saveMode();setOn(false);clearShow();refreshBtns();return}
        makeUrls();idx=0;setOn(true);paint();restart();refreshBtns();
      });return;
    }
    setOn(false);clearShow();
  }

  /* ---- 设置页里的「壁纸」栏 ---- */
  var file=document.createElement("input");file.type="file";file.accept="image/*";file.multiple=true;file.style.display="none";document.body.appendChild(file);
  file.onchange=function(){
    var fs=Array.prototype.slice.call(file.files||[]);file.value="";if(!fs.length)return;
    loadList().then(function(l){
      var room=MAX-l.length;
      if(room<=0){say("最多 "+MAX+" 张，先删掉几张再添加");return}
      return shrinkAll(fs.slice(0,room)).then(function(bs){
        if(!bs.length){say("这些图片打不开，换几张试试");return}
        var was=mode==="custom";
        list=l.concat(bs);
        return persist().then(function(){
          if(fs.length>room)say("最多 "+MAX+" 张，多出来的没有加进去");
          mode="custom";saveMode();makeUrls();if(!was)idx=0;
          setOn(true);paint();restart();refreshBtns();
        });
      });
    }).catch(function(){say("保存图片失败了，换几张试试")});
  };
  function card(){return document.getElementById("wpCard")}
  function refreshBtns(){
    var c=card();if(!c)return;
    c.querySelectorAll("[data-wp=custom],[data-wp=dogs]").forEach(function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-wp")===mode))});
    fillCard();
  }
  function fillCard(){
    var c=card();if(!c)return;var box=c.querySelector("#wpBody");if(!box)return;
    if(mode==="dogs"){
      box.innerHTML='<div class="wthumbs">'+DOGS.map(function(u){return '<img src="'+u+'" alt="" loading="lazy">'}).join("")+'</div>'+rotHTML()+'<p class="fine muted" style="margin:6px 0 0">一共 5 张。插画 © MALTESE。</p>'+sliderHTML();
    }else if(mode==="custom"){
      var th=urls.map(function(u,i){return '<span class="wt"><img src="'+u+'" alt=""><button type="button" data-wp="rm" data-i="'+i+'" aria-label="删除这张">×</button></span>'}).join("");
      box.innerHTML='<div class="wthumbs">'+th+'</div><div class="controls"><button class="btn small" type="button" data-wp="pick">＋ 添加图片</button><button class="btn small" type="button" data-wp="del">全部删除</button></div>'+(urls.length>1?rotHTML():"")+'<p class="fine muted" style="margin:6px 0 0">可以一次选多张 (最多 '+MAX+' 张)。图片只保存在这台设备的浏览器里，不会上传到任何地方。</p>'+sliderHTML();
    }else box.innerHTML="";
  }
  function build(){
    var c=document.createElement("div");c.className="card";c.id="wpCard";c.style.marginTop="14px";
    c.innerHTML='<h3 style="margin-top:0">🖼️ 壁纸</h3><p class="fine muted">默认不用壁纸。点一下选用，再点一下取消。</p><div class="seg"><button type="button" data-wp="custom" aria-pressed="'+(mode==="custom")+'">自定义</button><button type="button" data-wp="dogs" aria-pressed="'+(mode==="dogs")+'">线条小狗</button></div><div id="wpBody"></div>';
    c.addEventListener("input",function(e){
      if(e.target.id!=="wpBr")return;
      br=+e.target.value;layer.style.setProperty("--wpb",br/100);
      var v=document.getElementById("wpBrV");if(v)v.textContent=br+"%";
      try{localStorage.setItem("spm-wp-br",String(br))}catch(_){}
    });
    c.addEventListener("change",function(e){
      if(e.target.id!=="wpRot")return;
      rot=e.target.checked;try{localStorage.setItem("spm-wp-rot",rot?"1":"0")}catch(_){}
      restart();
    });
    c.addEventListener("click",function(e){
      var b=e.target.closest("[data-wp]");if(!b)return;
      var w=b.getAttribute("data-wp");
      if(w==="pick"){file.click();return}
      if(w==="rm"){
        var i=+b.getAttribute("data-i");if(!list||isNaN(i))return;
        list.splice(i,1);
        (list.length?persist():dbDel("customList")).catch(function(){}).then(function(){
          if(!list.length){urls.forEach(function(u){URL.revokeObjectURL(u)});urls=[];mode="";saveMode();apply();refreshBtns();return}
          makeUrls();if(idx>=urls.length)idx=0;paint();restart();refreshBtns();
        });return;
      }
      if(w==="del"){
        list=[];dbDel("customList").catch(function(){}).then(function(){
          urls.forEach(function(u){URL.revokeObjectURL(u)});urls=[];mode="";saveMode();apply();refreshBtns();say("已删除全部自定义图片");
        });return;
      }
      if(mode===w){mode="";saveMode();apply();refreshBtns();return}
      if(w==="dogs"){mode="dogs";saveMode();apply();refreshBtns();return}
      loadList().then(function(l){
        if(l.length){mode="custom";saveMode();apply();refreshBtns()}else file.click();
      });
    });
    return c;
  }
  var sheet=document.getElementById("sheet");
  function inject(){
    if(!sheet||card())return;
    var h=sheet.querySelector("h2");
    if(!h||h.textContent.trim()!=="设置")return;
    var anchor=sheet.querySelector(".grid.g2")||h;
    anchor.insertAdjacentElement("afterend",build());
    fillCard();
  }
  if(sheet){new MutationObserver(inject).observe(sheet,{childList:true});inject()}
  apply();
})();
</script>
