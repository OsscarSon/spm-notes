lite above the Earth, r = R + h."],["Gravitational Field Strength and Weight","重力场强与重量",[["Gravitational field strength \\(g=\\dfrac{F}{m}=\\dfrac{GM}{r^{2}}\\) — force per unit mass (N kg⁻¹ = m s⁻²).","重力场强 g = F/m = GM/r²，单位 N/kg"],["Earth's surface: \\(g=9.81\\) N kg⁻¹ (M = 5.97 × 10²⁴ kg, R = 6.37 × 10⁶ m). g decreases as r increases (higher altitude).","地表 g = 9.81 N/kg；越高 g 越小"],["Weight \\(W=mg\\) is the gravitational force on an object (vector, newtons); mass is the amount of matter (scalar, kilograms) and does not change with place.","重量 W=mg 是矢量；质量是标量，不随地点变"],["Moon: g ≈ 1.6 N kg⁻¹, so a 60 kg astronaut weighs 60 × 1.6 ≈ 96 N there but still has a mass of 60 kg.","月球 g≈1.6：重量变小，质量不变"],["Relation between planets: \\(\\dfrac{g_1}{g_2}=\\dfrac{M_1}{M_2}\\left(\\dfrac{r_2}{r_1}\\right)^{2}\\).","行星比较：g₁/g₂ = (M₁/M₂)(r₂/r₁)²"]],"","Tip: 'Weight changes, mass does not' is a frequent exam statement."],["Worked Examples: Gravitation","例题：万有引力",[["Q1: Find the force between Earth (5.97 × 10²⁴ kg) and a 1 kg mass on its surface (R = 6.37 × 10⁶ m).","题1：地球与地表 1 kg 物体的引力"],["Step 1: \\(F=\\dfrac{(6.67\\times10^{-11})(5.97\\times10^{24})(1)}{(6.37\\times10^{6})^{2}}=9.81\\) N.","F ≈ 9.81 N"],["Q2: At what height above the surface is g reduced to ¼ of its surface value?","题2：g 变为地表 1/4 的高度？"],["Step 1: g ∝ 1/r², so g ÷ 4 means r = 2R. Step 2: h = 2R − R = R = 6.37 × 10⁶ m.","r = 2R，h = R = 6.37×10⁶ m"],["Q3: The force between two 5 kg spheres 0.5 m apart: \\(F=\\dfrac{(6.67\\times10^{-11})(5)(5)}{0.5^{2}}=6.67\\times10^{-9}\\) N.","题3：两 5 kg 球相距 0.5 m：F = 6.67×10⁻⁹ N"]],"","Tip: when r is doubled from the Earth's centre, h = R, not 2R."],["Centripetal Force and Circular Motion","向心力与圆周运动",[["An object moving in a circle at constant speed has a changing velocity (direction changes), so it accelerates towards the centre: \\(a=\\dfrac{v^{2}}{r}\\).","匀速圆周运动速度方向改变，加速度指向圆心 a = v²/r"],["Centripetal force \\(F=\\dfrac{mv^{2}}{r}\\) acts towards the centre; it does no work because it is perpendicular to the velocity.","向心力 F = mv²/r 指向圆心；与速度垂直不做功"],["Speed in a circle: \\(v=\\dfrac{2\\pi r}{T}\\).","圆周速度 v = 2πr/T"],["Sources of centripetal force: gravity for planets/satellites; tension for a stone on a string; friction for a car turning on a flat road.","向心力来源：重力、张力、摩擦力"],["Centripetal force is not an extra force; it is the name given to the resultant force that points towards the centre.","向心力是指向圆心的合力，不是额外的力"]],"","Tip: a larger v or a smaller r needs a larger centripetal force."],["Kepler's Laws","开普勒定律",[["First law: the orbit of a planet is an ellipse with the Sun at one focus.","第一定律：行星轨道是椭圆，太阳在一个焦点上"],["Second law: the line joining a planet to the Sun sweeps equal areas in equal times — the planet moves faster when nearer the Sun (perihelion).","第二定律：相等时间扫过相等面积；近日点速度最大"],["Third law: \\(T^{2}\\propto r^{3}\\), i.e. \\(\\dfrac{T^{2}}{r^{3}}=\\) constant for all planets orbiting the same body.","第三定律：T² ∝ r³，T²/r³ 为常数"],["For two planets: \\(\\left(\\dfrac{T_1}{T_2}\\right)^{2}=\\left(\\dfrac{r_1}{r_2}\\right)^{3}\\).","两行星：(T₁/T₂)² = (r₁/r₂)³"],["Graph of T² against r³ is a straight line through the origin.","T²-r³ 图是过原点的直线"]],"","Tip: Kepler's third law uses the same central body; Moon–Earth data cannot be compared with Earth–Sun data."],["Mass of the Central Body from Orbital Data","由轨道数据求中心天体质量",[["Gravity provides the centripetal force: \\(\\dfrac{GMm}{r^{2}}=\\dfrac{mv^{2}}{r}\\) and \\(v=\\dfrac{2\\pi r}{T}\\).","引力提供向心力，并代入 v = 2πr/T"],["Result: \\(M=\\dfrac{4\\pi^{2}r^{3}}{GT^{2}}\\). The mass of the satellite cancels out.","结果 M = 4π²r³/(GT²)，卫星质量被约去"],["Example: Moon r = 3.84 × 10⁸ m, T = 27.3 days = 2.36 × 10⁶ s → M ≈ 6.0 × 10²⁴ kg (the mass of the Earth).","例：月球数据可得地球质量约 6.0×10²⁴ kg"],["Example (Kepler): a planet orbits at 4 times the Earth–Sun radius. \\(T^{2}\\propto r^{3}\\) → T = 4^{1.5} = 8 years.","例：轨道半径为地球 4 倍 → T = 8 年"],["Higher orbits have longer periods and smaller speeds.","轨道越高周期越长、速度越小"]],"","Tip: convert days to seconds (× 86 400) and km to m before substituting."],["Man-made Satellites","人造卫星",[["Orbital speed from \\(\\dfrac{GMm}{r^{2}}=\\dfrac{mv^{2}}{r}\\): \\(v=\\sqrt{\\dfrac{GM}{r}}\\). It depends on the orbit radius and the central mass, not on the satellite's mass.","轨道速度 v = √(GM/r)，与卫星质量无关"],["The higher the orbit, the lower the speed and the longer the period.","轨道越高速度越小、周期越长"],["Geostationary satellite: period 24 h, orbits above the equator in the same direction as Earth's rotation, appears fixed in the sky at about 36 000 km above the surface. Uses: telecommunication, television broadcasting.","地球同步静止卫星：周期 24 h，在赤道上空，高约 36 000 km；用于通信与电视转播"],["Low Earth orbit (LEO, a few hundred km): remote sensing, imaging, space station; polar orbit passes over the poles. Medium Earth orbit: GPS navigation.","低轨道：遥感、空间站；极轨道；中轨道：GPS"],["Weightlessness in orbit: astronauts and the spacecraft are in free fall around the Earth, so there is no normal reaction force — gravity has not disappeared.","轨道上失重：处于自由落体状态，不是没有重力"]],"","Tip: 'apparent weightlessness' is due to free fall, not the absence of gravity."],["Escape Velocity","逃逸速度",[["Escape velocity is the minimum velocity needed by an object to escape from a planet's gravitational field without further propulsion.","逃逸速度：脱离星球引力场所需的最小速度"],["\\(v=\\sqrt{\\dfrac{2GM}{r}}=\\sqrt{2gr}\\). For Earth: v ≈ 11.2 km s⁻¹; Moon ≈ 2.4 km s⁻¹; Jupiter ≈ 59.5 km s⁻¹.","v = √(2GM/r)；地球约 11.2 km/s；月球 2.4；木星 59.5"],["Escape velocity does not depend on the mass of the object leaving.","逃逸速度与逃离物体质量无关"],["The Moon has almost no atmosphere because its escape velocity is low and gas molecules can escape; a larger planet with strong gravity can keep an atmosphere.","月球逃逸速度低，气体分子易逃逸，几乎没大气层"],["Worked example: Earth R = 6.37 × 10⁶ m, g = 9.81 → \\(v=\\sqrt{2(9.81)(6.37\\times10^{6})}=1.12\\times10^{4}\\) m s⁻¹.","算例：v = √(2×9.81×6.37×10⁶) = 1.12×10⁴ m/s"]],"","Tip: escape velocity is about √2 times the circular orbital velocity at the surface."],["Common Mistakes and Exam Tips","常见错误与考试提示",[["Using the height h instead of the distance r = R + h from the centre in \\(F=GMm/r^{2}\\).","公式里的 r 应是到中心的距离，不是高度"],["Forgetting to square r, or using km instead of m.","忘记平方或单位用 km"],["Saying 'no gravity' in orbit; astronauts experience weightlessness because they are in free fall.","轨道上并非没有重力"],["Treating mass and weight as the same; mass in kg, weight in N.","混淆质量与重量"],["Kepler's second law concerns equal areas (not equal distances) in equal times.","第二定律是相等面积，不是相等距离"]],"","Tip: always state units; G and M values are provided in the formula list, but know how to use them."],["Uji Diri","自测",[["S: State Newton's law of universal gravitation. J: The force between two masses is directly proportional to the product of the masses and inversely proportional to the square of the distance between their centres.","问：万有引力定律？答：与质量乘积成正比，与距离平方成反比"],["S: The distance between two masses is tripled. What happens to the force? J: It becomes 1/9 of the original.","问：距离变为 3 倍，引力？答：变为 1/9"],["S: State Kepler's third law. J: T² is proportional to r³ for planets orbiting the same body.","问：开普勒第三定律？答：T² ∝ r³"],["S: Why is a geostationary satellite always above the same point? J: Its period is 24 h, it orbits above the equator in the same direction as Earth rotates.","问：静止卫星为何总在同一点上空？答：周期 24 h，赤道上空，与地球同向"],["S: Does the escape velocity depend on the mass of the rocket? J: No; it depends on the mass and radius of the planet.","问：逃逸速度与火箭质量有关吗？答：无关，只与星球质量与半径有关"]],"",""]],"fiz|T4-4":[["Thermal Equilibrium","热平衡",[["Heat is a form of energy (joule, J) that flows from a hotter object to a colder object. Temperature is the degree of hotness of an object (°C or K).","热量是能量（J）；温度是冷热程度"],["Thermal equilibrium: two objects in thermal contact have the same temperature, so there is no net heat flow between them.","热平衡：两物体温度相同，无净热流"],["The net rate of heat transfer is zero at thermal equilibrium; the rate of heat gained = the rate of heat lost.","热平衡时净传热速率为零"],["Liquid-in-glass thermometer: the liquid expands uniformly with temperature; the thermometer reaches thermal equilibrium with the object before the reading is taken.","温度计与物体达到热平衡后才读数"],["Calibration with two fixed points: ice point (0 °C, pure melting ice) and steam point (100 °C, pure boiling water at standard pressure). \\(\\theta=\\dfrac{l_\\theta-l_0}{l_{100}-l_0}\\times100\\).","用两个固定点定标：冰点 0 °C、汽点 100 °C"]],"","Tip: 'Why wait before reading the thermometer?' → to reach thermal equilibrium."],["Specific Heat Capacity","比热容",[["Specific heat capacity c is the quantity of heat needed to raise the temperature of 1 kg of a substance by 1 °C (unit J kg⁻¹ °C⁻¹).","比热容：使 1 kg 物质升高 1 °C 所需热量"],["\\(Q=mc\\theta\\) where θ is the temperature change. Heat capacity \\(C=mc\\) (J °C⁻¹).","Q = mcθ；热容 C = mc"],["Water: c = 4200 J kg⁻¹ °C⁻¹ (very high); copper ≈ 390; aluminium ≈ 900.","水 4200，铜约 390，铝约 900"],["High c: heats up slowly and cools slowly, stores a lot of heat — water is used as a coolant and in hot-water bottles; sea breeze arises because land heats faster than sea.","c 大：升温慢、降温慢；水作冷却剂；海风成因"],["Low c: heats up quickly — cooking pots/pans made of metals.","c 小：升温快，适合做锅具"]],"","Tip: if electrical energy is supplied: \\(Pt=mc\\theta\\) (assuming no heat loss)."],["Experiment and Worked Example: Specific Heat Capacity","实验与例题：比热容",[["Electrical method: immersion heater (power P) heats a metal block/water of mass m; record temperature every minute; \\(Pt=mc\\theta\\).","电加热法：Pt = mcθ"],["Graph of θ against t: gradient = \\(\\dfrac{P}{mc}\\), so \\(c=\\dfrac{P}{m\\times\\text{gradient}}\\).","θ-t 图斜率 = P/(mc)"],["Precautions: lag the block with insulator, put a little oil in the thermometer hole, stir water, repeat readings.","保温层、温度计孔加油、搅拌"],["Q: How long does a 1000 W heater take to raise 2 kg of water from 20 °C to 70 °C? \\(t=\\dfrac{mc\\theta}{P}=\\dfrac{2\\times4200\\times50}{1000}=420\\) s.","题：1000 W 加热 2 kg 水 20→70 °C：t = 420 s"],["Heat loss to the surroundings makes the calculated value of c larger than the true value (more energy supplied than absorbed).","有热损失时测得的 c 偏大"]],"","Tip: write the energy equation first: 'electrical energy supplied = heat absorbed'."],["Specific Latent Heat","比潜热",[["Specific latent heat l is the quantity of heat needed to change the state of 1 kg of a substance at constant temperature (J kg⁻¹). \\(Q=ml\\).","比潜热：1 kg 物质在温度不变时改变状态所需热量 Q = ml"],["Latent heat of fusion (solid ↔ liquid): ice 3.34 × 10⁵ J kg⁻¹. Latent heat of vaporisation (liquid ↔ gas): water 2.26 × 10⁶ J kg⁻¹.","熔化潜热：冰 3.34×10⁵；汽化潜热：水 2.26×10⁶"],["During a change of state the temperature stays constant: the heat absorbed increases the potential energy of the molecules (breaks bonds), not their kinetic energy.","状态变化时温度不变：热量用于增加分子势能"],["The heating curve has flat parts at the melting and boiling points.","加热曲线在熔点、沸点处平直"],["Steam burns are worse than boiling-water burns: steam releases an extra large amount of latent heat when it condenses on skin.","蒸汽烫伤更严重：凝结放出大量潜热"]],"","Tip: during melting/boiling, temperature stays constant even though heat is still supplied."],["Worked Examples: Heat Calculations","例题：热量计算",[["Q1: Heat needed to melt 0.5 kg ice at 0 °C: \\(Q=ml=0.5\\times3.34\\times10^{5}=1.67\\times10^{5}\\) J.","题1：熔化 0.5 kg 冰：1.67×10⁵ J"],["Q2: 0.2 kg water at 80 °C is mixed with 0.3 kg water at 20 °C. Final temperature θ? Heat lost = heat gained.","题2：混合热水冷水求终温"],["0.2(4200)(80 − θ) = 0.3(4200)(θ − 20) → 16 − 0.2θ = 0.3θ − 6 → θ = 44 °C.","16 − 0.2θ = 0.3θ − 6 → θ = 44 °C"],["Q3: Heat to change 1 kg ice at −10 °C (c = 2100) to steam at 100 °C: ice warm 2.1 × 10⁴ + melt 3.34 × 10⁵ + water heat 4.2 × 10⁵ + boil 2.26 × 10⁶ ≈ 3.04 × 10⁶ J.","题3：分四段计算再相加"],["Always treat each stage separately: temperature change (mcθ) or state change (ml).","每个阶段分别计算"]],"","Tip: in mixing problems assume no heat loss unless told otherwise."],["Gas Laws and Kinetic Theory","气体定律与分子运动论",[["Gas pressure is caused by gas molecules colliding with the walls of the container and exerting force. Gas temperature relates to the average kinetic energy of molecules.","气体压强由分子撞击器壁产生"],["Absolute temperature: \\(T(\\text{K})=\\theta(\\text{°C})+273\\). Absolute zero = 0 K = −273 °C.","T(K) = θ + 273；绝对零度 −273 °C"],["Boyle's law: for fixed mass at constant temperature, \\(PV=\\) constant, \\(P_1V_1=P_2V_2\\).","玻意耳定律：T 不变，PV = 常数"],["Charles' law: constant pressure, \\(\\dfrac{V}{T}=\\) constant, \\(\\dfrac{V_1}{T_1}=\\dfrac{V_2}{T_2}\\) (T in kelvin).","查理定律：P 不变，V/T = 常数"],["Pressure law: constant volume, \\(\\dfrac{P}{T}=\\) constant. Combined: \\(\\dfrac{P_1V_1}{T_1}=\\dfrac{P_2V_2}{T_2}\\).","压强定律：V 不变，P/T = 常数；综合式"]],"","Tip: temperatures must be in kelvin in every gas-law calculation."],["Explaining the Gas Laws (Molecular)","用分子运动论解释气体定律",[["Boyle: volume decreases → molecules are closer → they hit the walls more frequently → the pressure increases (temperature unchanged so speed unchanged).","玻意耳：体积减小→碰撞更频繁→压强增大"],["Charles: temperature rises → molecules move faster → more force per collision; to keep the pressure constant the volume must expand so collisions per unit area are fewer.","查理：升温→分子更快；为保持压强，体积膨胀"],["Pressure law: temperature rises → molecules move faster → collisions are more frequent and more forceful → pressure increases (volume fixed).","压强定律：升温→碰撞更频繁更猛→压强增大"],["Graphs: P against 1/V — straight line through origin; V against T (K) — straight line through origin; extrapolating V–θ or P–θ graph meets the θ-axis at −273 °C.","P-1/V、V-T、P-T 图都是过原点直线；外推与 θ 轴交于 −273 °C"],["A gas cannot be cooled below absolute zero, where molecules would have minimum kinetic energy.","绝对零度时分子动能最小"]],"","Tip: use the structure: change in variable → effect on molecules → effect on collisions → effect on pressure/volume."],["Worked Examples: Gas Laws","例题：气体定律",[["Q1 (Boyle): 100 kPa, 2 m³ expands isothermally to 4 m³: \\(P_2=\\dfrac{100\\times2}{4}=50\\) kPa.","题1：玻意耳：50 kPa"],["Q2 (Charles): 300 cm³ of air at 27 °C is heated to 87 °C at constant pressure: T₁ = 300 K, T₂ = 360 K → \\(V_2=300\\times\\dfrac{360}{300}=360\\) cm³.","题2：查理：360 cm³"],["Q3 (Pressure law): a sealed tank at 27 °C and 200 kPa heated to 127 °C: \\(P_2=200\\times\\dfrac{400}{300}=267\\) kPa.","题3：压强定律：267 kPa"],["Q4: A bubble of volume 2 cm³ at the bottom of a lake (pressure 300 kPa, 7 °C) rises to the surface (100 kPa, 27 °C): \\(V_2=\\dfrac{300\\times2\\times300}{280\\times100}=6.4\\) cm³.","题4：气泡综合式：6.4 cm³"],["Check: pressure drops to a third and temperature rises slightly, so the volume must be a little more than triple.","检验：约为 3 倍多一点"]],"","Tip: when pressure is in kPa and volume in cm³, no need to convert if both sides use the same units."],["Common Mistakes and Exam Tips","常见错误与考试提示",[["Using °C instead of K in gas-law equations.","气体定律误用 °C"],["Forgetting that during melting/boiling the temperature does not change.","忘了状态变化时温度不变"],["Using Q = ml for a temperature change or Q = mcθ during a change of state.","混用 Q=ml 与 Q=mcθ"],["Mixing 'heat' and 'temperature' in explanations; heat is energy and temperature is hotness.","混淆热量与温度"],["For explanations, mention molecules' collisions with the walls: 'rate of collision' and 'force of collision'.","解释压强要提到分子碰撞频率和力"]],"","Tip: for 'explain' questions write 'more frequently' or 'faster' — the examiner looks for these key words."],["Uji Diri","自测",[["S: What is thermal equilibrium? J: The condition where two objects in thermal contact have the same temperature, so net heat flow is zero.","问：什么是热平衡？答：接触的两物体温度相同，无净热流"],["S: Calculate the heat needed to raise 0.5 kg of water by 40 °C. J: Q = 0.5 × 4200 × 40 = 84 000 J.","问：0.5 kg 水升温 40 °C 需多少热量？答：84 000 J"],["S: Why does the temperature stay constant when ice melts? J: The heat absorbed increases the potential energy of molecules (breaking bonds), not kinetic energy.","问：冰熔化时温度为何不变？答：热量增加分子势能"],["S: State Boyle's law. J: For a fixed mass of gas at constant temperature, pressure is inversely proportional to volume (PV constant).","问：玻意耳定律？答：温度不变，P 与 V 成反比"],["S: A gas at 300 K and 150 kPa is heated to 450 K at constant volume. New pressure? J: 150 × 450/300 = 225 kPa.","问：300 K、150 kPa 恒容升到 450 K？答：225 kPa"]],"",""]],"fiz|T4-5":[["Fundamentals of Waves","波的基本概念",[["A wave is a disturbance that transfers energy from one place to another without transferring matter; particles only oscillate about their equilibrium positions.","波传递能量而不传递物质"],["Transverse waves: oscillation perpendicular to the direction of travel (water waves, light, EM waves). Longitudinal waves: oscillation parallel to the direction (sound) — compressions and rarefactions.","横波：振动垂直传播方向；纵波：平行（声波）"],["Wavefront: line joining points with the same phase (e.g. all crests). Direction of the wave is perpendicular to the wavefront.","波前：同相位点连线；传播方向垂直波前"],["Amplitude A (maximum displacement), wavelength λ (distance between two consecutive points in phase), period T, frequency f = 1/T (Hz).","振幅 A、波长 λ、周期 T、频率 f = 1/T"],["Wave equation: \\(v=f\\lambda\\); speed = distance travelled by a wave in one period = λ/T.","波速公式 v = fλ"]],"","Tip: frequency is set by the source and does not change when the wave goes into another medium."],["Wave Graphs and Worked Examples","波的图像与例题",[["Displacement–time graph: gives the period T (horizontal distance for one complete oscillation) and amplitude. Displacement–distance graph: gives wavelength λ.","位移-时间图读周期；位移-距离图读波长"],["Q1: A ripple tank wave has f = 20 Hz, λ = 3.0 cm. \\(v=f\\lambda=20\\times0.03=0.60\\) m s⁻¹.","题1：v = 20 × 0.03 = 0.60 m/s"],["Q2: A sound wave of f = 500 Hz travels at 340 m s⁻¹. \\(\\lambda=\\dfrac{340}{500}=0.68\\) m.","题2：λ = 340/500 = 0.68 m"],["Q3: A displacement–time graph shows 2.5 complete oscillations in 0.5 s. T = 0.2 s, f = 5 Hz.","题3：0.5 s 内 2.5 次振动：T = 0.2 s，f = 5 Hz"],["Intensity (loudness/brightness) of a wave relates to amplitude; pitch relates to frequency.","振幅关联强度；频率关联音调"]],"","Tip: always convert cm to m (or cm s⁻¹) consistently before using v = fλ."],["Damping and Resonance","阻尼与共振",[["Natural frequency: the frequency at which a system oscillates freely after a disturbance. Damping: loss of energy of an oscillating system to the surroundings (air resistance, friction), so the amplitude decreases gradually; the period/frequency is unchanged.","阻尼：振动系统能量损失，振幅逐渐减小，频率不变"],["External damping: caused by air resistance/friction; internal damping: caused by internal friction of the material of the system.","外阻尼与内阻尼"],["Applications of damping: shock absorbers in vehicles, springs under a car, damping of a bridge.","应用：汽车避震器"],["Resonance: when an external periodic force has the same frequency as the natural frequency of the system, the system oscillates with maximum amplitude.","共振：驱动频率 = 固有频率，振幅最大"],["Barton's pendulums: the pendulum with the same length as the driver (same natural frequency) oscillates with maximum amplitude. Examples: swing, tuning a radio, microwave oven, bridge collapse (Tacoma Narrows).","巴顿摆：等长摆振幅最大；荡秋千、收音机调谐"]],"","Tip: 'resonance occurs when the driving frequency equals the natural frequency'."],["Reflection of Waves","波的反射",[["Law of reflection: angle of incidence i = angle of reflection r, both measured from the normal. The incident ray, reflected ray and normal lie in the same plane.","反射定律：入射角 = 反射角"],["After reflection: speed, wavelength and frequency are unchanged; only the direction changes (amplitude slightly decreases).","反射后 v、λ、f 不变，方向改变"],["Ripple tank: plane reflector gives plane wavefronts of the same shape; concave reflector converges the wavefronts to a focus; convex reflector diverges them.","涟漪槽：平面反射、凹面汇聚、凸面发散"],["Sound reflection: echo; \\(v=\\dfrac{2d}{t}\\) (the sound travels to the obstacle and back).","声波反射：v = 2d/t"],["Applications: sonar and ultrasound scanning, parabolic reflectors in satellite dishes.","应用：声呐、超声波、碟形天线"]],"","Tip: draw the normal as a dashed line and measure angles from the normal, not from the surface."],["Refraction of Waves","波的折射",[["Refraction is the change in direction of a wave when it travels from one medium to another because its speed changes (e.g. water depth change).","折射：速度改变导致传播方向改变"],["Deep → shallow: speed decreases, wavelength decreases, frequency unchanged; the wave bends towards the normal. Shallow → deep: speed and wavelength increase and the wave bends away from the normal.","深→浅：速度、波长减小，向法线偏折"],["Frequency never changes: \\(\\dfrac{\\sin i}{\\sin r}=\\dfrac{v_1}{v_2}=\\dfrac{\\lambda_1}{\\lambda_2}\\).","sin i/sin r = v₁/v₂ = λ₁/λ₂"],["Ripple tank: place a transparent plastic plate to create a shallower region; wavefronts become closer together there.","涟漪槽放塑料板制造浅水区"],["Sea waves: wavefronts approaching the shore become parallel to the beach because the depth decreases gradually.","海浪接近海岸时波前与海滩平行"]],"","Tip: if the wave enters at normal incidence (i = 0°), speed and wavelength still change but direction doesn't."],["Diffraction of Waves","波的衍射",[["Diffraction: spreading of waves when they pass through a gap or round an obstacle.","衍射：波通过缝隙/绕过障碍物时扩散"],["Effect is clearest when the gap width is about the same as, or smaller than, the wavelength; a wide gap gives only slight bending at the edges.","缝宽接近或小于波长时最明显"],["Speed, wavelength and frequency are unchanged; the amplitude (and intensity) decreases as the wave spreads.","v、λ、f 不变，振幅减小"],["A longer wavelength diffracts more: radio waves diffract round hills; low-pitched sound diffracts round corners more than high-pitched.","波长越长衍射越显著"],["Light shows little diffraction in daily life because its wavelength (~10⁻⁷ m) is far smaller than ordinary gaps.","光波长很小，日常难见衍射"]],"","Tip: 'Diffraction is more obvious when the wavelength is larger or the gap is narrower'."],["Interference of Waves and Young's Double-Slit","波的干涉与杨氏双缝",[["Principle of superposition: when two waves meet, the resultant displacement is the sum of the individual displacements.","叠加原理：合位移为分位移之和"],["Constructive interference: crest meets crest, path difference = nλ (n = 0, 1, 2…), maximum amplitude (antinodal lines). Destructive: crest meets trough, path difference = (n + ½)λ, minimum amplitude (nodal lines).","相长：波程差 nλ；相消：(n+½)λ"],["Conditions for observable interference: coherent sources — same frequency and constant phase difference.","相干源：同频率、相位差恒定"],["Young's double-slit: \\(\\lambda=\\dfrac{ax}{D}\\) where a = slit separation, x = distance between adjacent bright (or dark) fringes, D = distance from slits to screen.","杨氏双缝：λ = ax/D"],["x increases if λ increases (red > blue), if D increases or if a decreases.","x 随 λ、D 增大，随 a 增大而减小"]],"","Tip: sound interference with two loudspeakers gives loud and soft regions."],["Worked Example and Electromagnetic Waves","例题与电磁波",[["Q: Double slits are 0.50 mm apart; the screen is 2.0 m away; adjacent bright fringes are 2.4 mm apart. \\(\\lambda=\\dfrac{ax}{D}=\\dfrac{(0.5\\times10^{-3})(2.4\\times10^{-3})}{2.0}=6.0\\times10^{-7}\\) m = 600 nm.","题：λ = ax/D = 6.0×10⁻⁷ m = 600 nm"],["EM spectrum (low f → high f): radio waves, microwaves, infrared, visible light, ultraviolet, X-rays, gamma rays.","电磁波谱：无线电→微波→红外→可见光→紫外→X射线→γ射线"],["All EM waves are transverse, need no medium, and travel at \\(c=3.0\\times10^{8}\\) m s⁻¹ in a vacuum; from radio to gamma the frequency and energy increase while the wavelength decreases.","都是横波、不需介质、真空中 c=3.0×10⁸ m/s"],["Uses: radio – communication; microwave – cooking, radar; infrared – remote control, thermal imaging; visible – sight; UV – sterilisation, detecting forged notes; X-rays – medical imaging; gamma – cancer treatment, sterilising equipment.","用途"],["Hazards: UV – skin cancer; X-rays/gamma – cell damage; microwave – heating of tissue.","危害：紫外致皮肤癌；X/γ 损伤细胞"]],"","Tip: remember the order with 'Radio Microwave Infra-Red Visible UV X-ray Gamma' and match each with its use."],["Common Mistakes","常见错误",[["Mistake: saying frequency changes in refraction — frequency is fixed by the source.","错误：折射时频率改变"],["Mistake: confusing diffraction (spreading) with refraction (bending due to speed change).","错误：混淆衍射与折射"]],"",""],["Uji Diri","自测",[["S: What happens to wavelength when waves move from deep to shallow water? J: It decreases because the speed decreases and frequency is constant.","问：深→浅波长？答：减小，因速度减小而频率不变"],["S: State the condition for destructive interference. J: Path difference = (n + ½)λ (crest meets trough).","问：相消干涉条件？答：波程差 (n+½)λ"],["S: Why is resonance dangerous for a bridge? J: Wind/force at its natural frequency produces very large amplitude oscillations that may cause collapse.","问：共振为何危害桥梁？答：驱动频率等于固有频率，振幅极大可致坍塌"]],"",""]],"fiz|T4-6":[["Refraction of Light","光的折射",[["Refraction is the bending of light when it passes from one medium to another because its speed changes.","折射：光速改变使光线偏折"],["Into a denser medium (e.g. air → glass): light slows down and bends towards the normal; into a less dense medium: bends away from the normal.","进入光密介质：偏向法线；进入光疏：偏离法线"],["Snell's law: \\(\\dfrac{\\sin i}{\\sin r}=n\\) — refractive index (a constant for the two media). Frequency stays the same.","斯涅尔定律：sin i/sin r = n"],["\\(n=\\dfrac{c}{v}=\\dfrac{\\text{real depth}}{\\text{apparent depth}}\\); c = 3.0 × 10⁸ m s⁻¹. Typical n: water 1.33, glass 1.50, diamond 2.42.","n = c/v = 实深/视深"],["Experiment: measure r for different i, plot sin i against sin r — gradient = n.","实验：sin i - sin r 图斜率 = n"]],"","Tip: n has no unit; the greater the n, the slower light travels in that medium."],["Worked Examples: Refraction","例题：折射",[["Q1: A light ray enters glass with i = 45°, r = 28°. \\(n=\\dfrac{\\sin45^\\circ}{\\sin28^\\circ}=\\dfrac{0.707}{0.469}=1.51\\).","题1：n = sin45°/sin28° = 1.51"],["Q2: Speed of light in glass (n = 1.5): \\(v=\\dfrac{c}{n}=\\dfrac{3.0\\times10^{8}}{1.5}=2.0\\times10^{8}\\) m s⁻¹.","题2：v = c/n = 2.0×10⁸ m/s"],["Q3: A pool is 2.0 m deep (n = 1.33). Apparent depth = \\(\\dfrac{2.0}{1.33}=1.5\\) m — pools look shallower than they are.","题3：视深 = 2.0/1.33 = 1.5 m"],["Q4: Refraction examples: a straw looks bent in water; a coin in a bowl appears to rise when water is added; sunset appears earlier/later due to atmosphere refraction.","应用：吸管看似弯折"],["Ensure the calculator is in degree mode.","计算器要设为度数"]],"","Tip: draw the normal first; label angles i and r on the correct side."],["Total Internal Reflection","全内反射",[["Total internal reflection (TIR) occurs when light travels from a denser to a less dense medium and the angle of incidence exceeds the critical angle c — all light is reflected.","全内反射：光密→光疏且入射角 > 临界角"],["Critical angle c: the angle of incidence in the denser medium for which the angle of refraction is 90°. \\(\\sin c=\\dfrac{1}{n}\\).","临界角 c：折射角 90° 时的入射角；sin c = 1/n"],["Values: glass (n = 1.5) c ≈ 42°; water (n = 1.33) c ≈ 49°; diamond (n = 2.42) c ≈ 24°.","玻璃≈42°，水≈49°，钻石≈24°"],["Applications: optical fibres (telecommunication, endoscope), prism binoculars and periscopes, reflectors on bicycles and roads, mirage and rainbow formation.","光纤、棱镜、反光片、海市蜃楼"],["Mirage: layers of air near hot ground have a lower refractive index; light from the sky is totally internally reflected, looking like water on the road.","海市蜃楼：热空气折射率小"]],"","Tip: both conditions must be written: denser → less dense AND i > c."],["Worked Example and Applications of TIR","例题与应用",[["Q: Find the critical angle of glass (n = 1.5). \\(\\sin c=\\dfrac{1}{1.5}\\) → c = 41.8°.","题：玻璃 c = sin⁻¹(1/1.5) = 41.8°"],["Optical fibre: a glass core with higher n surrounded by cladding of lower n; light undergoes repeated TIR and carries signals over long distances with little loss.","光纤：纤芯 n 大，反复全内反射"],["Why use TIR prism in binoculars? It reflects light with almost 100% efficiency and no silvering is needed.","棱镜反射效率几乎 100%"],["Right-angled prism of glass: ray entering normally strikes the hypotenuse at 45° > 42°, so TIR occurs; two reflections turn the ray by 180° (binoculars) or 90° (periscope).","直角棱镜：45° > 42° 发生全内反射"],["Rainbow: refraction + dispersion + TIR inside raindrops.","彩虹：折射+色散+全内反射"]],"","Tip: when the angle of incidence equals c, the refracted ray travels along the boundary."],["Lenses and Terminology","透镜与术语",[["Convex (converging) lens is thicker at the centre and focuses parallel rays to the principal focus; concave (diverging) lens is thinner at the centre and spreads the rays out as if from a focus.","凸透镜汇聚；凹透镜发散"],["Terms: optical centre O, principal axis, focal point F, focal length f (distance from O to F), object distance u, image distance v.","光心 O、主轴、焦点 F、焦距 f、物距 u、像距 v"],["Ray rules (convex): ① ray parallel to the axis → refracts through F; ② ray through the optical centre → straight; ③ ray through F → refracts parallel to the axis.","三条特殊光线"],["Real image can be projected onto a screen (rays actually meet); virtual image cannot (rays only appear to come from it).","实像可以成在屏上；虚像不能"],["Lens power \\(P=\\dfrac{1}{f}\\) (f in metres, unit dioptre D).","透镜光焦度 P = 1/f"]],"","Tip: draw rays with a ruler and arrows; two rays are enough to locate the image."],["Image Characteristics of a Convex Lens","凸透镜成像规律",[["u > 2f: real, inverted, diminished image between f and 2f — camera.","u > 2f：倒立缩小实像，照相机"],["u = 2f: real, inverted, same size at 2f.","u = 2f：倒立等大实像"],["f < u < 2f: real, inverted, magnified image beyond 2f — projector.","f<u<2f：倒立放大实像，投影机"],["u = f: image formed at infinity (parallel rays). u < f: virtual, upright, magnified image on the same side as the object — magnifying glass.","u = f：成像于无穷远；u < f：正立放大虚像，放大镜"],["Concave lens: always virtual, upright, diminished, and located between the object and the lens.","凹透镜：总是正立缩小虚像"]],"","Tip: describe images with three words: nature (real/virtual), orientation (upright/inverted), size (magnified/diminished)."],["Thin Lens Formula","薄透镜公式",[["\\(\\dfrac{1}{f}=\\dfrac{1}{u}+\\dfrac{1}{v}\\); linear magnification \\(m=\\dfrac{v}{u}=\\dfrac{h_i}{h_o}\\).","1/f = 1/u + 1/v；m = v/u = h_i/h_o"],["Sign convention (real-is-positive): f positive for convex, negative for concave; v positive for real image, negative for virtual image; u positive for a real object.","符号：凸透镜 f 正，凹透镜 f 负；实像 v 正，虚像 v 负"],["Q1: Convex lens f = 10 cm, u = 30 cm: \\(\\dfrac{1}{v}=\\dfrac{1}{10}-\\dfrac{1}{30}=\\dfrac{2}{30}\\) → v = 15 cm; m = 15/30 = 0.5 (real, inverted, diminished).","题1：v = 15 cm，m = 0.5"],["Q2: f = 10 cm, u = 5 cm: \\(\\dfrac{1}{v}=\\dfrac{1}{10}-\\dfrac{1}{5}=-\\dfrac{1}{10}\\) → v = −10 cm (virtual); m = 2 (upright, magnified).","题2：v = −10 cm；m = 2"],["Q3: Concave lens f = −12 cm, u = 24 cm: \\(\\dfrac{1}{v}=-\\dfrac{1}{12}-\\dfrac{1}{24}=-\\dfrac{3}{24}\\) → v = −8 cm; virtual, diminished.","题3：v = −8 cm"]],"","Tip: when the answer is negative, say 'virtual image' and give the magnitude."],["Optical Instruments","光学仪器",[["Magnifying glass: convex lens with the object placed within its focal length (u < f); virtual, upright, magnified image.","放大镜：u < f"],["Compound microscope: two convex lenses — objective lens (short focal length, forms a real, inverted, magnified image) and eyepiece (longer focal length, acts as a magnifying glass producing the final virtual image); \\(f_o<f_e\\).","显微镜：物镜焦距短、目镜焦距较长 fo < fe"],["Astronomical telescope: objective with long focal length (collects light from distant objects, forms a real image at its focal plane) and eyepiece with short focal length; \\(f_o>f_e\\). Normal adjustment: separation = \\(f_o+f_e\\), magnification \\(M=\\dfrac{f_o}{f_e}\\).","天文望远镜：fo > fe；正常调节：间距 fo+fe，M = fo/fe"],["Camera: convex lens forms a real, inverted, diminished image on the film/sensor; adjust the lens distance to focus on objects at different distances.","照相机：倒立缩小实像"],["Projector: slide placed just beyond f (f < u < 2f), producing a real, inverted, magnified image on the screen (slide is inserted upside-down).","投影机：f < u < 2f"]],"","Tip: remember microscope: fo < fe; telescope: fo > fe."],["Spherical Mirrors","球面镜",[["Concave mirror (converging): reflects parallel rays to the focal point F; convex mirror (diverging): reflects rays so they appear to come from a focal point behind the mirror.","凹面镜汇聚；凸面镜发散"],["Terms: pole P, centre of curvature C, radius of curvature r = 2f, principal axis, focal length f.","极点 P、曲率中心 C、r = 2f"],["Concave mirror: u > 2f real, inverted, diminished; f < u < 2f real, inverted, magnified; u < f virtual, upright, magnified (shaving mirror, dentist's mirror).","凹面镜成像"],["Convex mirror: always virtual, upright, diminished; wide field of view — car side mirrors, shop security mirrors, road corners.","凸面镜：正立缩小虚像，视野宽"],["Mirror formula \\(\\dfrac{1}{f}=\\dfrac{1}{u}+\\dfrac{1}{v}\\) with the same sign rule (f positive for concave).","公式同薄透镜；凹面镜 f 为正"]],"","Tip: for ray diagrams of mirrors use the three rays: parallel→F; through F→parallel; through C→reflects back."],["Common Mistakes","常见错误",[["Mistake: measuring angles from the surface instead of from the normal.","错误：从界面而不是法线量角"],["Mistake: forgetting TIR needs light going from a denser to a less dense medium.","错误：忘了从光密到光疏"]],"",""],["Uji Diri","自测",[["S: Define refractive index. J: n = sin i / sin r = c / v = real depth / apparent depth.","问：折射率定义？答：sin i/sin r = c/v = 实深/视深"],["S: A ray inside glass (n = 1.5) strikes the boundary at 50°. Will TIR occur? J: Yes. c = 41.8° and 50° > 41.8°.","问：玻璃内 50° 入射会全内反射吗？答：会，50° > 41.8°"],["S: Convex lens, f = 20 cm, u = 30 cm. Find v. J: 1/v = 1/20 − 1/30 = 1/60 → v = 60 cm (real, inverted, magnified).","问：f=20、u=30，求 v？答：v = 60 cm"]],"",""]],"fiz|T5-1":[["Momentum and Conservation of Momentum","动量与动量守恒",[["Momentum \\(p=mv\\) (kg m s⁻¹) is a vector in the direction of velocity.","动量 p = mv，矢量"],["Principle of conservation of momentum: in a closed system with no external force, the total momentum before a collision/explosion = the total momentum after.","动量守恒：无外力的封闭系统，作用前后总动量相等"],["Elastic collision: objects separate after the collision; momentum and kinetic energy are both conserved. \\(m_1u_1+m_2u_2=m_1v_1+m_2v_2\\).","弹性碰撞：动量与动能都守恒"],["Inelastic collision: objects stick together or kinetic energy is lost (to heat/sound/deformation); momentum is still conserved. \\(m_1u_1+m_2u_2=(m_1+m_2)v\\).","非弹性碰撞：动量守恒，动能有损失"],["Explosion/recoil: total initial momentum is zero, so the two parts move in opposite directions: \\(0=m_1v_1+m_2v_2\\).","爆炸/反冲：总动量为零，两部分反向运动"]],"","Tip: choose one direction as positive; a velocity opposite to it is negative."],["Worked Examples: Momentum","例题：动量",[["Q1: A 2 kg trolley moving at 3 m s⁻¹ collides with a stationary 1 kg trolley and they stick together. \\(2(3)+1(0)=(2+1)v\\) → v = 2 m s⁻¹.","题1：粘在一起：v = 6/3 = 2 m/s"],["Kinetic energy before = ½(2)(3²) = 9 J; after = ½(3)(2²) = 6 J — a loss of 3 J, so the collision is inelastic.","动能 9 J → 6 J，损失 3 J：非弹性"],["Q2: A rifle of mass 4 kg fires a 0.01 kg bullet at 400 m s⁻¹. Recoil: \\(0=0.01(400)+4v\\) → v = −1 m s⁻¹ (rifle moves backward at 1 m s⁻¹).","题2：枪支反冲 1 m/s"],["Q3: A 0.5 kg ball moving at 4 m s⁻¹ hits a stationary 1.5 kg ball and stops; the other ball moves at v: 2 = 1.5v → v = 1.33 m s⁻¹.","题3：v = 1.33 m/s"],["Applications: rockets (gas expelled backward, rocket forward), jet engines, firearms.","应用：火箭、喷气发动机"]],"","Tip: write 'Total momentum before = total momentum after' before substituting numbers."],["Net Force and Newton's Laws","合力与牛顿定律",[["Newton's second law: the net (resultant) force on an object equals the rate of change of momentum: \\(F=\\dfrac{mv-mu}{t}\\); for constant mass \\(F=ma\\).","牛顿第二定律：合力 = 动量变化率，F = ma"],["Net force: if forces are balanced, F = 0 → constant velocity (or rest); if unbalanced, the object accelerates in the direction of the net force.","合力为零则匀速或静止"],["Newton's third law: when object A exerts a force on B, B exerts an equal and opposite force on A. The two forces act on different objects.","第三定律：作用力与反作用力等大反向、作用在不同物体上"],["Weight \\(W=mg\\); normal reaction R acts perpendicular to a surface; friction opposes motion.","重量 W=mg；法向力 R；摩擦力阻碍运动"],["Q: A 1200 kg car; engine force 3000 N, friction 600 N. Net force = 3000 − 600 = 2400 N → \\(a=\\dfrac{2400}{1200}=2\\) m s⁻².","题：合力 2400 N → a = 2 m/s²"]],"","Tip: always draw a free-body diagram showing all forces before writing F = ma."],["Net Force: Lifts and Inclined Surface","合力：电梯与斜面",[["Lift accelerating upwards: \\(R-mg=ma\\) → \\(R=m(g+a)\\) (apparent weight larger). Accelerating downwards: \\(R=m(g-a)\\) (smaller). Constant velocity: \\(R=mg\\). Free fall: R = 0 (weightlessness).","电梯：上加速 R=m(g+a)；下加速 R=m(g−a)；匀速 R=mg"],["Q: A 60 kg person in a lift accelerating upward at 2 m s⁻². \\(R=60(9.81+2)=709\\) N.","题：R = 60 × 11.81 = 709 N"],["Smooth inclined plane: the component of weight along the slope \\(mg\\sin\\theta\\) causes the acceleration \\(a=g\\sin\\theta\\). Normal reaction \\(R=mg\\cos\\theta\\).","光滑斜面：a = g sinθ；R = mg cosθ"],["Q: a 2 kg block on a smooth slope of 30°: a = 9.81 × sin30° = 4.9 m s⁻².","题：30° 斜面：a = 4.9 m/s²"],["With friction f: \\(ma=mg\\sin\\theta-f\\).","有摩擦：ma = mg sinθ − f"]],"","Tip: the person feels heavier when the lift accelerates upwards because the reaction force R increases."],["Impulse and Impulsive Force","冲量与冲力",[["Impulse = change in momentum = \\(Ft=mv-mu\\) (N s). Impulsive force = rate of change of momentum during a collision, \\(F=\\dfrac{mv-mu}{t}\\), acting over a very short time.","冲量 = 动量变化 = Ft；冲力 F = (mv−mu)/t"],["For the same change in momentum, a longer contact time gives a smaller impulsive force.","动量变化相同，作用时间越长冲力越小"],["Reduce impulsive force (increase t): airbags, car crumple zones, gymnastic mats, bending knees when landing, padded helmets, cushions, packaging.","延长时间：安全气囊、车身溃缩区、垫子、弯曲膝盖"],["Increase impulsive force (decrease t): hammer on a nail, karate chop, pile driver, golf club hitting the ball (hard surface).","缩短时间：锤子、空手道、打桩机"],["Q: A 0.15 kg ball at 20 m s⁻¹ is caught and stopped in 0.01 s: \\(F=\\dfrac{0-0.15(20)}{0.01}=-300\\) N (magnitude 300 N). Stopped in 0.1 s: only 30 N.","题：0.01 s 内停住：300 N；0.1 s：30 N"]],"","Tip: explanation formula: 'longer time → smaller rate of change of momentum → smaller impulsive force'."],["Resolution of Forces","力的分解",[["Resolving a force into two perpendicular components: horizontal \\(F_x=F\\cos\\theta\\), vertical \\(F_y=F\\sin\\theta\\) (θ measured from the horizontal).","力分解：Fx = F cosθ，Fy = F sinθ（θ 与水平方向夹角）"],["Resultant of two perpendicular forces: \\(R=\\sqrt{F_1^{2}+F_2^{2}}\\), direction \\(\\tan\\alpha=\\dfrac{F_2}{F_1}\\).","两垂直力合力 R = √(F₁²+F₂²)"],["Resultant of two forces at an angle: parallelogram method or triangle of forces (head to tail). Draw to scale or use trigonometry.","平行四边形法/三角形法"],["Q: A boy pulls a sledge with 50 N at 30° above the horizontal: \\(F_x=50\\cos30^\\circ=43.3\\) N (pulls forward); \\(F_y=50\\sin30^\\circ=25\\) N (reduces the normal reaction).","题：Fx = 43.3 N，Fy = 25 N"],["Resolution along and perpendicular to a slope: along the slope \\(mg\\sin\\theta\\), perpendicular \\(mg\\cos\\theta\\).","沿斜面分量 mg sinθ，垂直分量 mg cosθ"]],"","Tip: check whether the angle is measured from the horizontal or the vertical before choosing cos or sin."],["Forces in Equilibrium","力的平衡",[["An object is in equilibrium when the resultant force is zero: it is at rest or moves at constant velocity. Three forces in equilibrium form a closed triangle.","受力平衡：合力为零；三力平衡形成闭合三角形"],["Condition: sum of upward forces = sum of downward; sum of leftward = sum of rightward (horizontal and vertical components balance).","水平方向与竖直方向各自平衡"],["Q1: A lamp of weight 40 N hangs from two equal strings each at 30° to the horizontal: \\(2T\\sin30^\\circ=40\\) → T = 40 N.","题1：2T sin30° = 40 → T = 40 N"],["Q2: A block on a rough slope at constant velocity: friction f = mg sinθ and R = mg cosθ.","题2：匀速下滑：f = mg sinθ"],["Q3: Three forces — 6 N east, 8 N north and F — are in equilibrium: F = \\(\\sqrt{6^2+8^2}\\) = 10 N pointing south-west (opposite the resultant).","题3：F = 10 N，与合力反向"]],"","Tip: a smaller angle between two strings and the horizontal means a larger tension for the same load."],["Elasticity and Hooke's Law","弹性与胡克定律",[["Elasticity: property of a material to return to its original shape and size after the force is removed. Elastic limit: the maximum force beyond which the spring does not return to its original length.","弹性；弹性限度"],["Hooke's law: the extension of a spring is directly proportional to the applied force provided the elastic limit is not exceeded. \\(F=kx\\) (k = spring constant, N m⁻¹).","胡克定律：F = kx"],["Force–extension graph: straight line through the origin up to the limit of proportionality; gradient = k; area under graph = elastic potential energy \\(E=\\tfrac12Fx=\\tfrac12kx^{2}\\).","F-x 图：斜率 = k；面积 = 弹性势能 ½Fx"],["Stiffer spring (larger k): shorter length, thicker wire, smaller coil diameter, material of greater stiffness. Greater extension per newton: longer, thinner, larger diameter.","k 更大的弹簧：较短、线径粗、圈径小"],["Springs in series: each spring has the same force, total extension adds → effective constant \\(k/2\\) for two identical springs. In parallel: force shares → extension halves → effective constant \\(2k\\).","串联：k/2；并联：2k（相同弹簧）"]],"","Tip: the graph that goes beyond the elastic limit curves — Hooke's law no longer applies."],["Worked Example: Elasticity","例题：弹性",[["Q1: A spring extends 5 cm under a 10 N load. \\(k=\\dfrac{F}{x}=\\dfrac{10}{0.05}=200\\) N m⁻¹.","题1：k = 10/0.05 = 200 N/m"],["Q2: Extension under 15 N: \\(x=\\dfrac{15}{200}=0.075\\) m = 7.5 cm.","题2：x = 15/200 = 7.5 cm"],["Q3: Elastic potential energy at 5 cm: \\(E=\\tfrac12kx^{2}=\\tfrac12(200)(0.05)^2=0.25\\) J.","题3：E = 0.25 J"],["Q4: Two identical springs (k = 200 N m⁻¹) in series support 10 N: each extends 5 cm → total 10 cm → effective k = 100 N m⁻¹. In parallel: each carries 5 N → x = 2.5 cm → effective k = 400 N m⁻¹.","题4：串联 100 N/m；并联 400 N/m"],["Application: car suspension, trampolines, weighing balances, mattresses.","应用：悬架、弹簧秤"]],"","Tip: convert extension into metres before multiplying by k."],["Work, Energy, Power and Efficiency (Support)","功、能、功率与效率（辅助）",[["Work \\(W=Fs\\) (J), where s is the displacement in the direction of force. Kinetic energy \\(E_k=\\tfrac12mv^{2}\\); gravitational potential energy \\(E_p=mgh\\).","功 W = Fs；动能 ½mv²；重力势能 mgh"],["Principle of conservation of energy: energy cannot be created or destroyed, only transformed. Free fall: \\(mgh=\\tfrac12mv^{2}\\) → \\(v=\\sqrt{2gh}\\).","能量守恒；自由落体 v = √(2gh)"],["Power \\(P=\\dfrac{W}{t}=\\dfrac{E}{t}\\) (W). Efficiency \\(=\\dfrac{\\text{useful output energy}}{\\text{total input energy}}\\times100\\%\\).","功率 P = W/t；效率 = 有用输出/总输入 × 100%"],["Q: A motor lifts 20 kg by 5 m in 10 s: P = 20 × 9.81 × 5 / 10 = 98 W; if the input power is 150 W, efficiency = 65%.","题：功率 98 W；效率 65%"],["Elastic potential energy of a spring is converted into kinetic energy (e.g. toy car).","弹性势能转化为动能"]],"","Tip: if the question mentions 'energy converted', check that the energy of the answer does not exceed the input."],["Common Mistakes and Exam Tips","常见错误与考试提示",[["Forgetting that momentum is a vector: opposite directions must have opposite signs.","动量是矢量，方向相反符号相反"],["Using the mass instead of the net force in F = ma when friction exists.","有摩擦时 F 要用合力"],["Confusing 'action–reaction' forces with balanced forces: action–reaction acts on different bodies.","作用-反作用在不同物体上"],["Using the extension x as the total length of the spring in Hooke's law.","x 是伸长量，不是弹簧总长"],["Forgetting the explanation key words for impulsive force: 'longer time, smaller rate of change of momentum'.","冲力解释的关键词"]],"","Tip: show formula → substitution → answer with unit in every calculation."],["Uji Diri","自测",[["S: State the principle of conservation of momentum. J: In a closed system with no external force, total momentum before a collision equals total momentum after.","问：动量守恒原理？答：无外力封闭系统，碰撞前后总动量相等"],["S: A 3 kg trolley at 4 m s⁻¹ hits a stationary 1 kg trolley and they stick. Final velocity? J: 12 = 4v → v = 3 m s⁻¹.","问：3 kg 4 m/s 撞 1 kg 静止并粘住？答：3 m/s"],["S: Why does an airbag reduce injury? J: It increases the collision time, so the impulsive force is reduced for the same change in momentum.","问：安全气囊为何减伤？答：延长时间，冲力减小"],["S: A force of 30 N acts at 60° to the horizontal. Find the horizontal component. J: 30 cos60° = 15 N.","问：30 N 与水平成 60°，水平分量？答：15 N"],["S: A spring has k = 250 N m⁻¹. Find the energy stored when extended by 4 cm. J: ½(250)(0.04²) = 0.20 J.","问：k=250 N/m，伸长 4 cm 储能？答：0.20 J"]],"",""]],"fiz|T5-2":[["Pressure and Pressure in Liquids","压强与液体压强",[["Pressure is the force per unit area acting perpendicular to a surface: \\(P=\\dfrac{F}{A}\\) (Pa = N m⁻²).","压强 P = F/A，单位 Pa"],["Larger area → smaller pressure (snow shoes, wide tyres, wide base of a building); smaller area → larger pressure (knife, needle, drawing pin).","面积大压强小；面积小压强大"],["Liquid pressure \\(P=h\\rho g\\): increases with depth h, density ρ and gravitational field strength g; independent of the shape of the container or the cross-sectional area.","液体压强 P = hρg；与容器形状无关"],["Pressure at the same depth in the same liquid is the same in all directions.","同一深度各方向压强相同"],["Applications: dam walls are thicker at the base; deep-sea divers/submarines need strong hulls; water tanks placed high to give pressure in taps.","应用：水坝底部较厚；潜水器；高位水塔"]],"","Tip: liquid pressure depends on depth, not on the amount of liquid."],["Worked Examples: Liquid Pressure","例题：液体压强",[["Q1: Pressure due to the sea at depth 20 m (ρ = 1025 kg m⁻³): \\(P=20\\times1025\\times9.81=2.01\\times10^{5}\\) Pa.","题1：P = 20×1025×9.81 = 2.01×10⁵ Pa"],["Q2: A boy exerts 600 N through shoes of total area 0.04 m²: \\(P=\\dfrac{600}{0.04}=1.5\\times10^{4}\\) Pa.","题2：P = 600/0.04 = 1.5×10⁴ Pa"],["Q3: Water at 1.5 m deep (ρ = 1000): \\(P=1.5\\times1000\\times9.81=14\\,715\\) Pa ≈ 14.7 kPa. At the base of a 30 m dam wall: 294 kPa.","题3：1.5 m 深：14.7 kPa"],["Compare two liquids: equal pressure → \\(h_1\\rho_1=h_2\\rho_2\\) (e.g. oil column is taller than water column).","等压时 h₁ρ₁ = h₂ρ₂"],["Total pressure at depth in a lake = atmospheric pressure + \\(h\\rho g\\).","湖中总压强 = 大气压 + hρg"]],"","Tip: write depth in metres, density in kg m⁻³."],["Atmospheric Pressure","大气压强",[["Atmospheric pressure is caused by the weight of the air above us acting on a surface. Standard value: 101 kPa ≈ 760 mm Hg ≈ 10.3 m of water.","大气压强由空气重量产生；约 101 kPa = 760 mmHg"],["Atmospheric pressure decreases with altitude because the air is thinner (less air above). Boiling point of water is lower at high altitude.","海拔越高大气压越小"],["Simple mercury barometer: a glass tube filled with mercury inverted in a mercury dish; the height of the mercury column (760 mm at sea level) measures atmospheric pressure. \\(P_{atm}=h\\rho g\\) with \\(\\rho_{Hg}=13\\,600\\).","水银气压计：P = hρg"],["Aneroid barometer: a sealed metal box that expands/contracts; a pointer shows pressure; also used as an altimeter.","无液气压计"],["Applications: drinking through a straw, syringe, rubber suction cup, siphon, vacuum cleaner, vacuum pump.","应用：吸管、注射器、吸盘、虹吸"]],"","Tip: the liquid in a straw is pushed up by atmospheric pressure, not 'sucked'."],["Gas Pressure and Manometer","气体压强与压强计",[["Gas pressure is the force of gas molecules colliding with the walls of the container, per unit area.","气体压强：分子撞击器壁产生"],["Bourdon gauge: a curved flexible tube that straightens when the gas pressure increases; pointer shows the gauge pressure.","波登压力计"],["U-tube manometer: the difference in liquid levels h measures the gas pressure relative to atmospheric pressure: \\(P_{gas}=P_{atm}+h\\rho g\\) (gas pressure higher) or \\(P_{atm}-h\\rho g\\).","U 形管压强计：P气 = P大气 ± hρg"],["Q: Mercury level in the arm connected to the gas is 8 cm lower than the open arm (P_atm = 76 cmHg): \\(P_{gas}=76+8=84\\) cm Hg ≈ 1.12 × 10⁵ Pa.","题：P = 76 + 8 = 84 cmHg"],["Using water in the manometer gives a much larger h for the same pressure — more sensitive but taller.","用水比水银更灵敏但更高"]],"","Tip: compare the two liquid surfaces at the same horizontal level when writing equations."],["Pascal's Principle","帕斯卡原理",[["Pascal's principle: pressure applied to an enclosed fluid is transmitted equally to every part of the fluid.","帕斯卡原理：密闭流体的压强向各方向等值传递"],["Hydraulic system: \\(\\dfrac{F_1}{A_1}=\\dfrac{F_2}{A_2}\\); a small force on a small piston produces a large force on a large piston. Distances: \\(F_1d_1=F_2d_2\\) (work in = work out) so the small piston moves further.","液压系统 F₁/A₁ = F₂/A₂；小活塞移动距离更大"],["Q: A 100 N force acts on a 5 cm² piston; the large piston has area 200 cm². \\(F_2=100\\times\\dfrac{200}{5}=4000\\) N. If the small piston moves 20 cm, the large moves 0.5 cm.","题：F₂ = 4000 N；大活塞移 0.5 cm"],["Applications: hydraulic jack, car brakes, hydraulic lift, excavator arms, dentist chair.","应用：千斤顶、刹车系统"],["Brake fluid must be incompressible and air bubbles must be removed (air compresses and reduces transmitted pressure).","刹车油不可压缩；要排空气"]],"","Tip: fluid must be incompressible and the system sealed for Pascal's principle to apply."],["Archimedes' Principle and Buoyancy","阿基米德原理与浮力",[["Archimedes' principle: the buoyant force on an object immersed in a fluid equals the weight of the fluid displaced.","阿基米德原理：浮力 = 排开流体的重量"],["\\(F_b=\\rho_{fluid}Vg\\) where V is the volume of displaced fluid (submerged volume).","F浮 = ρVg，V 为排开体积"],["Floating object: \\(F_b=W\\) (weight of object = weight of water displaced). It sinks if its average density is greater than the fluid; floats if less.","漂浮：浮力 = 重力；密度小于流体则浮"],["Applications: ships (Plimsoll line, less dense overall due to air spaces), submarines (ballast tanks), hot-air balloons, hydrometers (deeper in less dense liquid).","应用：轮船吃水线、潜艇、热气球、比重计"],["Q: A 2 kg block of volume 0.001 m³ is fully submerged in water. \\(F_b=1000\\times0.001\\times9.81=9.81\\) N; weight = 19.6 N → apparent weight 9.8 N and it sinks (density 2000 > 1000).","题：浮力 9.81 N；视重 9.8 N；下沉"]],"","Tip: for floating objects, equate the weight of the object with the weight of displaced liquid."],["Bernoulli's Principle","伯努利原理",[["Bernoulli's principle: in a moving fluid, where the speed of the fluid is high, the pressure is low; where the speed is low, the pressure is high.","伯努利原理：流速大处压强小"],["Aerofoil (aeroplane wing): air above the curved top moves faster → lower pressure; the higher pressure below gives upward lift.","机翼升力：上方气流快压强小"],["Venturi tube: in the narrow section the speed is higher and pressure is lower (the liquid level in the thin tube above is lower).","文丘里管：窄处速度大压强小"],["Applications: Bunsen burner (air drawn in), spray gun/insect sprayer, carburettor, curveball, chimneys with wind passing over the top.","应用：本生灯、喷雾器、化油器"],["In a narrow pipe the same volume flow needs a higher fluid speed (continuity).","窄管内流速增大（连续性）"]],"","Tip: say 'faster flow, lower pressure' and then explain the resulting force from the high-pressure side."],["Common Mistakes","常见错误",[["Mistake: liquid pressure depends on the weight of liquid or the shape of the container — it depends only on depth, density and g.","错误：液体压强取决于容器形状/重量"],["Mistake: forgetting to add atmospheric pressure when the question asks for total/absolute pressure.","错误：总压强忘加大气压"]],"",""],["Uji Diri","自测",[["S: State Pascal's principle. J: Pressure applied to an enclosed fluid is transmitted uniformly in all directions.","问：帕斯卡原理？答：密闭流体压强等值向各方向传递"],["S: Why do aeroplanes experience lift? J: Air above the wing travels faster, giving lower pressure; the higher pressure below pushes the wing up.","问：机翼为何有升力？答：上方流速大压强小"],["S: A block of volume 0.002 m³ floats with half submerged in water. Buoyant force? J: Fb = 1000 × 0.001 × 9.81 = 9.81 N (equal to its weight).","问：0.002 m³ 的块半浸水中，浮力？答：9.81 N，等于重量"]],"",""]],"fiz|T5-3":[["Current and Potential Difference","电流与电势差",[["Electric current is the rate of flow of charge: \\(I=\\dfrac{Q}{t}\\) (ampere, A = C s⁻¹). Charge \\(Q=ne\\) with \\(e=1.6\\times10^{-19}\\) C.","电流 I = Q/t；Q = ne"],["Conventional current flows from the positive to the negative terminal; electrons actually flow the opposite way in a conductor.","约定电流由正到负；电子反向"],["Potential difference (voltage) is the work done (energy transferred) per unit charge: \\(V=\\dfrac{W}{Q}\\) (volt, V = J C⁻¹).","电势差 V = W/Q"],["Ammeter is connected in series (low resistance); voltmeter is connected in parallel (high resistance).","电流表串联；电压表并联"],["Q: 3.0 × 10²⁰ electrons pass a point in 60 s: Q = 3.0×10²⁰ × 1.6×10⁻¹⁹ = 48 C; I = 48/60 = 0.8 A. Energy for 12 V and 48 C: W = QV = 576 J.","题：I = 0.8 A；W = 576 J"]],"","Tip: 1 volt = 1 joule of energy transferred per coulomb of charge."],["Resistance and Ohm's Law","电阻与欧姆定律",[["Resistance \\(R=\\dfrac{V}{I}\\) (ohm, Ω = V A⁻¹): the opposition to the flow of current.","电阻 R = V/I"],["Ohm's law: the current through an ohmic conductor is directly proportional to the potential difference across it, at constant temperature. V–I graph is a straight line through the origin; gradient of I against V = 1/R.","欧姆定律：温度不变，I ∝ V"],["Non-ohmic: filament lamp (curve; resistance rises as the filament heats up), diode (conducts one way).","非欧姆：灯丝、二极管"],["Resistance of a wire: \\(R=\\dfrac{\\rho l}{A}\\). Increases with length l, decreases with cross-sectional area A, depends on resistivity ρ (material) and temperature (metals: R increases with temperature).","R = ρl/A；随长度增大、面积减小而增大"],["Q: Copper wire 2.0 m, A = 0.50 mm² (5.0 × 10⁻⁷ m²), ρ = 1.7 × 10⁻⁸ Ω m: R = 1.7×10⁻⁸ × 2/5×10⁻⁷ = 0.068 Ω.","题：R = 0.068 Ω"]],"","Tip: a thicker wire has less resistance; doubling the diameter divides R by 4."],["Series and Parallel Circuits","串联与并联",[["Series: same current; \\(V=V_1+V_2\\); \\(R=R_1+R_2\\). If one component fails, the circuit breaks.","串联：电流相同；R = R₁ + R₂"],["Parallel: same voltage across each branch; \\(I=I_1+I_2\\); \\(\\dfrac{1}{R}=\\dfrac{1}{R_1}+\\dfrac{1}{R_2}\\). Each branch works independently; total resistance is smaller than the smallest branch.","并联：电压相同；1/R = 1/R₁ + 1/R₂"],["Q: A 4 Ω resistor in series with a parallel pair of 6 Ω and 3 Ω across a 12 V battery. Parallel part: \\(\\dfrac{1}{R}=\\dfrac16+\\dfrac13=\\dfrac12\\) → 2 Ω; total R = 4 + 2 = 6 Ω; \\(I=\\dfrac{12}{6}=2\\) A.","题：并联部分 2 Ω；总电阻 6 Ω；I = 2 A"],["Voltage across the parallel pair = 2 × 2 = 4 V; currents: 4/6 = 0.67 A and 4/3 = 1.33 A (sum 2 A).","并联两端电压 4 V；分流 0.67 + 1.33"],["Household wiring uses parallel circuits so each appliance receives 240 V and operates independently.","家用线路用并联"]],"","Tip: simplify the parallel part first, then add the series resistors."],["Electromotive Force and Internal Resistance","电动势与内阻",[["e.m.f. (E) is the energy supplied by the source per unit charge to drive charge round the complete circuit (volt); it equals the voltage across the cell when no current flows.","电动势 E：电源对单位电荷做的功"],["Internal resistance r is the resistance inside the cell. Terminal potential difference \\(V=E-Ir\\); lost voltage = Ir.","内阻 r；端电压 V = E − Ir"],["\\(E=I(R+r)=V+Ir\\).","E = I(R + r)"],["Experiment: vary the load with a rheostat, plot V against I: intercept on the V-axis = E; gradient = −r.","V-I 图：截距 = E，斜率 = −r"],["Q: E = 12 V, r = 1 Ω, R = 5 Ω: I = 12/6 = 2 A; terminal voltage V = 12 − 2(1) = 10 V; lost voltage = 2 V.","题：I = 2 A；端电压 10 V"]],"","Tip: the voltmeter reading across the cell drops as the current increases."],["Electrical Energy and Power","电能与电功率",[["Electrical energy \\(E=VIt=Pt\\) (J). Power \\(P=VI=I^{2}R=\\dfrac{V^{2}}{R}\\) (W).","电能 E = VIt；功率 P = VI = I²R = V²/R"],["Kilowatt-hour (kWh): 1 kWh = 1000 W × 3600 s = 3.6 × 10⁶ J. Cost = number of kWh × tariff.","1 kWh = 3.6×10⁶ J；电费 = kWh × 电价"],["Q1: A 2 kW heater for 3 hours = 6 kWh; at RM0.50 per kWh = RM3.00.","题1：6 kWh，电价 RM0.50 → RM3.00"],["Q2: A 240 V, 60 W bulb: \\(I=\\dfrac{60}{240}=0.25\\) A; \\(R=\\dfrac{240^{2}}{60}=960\\) Ω.","题2：I = 0.25 A；R = 960 Ω"],["Fuse: rating slightly above normal current (e.g. 1000 W at 240 V draws 4.2 A, use a 5 A fuse); fuse is placed on the live wire.","保险丝：略大于正常电流，接在火线上"]],"","Tip: always check if the question wants joules or kWh."],["Energy Efficiency and Choosing Appliances","能量效率与电器选择",[["Efficiency \\(=\\dfrac{\\text{useful energy output}}{\\text{energy input}}\\times100\\%\\). Appliances waste energy as heat/sound.","效率 = 有用输出/输入 × 100%"],["Choose energy-efficient appliances (inverter air-conditioners, LED lamps) to lower the electricity bill; look at the energy label.","选择节能电器：LED、变频空调"],["Q: A kettle rated 2000 W takes 150 s to heat 0.5 kg of water by 60 °C. Useful energy = 0.5 × 4200 × 60 = 126 000 J; input = 2000 × 150 = 300 000 J; efficiency = 42%.","题：效率 = 126 000/300 000 = 42%"],["A short circuit or overload gives a large current → overheating; use fuses and circuit breakers.","短路/过载：电流过大发热"],["Ways to save energy: switch off unused appliances, use natural light, service air-conditioners.","节能方法"]],"","Tip: efficiency can never exceed 100%."],["Common Mistakes and Exam Tips","常见错误与考试提示",[["Connecting a voltmeter in series or an ammeter in parallel.","电压表串联/电流表并联"],["Adding resistances in parallel instead of reciprocals.","并联直接相加电阻"],["Forgetting that terminal voltage < e.m.f. when current flows.","忘了端电压小于电动势"],["Using hours instead of seconds in E = Pt unless the answer is in kWh.","E=Pt 时时间要用秒（kWh 才用小时）"],["Saying 'resistance depends on V and I' — resistance of an ohmic conductor is constant at constant temperature.","电阻与 V、I 无关"]],"","Tip: in circuit calculation questions, redraw the circuit and label V and I for each part."],["Uji Diri","自测",[["S: Define potential difference. J: The work done (energy transferred) per unit charge moving between two points.","问：电势差定义？答：单位电荷移动做的功"],["S: A resistor has 6 V across it and carries 2 A. Resistance? J: 6/2 = 3 Ω.","问：6 V、2 A 的电阻？答：3 Ω"],["S: Two 6 Ω resistors in parallel have a total resistance of? J: 3 Ω.","问：两个 6 Ω 并联？答：3 Ω"],["S: A cell has E = 6 V and r = 0.5 Ω. A current of 2 A flows. Terminal voltage? J: 6 − 2(0.5) = 5 V.","问：E=6 V，r=0.5 Ω，I=2 A，端电压？答：5 V"],["S: A 1.5 kW appliance runs for 4 h. Energy used? J: 6 kWh.","问：1.5 kW 用 4 小时？答：6 kWh"]],"",""]],"fiz|T5-4":[["Magnetic Fields due to Current","电流的磁场",[["A magnetic field is the region where a magnetic force acts on a magnetic material or moving charge; field lines go from N to S outside the magnet and are closer where the field is stronger.","磁场；磁感线由 N 极到 S 极，越密越强"],["Straight wire: concentric circular field lines; direction by the right-hand grip rule (thumb = current, fingers = field).","直导线：同心圆磁场；右手握拳法则"],["Solenoid: field similar to a bar magnet; the end where the current appears anticlockwise is the N-pole (grip rule: fingers = current, thumb = N).","螺线管：像条形磁铁"],["Stronger electromagnet: more turns, larger current, soft-iron core.","电磁铁增强：匝数多、电流大、软铁芯"],["Applications of electromagnets: electric bell, relay, circuit breaker, magnetic crane, loudspeaker.","应用：电铃、继电器、断路器"]],"","Tip: soft iron is used as a core because it is easily magnetised and demagnetised."],["Force on a Current-carrying Conductor in a Magnetic Field","磁场中通电导体所受的力",[["A current-carrying conductor in a magnetic field experiences a force because the two fields interact; the combined field is called the catapult field.","通电导线在磁场中受力；合成磁场称弹弓场"],["Fleming's left-hand rule: First finger = magnetic Field (N→S), seCond finger = Current, thuMb = Motion (force).","弗莱明左手定则：食指磁场、中指电流、拇指受力"],["Force increases with a larger current, a stronger magnetic field and a longer conductor in the field; reversing the current or field reverses the force direction. Force is zero if the wire is parallel to the field.","电流越大、磁场越强、导线越长，力越大；平行于磁场时为零"],["The force is strongest where the field lines are closest in the catapult field (the weak side of the combination is the side where fields cancel).","弹弓场中磁感线弱的一侧推动导线"],["Two parallel wires with currents in the same direction attract; in opposite directions repel.","同向电流相吸，反向电流相斥"]],"","Tip: draw field lines for the wire and the magnet, then show the weaker field region to find the direction of the force."],["DC Motor","直流电动机",[["A DC motor converts electrical energy to kinetic energy: a rectangular coil in a magnetic field; forces on the two sides are opposite, producing a turning effect (torque).","直流电动机：电能转为动能"],["Split-ring commutator reverses the current direction every half turn so the coil keeps rotating in one direction. Carbon brushes make contact with the commutator.","换向器每半圈改变电流方向"],["Increase speed/torque: increase the current, use stronger magnets, increase the number of turns, increase the area of the coil, use a soft-iron core/curved magnetic poles.","增大转速：电流大、磁铁强、匝数多、面积大"],["Reverse direction: reverse the current or reverse the poles of the magnet.","改变转向：反转电流或磁极"],["Applications: electric fans, washing machines, electric vehicles, toys.","应用：风扇、洗衣机、电动车"]],"","Tip: the commutator changes the current direction, not the magnetic field direction."],["Electromagnetic Induction","电磁感应",[["Electromagnetic induction: an induced e.m.f. is produced in a conductor when there is relative motion between the conductor and the magnetic field (cutting field lines / change in magnetic flux).","电磁感应：磁通量变化产生感应电动势"],["Faraday's law: the magnitude of induced e.m.f. is directly proportional to the rate of change of magnetic flux (rate of cutting field lines).","法拉第定律：感应电动势 ∝ 磁通变化率"],["Increase induced e.m.f.: faster movement, stronger magnet, more turns, larger coil area.","增大：运动更快、磁铁更强、匝数更多、面积更大"],["Lenz's law: the induced current flows in a direction such that it opposes the change that produces it. Pushing the N-pole towards a coil → the end facing the magnet becomes N (repels).","楞次定律：感应电流方向总是阻碍磁通变化"],["Fleming's right-hand rule gives the direction of induced current: thuMb = Motion, First finger = Field, seCond finger = Current.","右手定则：拇指运动、食指磁场、中指电流"]],"","Tip: Lenz's law is the law of conservation of energy — the work done against opposition becomes electrical energy."],["Generators: AC and DC","发电机：交流与直流",[["AC generator: a coil rotates in a magnetic field; slip rings and brushes deliver the alternating current. Output is a sinusoidal waveform.","交流发电机：集电环，输出正弦波"],["DC generator: uses a split-ring commutator so the current always flows in one direction (pulsating DC).","直流发电机：换向器，输出脉动直流"],["Increase output e.m.f.: increase the rotation speed, stronger magnet, more turns, larger coil area. The frequency of AC increases with rotation speed.","增大输出：转速、磁铁、匝数、面积"],["Output graph: maximum e.m.f. when the coil is parallel to the field (cutting lines fastest); zero when the coil is perpendicular.","线圈与磁场平行时 e.m.f. 最大；垂直时为零"],["Sources of energy: hydro, steam turbine (coal, gas, nuclear), wind turbines drive generators.","能源：水力、火力、风力"]],"","Tip: remember slip rings → AC; split ring commutator → DC."],["Transformer","变压器",[["A transformer changes the magnitude of an alternating voltage by electromagnetic induction: alternating current in the primary coil produces a changing flux in the iron core, which induces an e.m.f. in the secondary coil. It cannot work with DC.","变压器改变交流电压；直流无效"],["\\(\\dfrac{V_s}{V_p}=\\dfrac{N_s}{N_p}\\). Step-up: \\(N_s>N_p\\); step-down: \\(N_s<N_p\\).","Vs/Vp = Ns/Np"],["Ideal transformer: no power loss, \\(V_pI_p=V_sI_s\\). Efficiency \\(=\\dfrac{V_sI_s}{V_pI_p}\\times100\\%\\).","理想变压器：VpIp = VsIs"],["Energy losses and remedies: resistance of coils (use thick low-resistance copper wire); eddy currents (laminated core); hysteresis (soft iron core); flux leakage (wind coils on the same core, closed core).","能量损耗及对策"],["Q: 240 V to 12 V, Np = 1200: Ns = 1200 × 12/240 = 60 turns. If 2 A is drawn from the secondary: Ip = (12×2)/240 = 0.1 A.","题：Ns = 60；Ip = 0.1 A"]],"","Tip: in a step-up transformer the current in the secondary is smaller than in the primary."],["Transmission of Electricity","电力传输",[["The National Grid uses a step-up transformer at the power station to raise the voltage (e.g. 275–500 kV) and step-down transformers near homes (240 V).","国家电网：升压输电，降压到户"],["Power loss in cables \\(P_{loss}=I^{2}R\\). Raising the voltage lowers the current for the same power (\\(P=VI\\)), so far less energy is lost as heat.","高压输电使电流减小，I²R 损耗减小"],["Q: Transmit 100 kW. At 1 000 V: I = 100 A; at 100 000 V: I = 1 A. Power loss is 10⁴ times smaller (if R is the same).","题：电流 100 A → 1 A，损耗减为 1/10⁴"],["Alternating current is used because voltage can be easily changed using transformers.","用交流因为易变压"],["Advantages of the grid: continuous supply, efficient transmission, interconnect different power sources.","电网：供电稳定、效率高"]],"","Tip: say 'higher voltage → smaller current → less I²R loss'."],["Common Mistakes","常见错误",[["Mistake: using the left-hand rule for induced current — the right-hand rule is for generators; left-hand for motors.","错误：左右手定则混淆（电动机左手，发电机右手）"],["Mistake: stating that the transformer works with DC.","错误：直流也能用变压器"]],"",""],["Uji Diri","自测",[["S: State Lenz's law. J: The direction of the induced current is such that it opposes the change producing it.","问：楞次定律？答：感应电流方向总是阻碍引起它的变化"],["S: A transformer has 500 primary turns, 100 secondary turns and a 240 V input. Output? J: 240 × 100/500 = 48 V.","问：初级 500 匝、次级 100 匝、240 V 输入，输出？答：48 V"],["S: Why is the core of a transformer laminated? J: To reduce eddy currents and the heat they produce.","问：铁芯为何叠片？答：减小涡流"]],"",""]],"fiz|T5-5":[["Electrons and Thermionic Emission","电子与热电子发射",[["Thermionic emission: when a metal (cathode) is heated to a high temperature, free electrons gain enough energy to escape the surface.","热电子发射：加热金属阴极使电子逸出"],["Cathode ray tube (CRT): electron gun (heated cathode + anode with high voltage accelerating electrons), deflection system, fluorescent screen.","阴极射线管：电子枪、偏转系统、荧光屏"],["Properties of cathode rays: travel in straight lines in a vacuum, deflected by electric and magnetic fields (negatively charged), cast shadows, make the screen fluoresce, carry energy.","阴极射线性质：直线传播、在电磁场中偏转、有荧光"],["Deflection: in an electric field the beam bends towards the positive plate; in a magnetic field use Fleming's left-hand rule (electron flow is opposite to conventional current).","偏转：电场中偏向正极；磁场中用左手定则"],["Higher accelerating voltage → faster electrons → a smaller deflection and a brighter spot.","加速电压越高，电子越快，偏转越小"]],"","Tip: electrons flow from the cathode to the anode; conventional current is opposite."],["Cathode Ray Oscilloscope (CRO)","阴极射线示波器",[["The CRO displays voltage against time. Y-gain (V/div) controls vertical sensitivity; time-base (ms/div) controls the horizontal sweep.","示波器：Y 增益与时基"],["DC voltage: a horizontal line displaced from the zero; \\(V=\\) (displacement in divisions) × (Y-gain). AC: a sine wave; peak voltage \\(V_p\\) = (height of crest in divisions) × (Y-gain).","直流：水平线位移；交流：正弦波"],["Period T = (horizontal divisions for one cycle) × (time-base); \\(f=\\dfrac{1}{T}\\).","周期 T = 格数 × 时基；f = 1/T"],["Q: A sine wave has crest height 4 div, Y-gain 2 V/div, one cycle spans 5 div, time-base 2 ms/div. \\(V_p=8\\) V; \\(T=10\\) ms; \\(f=100\\) Hz.","题：Vp = 8 V；T = 10 ms；f = 100 Hz"],["Uses: measure voltage, frequency, period; study waveforms; check signals.","用途：测电压、频率、周期"]],"","Tip: convert the time-base to seconds before computing f."],["Semiconductors and the p–n Junction","半导体与 p-n 结",[["Semiconductors (silicon, germanium) have conductivity between conductors and insulators; conduction increases with temperature or doping.","半导体：导电性介于导体与绝缘体之间"],["n-type: pure silicon doped with a pentavalent atom (phosphorus) → extra free electrons (majority carriers). p-type: doped with a trivalent atom (boron) → holes (positive charge carriers).","n 型掺五价（电子）；p 型掺三价（空穴）"],["p–n junction diode: at the junction a depletion layer (no free carriers) forms.","p-n 结：耗尽层"],["Forward bias (p to +): depletion layer narrows, current flows (diode on, ≈0.6–0.7 V for silicon). Reverse bias: depletion layer widens, no current flows.","正向偏置导通；反向偏置不导通"],["Diode symbol: arrow shows the direction of conventional current.","二极管符号：箭头为电流方向"]],"","Tip: say 'depletion layer becomes thinner → current flows'."],["Rectification and Smoothing","整流与平滑",[["Rectification: converting AC to DC using diodes. Half-wave: one diode conducts only during the positive half-cycles. Full-wave: four diodes in a bridge circuit conduct in both half-cycles, with output of the same polarity.","整流：半波一个二极管；全波桥式四个二极管"],["Capacitor smoothing: a capacitor connected in parallel with the load charges up to the peak voltage and discharges slowly when the voltage falls, reducing the ripple. Bigger capacitance → smoother DC output.","电容平滑：并联电容减小波纹，容量越大越平滑"],["Output waveforms: half-wave rectified (gaps), full-wave rectified (all positive humps), smoothed (almost constant with small ripple).","波形：半波、全波、平滑"],["Applications: power adaptors, phone chargers, radios.","应用：电源适配器、充电器"],["Diode in a bridge: two diodes conduct in each half-cycle; the current through the load always flows the same way.","桥式整流：每半周两个二极管导通"]],"","Tip: describe waveforms with 'half-wave', 'full-wave', 'smoothed' and sketch the ripple correctly."],["Transistor: Structure and Functions","晶体管：结构与功能",[["A transistor has three terminals: emitter (E), base (B) and collector (C). In an npn transistor a small base current \\(I_B\\) controls a larger collector current \\(I_C\\); \\(I_E=I_B+I_C\\).","npn 晶体管：小 I_B 控制大 I_C；I_E = I_B + I_C"],["Current gain \\(=\\dfrac{I_C}{I_B}\\). Q: \\(I_B=0.04\\) mA, \\(I_C=4\\) mA → gain = 100.","电流增益 = I_C/I_B = 100"],["As a switch: when \\(V_{BE}\\) exceeds about 0.6–0.7 V the transistor turns on and a large collector current flows; below this it is off.","作开关：V_BE ≳ 0.6 V 导通"],["As an amplifier: a small change in \\(I_B\\) causes a large change in \\(I_C\\).","作放大器"],["A relay can be used in the collector circuit to switch a high-current device; a diode connected across the relay coil protects the transistor from the back e.m.f.","继电器 + 保护二极管"]],"","Tip: the transistor is ON only when the base is at a sufficiently positive voltage relative to the emitter."],["Transistor Circuits: Sensor Switches","晶体管电路：传感开关",[["Potential divider at the base: \\(V_{base}=\\dfrac{R_2}{R_1+R_2}V\\). The voltage across the resistor between the base and 0 V decides if the transistor turns on.","基极分压：V = R₂/(R₁+R₂) · V"],["Light-controlled switch (street lamp): LDR connected between base and 0 V with a fixed resistor above. In the dark LDR resistance is high → V_base high → transistor on → lamp lights.","光控灯：LDR 接基极与 0 V；黑暗时电阻大→V_BE 大→灯亮"],["Heat-controlled switch (fire alarm): thermistor placed at the top of the divider (resistor at the bottom). When hot, the thermistor resistance falls → V_base rises → alarm turns on.","热控报警：高温时热敏电阻值小→V_BE 增大→报警"],["To adjust the sensitivity, use a variable resistor in the divider.","可变电阻调灵敏度"],["Q: A 4 kΩ resistor is in series with an LDR (20 kΩ in the dark) from a 6 V supply; the base is connected across the LDR: \\(V=\\dfrac{20}{24}\\times6=5\\) V → transistor on.","题：V = 20/24 × 6 = 5 V → 导通"]],"","Tip: the component whose voltage rises when the quantity changes must be placed between the base and 0 V."],["Common Mistakes","常见错误",[["Mistake: thinking that the diode conducts in the reverse direction — reverse bias widens the depletion layer.","错误：二极管反向导通"]],"",""],["Uji Diri","自测",[["S: What is the function of a capacitor in a rectifier circuit? J: It smooths the output by storing charge and releasing it when the voltage falls.","问：整流电路中电容的作用？答：储放电使输出平滑"],["S: A transistor has I_B = 0.05 mA and I_C = 5 mA. Current gain? J: 5/0.05 = 100.","问：I_B=0.05 mA，I_C=5 mA，增益？答：100"],["S: Why is a relay used in a transistor circuit? J: The transistor's collector current is too small to run a large load; the relay switches a separate high-current circuit.","问：为何用继电器？答：控制独立的大电流电路"],["S: Explain thermionic emission. J: A heated cathode gives electrons enough energy to escape from the metal surface.","问：热电子发射？答：加热阴极使电子获得足够能量逸出"]],"",""]],"fiz|T5-6":[["Structure of the Atom and Radioactivity","原子结构与放射性",[["The nucleus contains protons and neutrons (nucleons). Nuclide notation \\(^{A}_{Z}\\text{X}\\): A = nucleon number (protons + neutrons), Z = proton number.","核由质子和中子组成；A 为核子数，Z 为质子数"],["Isotopes: atoms of the same element (same Z) with different numbers of neutrons (different A).","同位素：Z 相同，中子数不同"],["Radioactivity: the spontaneous and random disintegration of an unstable nucleus, emitting radiation (α, β, γ).","放射性：不稳定核自发、随机衰变"],["Radioactive decay cannot be affected by temperature, pressure or chemical reaction; it is random — you cannot predict when a particular nucleus will decay.","衰变不受温度、压强影响；具随机性"],["Background radiation: from rocks, cosmic rays, food; subtract it from measured count rates.","本底辐射：测量时需扣除"]],"","Tip: use 'spontaneous and random' in your definition of radioactive decay."],["Types of Radiation: α, β, γ","辐射类型：α、β、γ",[["Alpha (α): helium nucleus \\(^{4}_{2}\\text{He}\\), charge +2, strongly ionising, stopped by paper/few cm of air; deflected slightly (positive).","α：氦核，电离能力最强，纸可挡住"],["Beta (β⁻): fast electron, charge −1, moderate ionising power, stopped by a few mm of aluminium; deflected in the opposite direction to α.","β：快速电子，铝片（几毫米）挡住"],["Gamma (γ): electromagnetic wave, no charge, weakly ionising, very penetrating (reduced by thick lead or concrete); not deflected.","γ：电磁波，穿透力最强，需铅/混凝土"],["Detection: Geiger–Müller tube and rate meter (count per second), cloud chamber (tracks), photographic film.","探测：GM 管、云室、感光片"],["Ionising power: α > β > γ; penetrating power: γ > β > α.","电离能力 α>β>γ；穿透力 γ>β>α"]],"","Tip: 'The more strongly ionising, the less penetrating.'"],["Decay Equations","衰变方程",[["Alpha decay: nucleon number decreases by 4 and proton number by 2: \\(^{A}_{Z}\\text{X}\\to{}^{A-4}_{Z-2}\\text{Y}+{}^{4}_{2}\\text{He}\\). Example: \\(^{238}_{92}\\text{U}\\to{}^{234}_{90}\\text{Th}+{}^{4}_{2}\\text{He}\\).","α 衰变：A − 4，Z − 2"],["Beta decay: a neutron changes into a proton and an electron; A unchanged, Z increases by 1: \\(^{14}_{6}\\text{C}\\to{}^{14}_{7}\\text{N}+{}^{0}_{-1}e\\).","β 衰变：Z + 1，A 不变"],["Gamma emission: no change in A or Z; the nucleus releases extra energy.","γ 发射：A、Z 不变"],["Conservation of nucleon number and charge: totals on both sides must be equal.","核子数与电荷守恒"],["Q: \\(^{226}_{88}\\text{Ra}\\) emits an α-particle. Daughter: \\(^{222}_{86}\\text{Rn}\\).","题：镭-226 α 衰变得氡-222"]],"","Tip: check each equation by adding the top numbers and the bottom numbers on both sides."],["Half-life","半衰期",[["Half-life \\(T_{1/2}\\): the time taken for the number of undecayed nuclei (or the activity) to decrease to half of its initial value.","半衰期：未衰变核数（或活度）减半所需时间"],["After n half-lives: \\(N=N_0\\left(\\tfrac12\\right)^{n}\\), with \\(n=\\dfrac{t}{T_{1/2}}\\). Activity decays exponentially.","N = N₀(1/2)ⁿ，n = t/T"],["The decay curve: the count rate halves each equal time interval; read half-life from the graph at N₀/2.","衰变曲线：每隔一个半衰期减半"],["Q1: 80 g of a nuclide with T½ = 4 days. After 12 days: n = 3 → 80 × (1/2)³ = 10 g.","题1：80 g，T½=4 天，12 天后：10 g"],["Q2: Count rate falls from 800 to 100 counts per minute in 15 days: 800 → 400 → 200 → 100 = 3 half-lives → T½ = 5 days.","题2：3 个半衰期 → T½ = 5 天"]],"","Tip: subtract the background count before comparing activities."],["Uses of Radioisotopes and Safety","放射性同位素的应用与安全",[["Medicine: gamma rays for sterilising equipment and cancer treatment (radiotherapy); tracers (technetium-99m) to trace organs.","医疗：消毒、放疗、示踪"],["Industry: thickness control of paper or metal sheets (β source and detector), detecting leaks in pipes (tracer), smoke detectors (α source).","工业：测厚、检漏、烟雾探测器"],["Agriculture: tracers to study fertiliser uptake; irradiating food to kill bacteria. Archaeology: carbon-14 dating (T½ = 5730 years).","农业：示踪；考古：碳-14 定年"],["Q: A fossil has 25% of the C-14 activity of a living sample: 2 half-lives = 11 460 years old.","题：剩 25% C-14：2 个半衰期 = 11 460 年"],["Safety: use tongs/remote handling, lead-lined containers, wear dosimeter badges, limit exposure time, keep a large distance, and store in labelled containers.","安全：夹子、铅容器、剂量计、距离远、时间短"]],"","Tip: link the choice of radiation to its penetration, e.g. 'a β source is used for paper because it penetrates paper but is partly blocked by thicker sheets'."],["Nuclear Energy: Mass Defect and E = mc²","核能：质量亏损与 E=mc²",[["Mass defect Δm: the difference between the total mass of separate nucleons (or the reactants) and the mass of the nucleus (or products). The mass is converted into energy: \\(E=\\Delta m\\,c^{2}\\).","质量亏损转化为能量：E = Δm c²"],["Constants: \\(c=3.0\\times10^{8}\\) m s⁻¹; 1 atomic mass unit (u) = 1.66 × 10⁻²⁷ kg.","c = 3.0×10⁸ m/s；1 u = 1.66×10⁻²⁷ kg"],["Q: In a nuclear reaction the mass lost is 0.20 u. \\(\\Delta m=0.20\\times1.66\\times10^{-27}=3.32\\times10^{-28}\\) kg; \\(E=3.32\\times10^{-28}\\times(3.0\\times10^{8})^{2}=3.0\\times10^{-11}\\) J.","题：Δm = 0.20 u → E = 3.0×10⁻¹¹ J"],["Binding energy: the energy needed to separate a nucleus into its individual nucleons; equals the energy released when it forms.","结合能"],["Power from a reaction: \\(P=\\dfrac{E}{t}=\\dfrac{\\Delta m\\,c^{2}}{t}\\).","功率 = Δm c²/t"]],"","Tip: convert u to kg, then mass × c² gives joules."],["Nuclear Fission and Fusion","核裂变与核聚变",[["Fission: a heavy nucleus (uranium-235) absorbs a neutron and splits into two lighter nuclei, 2–3 neutrons and a large amount of energy. \\(^{235}_{92}\\text{U}+{}^{1}_{0}n\\to{}^{141}_{56}\\text{Ba}+{}^{92}_{36}\\text{Kr}+3{}^{1}_{0}n+\\text{energy}\\).","裂变：铀-235 吸收中子分裂并放能"],["Chain reaction: neutrons released cause further fission. Uncontrolled → atomic bomb; controlled in a reactor using control rods (boron/cadmium absorb neutrons) and a moderator (graphite/heavy water slows neutrons).","链式反应：控制棒吸收中子；慢化剂减速"],["Fusion: two light nuclei join into a heavier one releasing energy: \\(^{2}_{1}\\text{H}+{}^{3}_{1}\\text{H}\\to{}^{4}_{2}\\text{He}+{}^{1}_{0}n+\\text{energy}\\). Requires very high temperature (~10⁷–10⁸ K) and pressure; it is the energy source of the Sun and stars.","聚变：轻核结合；需要极高温；太阳能源"],["Nuclear power station: fission heat → steam → turbine → generator. Needs shielding (concrete), coolant, control rods, and heat exchanger.","核电站：热→蒸汽→涡轮→发电机"],["Advantages: huge energy from small fuel, no CO₂ emissions. Disadvantages: radioactive waste, risk of accidents (Chernobyl, Fukushima), high construction and decommissioning cost.","优缺点"]],"","Tip: fission – 'heavy nucleus splits'; fusion – 'light nuclei join'."],["Common Mistakes","常见错误",[["Mistake: saying α has a greater penetrating power than γ; ionising and penetrating powers are opposite.","错误：α 穿透力比 γ 强"]],"",""],["Uji Diri","自测",[["S: What changes in the nucleus after β decay? J: A neutron changes to a proton; proton number increases by 1; nucleon number unchanged.","问：β 衰变后核的变化？答：中子→质子，Z + 1，A 不变"],["S: A sample has T½ = 6 h and an initial activity of 640 counts/s. Activity after 18 h? J: 3 half-lives → 640 ÷ 8 = 80 counts/s.","问：T½=6 h，640 计数/秒，18 h 后？答：80"],["S: State the purpose of control rods in a reactor. J: They absorb neutrons to control the rate of chain reaction.","问：控制棒作用？答：吸收中子以控制链式反应速度"],["S: Mass lost 1.0 × 10⁻²⁹ kg. Energy released? J: E = 1.0×10⁻²⁹ × 9×10¹⁶ = 9.0×10⁻¹³ J.","问：质量亏损 1.0×10⁻²⁹ kg 的能量？答：9.0×10⁻¹³ J"]],"",""]],"fiz|T5-7":[["Quantum Theory of Light","光的量子论",[["Classical physics could not explain the spectrum of radiation emitted by a hot object (black body). Planck proposed that energy is emitted or absorbed in discrete packets called quanta.","普朗克：能量以量子形式发射或吸收"],["Photon: a quantum of light with energy \\(E=hf=\\dfrac{hc}{\\lambda}\\), where \\(h=6.63\\times10^{-34}\\) J s is Planck's constant.","光子能量 E = hf = hc/λ"],["Higher frequency (shorter wavelength) → higher photon energy: UV photons are more energetic than red photons.","频率越高光子能量越大"],["The intensity (brightness) of a beam depends on the number of photons per second, not the energy of each photon.","光强取决于每秒光子数"],["Q: Red light, λ = 7.0 × 10⁻⁷ m: \\(E=\\dfrac{(6.63\\times10^{-34})(3.0\\times10^{8})}{7.0\\times10^{-7}}=2.8\\times10^{-19}\\) J.","题：E = 2.8×10⁻¹⁹ J"]],"","Tip: 1 eV = 1.6 × 10⁻¹⁹ J."],["Photoelectric Effect","光电效应",[["Photoele
