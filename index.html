 / to inform you that ...", "开头一句说明目的"], ["Body: cover every note, giving a detail for each point (when, where, what to bring, why).", "正文：每个提示都要写，并给细节（时间、地点、带什么、原因）"], ["Closing: a request or action (Let me know by Thursday) + sign-off (See you! / Regards,) + name. Keep to about 80 words.", "结尾：请求/行动 + 署名；约 80 字"]], "", "Tip: tick off each note after you write it; leaving one out loses content marks."], ["Model Email (Part 1)", "示范电邮", [["Subject: Beach trip this Saturday", "标题"], ["Hi Mei Ling, I'm writing to invite you to our class beach trip this Saturday.", "开头：说明邀请目的"], ["We will meet at the school gate at 7.30 a.m. and travel by bus to Port Dickson. Please bring sunscreen, a towel and your lunch.", "时间地点交通 + 要带的东西"], ["We plan to play volleyball and have a picnic. The bus will return at 5 p.m. Let me know by Thursday if you can join us.", "活动 + 返程 + 回复期限"], ["See you! Aiman", "结尾署名（约 70–80 字）"]], "", ""], ["Directed Writing (Part 2): Formats", "引导写作（第2部分）：格式", [["Formal letter/email: Dear Sir/Madam, → purpose → details → request → Yours faithfully, (or Yours sincerely, with a name).", "正式信：称呼 → 目的 → 细节 → 请求 → 结尾敬语"], ["Report: Title → Introduction → Findings (headings or paragraphs) → Recommendations → Conclusion.", "报告：标题 → 引言 → 发现 → 建议 → 结论"], ["Speech: greet the audience → introduce the topic → 2–3 main points → call to action → Thank you.", "演讲：问候 → 主题 → 要点 → 号召 → 致谢"], ["Article: catchy title → hook → organised paragraphs → conclusion; use a lively but clear tone.", "文章：吸引人的标题 → 引子 → 分段 → 结尾"], ["Use all content points from the notes and develop each into a full sentence with detail (125–150 words).", "用完所有要点并扩写（约 125–150 字）"]], "", ""], ["Formal and Informal Language", "正式与非正式语言", [["Informal: Can you help me? → Formal: I would be grateful if you could assist me.", "请求的说法"], ["Informal: I want to ... → Formal: I would like to ...", "想要"], ["Informal: get/buy → Formal: obtain/purchase; ask for → request; find out → discover.", "词汇升级"], ["Avoid contractions, slang and exclamation marks in formal writing: do not, cannot, I would.", "正式文体避免缩写与俚语"], ["Informal writing may use contractions and friendly expressions: Guess what! See you soon!", "非正式可用缩写和亲切用语"]], "", ""], ["Writing Checklist", "写作检查清单", [["Content: all points covered, relevant, developed with detail.", "内容：覆盖所有要点并扩写"], ["Communicative achievement: correct format, register and tone for the reader.", "交际：格式、语域、语气得当"], ["Organisation: paragraphs, linking words (First, Moreover, However, Finally).", "组织：分段与连接词"], ["Language: accurate grammar, spelling, punctuation; a range of vocabulary and sentence types.", "语言：准确 + 丰富多样"], ["Proofread: subject–verb agreement, tenses, capital letters, word count.", "校对：主谓一致、时态、大小写、字数"]], "", ""], ["Uji Diri", "自测：先想答案，再对照", [["S: Dear Sir/Madam goes with which closing? J: Yours faithfully.", "问：Dear Sir/Madam 配哪种结尾？答：Yours faithfully。"], ["S: How many words for Directed Writing? J: About 125–150.", "问：Directed Writing 字数？答：约 125–150。"], ["S: What to do with every content point? J: Include and expand it.", "问：要点怎么处理？答：全部写到并扩写。"], ["S: Which register for the principal? J: Formal.", "问：给校长用什么语气？答：正式。"], ["S: What is the purpose of the opening sentence in an email? J: To state why you are writing.", "问：电邮开头句的作用？答：说明写信目的"], ["S: Formal version of 'I want to ...'? J: I would like to ...", "问：I want to 的正式说法？答：I would like to ..."]], "", ""]], "bi|1": [["Key Points", "重点要点", [["Part 3: choose ONE from three questions.", "三题选一"], ["Common genres: essay, article, short story, review, speech.", "常见文体"], ["Plan first: 3–4 minutes with a mind map.", "先花几分钟列提纲"], ["Marks: content, organisation, language accuracy and variety.", "评分：内容、组织、语言"], ["Length: about 200–250 words (check your paper).", "字数约 200–250，以试卷为准"]], "", ""], ["Model Language", "范例与模板", [["Hook: a question, a short quote or a striking fact.", "开头：问句/引言/惊人事实"], ["P.E.E: Point → Evidence → Explain, one idea per paragraph.", "P.E.E 段落"], ["Linking: Firstly, In addition, However, As a result, In conclusion.", "连接词"], ["Story ending: reflect on a lesson learned.", "故事结尾点出感悟"]], "", ""], ["Common Mistakes", "常见错误", [["Ignoring the genre (writing an essay when asked for a story).", "文体搞错"], ["Paragraphs with no clear point.", "段落没主旨"], ["Tense jumping in narrative.", "叙事时态混乱"], ["No conclusion.", "没有结尾"]], "", ""], ["Exam Question Patterns", "考试常见问法", [["Write an essay on the importance of ...", "议论文：...的重要性"], ["Write a story that begins with / ends with ...", "指定开头/结尾的故事"], ["Write an article about ... for a school magazine.", "校刊文章"]], "", ""], ["Essay Structure and Outline", "议论文结构与提纲", [["Introduction: hook (question/fact/short quote) + background + thesis/opinion.", "引言：钩子 + 背景 + 立场"], ["Body paragraph 1–3: Point → Evidence/Example → Explain (P.E.E) → link back.", "主体：论点 → 例证 → 解释 → 呼应"], ["Conclusion: restate the opinion in new words + final thought or suggestion.", "结论：换种说法重申观点 + 总结/建议"], ["Plan for 3–4 minutes: write the topic, three ideas and one example for each idea.", "先用 3–4 分钟列提纲"], ["Length about 200–250 words (check your paper); write neatly.", "约 200–250 字（以考卷为准）"]], "", ""], ["Story Writing Techniques", "故事写作技巧", [["Plot: opening (who, where, when) → build-up → climax → resolution → ending with a lesson/reflection.", "情节：开端 → 发展 → 高潮 → 结局 → 感悟"], ["Show, don't tell: not 'She was nervous' but 'Her hands trembled as she opened the envelope.'", "多展示少说教：用动作细节写情绪"], ["Use dialogue with correct punctuation: \"Where are you going?\" asked Mum.", "对话要注意标点"], ["Use the five senses: the smell of rain, the sound of thunder, the taste of salty tears.", "运用五感描写"], ["Keep the past tense consistent; vary sentence openings (Suddenly, Slowly, Without a word,).", "时态一致；句首多变"]], "", ""], ["Article, Review and Speech", "文章、评论与演讲", [["Article: catchy title, direct address (you), clear paragraphs, a concluding thought.", "文章：标题吸引、直接称呼读者、段落清晰"], ["Review (book/film/place): basic information → short summary → opinion with reasons → recommendation.", "评论：基本信息 → 简介 → 带理由的观点 → 推荐"], ["Speech: greeting, rhetorical questions, 'we/us' to include the audience, a call to action, Thank you.", "演讲：问候、反问、用 we 拉近、号召、致谢"], ["Use persuasive devices: examples, statistics, rule of three.", "说服手法：例子、数据、三点式"], ["Match the tone to the audience: students, parents, the public.", "语气要符合对象"]], "", ""], ["Upgrading Vocabulary and Sentences", "词汇与句式升级", [["very good → excellent; very bad → terrible; very big → enormous; very tired → exhausted.", "用强形容词代替 very + 形容词"], ["Relative clause: The girl who won the prize is my cousin.", "关系从句"], ["Participle opening: Exhausted, she fell asleep. Walking home, I met my teacher.", "分词开头"], ["Conditional: If we recycle more, we will protect the environment.", "条件句"], ["Passive: Many trees are cut down every year.", "被动句"]], "", ""], ["Model Essay Paragraph (P.E.E)", "示范段落", [["Point: Exercise is essential for teenagers' health.", "论点"], ["Evidence: According to health experts, teenagers who exercise regularly are less likely to be overweight.", "证据"], ["Explain: This is because physical activity burns calories and strengthens the heart, so they stay fit and active.", "解释"], ["Link: Therefore, schools should provide more sports activities.", "呼应论点"]], "", ""], ["Uji Diri", "自测：先想答案，再对照", [["S: How many questions do you answer in Part 3? J: One.", "问：Part 3 答几题？答：一题。"], ["S: What does P.E.E mean? J: Point, Evidence, Explain.", "问：P.E.E 是什么？答：观点、证据、解释。"], ["S: Give a contrast linking word. J: However.", "问：对比连接词？答：However。"], ["S: What should a story ending show? J: A lesson or reflection.", "问：故事结尾体现？答：感悟或教训。"], ["S: What does 'show, don't tell' mean? J: Describe actions and details to show feelings instead of naming them.", "问：“show, don't tell”？答：用动作细节表现情感"], ["S: Name the four parts of a review. J: Information, summary, opinion with reasons, recommendation.", "问：评论的四个部分？答：信息、简介、有理由的观点、推荐"]], "", ""]], "bi|2": [["Key Points", "重点要点", [["Skim for the gist; scan for names, numbers and dates.", "略读抓主旨，扫读抓名字、数字、日期"], ["Read the questions before the text.", "先看题"], ["Vocabulary in context: replace the word with your guess and test the sentence.", "把猜的词代入验证"], ["Inference: the answer is implied by clues in the text.", "推断题答案有文中线索"], ["Main idea ≠ one detail.", "主旨不是单个细节"]], "", ""], ["Common Mistakes", "常见错误", [["Choosing an option because it sounds true in real life but not in the text.", "凭常识选，不看原文"], ["Picking an option that is only partly correct.", "只对一半的选项"], ["Spending too long on one question.", "在一题上耗时太久"]], "", ""], ["Exam Question Patterns", "考试常见问法", [["What is the main idea of the passage?", "文章主旨"], ["What does the word '...' in line __ mean?", "词义题"], ["What can be inferred about the writer?", "推断作者"]], "", ""], ["Reading: Question Types", "阅读题型", [["Gist/main idea: what the whole text is mostly about (not a single detail).", "主旨题"], ["Detail: find the exact information (scan for names, numbers, dates).", "细节题"], ["Vocabulary in context: replace the word with your guess and test the sentence.", "语境词义"], ["Reference: what does 'it/they/this' refer to? Look at the noun before it.", "指代题"], ["Inference and writer's attitude/purpose: clues, adjectives and tone.", "推断与态度题"]], "", ""], ["Reading: Step-by-step Strategy", "阅读步骤", [["Preview: title, headings, pictures.", "预览标题与图片"], ["Read the questions first and underline keywords.", "先读题并圈关键词"], ["Skim to get the gist, then scan to find answers.", "略读得主旨，查读找答案"], ["Eliminate wrong options: too extreme, not mentioned, partly correct.", "排除过于绝对/未提及/只对一半的选项"], ["Check answers against the text before moving on.", "回文本核对"]], "", ""], ["Worked Example: Inference and Vocabulary", "例题：推断与词义", [["Text: Sarah stared at her phone for an hour but didn't reply. Her friends exchanged worried looks.", "文本"], ["Q: What can we infer about Sarah? A: She is upset (the clues: stared, didn't reply, friends worried).", "推断：她心情不好"], ["Q: 'stared' means ... A: looked at something for a long time without moving the eyes.", "词义"], ["Wrong options often use words from the text but change the meaning.", "错误选项常借用原文词但改变意思"]], "", ""], ["Uji Diri", "自测：先想答案，再对照", [["S: Skimming is used to find what? J: The gist.", "问：略读用来找？答：主旨。"], ["S: Scanning is used to find what? J: Specific details.", "问：扫读用来找？答：具体细节。"], ["S: Where is an inference answer found? J: Clues in the text.", "问：推断题答案在哪？答：文中线索。"], ["S: How do you test a vocabulary-in-context answer? J: Replace the word in the sentence and check the meaning.", "问：如何检验词义题？答：代入句子检验"]], "", ""]], "bi|3": [["Key Points", "重点要点", [["Part 1: 8 short-text questions (memo, poster, notice, announcement, advertisement, letter, dialogue).", "Part 1：8 题短文本"], ["Part 2: cloze, 10 questions on grammar and vocabulary.", "Part 2：Cloze 10 题"], ["Part 3: longer text, 8 questions, often a narrative.", "Part 3：长文本 8 题"], ["Paper 1 total 40 marks, CEFR B1–B2.", "Paper 1 共 40 分，B1–B2"]], "", ""], ["Model Language", "范例与模板", [["Short text: find the purpose, audience and key detail.", "短文本：目的、对象、关键信息"], ["Cloze: read all, decide the word class, check tense and agreement.", "Cloze：通读→判词性→查时态一致"], ["Longer text: summarise each paragraph in a few words.", "长文本：每段概括"]], "", ""], ["Common Mistakes", "常见错误", [["Choosing a word without reading the sentence after the blank.", "不读空格后文"], ["Ignoring prepositions and collocations.", "忽略介词与搭配"], ["Not checking singular/plural.", "不看单复数"]], "", ""], ["Exam Question Patterns", "考试常见问法", [["Where would you see this notice?", "这则通告出现在哪"], ["Choose the best word for blank (9).", "选最合适的词"], ["What is the writer's attitude?", "作者态度"]], "", "Parts 4 onwards: check your textbook / official sample."], ["Part 1: Short Texts", "第1部分：短文本", [["Identify the text type (notice, memo, poster, advertisement, message) and its purpose and audience.", "先判断文体、目的、对象"], ["Look for key details: date, time, place, price, instructions.", "找关键细节"], ["Read every option; distractors repeat words from the text but change the meaning.", "每个选项都读，干扰项会改变意思"], ["Do not use outside knowledge; answer from the text only.", "只依据文本"]], "", ""], ["Part 2: Cloze Strategy", "第2部分：完形填空策略", [["Read the whole passage first to understand the story.", "先通读"], ["Decide the word class needed: noun, verb, adjective, preposition, article, conjunction, pronoun.", "判断词类"], ["Check tense, singular/plural and collocations: make a decision, depend on, interested in.", "检查时态、单复数、搭配"], ["Look at the words before and after the blank: she has ___ (been/be) waiting.", "看前后词"], ["Re-read the completed sentence to check that it sounds natural.", "填完再读一遍"]], "", ""], ["Part 3: Longer Text", "第3部分：长篇阅读", [["Summarise each paragraph in 3–5 words as you read.", "每段用几个词概括"], ["Questions usually follow the order of the text.", "题目顺序通常和文章一致"], ["For attitude questions, find adjectives and adverbs showing feelings.", "态度题找情感词"], ["Keep time: do not spend too long on one question.", "控制时间"]], "", ""], ["Uji Diri", "自测：先想答案，再对照", [["S: How many questions in Part 2 cloze? J: 10.", "问：Part 2 几题？答：10 题。"], ["S: First step in cloze? J: Read the whole text.", "问：Cloze 第一步？答：通读全文。"], ["S: Total marks for Paper 1? J: 40.", "问：Paper 1 总分？答：40 分。"], ["S: What is the first step in a cloze test? J: Read the whole passage.", "问：完形第一步？答：通读全文"]], "", ""]], "bi|4": [["Key Points", "重点要点", [["Collocation: words that naturally go together.", "搭配：自然连用的词"], ["Preposition patterns must be memorised as chunks.", "介词搭配当整块背"], ["Linking words show contrast, reason, result and addition.", "连接词表对比、原因、结果、补充"], ["Synonyms help avoid repeating the same word.", "同义词避免重复"]], "", ""], ["Model Language", "范例与模板", [["make a decision / a mistake / progress; take a risk / a chance / a break.", "make 与 take 搭配"], ["do homework / research / your best.", "do 搭配"], ["depend on, good at, interested in, responsible for, afraid of.", "形容词/动词+介词"], ["Contrast: however, although; Reason: because, since; Result: therefore, consequently; Addition: moreover.", "连接词分类"]], "", ""], ["Common Mistakes", "常见错误", [["do a decision (✗) → make a decision (✓).", "decision 用 make"], ["interested on (✗) → interested in (✓).", "interested in"], ["Because ..., so ... in one sentence (✗).", "because 与 so 不同时用"], ["Overusing 'very'. Use strong adjectives (exhausted, delighted).", "少用 very，换强词"]], "", ""], ["Exam Question Patterns", "考试常见问法", [["Choose the correct preposition.", "选介词"], ["Replace the underlined word with a synonym.", "换同义词"], ["Join the sentences with a suitable linking word.", "用连接词合并句子"]], "", ""], ["Word Formation", "构词", [["Prefixes: un- (unhappy), dis- (dislike), im-/in-/il-/ir- (impossible, incorrect, illegal, irregular), mis- (misunderstand), re- (rebuild).", "前缀"], ["Suffixes: -tion/-ment (decision, development), -ness (kindness), -able (comfortable), -ful (helpful), -less (careless).", "后缀"], ["Change word class: succeed → success → successful → successfully.", "词性转换"], ["For cloze/word-formation items decide the class needed before changing the word.", "先判断需要的词性"]], "", ""], ["Phrasal Verbs", "短语动词", [["look after (take care of), look for (search), look up (check in a dictionary).", "照顾、寻找、查阅"], ["give up (stop trying), put off (postpone), turn down (refuse), carry on (continue).", "放弃、推迟、拒绝、继续"], ["come up with (think of an idea), run out of (have no more), take part in (join).", "想出、用完、参加"], ["get along with (have a good relationship), look forward to + -ing (wait eagerly).", "相处、期待"]], "", ""], ["Commonly Confused Words", "易混词", [["affect (verb) / effect (noun); advice (noun) / advise (verb).", "影响（动/名）；建议（名/动）"], ["accept (receive) / except (not including); lose (verb) / loose (not tight).", "接受/除外；丢失/松的"], ["its (belongs to it) / it's (it is); their / there / they're; then / than.", "its/it's；their/there/they're；then/than"], ["principal (head, main) / principle (rule); borrow (take) / lend (give).", "校长/原则；借入/借出"]], "", ""], ["Idioms and Collocations", "习语与搭配", [["break the ice (start a conversation); a piece of cake (very easy); under the weather (unwell).", "打破僵局；小菜一碟；身体不适"], ["hit the books (study hard); once in a blue moon (very rarely).", "用功读书；千载难逢"], ["Collocations: make a mistake, do homework, take a break, heavy rain, strong tea.", "固定搭配"]], "", ""], ["Uji Diri", "自测：先想答案，再对照", [["S: 'make' or 'do' a decision? J: make.", "问：decision 搭配？答：make。"], ["S: good ___ ? J: at.", "问：good ___？答：at。"], ["S: Link word for result? J: Therefore / Consequently.", "问：表结果？答：Therefore / Consequently。"], ["S: Fix: interested on J: interested in.", "问：改正 interested on答：interested in。"], ["S: Choose affect or effect: 'Pollution has a bad ___ on health.' J: effect.", "问：Pollution has a bad ___ on health？答：effect"], ["S: Meaning of 'give up'? J: stop trying.", "问：give up 的意思？答：放弃"]], "", ""]], "bi|5": [["Key Points", "重点要点", [["Subject–verb agreement: the number of ... is; a number of ... are.", "主谓一致"], ["Tenses: past simple for events; past continuous for background; present perfect for results up to now.", "时态用法"], ["Conditionals: If I were you, I would ...; If it rains, we will ...", "条件句"], ["Articles: the = specific/unique; a/an = first mention; no article for general plurals.", "冠词"], ["Reported speech: shift the tense back.", "间接引语时态后移"]], "", ""], ["Model Language", "范例与模板", [["Everyone / each / nobody take singular verbs.", "everyone 等配单数"], ["Since + point in time; for + duration.", "since 与 for"], ["Neither ... nor / Either ... or: verb agrees with the nearer subject.", "就近一致"]], "", ""], ["Common Mistakes", "常见错误", [["The number of students are (✗) → is (✓).", "the number of 配 is"], ["He go to school (✗) → goes (✓).", "第三人称单数"], ["I have seen him yesterday (✗) → saw (✓).", "昨天用过去式"], ["If I was you (✗ formal) → If I were you (✓).", "虚拟用 were"]], "", ""], ["Exam Question Patterns", "考试常见问法", [["Fill in the blank with the correct tense.", "选正确时态"], ["Correct the error in the sentence.", "改错"], ["Choose the correct article.", "选冠词"]], "", ""], ["Tenses Overview", "时态总览", [["Present simple: habits and facts (She walks to school). Present continuous: now or temporary (She is walking).", "现在时：习惯/正在进行"], ["Present perfect: result or experience up to now (I have finished). Use since + point in time, for + duration.", "现在完成时"], ["Past simple: finished events (I met him yesterday). Past continuous: background action (I was reading when he called).", "过去时与过去进行时"], ["Past perfect: earlier past (She had left before I arrived).", "过去完成时"], ["Future: will (decision/prediction), going to (plan), present continuous (arrangement).", "将来时"]], "", ""], ["Passive Voice", "被动语态", [["Form: be + past participle. The window was broken by the boy.", "结构：be + 过去分词"], ["Tenses: is made, was made, has been made, will be made, is being made.", "各时态被动"], ["Use the passive when the doer is unknown or unimportant: The shop was robbed last night.", "施事者不明或不重要时用"], ["Change active to passive: object becomes subject; verb → be + past participle; subject → by + agent.", "主动变被动的步骤"]], "", ""], ["Conditionals", "条件句", [["Zero: If you heat ice, it melts. (general truth)", "零条件：普遍真理"], ["First: If it rains, we will stay home. (real, likely)", "第一条件：可能发生"], ["Second: If I were you, I would apologise. (unreal present)", "第二条件：与现在事实相反"], ["Third: If she had studied, she would have passed. (unreal past)", "第三条件：与过去事实相反"]], "", ""], ["Reported Speech", "间接引语", [["Shift tenses back: 'I am tired' → She said (that) she was tired.", "时态后退一步"], ["Change pronouns and time words: now → then; today → that day; tomorrow → the next day.", "代词与时间状语变化"], ["Questions: 'Where do you live?' → He asked where I lived. Yes/no: He asked if/whether ...", "疑问句改写，语序变陈述"], ["Commands: 'Sit down.' → She told me to sit down.", "祈使句：told ... to"]], "", ""], ["Relative Clauses and Connectors", "关系从句与连接词", [["who (people), which (things), that (both), whose (possession), where (places).", "关系代词"], ["Non-defining clauses use commas: My uncle, who lives in Ipoh, is a doctor.", "非限定性从句加逗号"], ["Contrast: although, however, but. Reason: because, since. Result: so, therefore. Addition: moreover, in addition.", "对比/原因/结果/递进"], ["Do not use although and but together in one sentence.", "although 和 but 不能同用"]], "", ""], ["Prepositions, Articles and Modal Verbs", "介词、冠词与情态动词", [["Time: at 7 o'clock, on Monday, in June. Place: at the bus stop, in the room, on the table.", "时间与地点介词"], ["a/an for first mention or a general singular; the for specific or unique things (the sun).", "冠词用法"], ["Modal verbs: must (necessity), should (advice), can/could (ability, possibility), might (possibility).", "情态动词"], ["Modals are followed by the base verb: She can swim (not can swims).", "情态动词后接动词原形"]], "", ""], ["Uji Diri", "自测：先想答案，再对照", [["S: 'A number of students ___' (is/are)? J: are.", "问：a number of students ___？答：are。"], ["S: Since or for: 'two years'? J: for.", "问：'two years' 用 since 还是 for？答：for。"], ["S: If I ___ you, I would ... (was/were)? J: were.", "问：If I ___ you？答：were。"], ["S: Report: 'I am tired,' she said. J: She said (that) she was tired.", "问：改间接引语？答：She said (that) she was tired."], ["S: Complete: If it rains, we ___ stay home. J: will.", "问：If it rains, we ___ stay home？答：will"], ["S: Passive: The boy broke the window. J: The window was broken by the boy.", "问：改被动？答：The window was broken by the boy."]], "", ""]], "bi|6": [["Key Points", "重点要点", [["Listening: 30 marks, about 40 minutes.", "听力 30 分，约 40 分钟"], ["Read the options before the audio; underline keywords.", "先读选项，划关键词"], ["Listen for numbers, names, times and changes of mind (but, actually).", "注意数字、名字、时间、转折"], ["Speaking: give an opinion, a reason and an example.", "口语：观点+理由+例子"]], "", ""], ["Model Language", "范例与模板", [["In my opinion ... because ...", "我认为……因为……"], ["For example, ...", "例如……"], ["On the other hand, ...", "另一方面……"], ["Could you say that again, please?", "请再说一遍"]], "", ""], ["Common Mistakes", "常见错误", [["Answering with only yes/no.", "只答 yes/no"], ["Writing the answer late and missing the next question.", "答案写太慢漏下一题"], ["Long silence; use fillers such as 'Let me think'.", "长时间沉默"]], "", ""], ["Exam Question Patterns", "考试常见问法", [["Choose the picture that matches the recording.", "选与录音相符的图"], ["Complete the notes with a word or number.", "填词或数字"], ["Talk about your hobbies / a memorable event.", "谈爱好/难忘经历"]], "", "Speaking marks: confirm with the official format book."], ["Listening: Strategies by Task", "听力：按题型策略", [["Picture/short dialogue: look at the pictures first and predict the vocabulary.", "图片题：先预测词汇"], ["Notes completion: write a word or number; check spelling and units.", "填空：注意拼写和单位"], ["Multiple choice: listen for the idea, not just matching words; beware of corrections (No, I mean ...).", "选择题：留意更正"], ["Use pauses to read the next question; never leave a blank.", "利用间隙读下一题；不留空白"]], "", ""], ["Speaking: Answer Structure", "口语：回答结构", [["A.R.E.: Answer → Reason → Example. Do you like reading? Yes, I do, because it relaxes me. For example, last week I finished a mystery novel.", "回答 → 理由 → 例子"], ["Speak in full sentences; extend answers beyond one word.", "用完整句子"], ["Useful phrases: In my opinion, ...; Another point is ...; On the other hand, ...; Could you repeat that, please?", "常用表达"], ["Keep a steady pace; if you make a mistake, correct yourself calmly and continue.", "语速平稳，出错自然纠正"]], "", ""], ["Uji Diri", "自测：先想答案，再对照", [["S: What to do before the audio starts? J: Read the options.", "问：听前做什么？答：先读选项。"], ["S: Name one linking phrase for examples. J: For example.", "问：举例用语？答：For example。"], ["S: Marks for Listening? J: 30.", "问：听力总分？答：30 分。"], ["S: What does A.R.E. stand for in speaking? J: Answer, Reason, Example.", "问：A.R.E. 指什么？答：回答、理由、例子"]], "", ""]], "bm|0": [["Istilah Penting", "重点术语", [["Jenis karangan: rencana, ucapan, cerita, laporan, surat.", "文体种类"], ["Bahagian A wajib; Bahagian B pilih satu (ikut format kertas anda).", "A 必答，B 选一"], ["Pendahuluan: peribahasa, soalan retorik, definisi atau situasi.", "开头方式"], ["Binaan perenggan: isi + huraian + contoh + kesimpulan kecil.", "段落结构"], ["Penutup: rumusan dan harapan atau nasihat.", "结尾：总结与希望"]], "", ""], ["Contoh & Templat", "范例与模板", [["Penanda wacana: Pertama sekali, Selain itu, Di samping itu, Tambahan pula, Walau bagaimanapun, Akhir sekali.", "连接语"], ["Peribahasa: Bersatu teguh, bercerai roboh; Hendak seribu daya, tak hendak seribu dalih.", "谚语例子"], ["Ucapan: Salam hormat → penghargaan kepada tetamu → isi → penutup + terima kasih.", "演讲格式"], ["Laporan: Tajuk → Tarikh/Tempat → Isi → Penutup + nama penulis.", "报告格式"]], "", ""], ["Kesalahan Lazim", "常见错误", [["Tersalah jenis karangan atau format.", "文体或格式错"], ["Isi disenaraikan tanpa huraian.", "只列点不阐述"], ["Ayat terlalu panjang dan tidak tepat.", "句子冗长"], ["Tiada penutup.", "没有结尾"]], "", ""], ["Soalan Lazim SPM", "考试常见问法", [["Tulis sebuah rencana tentang pentingnya ...", "写文章谈...的重要"], ["Tulis ucapan tentang ... untuk perhimpunan sekolah.", "校会演讲"], ["Tulis cerita yang bermula dengan ...", "指定开头的故事"]], "", "Bahagian/markah: ikut format rasmi dalam kertas anda."], ["Struktur Karangan", "作文结构", [["Pendahuluan (1 perenggan): ayat pembuka (peribahasa / soalan retorik / definisi / pernyataan), huraikan tajuk, nyatakan hala tuju isi.", "引言（1 段）：开头句（谚语/设问/定义/陈述）、解释题目、点出要写的要点"], ["Isi (3–4 perenggan): satu isi utama setiap perenggan + huraian + contoh/bukti + kesimpulan kecil.", "主体（3–4 段）：每段一个主要点 + 阐述 + 例子/证据 + 小结"], ["Penutup (1 perenggan): rumusan isi dan harapan/nasihat; jangan bawa isi baharu.", "结尾（1 段）：总结要点并写期望/劝勉；不要引入新内容"], ["Susun isi dari yang paling penting kepada yang kurang penting; gunakan penanda wacana antara perenggan.", "要点按重要性排列；段与段之间用语篇标记连接"], ["Patuhi jenis karangan dan format yang diminta: rencana, ucapan, laporan, cerita, surat rasmi.", "严格按题目要求的体裁与格式写"]], "", "Petua: baca soalan dua kali, bulatkan kata kunci (jenis karangan, bilangan isi, sasaran pembaca) sebelum menulis."], ["Surat Rasmi: Format", "正式书信格式", [["Alamat pengirim di penjuru kanan atas, kemudian tarikh di bawahnya.", "寄信人地址在右上角，下面写日期"], ["Alamat penerima di sebelah kiri: nama/jawatan, nama organisasi, alamat.", "收信人地址在左侧：姓名/职位、机构、地址"], ["Salam pembuka: Tuan/Puan, (dengan tanda koma).", "称呼：Tuan/Puan,"], ["Tajuk surat dalam huruf besar dan tebal/bergaris, ringkas dan jelas, contohnya: PERMOHONAN MENGGUNAKAN DEWAN SEKOLAH.", "标题用大写并加粗/下划线，简短明确"], ["Isi: perenggan pembuka (tujuan), perenggan isi (butiran), perenggan penutup. Akhiri dengan: Sekian, terima kasih. Kemudian: Yang benar, (nama dalam kurungan).", "正文：开头（目的）、内容（细节）、结尾；以“Sekian, terima kasih.”结束，再写“Yang benar,”和署名"]], "", "Petua: gunakan bahasa baku, tiada singkatan SMS dan tiada ayat emosi dalam surat rasmi."], ["Ucapan dan Laporan", "演讲稿与报告", [["Ucapan: salam pembuka → penghormatan kepada tetamu (Yang Berusaha..., Yang Dihormati...) → pendahuluan → isi (3–4) → penutup + Sekian, terima kasih.", "演讲稿：开场问候 → 向嘉宾致敬 → 引言 → 要点 → 结尾致谢"], ["Gunakan ayat retorik, ajakan dan gaya bahasa untuk menarik perhatian pendengar.", "多用设问、号召和修辞吸引听众"], ["Laporan: tajuk → pengenalan (latar program) → isi (tarikh, tempat, aktiviti, hasil) → penutup/cadangan → nama penyedia dan tarikh.", "报告：标题 → 简介 → 内容（时间、地点、活动、成果）→ 结尾/建议 → 撰写人与日期"], ["Gunakan ayat pasif dan kata ganti ketiga (beliau, mereka); laporan bersifat fakta, bukan pendapat peribadi.", "报告用被动句与第三人称，只写事实，不写个人感受"], ["Perhatikan kata arahan dalam soalan (laporan tentang..., ucapan sempena...).", "注意题目的指令词"]], "", ""], ["Peribahasa dan Simpulan Bahasa", "谚语与惯用语", [["Bagai aur dengan tebing: saling memerlukan dan bergantung.", "如同竹与河岸：相互依赖"], ["Berat sama dipikul, ringan sama dijinjing: bekerjasama dalam susah dan senang.", "有难同当有福同享"], ["Bulat air kerana pembetung, bulat manusia kerana muafakat: kata sepakat menjayakan sesuatu.", "团结一致才能成功"], ["Rajin pangkal pandai; usaha tangga kejayaan: kegigihan membawa kejayaan.", "勤能生巧；努力是成功的阶梯"], ["Simpulan bahasa: ringan tulang (rajin), besar kepala (sombong), kaki bangku (tidak pandai bersukan), panjang tangan (suka mencuri), buah tangan (cenderamata).", "惯用语：勤快、傲慢、不擅运动、手脚不干净、手信"]], "", "Petua: gunakan peribahasa pada pendahuluan dan penutup, dan pastikan maksudnya sesuai dengan isi."], ["Contoh Perenggan: Menjaga Alam Sekitar", "示范段落：爱护环境", [["Pendahuluan: Alam sekitar ibarat ibu yang memberikan kita kehidupan. Oleh itu, tanggungjawab menjaganya terletak di bahu semua lapisan masyarakat. Antara langkah yang boleh diambil termasuklah kempen kitar semula dan penguatkuasaan undang-undang.", "引言：环境如同母亲；因此人人有责任；方法包括回收运动与执法"], ["Isi: Pertama sekali, kempen kitar semula dapat mengurangkan pembuangan sisa. Hal ini demikian kerana bahan terbuang diproses semula menjadi barang berguna. Sebagai contoh, tin aluminium dilebur untuk dijadikan tin baharu.", "要点：回收减少垃圾；原因；例子"], ["Penutup: Kesimpulannya, menjaga alam sekitar merupakan tanggungjawab bersama. Marilah kita bertindak sekarang agar generasi akan datang dapat menikmati bumi yang bersih dan hijau.", "结尾：总结 + 号召"], ["Perhatikan pola: pernyataan isi → huraian (Hal ini demikian kerana...) → contoh (Sebagai contoh,...).", "注意模式：主旨 → 阐述 → 例子"]], "", ""], ["Uji Diri", "自测：先想答案，再对照", [["S: Apakah struktur perenggan? J: Isi, huraian, contoh, kesimpulan.", "问：段落结构？答：要点、阐述、例子、小结。"], ["S: Apakah yang dibuat dahulu? J: Bulatkan jenis karangan.", "问：第一步？答：圈出文体。"], ["S: Nyatakan satu penanda wacana. J: Selain itu.", "问：一个连接语？答：Selain itu。"], ["S: Apa dalam penutup? J: Rumusan dan harapan.", "问：结尾写？答：总结与希望。"], ["S: Apakah penutup surat rasmi? J: Sekian, terima kasih. diikuti Yang benar,.", "问：正式书信的结尾？答：Sekian, terima kasih. 然后 Yang benar,"], ["S: Berapakah bilangan perenggan dalam karangan yang lengkap? J: Sekurang-kurangnya pendahuluan, 3–4 isi dan penutup.", "问：完整作文的结构？答：引言 + 3–4 主体段 + 结尾"], ["S: Apakah maksud 'bagai aur dengan tebing'? J: Saling memerlukan.", "问：谚语含义？答：相互依赖"]], "", ""]], "bm|1": [["Istilah Penting", "重点术语", [["Ringkasan: pendekkan teks kepada isi penting dalam satu perenggan.", "把文章缩成一段要点"], ["Isi penting = fakta utama; buang contoh, huraian dan ayat hiasan.", "只留主要事实"], ["Patuhi had perkataan.", "遵守字数"], ["Guna ayat sendiri, jangan salin.", "用自己的话"]], "", ""], ["Contoh & Templat", "范例与模板", [["Langkah: baca → garis isi → senarai isi → gabung ayat → semak had perkataan.", "五步法"], ["Gunakan kata hubung: dan, serta, kerana, supaya, sehingga.", "用连接词连句"], ["Gunakan ayat pasif/aktif untuk memendekkan.", "改写缩短"]], "", ""], ["Kesalahan Lazim", "常见错误", [["Menyalin ayat asal.", "照抄"], ["Menambah pendapat atau contoh sendiri.", "加入自己的意见"], ["Melebihi had perkataan.", "超字数"], ["Tiada pengaitan antara isi.", "要点之间无衔接"]], "", ""], ["Soalan Lazim SPM", "考试常见问法", [["Tulis ringkasan tentang ... dalam lebih kurang __ patah perkataan.", "限字数摘要"], ["Ringkaskan langkah/punca/kesan yang dinyatakan.", "摘要步骤/原因/影响"]], "", ""], ["Langkah Meringkaskan Teks", "摘要步骤", [["1. Baca arahan: jumlah isi, topik ringkasan dan had perkataan.", "先读指令：要点数、主题与字数上限"], ["2. Baca teks dan garis isi penting (selalunya terdapat dalam ayat topik di awal perenggan).", "读文并划出要点（常在段首主旨句）"], ["3. Senaraikan isi penting dalam ayat ringkas; buang contoh, ulangan dan huraian.", "把要点列成简短句；删去例子、重复和细节"], ["4. Gabungkan isi dengan kata hubung dan tulis dalam satu perenggan menggunakan ayat sendiri.", "用连词连成一段，用自己的话写"], ["5. Kira perkataan dan semak ejaan serta tatabahasa.", "数字数并检查拼写与语法"]], "", "Petua: jangan menulis pendapat sendiri; ringkasan hanya mengandungi isi daripada teks."], ["Teknik Memendekkan Ayat", "缩短句子的技巧", [["Gantikan frasa panjang dengan satu perkataan: pada masa ini → kini; oleh sebab itu → maka; dalam jangka masa yang panjang → lama-kelamaan.", "用单词代替长短语"], ["Buang kata penguat dan hiasan: sangat, amat, benar-benar; buang peribahasa dan perumpamaan.", "删去强调词与修饰、谚语"], ["Gabungkan dua ayat: Ali rajin belajar. Ali berjaya. → Ali berjaya kerana rajin belajar.", "合并两句"], ["Gunakan senarai: Mereka membeli beras, gula dan minyak. → Mereka membeli barang keperluan dapur.", "用概括词代替罗列"], ["Pastikan isi yang dipendekkan tidak mengubah maksud asal.", "缩短后不能改变原意"]], "", ""], ["Contoh Ringkasan", "摘要示范", [["Teks asal: Kegiatan bergotong-royong perlu dihidupkan semula kerana banyak faedahnya. Selain dapat mengeratkan hubungan penduduk, kampung juga menjadi bersih. Kos penyelenggaraan turut dapat dijimatkan. Contohnya, penduduk Kampung Seri menjaga parit bersama-sama setiap hujung minggu.", "原文：互助合作的好处"], ["Isi penting: (1) mengeratkan hubungan penduduk; (2) kampung bersih; (3) menjimatkan kos. (Contoh Kampung Seri dibuang.)", "要点：三点；例子删去"], ["Ringkasan: Kegiatan bergotong-royong perlu dihidupkan semula kerana dapat mengeratkan hubungan penduduk, menjadikan kampung bersih dan menjimatkan kos penyelenggaraan.", "摘要成品：一句话连接三点"], ["Perhatikan: ayat baharu, tiada contoh, dan semua isi digabungkan dengan koma dan kata hubung.", "注意：重新造句、无例子、用连词连接"]], "", ""], ["Uji Diri", "自测：先想答案，再对照", [["S: Berapa perenggan ringkasan? J: Satu.", "问：摘要几段？答：一段。"], ["S: Boleh salin ayat asal? J: Tidak.", "问：可抄原句吗？答：不可。"], ["S: Apa dibuang? J: Contoh dan huraian.", "问：要删掉什么？答：例子和阐述。"], ["S: Bolehkah memasukkan contoh dalam ringkasan? J: Tidak; contoh dibuang.", "问：摘要可以放例子吗？答：不可以"], ["S: Gantikan 'pada masa ini' dengan satu perkataan. J: Kini.", "问：一个词替换 pada masa ini？答：kini"]], "", ""]], "bm|2": [["Istilah Penting", "重点术语", [["Soalan pemahaman: jawab berdasarkan teks.", "根据文章作答"], ["'Apakah maksud ...': tafsir mengikut konteks.", "词义按语境"], ["'Jelaskan': beri sebab dan kesan.", "解释题：因+果"], ["'Pada pendapat anda': beri pendirian dan alasan.", "观点题：立场+理由"], ["Jawapan lengkap dan ringkas.", "答案完整简洁"]], "", ""], ["Contoh & Templat", "范例与模板", [["Rumus: Isi → Bukti dari teks → Huraian.", "答题公式"], ["Ubah suai ayat teks, jangan salin keseluruhan.", "改写文本语句"]], "", ""], ["Kesalahan Lazim", "常见错误", [["Menyalin satu perenggan.", "整段照抄"], ["Jawapan tiada bukti.", "无依据"], ["Tidak menjawab ikut kata arahan (nyatakan/jelaskan/huraikan).", "不按指令词作答"]], "", ""], ["Soalan Lazim SPM", "考试常见问法", [["Nyatakan dua ...", "列出两点"], ["Jelaskan mengapa ...", "解释原因"], ["Apakah pengajaran daripada teks?", "文章的教训"]], "", ""], ["Jenis Soalan Pemahaman", "理解题类型", [["Isi tersurat: jawapan terdapat jelas dalam teks (nyatakan, senaraikan).", "显性信息：答案直接在文中"], ["Isi tersirat: jawapan diperoleh daripada maklumat yang tidak dinyatakan secara langsung; perlu membuat inferens.", "隐含信息：需推断"], ["Soalan bahasa: maksud perkataan/peribahasa dalam konteks, unsur gaya bahasa.", "语言题：词语/谚语在语境中的意思，修辞"], ["Soalan nilai dan pengajaran; soalan pendapat (KBAT): beri pendirian dan sebab.", "价值/教训题；高阶思维：给出立场与理由"], ["Jumlah markah menentukan bilangan isi yang diperlukan dalam jawapan.", "分数决定要写的要点数量"]], "", ""], ["Kata Arahan dan Cara Menjawab", "指令词与答法", [["Nyatakan / Senaraikan: tulis isi ringkas, tidak perlu huraian.", "列举：简要写要点"], ["Jelaskan / Terangkan / Huraikan: beri isi + penjelasan (sebab, kesan atau contoh).", "解释/阐述：要点 + 说明"], ["Bincangkan: tulis kebaikan dan keburukan atau pelbagai sudut dengan alasan.", "讨论：优缺点或多角度并说明理由"], ["Bandingkan: nyatakan persamaan dan perbezaan.", "比较：相同与不同"], ["Pada pendapat anda: beri pendirian yang jelas + alasan + contoh.", "你认为：立场 + 理由 + 例子"]], "", ""], ["Contoh Jawapan Pemahaman", "理解题示范答案", [["Soalan: Mengapakah Pak Ali memilih menanam sayur-sayuran? (2 markah)", "题：阿里叔为何种蔬菜？（2分）"], ["Jawapan: Pak Ali memilih menanam sayur-sayuran kerana harga sayur semakin meningkat dan dia ingin menjimatkan perbelanjaan keluarga.", "答：因为菜价上涨，想节省家庭开销（两个要点各1分）"], ["Soalan: Apakah nilai murni yang ada pada watak ini? Jawapan: Rajin, kerana beliau menjaga kebun setiap hari tanpa mengeluh.", "题：价值观？答：勤奋 + 证据"], ["Elakkan menyalin satu perenggan; ubah suai ayat dan ambil isi yang berkaitan sahaja.", "不要抄整段，改写并只取相关要点"]], "", ""], ["Uji Diri", "自测：先想答案，再对照", [["S: 'Jelaskan' perlu apa? J: Isi dan huraian lengkap (boleh sertakan sebab atau kesan).", "问：Jelaskan 要写？答：因和果。"], ["S: Maksud perkataan ikut apa? J: Konteks teks.", "问：词义依据？答：语境。"], ["S: Format jawapan? J: Isi, bukti, huraian.", "问：答案格式？答：要点、证据、阐述。"], ["S: Apakah perbezaan 'nyatakan' dengan 'jelaskan'? J: Nyatakan = isi ringkas; jelaskan = isi + penjelasan.", "问：nyatakan 与 jelaskan 的区别？答：前者只写要点，后者要解释"], ["S: Isi tersirat ialah apa? J: Isi yang tidak dinyatakan secara langsung dalam teks.", "问：隐含信息？答：文中没有直接说出的信息"]], "", ""]], "bm|3": [["Istilah Penting", "重点术语", [["Awalan: me-, ber-, pe-, per-, ter-, di-, se-, ke-.", "前缀"], ["Akhiran: -kan, -i, -an.", "后缀"], ["Apitan: me-kan, pe-an, ke-an.", "圈缀"], ["Kata ganda: penuh, separa, berentak.", "叠词三种"], ["Ayat majmuk: gabungan, pancangan, campuran.", "复句三种"]], "", ""], ["Contoh & Templat", "范例与模板", [["me- + baca → membaca; ber- + lari → berlari; ter- + jatuh → terjatuh.", "前缀例子"], ["-kan: lakukan; -i: hadiri; -an: makanan.", "后缀例子"], ["pe-an: pembelajaran; ke-an: keindahan; me-kan: menyatakan.", "圈缀例子"], ["Penuh: buku-buku; berentak: sayur-mayur, kuih-muih.", "叠词例子"], ["Rapat: matahari, jawatankuasa, setiausaha.", "词连写例子"]], "", ""], ["Kesalahan Lazim", "常见错误", [["Tersilap ejaan imbuhan: me + pukul → memukul (huruf p luluh), bukan mempukul.", "imbuhan 拼写变化"], ["Mengeja kata majmuk yang sepatutnya rapat secara terpisah.", "连写词写成分写"], ["Menggunakan 'di' sebagai awalan dan kata depan secara tertukar.", "di 前缀与介词混用"]], "", ""], ["Soalan Lazim SPM", "考试常见问法", [["Tentukan jenis imbuhan bagi perkataan bergaris.", "判断词缀类型"], ["Betulkan kesalahan ayat.", "改错句"], ["Bina ayat menggunakan kata ganda.", "用叠词造句"]], "", ""], ["Golongan Kata", "词类", [["Kata nama: am (buku), khas (Kuala Lumpur), abstrak (keadilan), ganti nama (saya, mereka).", "名词：普通、专有、抽象、代词"], ["Kata kerja: transitif (membaca buku) dan tak transitif (berlari).", "动词：及物/不及物"], ["Kata adjektif: menerangkan sifat (cantik, rajin, tinggi).", "形容词"], ["Kata tugas: kata hubung (dan, tetapi, kerana), kata sendi nama (di, ke, daripada, kepada), kata penguat (sangat, amat), kata nafi (tidak, bukan), kata tanya (apa, siapa), kata seru (wah, aduh), kata pemeri (ialah, adalah).", "功能词：连词、介词、程度副词、否定词、疑问词、感叹词、系词"], ["Bezakan ialah (diikuti kata nama/frasa nama) dan adalah (diikuti adjektif/frasa sendi nama/frasa kerja).", "ialah 后接名词；adalah 后接形容词/介词短语"]], "", ""], ["Imbuhan dan Peluluhan", "词缀与首字脱落", [["Awalan me- berubah mengikut huruf pertama: me+baca → membaca; me+dengar → mendengar; me+ambil → mengambil; me+lihat → melihat.", "me- 随首字母变化"], ["Huruf k, p, t, s luluh: me+kirim → mengirim; me+pukul → memukul; me+tulis → menulis; me+sapu → menyapu.", "k、p、t、s 脱落"], ["Kata dasar satu suku kata: menge-: me+cat → mengecat; me+lap → mengelap.", "单音节词用 menge-"], ["pe-: pe+tulis → penulis; pe+pukul → pemukul; pe+jual → penjual; pe+kerja → pekerja.", "pe- 的变化"], ["ber-: ber+ajar → belajar; ber+kerja → bekerja; ber+ternak → beternak; ber+lari → berlari.", "ber- 的特殊变化"]], "", "Petua: kata pinjaman seperti 'kritik' ditulis mengkritik (k tidak luluh)."], ["Kata Ganda dan Kata Majmuk", "叠词与复合词", [["Kata ganda penuh: buku-buku, rumah-rumah; separa: lelaki, tetamu, pepohon; berentak: sayur-mayur, kuih-muih, gunung-ganang.", "全叠、半叠、节奏叠"], ["Kata ganda tidak perlu ditambah penjamak: semua murid (bukan semua murid-murid); banyak buku (bukan banyak buku-buku).", "已有“全部/许多”不再叠词"], ["Kata majmuk: kata yang bergabung dan membawa makna tertentu. Rapat: matahari, jawatankuasa, setiausaha, warganegara. Lain dieja terpisah: kereta api, ibu pejabat, orang ramai.", "合成词：有的连写，有的分写"], ["Kata majmuk istilah khusus: tanah liat, kad pengenalan.", "术语复合词"], ["Kata ganda berimbuhan: berlari-lari, kehijau-hijauan, anak-anakan.", "叠词加缀"]], "", ""], ["Jenis Ayat", "句子类型", [["Ayat penyata, ayat tanya, ayat perintah dan ayat seruan.", "陈述、疑问、祈使、感叹"], ["Ayat tunggal: satu klausa. Ayat majmuk: lebih daripada satu klausa.", "单句与复句"], ["Majmuk gabungan: dua ayat setara dihubungkan dengan dan, tetapi, atau, lalu, serta, malah.", "并列复句"], ["Majmuk pancangan: relatif (yang), komplemen (bahawa), keterangan (apabila, kerana, supaya, jika, walaupun).", "主从复句：关系、补语、状语"], ["Majmuk campuran: gabungan ayat majmuk gabungan dan pancangan.", "混合复句"]], "", ""], ["Ayat Aktif dan Pasif", "主动句与被动句", [["Ayat aktif: pelaku di depan; kata kerja berawalan meN-: Ali menendang bola itu.", "主动句：施事者在前"], ["Pasif jenis 1: objek di depan, kata kerja berawalan di- : Bola itu ditendang oleh Ali.", "被动句1：di- + oleh"], ["Pasif diri: kata ganti diri + kata kerja dasar tanpa imbuhan: Buku itu saya baca. Surat itu kami hantar.", "被动句2：人称代词 + 动词原形"], ["Ayat songsang: predikat di depan subjek untuk penekanan: Sedang membaca buku adikku.", "倒装句：谓语前置"], ["Soalan SPM sering meminta pelajar menukar ayat aktif kepada pasif atau sebaliknya.", "考题常要求主动被动互换"]], "", ""], ["Kesalahan Bahasa Lazim", "常见语言错误", [["Kata sendi nama: di, ke, dari dieja terpisah daripada kata nama tempat (di rumah, ke pasar). Awalan di- dieja bercantum dengan kata kerja (dibaca).", "介词分写，被动前缀连写"], ["dari digunakan untuk tempat/arah; daripada untuk orang, benda atau perbandingan: Dia datang dari Kedah. Hadiah daripada guru.", "dari 用于地点；daripada 用于人/物/比较"], ["Elakkan penjamak berganda: para pelajar (bukan para pelajar-pelajar); banyak orang (bukan banyak orang-orang).", "避免重复复数"], ["Walaupun... tetapi... ialah kesalahan; gunakan salah satu sahaja. Begitu juga kerana... maka...", "不能同时用 walaupun 与 tetapi"], ["Elakkan bahasa SMS dan bahasa pasar dalam karangan: tak, nak, dgn, yg.", "避免短信体和口语"]], "", ""], ["Uji Diri", "自测：先想答案，再对照", [["S: Sebut tiga jenis kata ganda. J: Penuh, separa, berentak.", "问：叠词三种？答：全叠、半叠、节奏叠。"], ["S: Contoh apitan? J: pe-an / ke-an / me-kan.", "问：圈缀例子？答：pe-an、ke-an、me-kan。"], ["S: Ayat majmuk ada tiga jenis apa? J: Gabungan, pancangan, campuran.", "问：复句三种？答：并列、偏正、混合。"], ["S: Tuliskan me + pukul. J: memukul.", "问：me + pukul？答：memukul"], ["S: Betulkan: Semua murid-murid hadir. J: Semua murid hadir.", "问：改错：Semua murid-murid hadir？答：Semua murid hadir"], ["S: Tukar ke pasif: Ali menendang bola itu. J: Bola itu ditendang oleh Ali.", "问：改被动？答：Bola itu ditendang oleh Ali."], ["S: Dari atau daripada? 'Hadiah ___ guru'. J: daripada.", "问：Hadiah ___ guru？答：daripada"]], "", ""]], "bm|4": [["Istilah Penting", "重点术语", [["Komsas: puisi, cerpen, novel, drama const PPTS_BC={"bc|0": [["重点要点", "", [["书信格式：称呼 → 问候 → 正文 → 祝颂语 → 署名 → 日期。", ""], ["称呼顶格，后加冒号；问候语另起一行，缩进两格。", ""], ["通告：标题 + 事由 + 时间 + 地点 + 联系 + 署名/日期。", ""], ["启事 (寻物、招领、征求等)：标题 + 事项 + 联系方式 + 署名/日期。", ""], ["便条、请假条：说明事由、时间，语气简洁礼貌。", ""]], "", ""], ["范例与模板", "", [["正式信开头：敬启者 / 尊敬的 ××：", ""], ["结尾祝颂：此致（另起）敬礼（再另起顶格）；对朋友可写“祝 学业进步”。", ""], ["通告标题居中，正文另起；落款在右下方。", ""]], "", ""], ["常见错误", "", [["对象与语气不符（给校长用口语）。", ""], ["漏写署名或日期。", ""], ["通告、启事混淆；启事要写联系方式。", ""], ["格式对但事由不具体。", ""]], "", ""], ["考试常见问法", "", [["给校长/老师/朋友写一封信，说明……", ""], ["写一则通告，通知同学……", ""], ["写一则寻物（招领）启事。", ""]], "", "Kertas 1 Bahagian A/B 的具体分配请以官方格式书为准。"], ["书信范文：给校长的建议信", "", [["敬爱的校长：（顶格，后加冒号）", ""], ["您好！（另起一行，空两格）", ""], ["我是高二甲班的学生李明。我想向您建议，在图书馆增设晚间开放时间，让同学们有更多的自习空间。目前不少同学放学后需要回家才能温习，往往效率不高。", ""], ["如果学校能够在每周二、四开放图书馆至晚上七点，相信对同学们的学习帮助很大。恳请您考虑这项建议。", ""], ["此致 / 敬礼（“此致”另起空两格，“敬礼”再另起顶格）", ""], ["学生 李明 敬上；日期写在署名下方，靠右。", ""]], "", "提示：先写事由与目的，再写理由，最后写请求；语气要尊敬、有礼。"], ["通告范文", "", [["标题：通告（居中）", ""], ["为培养同学们的阅读习惯，本校将于十一月三日（星期一）上午八时至十时，在学校礼堂举办“阅读分享会”。", ""], ["欢迎各班同学踊跃参加，有意上台分享者请于十月三十一日前向华文学会报名。", ""], ["特此通告。（结尾套语）", ""], ["落款：华文学会（右下方），日期：二〇二六年十月十二日。", ""]], "", "必备要素：标题、事由、时间、地点、联系/报名方式、落款与日期。"], ["启事范文：寻物启事与招领启事", "", [["寻物启事：本人于十月十日下午在学校篮球场遗失黑色水壶一个，内有名字贴纸。拾到者请与高二乙班王芳联系，不胜感激。", ""], ["招领启事：本人于十月十一日早上在三年级教室拾获蓝色雨伞一把，失主请到学校服务处认领。", ""], ["格式：标题（居中）→ 正文（物品特征、时间地点）→ 联系方式 → 署名与日期。", ""], ["常用套语：拾到者请与……联系，不胜感激；失主请前来认领；特此启事。", ""]], "", "启事一定要写联系方式或认领地点，否则找不到人。"], ["应用文常用套语和易错点", "", [["称呼：敬启者（对不特定的人）、敬爱的老师/校长、亲爱的朋友。", ""], ["结尾祝颂：此致敬礼、祝学业进步、顺祝安康；结尾套语：谨此、盼复、特此通告。", ""], ["便条/请假条：先写称呼，再写事由、时间，最后写署名与日期；字数少但信息要完整。", ""], ["常见错误：对象与语气不符；少写署名/日期；通告与启事混淆；事由写得太笼统。", ""], ["检查清单：格式 → 事由具体 → 语气礼貌 → 署名日期 → 错别字与标点。", ""]], "", ""], ["Uji Diri", "自测：先想答案，再对照", [["S: 书信中“此致”后接什么？ J: 敬礼，另起一行。", ""], ["S: 通告的必备要素有哪些？ J: 标题、事由、时间、地点、联系、署名与日期。", ""], ["S: 启事必须写什么才能联系到人？ J: 联系方式。", ""], ["S: 通告的结尾套语是什么？ J: 特此通告。", ""], ["S: 启事必须写什么？ J: 联系方式或认领地点。", ""]], "", ""]], "bc|1": [["重点要点", "", [["记叙文六要素：人物、时间、地点、起因、经过、结果。", ""], ["叙述顺序：顺叙、倒叙、插叙。", ""], ["细节描写：动作、神态、语言、心理、环境。", ""], ["议论文三要素：论点、论据、论证。", ""], ["说明文方法：举例子、列数字、作比较、下定义、分类别、打比方。", ""]], "", ""], ["范例与模板", "", [["开头：开门见山 / 设问引入 / 引用名言。", ""], ["结尾：点题、呼应开头、升华主题。", ""], ["议论文结构：提出论点 → 分析论证 → 结论。", ""]], "", ""], ["常见错误", "", [["写成流水账，没有重点和细节。", ""], ["论点不明确，论据与论点不符。", ""], ["偏题、离题。", ""], ["错别字与标点错误。", ""]], "", ""], ["考试常见问法", "", [["以“……”为题，写一篇记叙文。", ""], ["你是否同意……？写一篇议论文。", ""], ["介绍一样事物，写一篇说明文。", ""]], "", ""], ["记叙文：结构与写作技巧", "", [["结构：开头点题 → 起因 → 经过（发展、高潮） → 结果 → 结尾点题或抒发感受。", ""], ["六要素要交代清楚：人物、时间、地点、起因、经过、结果；经过部分要详写，其余略写。", ""], ["细节描写：动作（慢慢捡起）、神态（皱起眉头）、语言（带语气和标点）、心理（心想……）、环境（渲染气氛）。", ""], ["叙述顺序：顺叙最稳；倒叙可以制造悬念；插叙补充背景，用得要自然。", ""], ["结尾可以点题、呼应开头或升华主题，不要空喊口号。", ""]], "", "避免流水账：选一件事，把高潮写足，再用一句话收尾。"], ["记叙文片段示范", "", [["开头：每当我看到那把旧雨伞，就会想起那个下着大雨的傍晚。", ""], ["动作与神态：妈妈放下手中的饭碗，皱着眉头冲进雨里，把我护在伞下，自己的半边肩膀却湿透了。", ""], ["心理：我望着她被雨水打湿的头发，心里一阵发酸：原来爱就藏在这些不起眼的细节里。", ""], ["结尾：如今雨伞早已褪色，但那份温暖，一直撑在我的心里。（点题 + 升华）", ""]], "", ""], ["议论文：结构与论证方法", "", [["结构：引论（提出论点）→ 本论（分论点 + 论据）→ 结论（重申论点并升华）。", ""], ["三要素：论点（观点）、论据（事实、数据、名言）、论证（把论据和论点联系起来）。", ""], ["论证方法：举例论证、道理论证（引用名言）、对比论证、比喻论证。", ""], ["每个分论点一个段落：观点句 → 论据 → 分析 → 回扣论点。", ""], ["写作忌讳：论点含糊、论据与论点无关、只堆事例不分析。", ""]], "", "开头可以用设问或名言引入，结尾要回应题目。"], ["说明文与作文审题", "", [["说明文要点：说明对象明确，说明顺序（时间、空间、逻辑），说明方法（举例子、列数字、作比较、下定义、分类别、打比方）。", ""], ["语言要准确、客观、有条理，不夹杂过多感情。", ""], ["审题：圈出题眼，判断体裁（记叙、议论、说明、应用），确定人称与字数。", ""], ["立意：从题目中找最有话可写的角度；先列提纲再动笔，段落之间要有衔接。", ""], ["收尾 3 分钟检查：错别字、标点、病句、字数、标题格式。", ""]], "", ""], ["好词好句积累", "", [["形容勤奋：废寝忘食、持之以恒、锲而不舍。", ""], ["形容团结：同心协力、众志成城、齐心协力。", ""], ["形容感动：热泪盈眶、感慨万千、心潮澎湃。", ""], ["名言：千里之行，始于足下；业精于勤，荒于嬉。", ""], ["使用成语要符合语境和感情色彩，不要生硬堆砌。", ""]], "", ""], ["Uji Diri", "自测：先想答案，再对照", [["S: 议论文三要素？ J: 论点、论据、论证。", ""], ["S: 记叙文如何增加细节？ J: 加动作、神态、语言、心理、环境描写。", ""], ["S: 结尾常见写法？ J: 点题、呼应、升华。", ""], ["S: 记叙文哪一部分要详写？ J: 经过（高潮）。", ""], ["S: 议论文每个分论点怎么写？ J: 观点句 + 论据 + 分析 + 回扣。", ""]], "", ""]], "bc|2": [["重点要点", "", [["阅读理解：先通读，找关键句，概括中心思想。", ""], ["修辞：比喻（本体、喻体、喻词）、拟人、夸张、排比、设问、反问。", ""], ["词语在文中的意思要结合上下文。", ""], ["回答要用自己的话归纳，不整段照抄。", ""]], "", ""], ["范例与模板", "", [["比喻：把 A 比作 B；拟人：把物当人写。", ""], ["设问：自问自答；反问：无疑而问，答案在反面。", ""], ["作用答法：修辞 + 表达效果（生动、形象、强调、增强语气）。", ""]], "", ""], ["常见错误", "", [["比喻与拟人混淆；设问与反问混淆。", ""], ["答案照抄原文整段。", ""], ["只写手法，不写作用。", ""]], "", ""], ["考试常见问法", "", [["文中画线句用了什么修辞？有什么作用？", ""], ["概括第×段的段意。", ""], ["解释词语在文中的意思。", ""]], "", ""], ["修辞手法及作用的答题公式", "", [["比喻：把A比作B，生动形象地写出了……的特点。", ""], ["拟人：赋予事物人的动作/情感，生动形象，表达了作者……的感情。", ""], ["夸张：突出……的特点，强调……，给人深刻印象。", ""], ["排比：增强气势和节奏感，强调……，更有说服力。", ""], ["设问：引起读者注意与思考；反问：加强语气，强调……，语气强烈。", ""]], "", "答题公式：修辞名称 + 本体特征 + 表达效果 + 作者情感。"], ["概括段意与中心思想", "", [["概括段意：找段落主旨句（常在段首或段尾）；叙事段用“谁 + 做了什么 + 结果”。", ""], ["概括中心思想：全文写了什么 + 表达了什么（情感或道理）。", ""], ["公式：本文通过叙述……（事件），表达了……（情感/道理）。", ""], ["回答要用自己的话归纳，不整段照抄；字数要符合要求。", ""]], "", ""], ["句子作用与词语理解", "", [["开头句：点题、设置悬念、渲染气氛、引出下文。", ""], ["结尾句：点明中心、升华主题、呼应开头、余味无穷。", ""], ["过渡句：承上启下，使行文自然。", ""], ["词语理解：结合上下文推断；含义深刻的词语要回答“字面义 + 语境义”。", ""], ["重点词语（如“渐渐”“竟然”）：分析词性与表达效果，如表现变化过程、表示出乎意料。", ""]], "", ""], ["阅读题常见问法与答法", "", [["文中画线句用了什么修辞？有什么作用？→ 手法 + 效果。", ""], ["文章为什么用这个题目？→ 点明主旨/贯穿线索/吸引读者。", ""], ["从文中哪里可以看出……？→ 找原句，再用自己的话分析。", ""], ["你对……有什么看法？→ 观点明确 + 结合文章 + 联系生活。", ""], ["答题要分点、简洁，注意分数与要点数量对应。", ""]], "", ""], ["Uji Diri", "自测：先想答案，再对照", [["S: 设问与反问的区别？ J: 设问自问自答；反问无疑而问、答案在反面。", ""], ["S: 排比至少几个句子？ J: 三个或以上，结构相似。", ""], ["S: 修辞题答案包含什么？ J: 手法加作用。", ""], ["S: 比喻句的作用怎么答？ J: 生动形象地写出了……特点。", ""], ["S: 概括段意的公式？ J: 谁 + 做了什么 + 结果。", ""]], "", ""]], "bc|3": [["重点要点", "", [["常见虚词：之、其、而、以、于、者、也、乎、焉、矣。", ""], ["一词多义、古今异义（如“走”古义为“跑”，“去”古义为“离开”）。", ""], ["通假字：音同或音近而借用的字。", ""], ["翻译五字诀：留、换、补、删、调。", ""]], "", ""], ["范例与模板", "", [["留：人名、地名、官名保留不译。", ""], ["换：把古词换成现代词。", ""], ["补：补出省略的主语或成分。", ""], ["删：删去无义的虚词。", ""], ["调：调整倒装语序。", ""]], "", ""], ["常见错误", "", [["把古义当成今义。", ""], ["直译后句子不通顺。", ""], ["漏译虚词的作用或省略成分。", ""]], "", ""], ["考试常见问法", "", [["解释文中加点字的意思。", ""], ["把句子翻译成现代汉语。", ""], ["根据文章内容回答问题。", ""]], "", "文言文约占 Kertas 2 的 30 分（据练习网站转述的格式表，请核对官方格式书）。"], ["文言实词：古今异义与通假字", "", [["古今异义：走（古义：跑）、去（古义：离开）、妻子（古义：妻子和儿女）、非常（古义：不同寻常）、汤（古义：热水）、书（古义：书信）、池（古义：护城河）。", ""], ["通假字：说（通“悦”）、知（通“智”）、蚤（通“早”）、反（通“返”）。", ""], ["一词多义：以（用、因为、来）、为（作为、是、成为）、于（在、向、比）要结合语境判断。", ""], ["词类活用：名词作动词、形容词作动词、使动用法，翻译时要补出意思。", ""]], "", "做题提示：把词义放回句子里读，看是否通顺。"], ["文言虚词用法", "", [["之：代词（它）、助词（的）、取消句子独立性；例：学而时习之（之=代词）。", ""], ["而：表并列、承接、转折；例：学而不思则罔（而=转折）。", ""], ["以：用、凭、因为、来；于：在、向、比；其：他的/它的/那。", ""], ["者：……的人/事；也：判断或语气；矣：了；乎：吗/于；焉：兼词或语气词。", ""], ["虚词要放在句子中判断，一个字往往有几种用法。", ""]], "", ""], ["文言句式", "", [["判断句：……者，……也；……，……也；翻译成“……是……”。", ""], ["被动句：见、为……所、被；翻译成“被……”。", ""], ["倒装句：宾语前置（何陋之有→有何陋）、定语后置、状语后置。", ""], ["省略句：省略主语、宾语或介词，翻译时要补出。", ""], ["翻译时先找出句式，再逐字落实。", ""]], "", ""], ["翻译技巧与例句", "", [["例1：学而不思则罔，思而不学则殆。→ 只学习而不思考就会迷惑，只思考而不学习就会疑惑。", ""], ["例2：三人行，必有我师焉。→ 几个人同行，其中必定有可以做我老师的人。", ""], ["留：人名、地名、官名不译；换：古词换今词；补：补出省略成分；删：删去无义虚词；调：调整倒装语序。", ""], ["翻译完要通读一遍，保证句子通顺、符合原意。", ""]], "", ""], ["文言文阅读答题步骤", "", [["先通读全文，弄清故事、人物和大意。", ""], ["解释字词时联系上下文和已学知识。", ""], ["概括人物形象：看人物的语言、行动，再用一两个词概括。", ""], ["归纳启示：从文章的道理、教训出发，结合生活写。", ""], ["答案分点作答，字迹工整，不要漏写要点。", ""]], "", ""], ["Uji Diri", "自测：先想答案，再对照", [["S: 翻译五字诀是什么？ J: 留、换、补、删、调。", ""], ["S: “走”的古义是什么？ J: 跑。", ""], ["S: 通假字是什么？ J: 音同或音近而借用的字。", ""], ["S: “蚤”通哪个字？ J: 早。", ""], ["S: 判断句的标志？ J: ……者，……也。", ""]], "", ""]], "bc|4": [["重点要点", "", [["病句类型：搭配不当、语序不当、成分残缺、前后矛盾、重复啰嗦、不合逻辑。", ""], ["成语：要理解含义与感情色彩，不能望文生义。", ""], ["标点：逗号、顿号、分号、冒号、引号、省略号各有用法。", ""], ["顿号用于并列词语之间，分号用于分句并列。", ""]], "", ""], ["范例与模板", "", [["修改病句：先找主干（谁 + 做了什么），再看修饰成分。", ""], ["重复：“大约……左右”只能留一个。", ""]], "", ""], ["常见错误", "", [["望文生义使用成语。", ""], ["顿号与逗号用混。", ""], ["修改后又产生新病句。", ""]], "", ""], ["考试常见问法", "", [["指出并修改下列病句。", ""], ["选择适当的成语填空。", ""], ["为句子加上标点符号。", ""]], "", ""], ["成语理解与常见误用", "", [["差强人意：大体上还能使人满意（不是“不满意”）。", ""], ["首当其冲：最先受到攻击或遭遇灾难（不是“首先”）。", ""], ["不以为然：不认为是对的（不是“不在乎”）。", ""], ["炙手可热：形容权势大、气焰盛（贬义）。", ""], ["七月流火：指天气渐渐变凉（不是“酷热”）。", ""], ["使用成语先弄清含义、感情色彩和适用对象，不要望文生义。", ""]], "", ""], ["病句类型与修改", "", [["成分残缺：通过这次活动，使我们增长了知识。→ 删去“通过”或“使”。", ""], ["重复啰嗦：他大约十二岁左右。→ 删去“大约”或“左右”。", ""], ["否定不当：我们要避免不再发生类似的错误。→ 去掉“不”。", ""], ["搭配不当：他的写作水平显著增加。→ “水平”应与“提高”搭配。", ""], ["语序不当、前后矛盾、不合逻辑也要逐一检查；改完要重读一遍。", ""]], "", "修改方法：抓主干（谁 + 做什么），再检查修饰成分。"], ["标点符号用法", "", [["逗号：句内停顿；顿号：并列词语之间；分号：并列分句之间，层次更清楚。", ""], ["冒号：提示下文或总括上文；引号：直接引用、特殊含义。", ""], ["书名号《》：书名、篇名、报刊名；省略号：省略、语意中断；破折号：解释说明、转折。", ""], ["句号表示陈述句结束，问号用于疑问句，感叹号用于强烈感情。", ""], ["常见错误：顿号与逗号混用；引号内的句末标点位置错误。", ""]], "", ""], ["的、地、得，近义词辨析", "", [["“的”后面接名词：美丽的花；“地”后面接动词：认真地学习；“得”后面接补语：跑得很快。", ""], ["近义词要看语境、范围、轻重、感情色彩，例如“爱护/爱惜”“发现/发觉”。", ""], ["辨析时代入句子，读起来是否自然、意思是否准确。", ""]], "", ""], ["Uji Diri", "自测：先想答案，再对照", [["S: “大约三十人左右”错在哪里？ J: 重复啰嗦。", ""], ["S: 顿号用在哪里？ J: 并列词语之间。", ""], ["S: 病句修改先找什么？ J: 句子主干。", ""], ["S: “差强人意”的意思？ J: 大体上还能使人满意。", ""], ["S: 改病句：他大约十二岁左右。 J: 删去“大约”或“左右”。", ""]], "", ""]], "bc|5": [["重点要点", "", [["Kertas 3：小组讨论，约 30 分（据练习网站转述）。", ""], ["表达结构：观点 + 理由 + 例子。", ""], ["要回应他人的观点，而不是只说自己的。", ""], ["语言要流利、清楚、有礼貌。", ""]], "", ""], ["范例与模板", "", [["开场：我认为……，因为……", ""], ["回应：我同意……的看法，不过……", ""], ["补充：此外，我想补充一点……", ""], ["总结：综合大家的意见，……", ""]], "", ""], ["常见错误", "", [["抢话或长时间沉默。", ""], ["只说观点，没有理由和例子。", ""], ["偏离讨论主题。", ""]], "", ""], ["考试常见问法", "", [["就某个话题与组员讨论并表达看法。", ""], ["对他人的观点作出回应。", ""]], "", "口试分数与形式请以官方格式书和学校通知为准。"], ["小组讨论：流程与评分关注点", "", [["流程：听清题目 → 简短思考 → 轮流发言 → 回应他人 → 总结。", ""], ["评分关注：语言表达（流利、清楚、用词得当）、内容（观点明确有理由）、互动（倾听与回应）、礼貌。", ""], ["发言结构：观点 + 理由 + 例子，每次发言保持简洁。", ""], ["不要抢话，也不要长时间沉默；可用“我想补充一点……”加入讨论。", ""]], "", ""], ["常用句式与示范话题", "", [["开场：我认为……，因为……；我的看法是……", ""], ["同意与补充：我同意你的看法，此外……；你说得很对，我想补充的是……", ""], ["不同意：我理解你的意思，不过我认为……", ""], ["总结：综合大家的意见，我们认为……", ""], ["话题示范：手机对学生的利与弊。观点：利大于弊，但需自律；理由：查资料、联系；例子：线上学习；弊端：沉迷游戏。", ""]], "", ""], ["Uji Diri", "自测：先想答案，再对照", [["S: 发言的基本结构？ J: 观点、理由、例子。", ""], ["S: 讨论中要做什么？ J: 回应他人，不只说自己的。", ""], ["S: 讨论中如何加入别人的话题？ J: 先回应，再说“我想补充一点”。", ""]], "", ""]]};

const PPTS_AM={"am|T4-1": [["Key Formulas (1/2)", "核心公式 (1/2)", [["Vertical line test: a vertical line meets the graph at most once for a relation to be a function.", "垂直线测试：垂直线最多交图像于一点，才是函数。"], ["Domain, codomain, range; \\(f(x)\\) is the image of \\(x\\).", "定义域、陪域、值域；\\(x\\) 的像为 \\(f(x)\\)。"], ["Absolute value function: \\(|x|=x\\;(x\\ge0)\\), \\(|x|=-x\\;(x\\lt0)\\); the graph is V-shaped.", "绝对值函数：\\(|x|=x\\;(x\\ge0)\\)，\\(|x|=-x\\;(x\\lt0)\\)，图像呈 V 形。"], ["Composite function: \\(fg(x)=f\\big(g(x)\\big)\\), do \\(g\\) first then \\(f\\); in general \\(fg\\ne gf\\).", "复合函数：\\(fg(x)=f\\big(g(x)\\big)\\)，先 \\(g\\) 后 \\(f\\)；一般 \\(fg\\ne gf\\)。"]], "", ""], ["Key Formulas (2/2)", "核心公式 (2/2)", [["Inverse \\(f^{-1}\\): let \\(y=f(x)\\), make \\(x\\) the subject, then replace \\(y\\) with \\(x\\).", "反函数 \\(f^{-1}\\)：设 \\(y=f(x)\\)，用 \\(y\\) 表示 \\(x\\)，再把 \\(y\\) 换成 \\(x\\)。"], ["\\(ff^{-1}(x)=f^{-1}f(x)=x\\); the graphs of \\(f\\) and \\(f^{-1}\\) are symmetric about \\(y=x\\); only one-to-one functions have inverses.", "\\(ff^{-1}(x)=f^{-1}f(x)=x\\)；\\(f\\) 与 \\(f^{-1}\\) 的图像关于 \\(y=x\\) 对称；只有一对一函数有反函数。"], ["\\((fg)^{-1}=g^{-1}f^{-1}\\).", "\\((fg)^{-1}=g^{-1}f^{-1}\\)。"]], "", ""], ["Worked Example", "例题详解", [["Question: given \\(f(x)=2x+3\\), \\(g(x)=x^2\\), find \\(fg(x)\\), \\(gf(x)\\) and \\(f^{-1}(x)\\).", "题：已知 \\(f(x)=2x+3\\)，\\(g(x)=x^2\\)，求 \\(fg(x)\\)、\\(gf(x)\\) 与 \\(f^{-1}(x)\\)。"], ["Step 1: \\(fg(x)=f(x^2)=2x^2+3\\)", "第 1 步：\\(fg(x)=f(x^2)=2x^2+3\\)"], ["Step 2: \\(gf(x)=g(2x+3)=(2x+3)^2\\)", "第 2 步：\\(gf(x)=g(2x+3)=(2x+3)^2\\)"], ["Step 3: let \\(y=2x+3\\), then \\(x=\\dfrac{y-3}{2}\\)", "第 3 步：令 \\(y=2x+3\\)，则 \\(x=\\dfrac{y-3}{2}\\)"], ["Step 4: so \\(f^{-1}(x)=\\dfrac{x-3}{2}\\)", "第 4 步：所以 \\(f^{-1}(x)=\\dfrac{x-3}{2}\\)"]], "", ""], ["Solving Steps", "解题步骤", [["To find \\(fg(x)\\): substitute the whole of \\(g(x)\\) in place of x in f.", "求 \\(fg(x)\\)：把 \\(g(x)\\) 整个代入 f 的 x。"], ["Given \\(fg(x)\\), find \\(f(x)\\): let \\(u=g(x)\\), solve for x in terms of u, then substitute back.", "已知 \\(fg(x)\\) 求 \\(f(x)\\)：令 \\(u=g(x)\\)，解出 x（用 u 表示），代回。"], ["Inverse: \\(y=f(x) \\to\\) make x the subject \\(\\to\\) replace y with x \\(\\to\\) write \\(f^{-1}(x)\\).", "求反函数：\\(y=f(x) \\to\\) 换成以 y 表示 x → 把 y 换成 x → 写出 \\(f^{-1}(x)\\)。"], ["Absolute value: split into cases (\\(x\\ge 0\\) and x<0) to remove the modulus.", "含绝对值：分情况（\\(x\\ge 0\\) 与 x<0）去绝对值。"]], "", ""], ["Common Mistakes", "常见错误", [["Writing fg and gf in the wrong order.", "fg 与 gf 次序写反。"], ["Forgetting to swap x and y when finding an inverse.", "求反函数时忘了交换 x 与 y。"], ["Not checking the answers of an absolute value equation by substitution.", "绝对值方程解出后不代回检验。"]], "", ""], ["Exam Focus & Marks", "考试题型与得分点", [["Common: given f and g, find fg, gf and inverses; given fg, find f or g.", "常考：给出 f、g 求 fg、gf 与反函数；已知 fg 求 f 或 g。"], ["Mark points: show the substitution (method mark), then simplify (answer mark).", "得分点：代入过程要写出（方法分），最后化简（答案分）。"]], "", "M = method mark, A = answer mark（M = 方法分，A = 答案分）"], ["Quick Recall", "速记", [["Composite: substitute from the inside out (g first, then f); inverse: swap, then solve.", "复合从里往外代：先 g 后 f；反函数：换位置再解。"]], "", ""], ["Uji Diri", "自测：先想答案，再对照", [["S: \\(f(x)=2x+3\\), \\(g(x)=x^{2}\\), find \\(fg(x)\\). J: \\(2x^{2}+3\\)", "问：\\(f(x)=2x+3\\)，\\(g(x)=x^{2}\\)，求 \\(fg(x)\\)。答：\\(2x^{2}+3\\)"], ["S: \\(f(x)=2x+3\\), find \\(f^{-1}(x)\\). J: (x−3)/2", "问：\\(f(x)=2x+3\\)，求 \\(f^{-1}(x)\\)。答：(x−3)/2"], ["S: In \\(fg(x)\\), which function is applied first? J: g first, then f.", "问：\\(fg(x)\\) 的运算顺序？答：先 g 后 f。"]], "", ""]], "am|T4-2": [["Key Formulas (1/2)", "核心公式 (1/2)", [["Quadratic formula: \\(x=\\dfrac{-b\\pm\\sqrt{b^2-4ac}}{2a}\\).", "求根公式：\\(x=\\dfrac{-b\\pm\\sqrt{b^2-4ac}}{2a}\\)。"], ["Completing the square: \\(x^2+bx=\\left(x+\\dfrac b2\\right)^2-\\dfrac{b^2}{4}\\).", "配方法：\\(x^2+bx=\\left(x+\\dfrac b2\\right)^2-\\dfrac{b^2}{4}\\)。"], ["Sum and product of roots: \\(\\alpha+\\beta=-\\dfrac ba\\), \\(\\alpha\\beta=\\dfrac ca ：把线性式变成 \\(y=\\)… 代入非线性式"], ["S: How to simplify three equations in three unknowns? J: Eliminate the same variable", "问：三元方程组如何化简？答：消去同一个变量"]], "", ""]], "am|T4-4": [["Key Formulas (1/2)", "核心公式 (1/2)", [["Indices: \\(a^m\\times a^n=a^{m+n}\\), \\(a^m\\div a^n=a^{m-n}\\), \\((a^m)^n=a^{mn}\\).", "指数：\\(a^m\\times a^n=a^{m+n}\\)，\\(a^m\\div a^n=a^{m-n}\\)，\\((a^m)^n=a^{mn}\\)。"], ["\\(a^{-n}=\\dfrac1{a^n}\\), \\(a^{m/n}=\\sqrt[n]{a^m}\\), \\(a^0=1\\).", "\\(a^{-n}=\\dfrac1{a^n}\\)，\\(a^{m/n}=\\sqrt[n]{a^m}\\)，\\(a^0=1\\)。"], ["Surds: \\(\\sqrt a\\times\\sqrt b=\\sqrt{ab}\\), \\(\\dfrac{\\sqrt a}{\\sqrt b}=\\sqrt{\\dfrac ab}\\); rationalising \\(\\dfrac1{a+\\sqrt b}=\\dfrac{a-\\sqrt b}{a^2-b}\\).", "Surd：\\(\\sqrt a\\times\\sqrt b=\\sqrt{ab}\\)，\\(\\dfrac{\\sqrt a}{\\sqrt b}=\\sqrt{\\dfrac ab}\\)；有理化 \\(\\dfrac1{a+\\sqrt b}=\\dfrac{a-\\sqrt b}{a^2-b}\\)。"], ["Logarithms: \\(\\log_a a=1\\), \\(\\log_a1=0\\); \\(\\log_a(xy)=\\log_ax+\\log_ay\\); \\(\\log_a\\dfrac xy=\\log_ax-\\log_ay\\); \\(\\log_ax^n=n\\log_ax\\).", "对数：\\(\\log_a a=1\\)，\\(\\log_a1=0\\)；\\(\\log_a(xy)=\\log_ax+\\log_ay\\)；\\(\\log_a\\dfrac xy=\\log_ax-\\log_ay\\)；\\(\\log_ax^n=n\\log_ax\\)。"]], "", ""], ["Key Formulas (2/2)", "核心公式 (2/2)", [["Change of base: \\(\\log_ab=\\dfrac{\\log_cb}{\\log_ca}\\), \\(\\log_ab=\\dfrac1{\\log_ba}\\); \\(a^{\\log_ax}=x\\).", "换底：\\(\\log_ab=\\dfrac{\\log_cb}{\\log_ca}\\)，\\(\\log_ab=\\dfrac1{\\log_ba}\\)；\\(a^{\\log_ax}=x\\)。"]], "", ""], ["Worked Example", "例题详解", [["Question: solve \\(\\log_2(x+3)+\\log_2x=2\\).", "题：解 \\(\\log_2(x+3)+\\log_2x=2\\)。"], ["Step 1: \\(\\log_2[x(x+3)]=2\\Rightarrow x(x+3)=4\\)", "第 1 步：\\(\\log_2[x(x+3)]=2\\Rightarrow x(x+3)=4\\)"], ["Step 2: \\(x^2+3x-4=0\\Rightarrow(x+4)(x-1)=0\\)", "第 2 步：\\(x^2+3x-4=0\\Rightarrow(x+4)(x-1)=0\\)"], ["Step 3: \\(x=-4\\) (rejected, the argument must be \\(\\gt0\\)) or \\(x=1\\)", "第 3 步：\\(x=-4\\)（舍去，真数须 \\(\\gt0\\)）或 \\(x=1\\)"], ["Step 4: answer: \\(x=1\\)", "第 4 步：答：\\(x=1\\)"]], "", ""], ["Solving Steps", "解题步骤", [["Exponential equations: make the bases the same, or take logs of both sides.", "解指数方程：化成同底，或两边取对数。"], ["Logarithmic equations: combine into one log and either equate arguments or convert to index form; always check that arguments are \\(\\gt 0\\).", "解对数方程：化为 logₐ(…\\()=\\log _{a}(\\)…) 或写成指数式；必须检验真数＞0。"], ["Rationalising: multiply numerator and denominator by the conjugate.", "有理化：分子分母同乘共轭式。"]], "", ""], ["Common Mistakes", "常见错误", [["Splitting \\(\\log (x+y)\\) into log x + log y.", "把 \\(\\log (x+y)\\) 拆成 log x + log y。"], ["Treating \\((a+b)^{n}\\) as \\(a^{n}+b^{n}\\).", "\\((a+b)^{n}\\) 误当成 \\(a^{n}+b^{n}\\)。"], ["Not checking log equation answers and keeping a root that makes an argument negative.", "解对数方程后不检验，保留了使真数为负的根。"]], "", ""], ["Exam Focus & Marks", "考试题型与得分点", [["Common: exponential and log equations; change of base; rationalising surds.", "常考：解指数、对数方程；换底；surd 有理化。"], ["Mark points: combine the logs (M), reject the root that makes the argument invalid (A).", "得分点：合并对数（M），舍去不合真数的根（A）。"]], "", "M = method mark, A = answer mark（M = 方法分，A = 答案分）"], ["Quick Recall", "速记", [["Always check log equations: the argument must be greater than zero.", "对数方程必检验：真数要大于零。"]], "", ""], ["Uji Diri", "自测：先想答案，再对照", [["S: Value of \\(\\log _{2}8\\)? J: 3", "问：\\(\\log _{2}8\\) 的值？答：3"], ["S: \\(\\log a + \\log b =\\) ? J: \\(\\log (ab)\\)", "问：\\(\\log a + \\log b =\\) ？答：\\(\\log (ab)\\)"], ["S: Rationalise \\(1/\\sqrt{3}\\). J: \\(\\sqrt{3}/3\\)", "问：\\(1/\\sqrt{3}\\) 有理化？答：\\(\\sqrt{3}/3\\)"]], "", ""]], "am|T4-5": [["Key Formulas (1/2)", "核心公式 (1/2)", [["AP: \\(T_n=a+(n-1)d\\); \\(S_n=\\dfrac n2\\left[2a+(n-1)d\\right]=\\dfrac n2(a+l)\\).", "AP：\\(T_n=a+(n-1)d\\)；\\(S_n=\\dfrac n2\\left[2a+(n-1)d\\right]=\\dfrac n2(a+l)\\)。"], ["GP: \\(T_n=ar^{n-1}\\); \\(S_n=\\dfrac{a(1-r^n)}{1-r}=\\dfrac{a(r^n-1)}{r-1}\\) (\\(r\\ne1\\)).", "GP：\\(T_n=ar^{n-1}\\)；\\(S_n=\\dfrac{a(1-r^n)}{1-r}=\\dfrac{a(r^n-1)}{r-1}\\)（\\(r\\ne1\\)）。"], ["Infinite GP: \\(S_\\infty= by section, then add.", "求路程：找出 \\(v=0\\) 的时刻，分段计算后相加。"]], "", ""], ["Common Mistakes", "常见错误", [["Confusing displacement with distance.", "位移与路程混淆。"], ["Forgetting to use the initial condition to find c after integrating.", "积分后忘了用初始条件求 c。"], ["Treating the t where \\(a=0\\) as the time when velocity is 0.", "\\(a=0\\) 时的 t 当成速度为 0 的时刻。"]], "", ""], ["Exam Focus & Marks", "考试题型与得分点", [["Common: from s find v and a; integrate a; total distance.", "常考：由 s 求 v、a；由 a 积分；总路程。"], ["Mark points: differentiate or integrate (M), initial conditions (M), answer (A).", "得分点：求导或积分（M）、初始条件（M）、答案（A）。"]], "", "M = method mark, A = answer mark（M = 方法分，A = 答案分）"], ["Quick Recall", "速记", [["Displacement depends on the end points; distance must be split into sections.", "位移看首尾，路程要分段。"]], "", ""], ["Uji Diri", "自测：先想答案，再对照", [["S: Relation between a and v? J: \\(a=\\frac{dv}{dt}\\)", "问：a 与 v 的关系？答：\\(a=\\frac{dv}{dt}\\)"], ["S: When the particle is at rest? J: \\(v=0\\)", "问：静止时？答：\\(v=0\\)"], ["S: When velocity is maximum? J: \\(a=0\\)", "问：速度最大时？答：\\(a=0\\)"]], "", ""]]};

const PPTS_FIZIK={"fiz|T4-1":[["Physical Quantities and SI Units","物理量与国际单位",[["A physical quantity is a quantity that can be measured. Base quantities cannot be defined in terms of other quantities.","物理量是可测量的量；基本量不能用其他量来定义"],["Five base quantities in SPM: length (metre, m), mass (kilogram, kg), time (second, s), current (ampere, A), temperature (kelvin, K).","SPM 五个基本量：长度 m、质量 kg、时间 s、电流 A、温度 K"],["Derived quantities are obtained by multiplying or dividing base quantities, e.g. area (m²), volume (m³), density (kg m⁻³), velocity (m s⁻¹).","导出量由基本量相乘或相除得到，如面积、体积、密度、速度"],["Derived units with special names: force N = kg m s⁻²; pressure Pa = N m⁻² = kg m⁻¹ s⁻²; energy J = N m = kg m² s⁻²; power W = J s⁻¹ = kg m² s⁻³.","有专门名称的导出单位：N、Pa、J、W 及其基本单位形式"],["Express a derived unit in base units by substituting the formula, e.g. \\(F=ma\\) → kg × m s⁻² = kg m s⁻².","把公式代入即可把导出单位化成基本单位"]],"","Tip: when asked to 'derive the unit', write the formula first, then substitute the units step by step."],["Prefixes, Standard Form and Conversion","词头、科学记数法与单位换算",[["Common prefixes: tera T = 10¹²; giga G = 10⁹; mega M = 10⁶; kilo k = 10³; centi c = 10⁻²; milli m = 10⁻³; micro μ = 10⁻⁶; nano n = 10⁻⁹; pico p = 10⁻¹².","常用词头：T、G、M、k、c、m、μ、n、p 及对应的 10 的幂"],["Standard form: \\(A\\times10^{n}\\) where \\(1\\le A<10\\) and n is an integer. Example: 0.000 45 m = 4.5 × 10⁻⁴ m.","科学记数法：A 在 1 到 10 之间，n 为整数"],["Length conversion: 1 km = 10³ m; 1 cm = 10⁻² m; 1 mm = 10⁻³ m. Area: 1 cm² = 10⁻⁴ m²; volume: 1 cm³ = 10⁻⁶ m³.","面积、体积换算要把幂次一并平方、立方"],["Speed: 72 km h⁻¹ = 72 × 1000 ÷ 3600 = 20 m s⁻¹ (divide by 3.6).","速度：km/h 除以 3.6 得 m/s"],["Density: 1 g cm⁻³ = 1000 kg m⁻³.","密度：1 g/cm³ = 1000 kg/m³"]],"","Tip: the most common loss of marks is converting cm² or cm³ with the wrong power (1 cm² is 10⁻⁴ m², not 10⁻² m²)."],["Scalar and Vector Quantities","标量与矢量",[["Scalar: has magnitude only. Examples: distance, speed, mass, time, energy, temperature, work.","标量：只有大小，如距离、速率、质量、时间、能量"],["Vector: has both magnitude and direction. Examples: displacement, velocity, acceleration, force, momentum, weight.","矢量：有大小也有方向，如位移、速度、加速度、力、动量"],["Distance is the total length of the path travelled; displacement is the shortest straight-line distance from start to end in a stated direction.","距离是路径总长；位移是起点到终点的直线距离并带方向"],["Speed = distance ÷ time (scalar); velocity = displacement ÷ time (vector).","速率=距离/时间；速度=位移/时间"],["A runner completing one full lap has non-zero distance and speed, but zero displacement and zero average velocity.","跑完一圈：距离和速率不为零，位移和平均速度为零"]],"","Tip: always state a direction when giving a vector answer (e.g. 5 m s⁻¹ to the right, or +5 / −5 m s⁻¹)."],["Measuring Instruments: Accuracy, Consistency, Sensitivity","测量仪器：准确度、一致性、灵敏度",[["Accuracy: how close a reading is to the true value. Consistency: how close repeated readings are to each other (small spread).","准确度：接近真实值的程度；一致性：重复读数彼此接近的程度"],["Sensitivity: ability of an instrument to detect a small change in the quantity measured.","灵敏度：仪器检测微小变化的能力"],["Precise (consistent) but inaccurate readings are caused by a systematic error such as a zero error; accurate but inconsistent readings are caused by random error.","一致但不准确多为系统误差（如零误差）；准确但不一致多为随机误差"],["Smallest division: metre rule 0.1 cm (1 mm); vernier calipers 0.01 cm (0.1 mm); micrometer screw gauge 0.01 mm.","最小刻度：米尺 1 mm；游标卡尺 0.1 mm；螺旋测微器 0.01 mm"],["Choose the instrument by the size of the object and the precision required: micrometer for wire diameter, vernier for a test-tube diameter.","按物体大小与所需精确度选仪器：微分尺量线径，游标卡尺量试管径"]],"","Tip: sensitivity is NOT the same as accuracy. A sensitive instrument can still have a zero error."],["Reading the Vernier Calipers and Micrometer","游标卡尺与螺旋测微器读数",[["Vernier calipers: reading = main scale reading + (vernier division that coincides with a main-scale line × 0.01 cm).","游标卡尺：主尺读数 + 对齐的游标格数 × 0.01 cm"],["Micrometer: reading = sleeve (main scale) reading + (thimble reading × 0.01 mm).","螺旋测微器：套筒读数 + 微分筒读数 × 0.01 mm"],["Example (vernier): main scale 2.3 cm, 4th vernier line coincides → 2.3 + 0.04 = 2.34 cm.","例（游标卡尺）：2.3 + 0.04 = 2.34 cm"],["Example (micrometer): sleeve 5.5 mm, thimble 28 → 5.5 + 0.28 = 5.78 mm.","例（测微器）：5.5 + 0.28 = 5.78 mm"],["Zero error: reading when the jaws are closed is not zero. Corrected reading = observed reading − zero error (keep the sign!). Example: observed 5.78 mm, zero error +0.03 mm → 5.75 mm.","零误差：闭合时读数不为零。正确读数 = 读数 − 零误差（注意正负）"]],"","Tip: if the micrometer reads −0.02 mm with jaws closed, the zero error is −0.02 mm and the correction is +0.02 mm."],["Errors in Measurement","测量误差",[["Systematic error: all readings are shifted in the same direction. Causes: zero error, wrongly calibrated scale, faulty instrument. It cannot be reduced by averaging; correct it using the zero error.","系统误差：读数朝同一方向偏移；多次平均不能消除，需校正"],["Random error: readings scatter above and below the true value. Causes: parallax error, reaction time in timing, fluctuation of conditions.","随机误差：读数在真实值上下散布；如视差、反应时间"],["To reduce random error: take several readings and calculate the average; place the eye perpendicular to the scale (avoid parallax); measure a large number of oscillations (e.g. 20 oscillations) then divide to find T.","减小随机误差：多次测量取平均；视线垂直刻度；测 20 次振动再求周期"],["Parallax error: occurs when the eye is not directly in line with the pointer and the scale, so the reading appears shifted.","视差：视线没有垂直对准指针与刻度时产生"],["Use a mirror scale (pointer image coincides with the pointer) to remove parallax error.","用镜面刻度（指针与其像重合）可消除视差"]],"","Tip: 'Repeat and take the average' reduces random error only, never systematic error."],["Scientific Investigation","科学探究",[["Variables: manipulated (changed by you), responding (measured result), fixed/constant (kept the same to make the test fair).","变量：操纵变量、响应变量、固定变量"],["Inference → hypothesis → aim → variables → apparatus and materials → procedure → tabulate data → analyse → conclusion.","推断→假设→目的→变量→器材→步骤→数据表→分析→结论"],["Hypothesis format: 'The greater the manipulated variable, the greater/smaller the responding variable.'","假设格式：操纵变量越大，响应变量越大/越小"],["Procedure must state: how to set the manipulated variable, how to measure the responding variable, how many readings are repeated (at least 5 different values).","步骤要写：如何改变操纵变量、如何测响应变量、至少取 5 组数据"],["Graph: manipulated variable on the x-axis, responding on the y-axis; choose a suitable scale, plot points accurately, draw a best-fit line (straight line or smooth curve); gradient = Δy/Δx using a large triangle.","作图：x 轴放操纵变量、y 轴放响应变量；合适比例；画最佳拟合线；用大三角形求斜率"]],"","Tip: the conclusion must be the hypothesis rewritten as a statement of the result (e.g. 'The period of oscillation increases as the mass increases')."],["Worked Example and Common Mistakes","例题与常见错误",[["Q: A student measures a wire with a micrometer. Zero error −0.02 mm. Observed reading 0.74 mm. Find the true diameter.","题：测微器零误差 −0.02 mm，读数 0.74 mm，求真实直径"],["Step 1: corrected = observed − zero error = 0.74 − (−0.02) = 0.76 mm.","步骤：0.74 − (−0.02) = 0.76 mm"],["Q: Convert 450 cm² to m². 450 × 10⁻⁴ = 4.5 × 10⁻² m².","换算：450 cm² = 4.5 × 10⁻² m²"],["Mistake: quoting 'distance' when the question asks for displacement, or leaving out the direction of a vector.","错误：位移题答成距离，或矢量不写方向"],["Mistake: confusing accuracy and consistency; remember accuracy = closeness to the true value, consistency = closeness among readings.","错误：混淆准确度与一致性"]],"","Tip: write every number with its unit; a correct number with a missing unit often loses the mark."],["Uji Diri","自测",[["S: What is the SI unit of pressure in base units? J: kg m⁻¹ s⁻² (1 Pa = 1 N m⁻²).","问：压强的国际单位用基本单位表示？答：kg m⁻¹ s⁻²（1 Pa = 1 N m⁻²）"],["S: Convert 90 km h⁻¹ to m s⁻¹. J: 90 ÷ 3.6 = 25 m s⁻¹.","问：90 km/h 换算为 m/s？答：25 m/s"],["S: A micrometer shows 3.5 mm on the sleeve and 12 on the thimble, zero error +0.01 mm. True reading? J: 3.5 + 0.12 = 3.62 mm; 3.62 − 0.01 = 3.61 mm.","问：套筒 3.5 mm，微分筒 12，零误差 +0.01 mm，真实读数？答：3.62 − 0.01 = 3.61 mm"],["S: Name one way to reduce random error in timing 20 oscillations. J: Repeat the measurement and take the average / time many oscillations and divide.","问：减小计时随机误差的一种方法？答：重复测量取平均/测多次振动再除"],["S: Give one difference between accuracy and sensitivity. J: Accuracy is closeness to the true value; sensitivity is the ability to detect small changes.","问：准确度与灵敏度的区别？答：准确度=接近真实值；灵敏度=检测微小变化的能力"]],"",""]],"fiz|T4-2":[["Linear Motion: Key Concepts","直线运动：基本概念",[["Distance (scalar) is the total path length; displacement (vector) is the straight-line distance from the starting point in a stated direction.","距离是路径总长；位移是起点到终点的直线距离（带方向）"],["Speed = total distance ÷ total time. Velocity = displacement ÷ time = rate of change of displacement.","速率=总距离/总时间；速度=位移/时间"],["Acceleration \\(a=\\dfrac{v-u}{t}\\) = rate of change of velocity. If velocity decreases, a is negative (deceleration/retardation).","加速度 a=(v−u)/t；速度减小则 a 为负（减速）"],["Types: stationary (v = 0); uniform velocity (a = 0); uniform acceleration (constant a); non-uniform velocity (a changes).","类型：静止、匀速、匀加速、变加速"],["Average speed ≠ average of two speeds in general; always use total distance ÷ total time.","平均速率要用总距离除以总时间"]],"","Tip: u = initial velocity, v = final velocity, s = displacement, t = time, a = acceleration."],["Equations of Uniform Acceleration","匀加速运动公式",[["\\(v=u+at\\)","v = u + at（无 s）"],["\\(s=ut+\\tfrac12at^{2}\\)","s = ut + ½at²（无 v）"],["\\(v^{2}=u^{2}+2as\\)","v² = u² + 2as（无 t）"],["\\(s=\\tfrac12(u+v)t\\)","s = ½(u+v)t（无 a）"],["Valid only when acceleration is constant. Choose the equation that contains the three known values and the one unknown. Take one direction as positive and keep signs consistent.","仅适用于恒定加速度；选含三个已知量和一个未知量的公式；统一正方向"]],"","Tip: 'starts from rest' means u = 0; 'comes to a stop' means v = 0."],["Worked Examples: Linear Motion","例题：直线运动",[["Q1: A car accelerates uniformly from 10 m s⁻¹ at 2 m s⁻² for 5 s. Find v and s.","题1：初速 10 m/s，加速度 2 m/s²，5 s，求 v 与 s"],["Step 1: \\(v=u+at=10+2(5)=20\\) m s⁻¹.","步骤：v = 10 + 2×5 = 20 m/s"],["Step 2: \\(s=ut+\\tfrac12at^{2}=10(5)+\\tfrac12(2)(25)=75\\) m.","s = 50 + 25 = 75 m"],["Q2: A car brakes from 20 m s⁻¹ and stops in 40 m. Find a and the time taken.","题2：从 20 m/s 刹车，40 m 内停下，求 a 与时间"],["Step 1: \\(0=20^{2}+2a(40)\\) → \\(a=-5\\) m s⁻². Step 2: \\(0=20+(-5)t\\) → \\(t=4\\) s.","0 = 400 + 80a → a = −5 m/s²；t = 4 s"]],"","Tip: a negative answer for a means deceleration, not an error."],["Ticker Timer Analysis","打点计时器分析",[["A ticker timer at 50 Hz makes 50 dots per second, so 1 tick = 0.02 s; a 5-tick strip = 0.10 s.","50 Hz：每点 0.02 s；5 点间隔 = 0.10 s"],["Uniform velocity: equal spacing between dots. Acceleration: spacing increases. Deceleration: spacing decreases.","匀速：点间距相等；加速：间距增大；减速：间距减小"],["Velocity of a strip = length of strip ÷ time of strip; e.g. 2.0 cm in 0.10 s → 20 cm s⁻¹.","速度 = 纸带长度 / 时间"],["Acceleration \\(a=\\dfrac{v-u}{t}\\), where u and v are velocities from the first and last strips, and t = time from the middle of the first strip to the middle of the last strip.","加速度：用首末两段的速度，时间取两段中点之间"],["A tape chart (strips stuck side by side) has the same shape as the velocity-time graph.","纸带条形图的形状相当于 v-t 图"]],"","Tip: count the number of ticks (spaces between dots), not the number of dots."],["Linear Motion Graphs","直线运动图像",[["Displacement-time (s–t): gradient = velocity. Horizontal line = stationary; straight sloping line = uniform velocity; curve = changing velocity.","s-t 图：斜率 = 速度；水平线 = 静止；斜直线 = 匀速"],["Velocity-time (v–t): gradient = acceleration; area under graph = displacement. Horizontal line = uniform velocity; sloping line = uniform acceleration; negative slope = deceleration.","v-t 图：斜率 = 加速度；面积 = 位移"],["Acceleration-time (a–t): area under graph = change in velocity; horizontal line above axis = uniform acceleration.","a-t 图：面积 = 速度变化"],["Distance = total area (all areas counted positive); displacement = area above axis minus area below axis.","距离=所有面积相加；位移=上方面积减下方面积"],["Steeper gradient on an s–t graph means a higher speed; steeper gradient on a v–t graph means a larger acceleration.","斜率越陡，s-t 图速度越大；v-t 图加速度越大"]],"","Tip: label axes with quantity and unit and state clearly what the gradient and area represent when asked."],["Worked Example: v–t Graph","例题：v-t 图",[["Q: A train accelerates uniformly from rest to 10 m s⁻¹ in 4 s, travels at constant velocity for 6 s, then decelerates uniformly to rest in 2 s. Find (a) a in each stage, (b) total displacement.","题：4 s 内由静止加速到 10 m/s，匀速 6 s，再 2 s 减速到停，求各阶段 a 与总位移"],["(a) Stage 1: \\(a=\\dfrac{10-0}{4}=2.5\\) m s⁻²; stage 2: a = 0; stage 3: \\(a=\\dfrac{0-10}{2}=-5\\) m s⁻².","各阶段：2.5、0、−5 m/s²"],["(b) Area of trapezium = ½(6 + 12) × 10 = 90 m.","总位移 = 梯形面积 = ½(6+12)×10 = 90 m"],["Check by parts: ½(4)(10) + 6(10) + ½(2)(10) = 20 + 60 + 10 = 90 m.","分段核对：20 + 60 + 10 = 90 m"],["Average velocity = 90 ÷ 12 = 7.5 m s⁻¹.","平均速度 = 90 ÷ 12 = 7.5 m/s"]],"","Tip: show the area as a calculation (triangle + rectangle) so partial marks are earned."],["Free Fall and Gravitational Acceleration","自由落体与重力加速度",[["Free fall: motion of an object under the influence of gravity only (air resistance negligible). Acceleration = gravitational acceleration \\(g=9.81\\) m s⁻² (≈ 10 m s⁻²) downward.","自由落体：只受重力；加速度 g = 9.81 m/s² 向下"],["In a vacuum all objects fall with the same acceleration regardless of mass (feather and coin in an evacuated tube).","真空中所有物体下落加速度相同，与质量无关"],["In air, a feather falls slower than a coin because of air resistance (large surface area), not because its g is smaller.","空气中羽毛较慢是因为空气阻力"],["Equations with a = g, u = 0 (dropped): \\(v=gt\\); \\(s=\\tfrac12gt^{2}\\); \\(v^{2}=2gs\\). Thrown upwards: a = −g, v = 0 at the highest point.","u=0 时：v=gt；s=½gt²；v²=2gs；上抛最高点 v=0"],["Experiment to find g: use a ticker timer or light gate; plot v–t (gradient = g) or s–t² (gradient = g/2).","测 g：用打点计时器/光电门；v-t 斜率 = g；s-t² 斜率 = g/2"]],"","Tip: g is the gradient of the velocity-time graph of a free-falling object."],["Worked Example: Free Fall","例题：自由落体",[["Q: A stone is dropped from a bridge 45 m above the water. Find the time to reach the water and its speed on impact (g = 9.81 m s⁻²).","题：石头从 45 m 高处落下，求落水时间与速度"],["Step 1: \\(s=\\tfrac12gt^{2}\\) → \\(45=\\tfrac12(9.81)t^{2}\\) → \\(t=\\sqrt{9.17}=3.03\\) s.","t = √(90/9.81) = 3.03 s"],["Step 2: \\(v=gt=9.81\\times3.03=29.7\\) m s⁻¹.","v = 9.81 × 3.03 = 29.7 m/s"],["Q: A ball is thrown upward at 20 m s⁻¹. Maximum height? \\(0=20^{2}-2(9.81)s\\) → s = 20.4 m. Time to top: \\(t=20/9.81=2.04\\) s.","上抛 20 m/s：最大高度 20.4 m；到顶 2.04 s"],["Total time of flight (returns to start) = 2 × 2.04 = 4.08 s.","落回原点总时间 4.08 s"]],"","Tip: use g = 9.81 unless the question says to take g = 10."],["Inertia","惯性",[["Newton's first law: an object remains at rest or moves with constant velocity unless acted upon by an external (resultant) force.","牛顿第一定律：不受合力则保持静止或匀速直线运动"],["Inertia is the tendency of an object to resist any change in its state of rest or motion. The greater the mass, the greater the inertia.","惯性：抵抗运动状态改变的性质；质量越大惯性越大"],["Experiment: oscillating hacksaw blade; manipulated variable = mass, responding = period T. Result: the larger the mass, the longer the period (larger inertia).","实验：锯条振动；质量越大周期越长"],["Examples: passengers jerk forward when a bus brakes suddenly; ketchup falls out when the bottle is shaken downward; a coin on a card drops into a glass when the card is flicked.","例子：急刹乘客前倾；甩番茄酱；弹走卡片硬币落入杯"],["Reduce harmful effects of inertia: seat belts, headrests, air bags, strong cabin (lorries have a metal barrier behind the cabin).","减小惯性危害：安全带、头枕、安全气囊、货车驾驶室后挡板"]],"","Tip: always link to mass — 'a larger mass has a larger inertia, so it is harder to start moving or stop'."],["Common Mistakes and Exam Tips","常见错误与考试提示",[["Mixing up distance/displacement and speed/velocity; gradient of s–t is velocity, not acceleration.","混淆距离/位移、速率/速度；s-t 斜率是速度"],["Forgetting that a = −g when throwing upward while taking up as positive.","取向上为正时，上抛 a = −g"],["Using v = u + at when the acceleration is not constant.","加速度不恒定时不能用公式"],["For a v–t graph with parts below the axis, displacement uses subtraction, distance uses addition.","v-t 图轴下面积：位移相减，距离相加"],["Inertia is not a force; it is a property of mass. Do not write 'the force of inertia'.","惯性不是力，是质量的性质"]],"","Tip: for 'explain' questions use: stated principle → application to the situation → result."],["Uji Diri","自测",[["S: A car travelling at 12 m s⁻¹ accelerates at 3 m s⁻² for 4 s. What is its final velocity? J: v = 12 + 3(4) = 24 m s⁻¹.","问：12 m/s、加速度 3 m/s²、4 s 后速度？答：24 m/s"],["S: What does the area under a velocity-time graph represent? J: Displacement.","问：v-t 图下的面积表示？答：位移"],["S: A ticker tape has dots getting further apart. What is the motion? J: The object is accelerating.","问：点间距渐增表示？答：加速运动"],["S: A stone is dropped and takes 2 s to hit the ground. Find the height (g = 10 m s⁻²). J: s = ½(10)(2²) = 20 m.","问：石头落下 2 s，高度（g=10）？答：20 m"],["S: Why does a heavier object have greater inertia? J: Inertia is the resistance to change in motion and it increases with mass.","问：为何质量大惯性大？答：惯性是抵抗运动状态改变，随质量增大"]],"",""]],"fiz|T4-3":[["Newton's Law of Universal Gravitation","万有引力定律",[["Every object attracts every other object with a force directly proportional to the product of their masses and inversely proportional to the square of the distance between their centres.","任意两物体间的引力与质量乘积成正比，与两中心距离平方成反比"],["\\(F=\\dfrac{Gm_1m_2}{r^{2}}\\), \\(G=6.67\\times10^{-11}\\) N m² kg⁻² (universal gravitational constant).","F = Gm₁m₂/r²；G = 6.67×10⁻¹¹ N m² kg⁻²"],["The force is always attractive and acts along the line joining the centres; the pair of forces are equal and opposite (Newton's third law).","引力总是吸引力，沿两中心连线，成对大小相等方向相反"],["Inverse-square: if r doubles, F becomes ¼; if r halves, F becomes 4×.","平方反比：r 加倍，F 变为 1/4"],["Gravitational force between everyday objects is tiny because G is very small; it is significant only when one mass is huge (planets, stars).","日常物体间引力很小，因 G 很小"]],"","Tip: r is the distance between centres; for a satel
